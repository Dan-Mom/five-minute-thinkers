*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:28px 16px 8px;max-width:1100px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{color:var(--mute);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow)}
.stat b{font-size:1.25rem;display:block}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
nav .in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;min-height:44px}
nav button[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:16px}
.intro{color:var(--mute);margin:4px 0 16px}
h2{font-size:1.1rem;margin:22px 0 8px}
h2 small{color:var(--mute);font-weight:400;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1rem;line-height:1.3}
.card p{margin:0;color:var(--mute);font-size:.92rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.chip{font-size:.78rem;border-radius:999px;padding:2px 9px;font-weight:600}
.chip.good{background:var(--goodbg);color:var(--good)}.chip.mid{background:var(--midbg);color:var(--mid)}.chip.low{background:var(--lowbg);color:var(--low)}
.meta{font-size:.78rem;color:var(--mute)}
.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
.btn.alt{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.seen{color:var(--good);font-size:.85rem}
.area{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.area h3{margin:0 0 4px;font-size:1rem}.area .next{margin:8px 0 0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:.92rem}
.note{margin:28px 0 8px;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:.92rem}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;flex-direction:column}
#viewer.on{display:flex}
#viewer .bar{background:var(--card);padding:8px 12px;display:flex;gap:8px;align-items:center}
#viewer .bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer iframe{flex:1;border:0;background:#fff;width:100%}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>

function E(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e}
function seenGet(){try{return JSON.parse(localStorage.getItem('wmn-seen')||'{}')}catch(e){return{}}}
function seenSet(k){try{var s=seenGet();s[k]=1;localStorage.setItem('wmn-seen',JSON.stringify(s))}catch(e){}}
document.getElementById('gen').textContent=DATA.generated;
var total=0,playable=0;DATA.sections.forEach(function(s){if(s.groups)s.groups.forEach(function(g){g.items.forEach(function(i){total++;if(i.href)playable++})})});
DATA.sections.filter(function(s){return s.groups}).map(function(s){return [s.zh,s.count]}).concat([['合计可打开',playable]]).forEach(function(x){var d=E('div','stat');d.appendChild(E('b',null,x[1]));d.appendChild(E('span',null,x[0]));document.getElementById('stats').appendChild(d)});
var tabs=document.getElementById('tabs'),main=document.getElementById('main'),cur=0;
DATA.sections.forEach(function(s,i){var b=E('button',null,s.icon+' '+s.zh+(s.count?' · '+s.count:''));b.type='button';b.setAttribute('role','tab');b.onclick=function(){show(i)};tabs.appendChild(b)});
var HUB=decodeURIComponent((location.pathname.split('/').pop())||'')||'index.html';
function withHome(h){if(/^https?:/.test(h))return h;var depth=h.split('/').length-1,up='';for(var i=0;i<depth;i++)up+='../';return h+'?home='+encodeURIComponent(up+(HUB||'index.html')).replace(/%2F/g,'/')+'&v='+DATA.v}
window.addEventListener('message',function(e){if(e.data&&e.data.fmpHome&&V.classList.contains('on'))closeV()});
function card(it){
  var c=E('div','card');c.appendChild(E('h3',null,it.title));if(it.zh)c.appendChild(E('p',null,it.zh));
  var r=E('div','row');r.appendChild(E('span','chip '+(it.tone||'mid'),it.status||''));
  if(it.meta)r.appendChild(E('span','meta',it.meta));
  var key=it.href||it.title;if(it.href&&seenGet()[key]){r.appendChild(E('span','seen','✓ 打开过'))}
  c.appendChild(r);
  var r2=E('div','row');
  if(it.href){
    var b=E('button','btn','打开');b.type='button';b.onclick=function(){openIt(it,key)};r2.appendChild(b);
    if(DATA.site||DATA.sections[cur].id==='math'){var a=E('a','btn alt','新窗口');a.href=withHome(it.href);a.target='_blank';a.rel='noopener';a.onclick=function(){seenSet(key)};r2.appendChild(a)}
  } else {var d=E('span','btn alt','还没有可打开的页面');d.setAttribute('aria-disabled','true');r2.appendChild(d)}
  r2.style.paddingTop='4px';c.appendChild(r2);
  if(it.note){c.appendChild(E('p','meta',it.note))}
  return c}
function show(i){
  cur=i;var s=DATA.sections[i];main.innerHTML='';
  [].forEach.call(tabs.children,function(b,j){b.setAttribute('aria-selected',String(j===i))});
  main.appendChild(E('p','intro',s.intro));
  if(s.areas){s.areas.forEach(function(a){var d=E('div','area');d.appendChild(E('h3',null,a.title));d.appendChild(E('p','meta',a.zh));
    var r=E('div','row');r.appendChild(E('span','chip '+a.tone,a.status));if(a.waiting)r.appendChild(E('span','chip mid',a.waiting));if(a.updated)r.appendChild(E('span','meta','更新 '+a.updated));d.appendChild(r);
    if(a.next)d.appendChild(E('p','next','下一步：'+a.next));if(a.extra)d.appendChild(E('p','meta',a.extra));main.appendChild(d)})}
  else s.groups.forEach(function(g){
    if(g.zh){var h=E('h2',null,g.zh);if(g.en)h.appendChild(E('small',null,g.en));main.appendChild(h)}
    var gr=E('div','grid');g.items.forEach(function(it){gr.appendChild(card(it))});main.appendChild(gr)});
  if(s.id==='math'&&!DATA.site){main.appendChild(E('div','note','数学课另有一份备份在你的私有 GitHub 仓库（Dan-Mom/five-minute-math）。要变成别人也能点开的公开网址，需要你同意开启 GitHub Pages；现在还没发布任何东西。'))}
  window.scrollTo(0,0)}
var V=document.getElementById('viewer'),VF=document.getElementById('vf');
function openIt(it,key){seenSet(key);document.getElementById('vt').textContent=it.title;document.getElementById('vnew').href=withHome(it.href);
  if(it.video){window.open(it.href,'_blank');return}
  VF.src=/^https?:/.test(it.href)?it.href:it.href+"?v="+DATA.v;V.classList.add('on');document.getElementById('vx').focus()}
