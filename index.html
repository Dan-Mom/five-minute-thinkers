<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five-Minute Thinkers: one idea, five minutes, your child does the thinking</title>
<meta name="description" content="One idea in five minutes, explained so it clicks and your child does the thinking. Interactive math, science and everyday-smarts lessons, free to try, no sign-up, nothing collected.">
<meta name="theme-color" content="#7ccbff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20role%3D%22img%22%20aria-label%3D%22Five-Minute%20Thinkers%22%3E%3Crect%20x%3D%2228%22%20y%3D%221.5%22%20width%3D%228%22%20height%3D%226%22%20rx%3D%222%22%20fill%3D%22%231d2b4f%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2236%22%20r%3D%2224%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%231d2b4f%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M32%2036%20L32%2015%20A21%2021%200%200%201%2050.2%2025.5%20Z%22%20fill%3D%22%23e8650a%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2236%22%20r%3D%224%22%20fill%3D%22%231d2b4f%22%2F%3E%3Cpath%20d%3D%22M54%203%20L55.8%207.6%20L60.4%209.4%20L55.8%2011.2%20L54%2015.8%20L52.2%2011.2%20L47.6%209.4%20L52.2%207.6%20Z%22%20fill%3D%22%23ffd23f%22%20stroke%3D%22%231d2b4f%22%20stroke-width%3D%221.4%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Five-Minute Thinkers">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#1d2b4f; --mute:#4a587a; --page:#fff6e3; --card:#fff;
  --orange:#d95b00; --orange-s:#ffe2c4; --orange-m:#ff9a3d;
  --pink:#d6246e;   --pink-s:#ffd8ea;   --pink-m:#ff6fa8;
  --teal:#0b8a7c;   --teal-s:#c8f3ec;   --teal-m:#2fd0bd;
  --green:#1f8f45;  --green-s:#d3f4dd;  --green-m:#4fd37c;
  --purple:#6d3fd8; --purple-s:#e4dbff; --purple-m:#a07cff;
  --blue:#1b6fd1;   --blue-s:#d5e9ff;   --blue-m:#4fa8ff;
  --display:"Baloo 2","Nunito","Trebuchet MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--page);color:var(--ink);font:700 18px/1.55 var(--body);overflow-x:hidden}
button,a{font-family:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.c-orange{--c:var(--orange);--cs:var(--orange-s);--cm:var(--orange-m)}
.c-pink{--c:var(--pink);--cs:var(--pink-s);--cm:var(--pink-m)}
.c-teal{--c:var(--teal);--cs:var(--teal-s);--cm:var(--teal-m)}
.c-green{--c:var(--green);--cs:var(--green-s);--cm:var(--green-m)}
.c-purple{--c:var(--purple);--cs:var(--purple-s);--cm:var(--purple-m)}
.c-blue{--c:var(--blue);--cs:var(--blue-s);--cm:var(--blue-m)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,246,227,.94);backdrop-filter:blur(6px);border-bottom:2px solid #f1dfb8}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 22px var(--display);cursor:pointer;border:0;background:none;padding:0}
.brand svg{width:44px;height:44px}
.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.top nav a{min-height:44px;display:inline-flex;align-items:center;padding:6px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font:800 17px var(--display);cursor:pointer}
.top nav a:hover{background:#ffe9bd}
@media (max-width:560px){.brand #brandName{display:none}.top nav a{padding:6px 10px;font-size:16px}}

/* ---------- hero ---------- */
.hero{position:relative;background:linear-gradient(180deg,#7ccbff 0%,#b9e6ff 60%,#fff0c9 100%);padding:34px 0 84px;overflow:hidden}
.hero .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift 60s linear infinite}
.hero .cloud::before,.hero .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.a{width:120px;height:34px;top:26px;left:-140px}.cloud.a::before{width:52px;height:52px;left:18px;top:-24px}.cloud.a::after{width:40px;height:40px;left:62px;top:-16px}
.cloud.b{width:90px;height:26px;top:300px;left:-120px;animation-duration:80s;animation-delay:-30s}.cloud.b::before{width:40px;height:40px;left:12px;top:-18px}.cloud.b::after{width:30px;height:30px;left:46px;top:-12px}
@keyframes drift{to{transform:translateX(calc(100vw + 360px))}}
.hero-grid{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(34px,5.6vw,58px);font-weight:800;color:#fff;text-shadow:0 4px 0 #1b6fd1,0 8px 0 rgba(27,111,209,.3)}
.hero .sub{margin:16px 0 0;font:700 clamp(18px,2.3vw,22px)/1.45 var(--body);color:#12306b;max-width:560px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn{min-height:56px;border:0;border-radius:18px;padding:10px 26px;font:800 22px var(--display);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,box-shadow .1s}
.btn.main{background:var(--orange);color:#fff;box-shadow:0 6px 0 #8f3c00}
.btn.main:hover{transform:translateY(-2px);box-shadow:0 8px 0 #8f3c00}
.btn.main:active{transform:translateY(3px);box-shadow:0 2px 0 #8f3c00}
.btn.alt{background:#fff;color:var(--blue);box-shadow:0 6px 0 rgba(20,40,90,.22)}
.btn.alt:hover{transform:translateY(-2px)}
.btn.c{background:var(--c);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.c:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--c,var(--blue));border:3px solid var(--cs,#d5e9ff);min-height:48px;font-size:19px;padding:6px 16px;box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chip{background:rgba(255,255,255,.92);color:#12306b;border-radius:999px;padding:5px 14px;font:800 15px var(--display)}
.demo-box{position:relative;display:flex;justify-content:center;padding:6px 0}
.demo{position:relative;width:min(360px,100%);background:#fff;border-radius:28px;padding:18px 20px 20px;box-shadow:-12px 12px 0 #ffd23f,0 22px 34px rgba(20,40,90,.18);transform:rotate(2deg);animation:bob 4s ease-in-out infinite}

.demo-top{display:flex;align-items:center;gap:10px}
.demo-top .lg{width:38px;flex:0 0 auto}.demo-top b{font:800 18px var(--display);flex:1}
.demo-time{background:var(--orange-s);color:var(--orange);border-radius:999px;padding:3px 12px;font:800 16px var(--display)}
.demo-q{margin:14px 0 4px;font:800 14px var(--display);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.demo-big{margin:0;font:800 24px/1.2 var(--display)}
.demo-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.demo-opts span{border:3px solid var(--blue-s);border-radius:14px;padding:6px 14px;font:800 20px var(--display);color:var(--blue)}
.demo-opts span.pick{background:var(--blue);border-color:var(--blue);color:#fff}
.demo-steps{display:flex;gap:6px;margin-top:16px}
.demo-steps span{flex:1;text-align:center;background:var(--cs,#fff0c9);color:var(--ink);border-radius:12px;padding:6px 2px;font:800 14px var(--display)}
.demo-steps span:nth-child(1){background:#ffe2c4}.demo-steps span:nth-child(2){background:#d3f4dd}.demo-steps span:nth-child(3){background:#d5e9ff}
@keyframes bob{50%{transform:translateY(-9px) rotate(-2deg)}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:54px;width:100%;display:block}
@media (max-width:760px){.cloud.b{display:none}.hero-grid{grid-template-columns:1fr}.demo-box{order:2}.demo{transform:none}.hero{padding-top:20px}}

/* ---------- sections ---------- */
section.block{padding:34px 0 8px}
section.block h2{font-size:clamp(28px,4vw,38px);font-weight:800}
.lead{margin:6px 0 20px;color:var(--mute);font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:3px solid var(--cs);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--cs),0 12px 22px rgba(20,30,60,.08);transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card .art{height:112px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--cs),#fff 140%);font-size:60px;position:relative}
.card .art span.e{filter:drop-shadow(0 5px 0 rgba(0,0,0,.12));display:inline-block}
.tag{position:absolute;top:10px;left:10px;background:#fff;color:var(--c);border-radius:999px;padding:2px 10px;font:800 13px var(--display)}
.tag.right{left:auto;right:10px;background:#ffd23f;color:#5a3d00}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:22px}
.card p{margin:0;font-size:16px;font-weight:700;color:var(--mute);line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.m{font:800 13.5px var(--display);background:var(--cs);color:var(--c);border-radius:999px;padding:2px 11px}
.m.lvl{box-shadow:inset 0 0 0 1.5px var(--c)}
.m.lvs{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--cs);font-weight:700;font-size:12.5px}
.actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.actions .btn{flex:1;min-width:110px;font-size:20px;min-height:50px}
.card.feature .art{height:132px;font-size:72px}

/* video */
.vrow{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 16px;scroll-snap-type:x proximity}
.vcard{flex:0 0 min(300px,80vw);scroll-snap-align:start;border:0;padding:0;text-align:left;background:var(--card);border-radius:20px;box-shadow:0 6px 0 var(--blue-s),0 12px 22px rgba(20,30,60,.08);overflow:hidden;cursor:pointer;font:inherit;color:inherit}
.vcard .th{position:relative;aspect-ratio:16/9;background:#12306b center/cover}
.vcard .th::after{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.vcard b{display:block;padding:10px 14px 14px;font:800 18px/1.2 var(--display)}
.soon{display:flex;align-items:center;gap:18px;background:#fff;border:3px dashed #9bc7f5;border-radius:24px;padding:18px 22px}
.soon svg{width:84px;height:84px;flex:0 0 auto}
.soon b{font:800 22px var(--display);display:block}
.soon p{margin:2px 0 0;color:var(--mute)}

/* subject tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;cursor:pointer;color:#fff;border-radius:26px;padding:18px;min-height:196px;background:linear-gradient(150deg,var(--cm),var(--c));box-shadow:0 7px 0 rgba(20,30,60,.22),0 16px 26px rgba(20,30,60,.1);overflow:hidden;font:inherit;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-.5deg)}
.tile::before{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16)}
.tile .e{font-size:58px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.18));width:fit-content}
.tile h3{font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile p{margin:0;font-size:15px;opacity:.97}
.tile .n{margin-top:auto;background:#fff;color:var(--c);border-radius:999px;padding:4px 12px;font:800 15px var(--display);width:fit-content}

/* how / promises / about */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.step{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 #f1dfb8;text-align:center}
.step .e{font-size:46px}.step h3{font-size:24px;margin:4px 0}.step p{margin:0;color:var(--mute);font-size:16.5px}
.promises{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin-top:18px}
.promise{display:flex;align-items:center;gap:10px;background:var(--green-s);color:#145d2d;border-radius:18px;padding:12px 16px;font:800 17px var(--display)}
.about{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:#fff;border-radius:28px;padding:22px;box-shadow:0 6px 0 #f1dfb8;margin-top:6px}
.about svg{width:140px}
.about h2{font-size:30px}.about p{margin:8px 0 0;color:var(--mute)}
@media (max-width:640px){.about{grid-template-columns:1fr;text-align:center}.about svg{margin:0 auto}}
footer{margin-top:44px;padding:26px 0 40px;text-align:center;color:var(--mute);font-size:15px;border-top:2px solid #f1dfb8}

/* roadmap */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-bottom:18px}
.goal{background:#fff;border-radius:22px;padding:16px;box-shadow:0 5px 0 #f1dfb8;display:flex;gap:12px;align-items:flex-start}
.goal .e{font-size:38px;line-height:1}.goal h3{font-size:22px}.goal p{margin:2px 0 0;color:var(--mute);font-size:16px}
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.ri{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ri h3{font-size:19px}.ri p{margin:0;font-size:15.5px;line-height:1.4}
.ri.now{background:var(--green-s);color:#145d2d;border:3px solid #a8e6bd}
.ri.now p{color:#245f3a}
.ri.next,.ri.later{background:#eceff3;color:#6b7690;border:3px dashed #c3cad8}
.ri.next h3,.ri.later h3{color:#68738e}.ri.next p,.ri.later p{color:#7b859d}
.ri.later{opacity:.8}
.when{align-self:flex-start;border-radius:999px;padding:1px 10px;font:800 12.5px var(--display);margin-bottom:4px}
.now .when{background:#fff;color:var(--green)}.next .when,.later .when{background:#dde2ec;color:#6b7690}
.fine{margin:14px 0 0;color:var(--mute);font-size:15.5px}
/* the "All" page: every lesson and tool in one list */
.alln{color:var(--mute);margin:2px 0 10px}
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--cs);border-radius:18px;padding:8px 12px}
.rw .e{font-size:30px;width:40px;text-align:center}
.rw .t{flex:1;min-width:0}.rw .t b{display:block;font:800 18px/1.15 var(--display)}.rw .t span{font-size:14px;color:var(--mute)}
.rw .btn{min-height:44px;font-size:18px;padding:6px 16px;flex:0 0 auto}
.rw .tg{font:800 12.5px var(--display);background:var(--cs);color:var(--c);border-radius:999px;padding:1px 9px;margin-left:6px}
@media (max-width:560px){.rw{flex-wrap:wrap}.rw .t{flex-basis:calc(100% - 60px)}}
/* ---------- inner pages ---------- */
.crumb{padding:18px 0 4px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 18px;border:0;border-radius:999px;background:#fff;color:var(--ink);font:800 18px var(--display);cursor:pointer;box-shadow:0 4px 0 rgba(20,30,60,.16)}
.page-head{display:flex;align-items:center;gap:16px;margin:10px 0 4px}
.page-head .e{font-size:62px;line-height:1}
.page-head h1{font-size:clamp(30px,5vw,46px);color:var(--c)}
.topic{display:inline-flex;margin:26px 0 12px;background:var(--cs);color:var(--c);border-radius:999px;padding:6px 18px;font:800 21px var(--display)}
.proj{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;margin-top:14px;align-items:start}
.proj .box{background:#fff;border-radius:26px;padding:20px;box-shadow:0 6px 0 var(--cs);border:3px solid var(--cs)}
.proj h2{font-size:24px;margin-bottom:8px}
.embed{position:relative;aspect-ratio:16/9;background:#12306b;border-radius:20px;overflow:hidden}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.vlist button{min-height:46px;text-align:left;border:3px solid var(--cs);background:#fff;border-radius:14px;padding:8px 14px;font:800 17px var(--display);cursor:pointer;color:var(--ink)}
.vlist button[aria-current=true]{background:var(--cs)}
.tip{margin-top:12px;background:var(--cs);border-radius:18px;padding:12px 16px;font-size:16.5px}
@media (max-width:820px){.proj{grid-template-columns:1fr}}

/* ---------- subject tabs on the courses-only home ---------- */
.tabs{position:sticky;top:62px;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;margin:0 -2px;background:var(--page);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:48px;display:inline-flex;align-items:center;gap:7px;padding:6px 16px 6px 12px;border-radius:999px;background:#fff;border:3px solid var(--cs);color:var(--ink);text-decoration:none;font:800 18px var(--display);white-space:nowrap}
.tab:hover{background:var(--cs)}
.tab .e{font-size:24px;line-height:1}
.tab .ct{font:800 13px var(--display);background:var(--cs);color:var(--c);border-radius:999px;padding:0 8px}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}
.tab.on .ct{background:rgba(255,255,255,.28);color:#fff}
/* ---------- My Passport ---------- */
.mechip{-webkit-appearance:none;appearance:none;margin:0;line-height:1.2;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px 4px 8px;border-radius:999px;background:#fff;border:3px solid var(--orange-s);color:var(--ink);text-decoration:none;font:800 17px var(--display);cursor:pointer;white-space:nowrap}
.mechip:hover{background:#fff0dc}
.mechip .mav{font-size:26px;line-height:1}
@media (max-width:560px){.top nav a.hm{display:none}.mechip{padding:4px 10px 4px 6px}}
.pp-page{padding-bottom:24px}
.pp-page h1{font-size:clamp(30px,5vw,44px);color:var(--c,var(--orange))}
.pp-h{font-size:clamp(24px,3.4vw,30px);margin:30px 0 8px}
.pp-head{display:flex;gap:18px;align-items:center;margin:20px 0 14px;background:#fff;border:3px solid var(--orange-s);border-radius:28px;padding:18px;box-shadow:0 6px 0 var(--orange-s)}
.pp-me{font-size:76px;line-height:1;flex:0 0 auto;background:var(--orange-s);border-radius:50%;width:112px;height:112px;display:flex;align-items:center;justify-content:center}
.pp-me.sm{font-size:40px;width:64px;height:64px}
.pp-ht{flex:1;min-width:0}.pp-ht h1{margin-bottom:2px}
.pp-lv{font:800 24px var(--display);color:var(--ink)}
.pp-s{color:var(--mute);font-size:16px;margin:6px 0 0}
.pp-gift{margin-top:10px;background:#fff3c4;color:#6b4a00;border-radius:14px;padding:8px 14px;font:800 17px var(--display)}
.pp-bar{height:18px;border-radius:999px;background:#f3e6c9;overflow:hidden;margin-top:8px}
.pp-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb52e,#ff7a1a);border-radius:999px;transition:width .6s}
@media (max-width:560px){.pp-head{flex-direction:column;text-align:center}.pp-me{width:96px;height:96px;font-size:62px}}
.pp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pp-stat{background:#fff;border-radius:22px;padding:12px 8px;text-align:center;box-shadow:0 5px 0 #f1dfb8}

lsNote":"Level 0 to Level 5 so far","roadmap":{"title":"Where we are going","lead":"We are starting with the early Levels of math, Level 0 to Level 5, and building toward Level 12. Colored things you can use today. Gray things are planned.","goals":[{"emoji":"🧱","title":"Know it","text":"Every early math idea, with no gaps."},{"emoji":"🎯","title":"Use it alone","text":"Solve new problems without help, and explain why."},{"emoji":"🧩","title":"Think beyond it","text":"Patterns, analogies, sorting and spatial reasoning."}],"promise":"Original lessons only. We study how great teachers explain things, then build our own pictures, tools and problems. We never copy other products or tests.","items":[{"status":"now","title":"Math lessons, Level 0 to Level 5","text":"{N} lessons you can play today, growing every week."},{"status":"now","title":"Food, science and money lessons","text":"Label detectives, history mysteries and saving."},{"status":"now","title":"Play & Practice tools","text":"Games that train what a lesson just taught. More are coming."},{"status":"next","when":"Next year","title":"A complete map of early math","text":"Every skill from Level 0 to Level 5, with what is ready and what is next."},{"status":"next","when":"Next year","title":"Check-ups that find hidden gaps","text":"Short, no-hint questions that show what really stuck."},{"status":"next","when":"Next year","title":"A daily path for each child","text":"Five to ten minutes picked for your child: a review, then something new."},{"status":"next","when":"Next year","title":"Come-back reviews","text":"New numbers a few days later, to see what is truly remembered."},{"status":"next","when":"Next year","title":"Reasoning puzzles","text":"Number patterns, analogies, sorting and shape puzzles, built into every topic."},{"status":"next","when":"Next year","title":"A parent report","text":"What your child did alone, where a hint helped, and one question to ask."},{"status":"next","when":"Next year","title":"Real-life math projects","text":"Money, data and measuring, with simple things from home."},{"status":"later","when":"Later","title":"Levels 6 to 12","text":"The later Levels, starting with the children who finish early."},{"status":"later","when":"Later","title":"More subjects","text":"Reading, writing, science and more, five minutes at a time."}]},"parentView":{"title":"Parent View","lead":"Everything a grown-up needs on one page: what this is, how your child uses it, why it is built this way, and how your child is doing.","nav":[{"id":"pv-what","label":"What it is"},{"id":"pv-how","label":"How it works"},{"id":"pv-why","label":"Why it works"},{"id":"pv-benefits","label":"Benefits"},{"id":"pv-course","label":"Course progress"},{"id":"pv-child","label":"Your child"},{"id":"pv-map","label":"Learning map"}],"what":{"title":"What is Five-Minute Thinkers?","paras":["Five-Minute Thinkers is a set of short, hands-on lessons. Each one teaches a single idea in about five minutes.","Your child does the thinking. They guess first, try it with pictures and tools they can move, and then say why in their own words.","It is free. There are no accounts, no ads and nothing about your child is collected. Progress stays on this device, in this browser."],"points":["One idea per lesson","About five minutes","Free, no accounts, no ads","Progress stays on this device"]},"how":{"title":"How your child uses it","steps":[{"emoji":"🦊","title":"Pick who is playing","text":"Tap the animal button at the top and choose your child's animal. Each child gets their own sparks, badges and record."},{"emoji":"📚","title":"Choose a lesson","text":"Pick a subject, then a lesson. Each card says how long it takes. Start with one that looks fun."},{"emoji":"🤔","title":"Predict, try, explain","text":"Your child guesses first, explores with tools they can move, and then explains why. A wrong guess is part of the plan, not a problem."},{"emoji":"✨","title":"Finish and earn sparks","text":"Sparks are earned for effort and good habits, like predicting, asking for a hint, or trying again. Nothing is ever taken away."},{"emoji":"🌅","title":"Come back tomorrow","text":"Five to ten minutes a day is often more effective than one long session. Short and often is the whole idea."}],"rhythm":"A good rhythm is one lesson a day, five to ten minutes. If your child wants to stop early, that is fine. If they want more, there is always another one.","tiers":{"title":"Two steps inside a lesson: Starter and Stretch","text":"Many lessons have two difficulty tiers. Starter is a gentler start. Stretch goes one step deeper with the same big idea. Your child can begin with either and move up when they feel ready."},"extras":[{"emoji":"💡","title":"Hints are welcome","text":"Lessons offer hints in steps. Asking for a hint earns a spark, because asking is smart. This page shows how often a hint was used, so you can see what was done alone."},{"emoji":"🔄","title":"Sharing one device","text":"Brothers and sisters can share a device. Tap the animal button and choose Switch player. Each child's record stays separate."},{"emoji":"💾","title":"Back up with a save code","text":"A save code is a long piece of text that holds your child's progress. Make one now and then from the Grown-ups page, and paste it into another device to move everything over. Browsers can clear saved data, so this is a good habit."}]},"why":{"title":"Why it works: what we combined","lead":"We looked at how good teachers and good learning tools explain math, and we kept the strongest ideas from each. These are the ideas behind how we build our lessons. They are ideas supported by learning research, not promises about results.","cards":[{"emoji":"🧱","title":"Hands first, then pictures, then symbols","text":"Children meet an idea with things they can move, then see it as a picture, and only then write it with numbers. This is how Singapore-style and Montessori-style teaching build understanding before rules.","status":"live"},{"emoji":"🎯","title":"Predict first, then test","text":"Before a child is shown the answer, they make a guess. Wondering first often makes the explanation stick, and a wrong guess becomes a useful surprise.","status":"live"},{"emoji":"💬","title":"Explain why in your own words","text":"Many lessons end with the child choosing or building the reason. Saying why is one of the strongest ways to find out what a child really understands.","status":"live"},{"emoji":"🐢","title":"Mastery over speed","text":"Speed never earns anything. There are no leaderboards and no streak punishment, and nothing is taken away. The practice games that keep a best time (Times Tables and Cube Quest) only compare a child with their own earlier tries. The timer can be hidden or skipped, and it never decides whether a child moves on.","status":"live"},{"emoji":"🔁","title":"Warm-ups now, come-back reviews next","text":"After a lesson, a short warm-up brings the idea back. Coming back a few days later with new numbers, to see what is truly remembered, is planned. A first version for fractions is being tested before it reaches this site.","status":"planned"},{"emoji":"🔒","title":"Answer keys checked by an automatic test","text":"Each math lesson runs a built-in self-test: exactly one right answer per question, the right answer is not always in the same place, and every wrong answer matches a named slip. We also break lessons on purpose to make sure the test catches mistakes. Other lessons are checked in other ways. Stand-alone no-hint checks with new numbers are planned.","status":"live"},{"emoji":"🧩","title":"Reasoning beyond procedures","text":"Patterns, analogies, sorting and shape puzzles train flexible thinking, not just steps. Hands-on cube puzzles are in the Little STEAM Lab today. The pattern, analogy and sorting puzzles are planned.","status":"planned"},{"emoji":"🤖","title":"Built with AI, then checked","text":"AI helps us draft lessons and tools quickly. Independent reviewers check our lessons before they are released, and we test them in real browsers at several screen sizes. The site is still in Beta, so lessons are still being polished. Children try lessons as we go. Trying every lesson with real children first is planned.","status":"live"},{"emoji":"✏️","title":"Original content only","text":"We study how great teachers explain things, then build our own pictures, tools and problems. We never copy other products or tests.","status":"live"},{"emoji":"🛡️","title":"Private by design","text":"No accounts and no ads. Each child's record is kept in this browser on this device. It leaves the device only if a grown-up chooses to make a save code or to connect their own private sheet, which is off by default.","status":"live"}],"notThis":{"title":"What this is not","items":["Not a replacement for school or for a teacher.","Not test prep, and we make no promises about test scores.","No rankings, no comparing children, no scores out of 100."]}},"benefits":{"title":"Benefits for your child and for you","child":["Built to help build real understanding, not just memorized steps","Confidence, because a wrong guess is safe here","Short sessions that fit into a busy day","Pictures, tools and games that are fun to explore"],"parent":["See what your child did alone and where a hint helped","One simple question to ask tonight","Nothing to set up, no account to make","Private: the record stays on your device"]},"course":{"title":"Course progress","lead":"Counted live from the site. Beta means the lesson is ready to try and we are still polishing and testing it.","built":"We build the whole map first, then fill it in Level by Level, starting with the earliest.","roadmapTitle":"Where we are going","roadmapLead":"Colored things you can use today. Gray things are planned.","reword":{"Math lessons, Level 0 to Level 5":{"title":"Math lessons","text":"{N} math lessons you can play today, growing every week."},"A parent report":{"status":"now","title":"A parent report","text":"This h finish). If the ledger cannot tell which tier was played, a finish lights 'starter' and 'any' items only. An item shows 'in progress' when the child has started a listed lesson but not finished it. Lessons are matched by the last part of the lesson id, the same way the passport does it. Result details (share right on the first try, hints used, minutes) come from the child's own ledger for the lesson that lit the item. 'planned' items never light. 'skill' lists skill-map ids for the team and is not shown to families. An item may carry an optional 'units' list (for example L5-cube-3x3 has ['week8']): then it lights only when one of those units was finished, not on any finish of the lesson. 'levelOf' gives each lesson's Starter and Stretch Level, and the lesson cards and lists on the site show the Level from it, and 'counts' gives items per Level. Families only ever see 'Level N'.","levels":[{"level":0,"title":"Counting and Shapes","blurb":"Children count small groups, compare them, and learn which numbers pair up to make ten. They also meet flat and solid shapes and learn to sort things into groups.","status":"building","strands":[{"name":"Counting and numbers","items":[{"id":"L0-count-how-many","name":"Count and say how many","plain":"Touches each thing once and knows the last number said tells how many.","lessons":["count-how-many"],"state":"available","tier":"any"},{"id":"L0-compare-groups","name":"Compare two groups to 10","plain":"Matches two groups up and says which has more, which has fewer, or that they are the same.","lessons":["more-fewer-same"],"state":"available","tier":"starter"},{"id":"L0-ten-partners","name":"Pairs that make ten","plain":"Knows that every number up to 10 has a partner that makes ten together.","lessons":["ten-composition"],"state":"available","tier":"any"},{"id":"L0-teen-numbers","name":"Teen numbers","plain":"Knows that 14 is one ten and four ones.","lessons":[],"state":"planned","tier":"planned"}]},{"name":"Putting together and taking apart","items":[{"id":"L0-together-apart","name":"Put together and take away within 10","plain":"Tells and solves little stories where things join or go away, and knows what the equals sign means.","lessons":["together-and-apart"],"state":"available","tier":"any"}]},{"name":"Shapes and places","items":[{"id":"L0-flat-shapes","name":"Name flat shapes","plain":"Names circles, triangles, squares and rectangles in pictures and around the house.","lessons":["name-flat-shapes"],"state":"available","tier":"any"},{"id":"L0-where-things-are","name":"Say where things are","plain":"Uses words like above, below, beside, in front of and behind.","lessons":["where-things-are"],"state":"available","tier":"any"},{"id":"L0-solid-shapes","name":"Name solid shapes","plain":"Tells a cube, ball, cone and can apart, and tells flat shapes from solid ones.","lessons":["name-solid-shapes"],"state":"available","tier":"any"},{"id":"L0-shapes-together","name":"Put shapes together and take them apart","plain":"Builds a bigger shape out of smaller ones and splits it back up.","lessons":[],"state":"planned","tier":"planned"}]},{"name":"Sorting and data","items":[{"id":"L0-sort-count","name":"Sort things and count each group","plain":"Sorts a pile of things into groups and counts how many are in each.","lessons":["sort-and-count"],"state":"available","tier":"any"}]},{"name":"Fair shares","items":[{"id":"L0-fair-shares","name":"Fair shares need equal parts","plain":"Sees that sharing fairly means the pieces must be the same size.","lessons":[],"state":"planned","tier":"planned"}]}]},{"level":1,"title":"Tens, Ones and Adding to 20","blurb":"Children see two-digit numbers as tens and ones, add and take away across ten, and read the clock. They try first halves and quarters, and a set of food, body, map and money mysteries.","status":"building","strands":[{"name":"Place value and counting","items":[{"id":"L1-tens-ones","name":"Two-digit numbers are tens and ones","plain":"Knows that 34 is three tens and four ones, and that ten ones make one ten.","lessons":["tens-and-ones"],"state":"available","tier":"any"},{"id":"L1-ten-more-less","name":"Ten more, ten less","plain":"Finds the number that is ten more or ten less than a two-digit number.","lessons":["ten-more-ten-less"],"state":"available","tier":"starter"},{"id":"L1-count-10s-5s","name":"Count by 10s and 5s","plain":"Counts forward by tens and by fives without losing the place.","lessons":[],"state":"planned","tier":"planned"}]},{"name":"Adding and taking away","items":[{"id":"L1-make-ten","name":"Add across ten by making ten first","plain":"Works out 8 + 5 by filling up to ten, then adding the rest.","lessons":["make-ten-addition"],"state":"available","tier":"any"},{"id":"L1-break-ten","name":"Take away across ten","plain":"Works out 14 - 6 by taking away down to ten first, then the rest.","lessons":["subtract-through-ten"],"state":"available","tier":"any"},{"id":"L1-undo","name":"Adding and taking away undo each other","plain":"Checks an answer by going backwards, such as 7 + 5 = 12 so 12 - 5 = 7.","lessons":["add-sub-inverse"],"state":"available","tier":"starter"},{"id":"L1-story-problems","name":"Story problems: join, take away, compare","plain":"Reads a short story and decides whether to add, take away or compare.","lessons":["story-problems"],"state":"available","tier":"any"},{"id":"L1-how-many-more","name":"How many more?","plain":"Compares two numbers and says how many more one has than the other.","lessons":["more-fewer-same"],"state":"available","tier":"stretch"}]},{"name":"Time, measuring and data","items":[{"id":"L1-clock-hours","name":"Read the hour and half hour","plain":"Reads a clock when it is on the hour or half past.","lessons":["telling-time"],"state":"available","tier":"starter"},{"id":"L1-measure-units","name":"Measure with equal units","plain":"Measures a length by laying same-size units end to end with no gaps.","lessons":["measure-equal-units"],"state":"available","tier":"any"},{"id":"L1-tally-graph","name":"Tally marks and picture graphs","plain":"Keeps a tally of what was counted and shows it in a picture graph.","lessons":["tally-picture-graph"],"state":"available","tier":"any"},{"id":"L1-bar-graph","name":"Read and make a bar graph","plain":"Reads a bar graph where each step counts one and makes one of their own.","lessons":["bar-graph-read"],"state":"available","tier":"any"}]},{"name":"Shapes and fair shares","items":[{"id":"L1-shape-sides","name":"What makes a shape that shape","plain":"Knows a shape is named by its sides and corners, not by its size, colour or turn.","lessons":["shape-sides-corners"],"state":"available","tier":"any"},{"id":"L1-halves-quarters","name":"Halves, thirds and quarters","plain":"Shares a whole into equal parts and names them as halves, thirds and quarters.","lessons":["fraction-intro"],"state":"available","tier":"starter"},{"id":"L1-equal-shares-shapes","name":"Equal shares of rectangles and circles","plain":"Cuts a rectangle or circle into equal parts in more than one way.","lessons":["equal-shares-shapes"],"state":"available","tier":"any"},{"id":"L1-perimeter","name":"Perimeter: the way around","plain":"Adds the sides to find the distance all the way around a shape.","lessons":["perimeter-walk"],"state":"available","tier":"any"},{"id":"L1-fraction-line","name":"Fractions on a number line","plain":"Places a fraction on a number line between 0 and 1.","lessons":["fraction-number-line"],"state":"available","tier":"any"}]},{"name":"Science and everyday smarts","items":[{"id":"L1-sugar-sort","name":"Spot the sugar in foods","plain":"Sorts foods by how much sugar they hold and sees why it matters.","lessons":["sugar-label-detective"],"state":"available","tier":"starter"},{"id":"L1-fat-sort","name":"Where fats come from","plain":"Sorts fats by where they come from, with no numbers needed.","lessons":["fat-label-detective"],"state":"available","tier":"starter"},{"id":"L1-color-added","name":"Added colour or natural colour","plain":"Tells colour that comes from the food itself from colour that was added.","lessons":["color-label-detective"],"state":"available","tier":"starter"},{"id":"L1-warning-why","name":"Why a trace warning shows up","plain":"Gives two simple reasons a tiny trace of something can appear in a food.","lessons":["warning-label-detective"],"state":"available","tier":"starter"},{"id":"L1-vitamin-c","name":"The sailors who needed fresh food","plain":"Follows the story of sailors who got sick and why top-ups from fresh food mattered.","lessons":["vitamin-c"],"state":"available","tier":"starter"},{"id":"L1-tooth-order","name":"Baby teeth fall out in order","plain":"Learns that teeth fall out in a pattern and puts the order together.","lessons":["tooth-timeline"],"state":"available","tier":"starter"},{"id":"L1-continents-oceans","name":"Continents and oceans","plain":"Names the continents and oceans and sees that some borders are lines people drew.","lessons":["continents-and-oceans"],"state":"available","tier":"starter"},{"id":"L1-piggy-bank","name":"Savings that grow","plain":"Watches a piggy bank grow with interest, with no percent maths yet.","lessons":["travel-piggy-bank"],"state":"available","tier":"starter"}]}]},{"level":2,"title":"Hundreds, Groups and Graphs","blurb":"Children add and take away two-digit numbers with trading, meet equal groups and skip counting, and work with coins, dollars and clocks. Graphs and rulers are next on the way.","status":"building","strands":[{"name":"Numbers to 1,000","items":[{"id":"L2-add-trade","name":"Add two-digit numbers with a trade","plain":"Adds like 38 + 27 by trading ten ones for one ten.","lessons":["add-regroup"],"state":"available","tier":"starter"},{"id":"L2-subtract-trade","name":"Take away two-digit numbers with a trade","plain":"Takes away like 52 - 27 by trading one ten for ten ones.","lessons":["subtract-regroup"],"state":"available","tier":"starter"},{"id":"L2-ten-more-past-100","name":"Ten more and ten less past one hundred","plain":"Moves ten up or down even when the number crosses 100.","lessons":["ten-more-ten-less"],"state":"available","tier":"stretch"},{"id":"L2-check-two-digit","name":"Check two-digit answers by going backwards","plain":"Uses the opposite operation to prove a two-digit answer is right.","lessons":["add-sub-inverse"],"state":"available","tier":"stretch"},{"id":"L2-even-odd","name":"Even and odd numbers","plain":"Tells even from odd by pairing things up with none left over.","lessons":[],"state":"planned","tier":"planned"},{"id":"L2-mental-100","name":"Mental strategies within 100","plain":"Adds and takes away in the head by jumping tens and ones.","lessons":[],"state":"planned","tier":"planned"},{"id":"L2-hundreds","name":"Hundreds, tens and ones","plain":"Reads, writes and compares numbers up to 1,000.","lessons":[],"state":"planned","tier":"planned"},{"id":"L2-roman","name":"Write numbers as Roman numerals","plain":"Writes numbers as Roman numerals using tens and ones ideas.","lessons":["roman-numerals"],"state":"available","tier":"any"}]},{"name":"Equal groups","items":[{"id":"L2-equal-groups","name":"Equal groups added again and again","plain":"Adds trays of the same size over and over, such as 4 + 4 + 4.","lessons":["multiplication-arrays"],"state":"available","tier":"starter"},{"id":"L2-skip-counting","name":"Skip counting by 2s, 5s and 10s","plain":"Counts in equal hops and sees the patterns in the numbers.","lessons":["count-by-tables"],"state":"available","tier":"starter"},{"id":"L2-cover-rectangle","name":"Cover a rectangle with squares","plain":"Fills a rectangle with same-size squares in rows and columns.","lessons":[],"state":"planned","tier":"planned"}]},{"name":"Time and money","items":[{"id":"L2-clock-fives","name":"Read the clock in fives","plain":"Reads the minute hand in steps of five minutes.","lessons":["telling-time"],"state":"available","tier":"stretch"},{"id":"L2-hours-later","name":"Hours and half hours later","plain":"Finds what time it will be a few hours or half hours later.","lessons":["elapsed-time"],"state":"available","tier":"starter"},{"id":"L2-weeks","name":"Calendar weeks","plain":"Knows the same weekday comes back every 7 days and uses it on a calendar.","lessons":["calendar-weeks"],"state":"available","tier":"starter"},{"id":"L2-coins","name":"Count coins","plain":"Knows each coin value, counts mixed coins, and finds the fewest coins or the change.","lessons":["counting-coins"],"state":"available","tier":"any"},{"id":"L2-dollars-cents","name":"Dollars and cents","plain":"Writes money like $0.46 and $1.05 and avoids the zero trap.","lessons":["money-dollars"],"state":"available","tier":"any"}]},{"name":"Graphs and measuring","items":[{"id":"L2-compare-categories","name":"How many more, how many fewer","plain":"Compares the bars of a graph to say how many more or fewer.","lessons":[],"state":"planned","tier":"planned"},{"id":"L2-line-plot","name":"Line plots with whole units","plain":"Shows measurements as marks above a number line.","lessons":[],"state":"planned","tier":"planned"},{"id":"L2-ruler-zero","name":"Measure with a ruler, starting at zero","plain":"Lines an object up at zero and counts the units along the ruler.","lessons":["ruler-from-zero"],"state":"available","tier":"any"},{"id":"L2-two-units","name":"The same length in two units","plain":"Sees that a bigger unit needs a smaller number to name the same length.","lessons":[],"state":"planned","tier":"planned"}]},{"name":"Shapes and fractions","items":[{"id":"L2-square-corner","name":"Smaller, same or bigger than a square corner","plain":"Compares a corner to a square corner and says if it is smaller, the same, or bigger.","lessons":["angle-turns"],"state":"available","tier":"starter"},{"id":"L2-smaller-pieces","name":"More equal parts means smaller pieces","plain":"Understands that cutting a whole into more parts makes each part smaller.","lessons":[],"state":"planned","tier":"planned"}]},{"name":"Science and everyday smarts","items":[{"id":"L2-claims-feelings","name":"Rules versus feelings on a food box","plain":"Tells which words on a food box are real rules and which are just a good feeling.","lessons":["package-claims-detective"],"state":"available","tier":"starter"},{"id":"L2-splinter","name":"How skin renews itself","plain":"Learns where a splinter goes as skin grows and replaces itself.","lessons":["splinter"],"state":"available","tier":"any"}]}]},{"level":3,"title":"Multiply, Divide and Fractions","blurb":"Children learn that multiplying and dividing are two sides of one idea, learn their times facts, and treat fractions as numbers. They also meet area, perimeter and the clock to the minute.","status":"building","strands":[{"name":"Numbers to 1,000","items":[{"id":"L3-add-1000","name":"Add within 1,000","plain":"Adds numbers up to 1,000 with two trades into the hundreds.","lessons":["add-regroup"],"state":"available","tier":"stretch"},{"id":"L3-subtract-1000","name":"Take away within 1,000","plain":"Takes away numbers up to 1,000 with trades through the hundreds.","lessons":["subtract-regroup"],"state":"available","tier":"stretch"},{"id":"L3-round","name":"Round and estimate","plain":"Rounds a number to the nearest ten or hundred to make a quick estimate.","lessons":[],"state":"planned","tier":"planned"}]},{"name":"Multiplying and dividing","items":[{"id":"L3-rows-times","name":"Rows times the number in each row","plain":"Writes a multiplication from rows and the number in each row, and knows the order can turn around.","lessons":["multiplication-arrays"],"state":"available","tier":"stretch"},{"id":"L3-skip-to-tables","name":"Count-by facts as times tables","plain":"Connects counting in equal hops to the times table facts.","lessons":["count-by-tables"],"state":"available","tier":"stretch"},{"id":"L3-fact-tricks","name":"Split a hard fact into easy facts","plain":"Works out a hard fact like 7 x 6 from facts like 5 x 6 and 2 x 6.","lessons":["times-strategies"],"state":"available","tier":"any"},{"id":"L3-split-tray","name":"Split a number into tens and ones to multiply","plain":"Multiplies a two-digit number by splitting it into tens and ones.","lessons":["area-model-multiply"],"state":"available","tier":"starter"},{"id":"L3-times-practice","name":"Practise the times facts","plain":"Builds quick recall of times facts up to 10 x 10 through practice.","lessons":["times-tables"],"state":"available","tier":"starter"},{"id":"L3-division-sharing","name":"Division as sharing and grouping","plain":"Divides by dealing out fairly or by making equal groups.","lessons":["division-sharing"],"state":"available","tier":"any"},{"id":"L3-fact-family","name":"Fact families","plain":"Knows multiplying and dividing undo each other, and checks division by multiplying.","lessons":["mult-div-inverse"],"state":"available","tier":"any"},{"id":"L3-division-known-fact","name":"Divide from a fact you know","plain":"Divides by 2, 5 and 10 by thinking of the matching times fact.","lessons":["division-known-fact"],"state":"available","tier":"starter"},{"id":"L3-leftovers","name":"Leftovers when sharing","plain":"Shares things out and says how many are left over.","lessons":["division-remainders"],"state":"available","tier":"starter"},{"id":"L3-growing-squares","name":"Growing squares from odd numbers","plain":"Sees that adding the next odd number grows a square, and spots the pattern.","lessons":["odd-numbers-squares"],"state":"available","tier":"starter"}]},{"name":"Fractions","items":[{"id":"L3-write-fraction","name":"Read and write a fraction","plain":"Reads and writes a fraction such as 3/4 with a top and a bottom.","lessons":["fraction-intro"],"state":"available","tier":"stretch"},{"id":"L3-fraction-twins","name":"Same amount, different name","plain":"Knows 1/2 and 2/4 are the same amount and spots the near misses.","lessons":["fraction-equivalent"],"state":"available","tier":"any"},{"id":"L3-compare-same-bottom","name":"Compare fractions with the same size pieces","plain":"Says which of two fractions is bigger when the pieces are the same size.","lessons":["fraction-compare"],"state":"available","tier":"starter"},{"id":"L3-add-pieces","name":"Add same-size pieces","plain":"Adds pieces of the same size by counting them, in words.","lessons":["fraction-add"],"state":"available","tier":"starter"},{"id":"L3-subtract-pieces","name":"Take away same-size pieces","plain":"Takes away pieces of the same size and says what is left.","lessons":["fraction-subtract"],"state":"available","tier":"starter"}]},{"name":"Time, measuring and data","items":[{"id":"L3-clock-minute","name":"Read the clock to the minute","plain":"Reads any time to the nearest minute by counting on from the five-minute mark.","lessons":["clock-to-the-minute"],"state":"available","tier":"any"},{"id":"L3-time-hops","name":"How long did it take","plain":"Finds how long something took by hopping through the hour.","lessons":["elapsed-time"],"state":"available","tier":"stretch"},{"id":"L3-weeks-extra","name":"Weeks plus extra days","plain":"Turns a number of days into weeks and extra days to plan ahead on a calendar.","lessons":["calendar-weeks"],"state":"available","tier":"stretch"},{"id":"L3-scaled-graphs","name":"Graphs where each step is worth more than one","plain":"Reads graphs where each picture or step counts for 2, 5 or 10.","lessons":[],"state":"planned","tier":"planned"},{"id":"L3-mass-volume","name":"Weigh and pour","plain":"Measures how heavy things are and how much liquid fits in a jug.","lessons":[],"state":"planned","tier":"planned"}]},{"name":"Area, perimeter and shapes","items":[{"id":"L3-area-tiles","name":"Area: covering with squares","plain":"Counts the unit squares that cover a flat shape.","lessons":[],"state":"planned","tier":"planned"},{"id":"L3-area-rectangle","name":"Area of a rectangle","plain":"Finds area by multiplying rows by columns.","lessons":[],"state":"planned","tier":"planned"},{"id":"L3-area-l-shapes","name":"Area of L-shaped figures","plain":"Splits an L-shape into rectangles and adds the areas.","lessons":[],"state":"planned","tier":"planned"},{"id":"L3-same-perimeter","name":"Same perimeter, different area","plain":"Sees that two shapes can have the same distance around but cover different space.","lessons":[],"state":"planned","tier":"planned"},{"id":"L3-shape-families","name":"Shapes belong to families","plain":"Sorts four-sided shapes into families and sees how the families overlap.","lessons":[],"state":"planned","tier":"planned"}]},{"name":"Science and everyday smarts","items":[{"id":"L3-sugar-label","name":"Compare sugar fairly using a label","plain":"Reads real numbers on a label and compares two foods fairly.","lessons":["sugar-label-detective"],"state":"available","tier":"stretch"},{"id":"L3-fat-label","name":"Read fat words on a label","plain":"Reads words like total and saturated fat and compares foods fairly.","lessons":["fat-label-detective"],"state":"available","tier":"stretch"},{"id":"L3-color-label","name":"Read named dyes and judge a claim","plain":"Reads named dyes on a label and decides if a colour claim is true.","lessons":["color-label-detective"],"state":"available","tier":"stretch"},{"id":"L3-warning-cautious","name":"Why a warning is a careful heads-up","plain":"Understands that a warning is a cautious note, not a promise of harm.","lessons":["warning-label-detective"],"state":"available","tier":"stretch"},{"id":"L3-vitamin-test","name":"A fair test from history","plain":"Reads the sailors' history as a fair test and says what it shows.","lessons":["vitamin-c"],"state":"available","tier":"stretch"},{"id":"L3-tooth-compare","name":"Compare start and finish times fairly","plain":"Compares when teeth start and finish falling out as a fair comparison.","lessons":["tooth-timeline"],"state":"available","tier":"stretch"},{"id":"L3-borders-test","name":"Test a rule against real borders","plain":"Tests a rule about continents and oceans against real borders.","le function bundle(){var saves={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^fmlos\.sample\..+\.h_[a-z]+\.v1$/.test(k)||/^rnk_state:[a-z]+$/.test(k)||k==='mathfacts_progress_v1')saves[k]=localStorage.getItem(k)}}catch(e){}
  return{fmt:'FMT-SAVE',v:1,at:Date.now(),passport:{kids:st.kids,rewards:st.rewards},saves:saves}}
function b64u(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

function pipe(bytes,Ctor){return new Response(new Blob([bytes]).stream().pipeThrough(new Ctor('deflate'))).arrayBuffer()}
function encode(o){var json=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream)return pipe(json,CompressionStream).then(function(b){return 'FMT1.'+b64u(b)});
  return Promise.resolve('FMT0.'+b64u(json))}
function decode(code){var m=/^FMT([01])\.([A-Za-z0-9_-]+)$/.exec(String(code).replace(/\s+/g,''));
  if(!m)return Promise.reject(new Error('That does not look like a save code.'));
  var b=unb64u(m[2]);if(m[1]==='1'&&!window.DecompressionStream)return Promise.reject(new Error('This browser is too old to read this code. Update it, or open the code on a newer device.'));
  return(m[1]==='1'?pipe(b,DecompressionStream):Promise.resolve(b.buffer)).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))})}

    var added=0,kids=0;

      Object.keys(src.ledger||{}).forEach(function(key){var e=src.ledger[key];if(!Array.isArray(e)||e.length<4||typeof e[0]!=='number'||typeof e[1]!=='number'||typeof key!=='string'||key.length>120)return;if(!k.ledger[key]){k.ledger[key]=[e[0],e[1],String(e[2]).slice(0,8),String(e[3]).slice(0,60),+e[4]||0];if(typeof e[5]==='string'&&e[5])k.ledger[key].push(e[5].slice(0,40));added++}});
