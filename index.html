<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five-Minute Thinkers: one idea, five minutes, your child does the thinking</title>
<meta name="description" content="One idea in five minutes, explained so it clicks and your child does the thinking. Interactive math, science and everyday-smarts lessons, free to try, no sign-up, nothing collected.">
<meta name="theme-color" content="#7ccbff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20role%3D%22img%22%20aria-label%3D%22Five-Minute%20Thinkers%22%3E%3Crect%20x%3D%2228%22%20y%3D%221.5%22%20width%3D%228%22%20height%3D%226%22%20rx%3D%222%22%20fill%3D%22%231d2b4f%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2236%22%20r%3D%2224%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%231d2b4f%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M32%2036%20L32%2015%20A21%2021%200%200%201%2050.2%2025.5%20Z%22%20fill%3D%22%23e8650a%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2236%22%20r%3D%224%22%20fill%3D%22%231d2b4f%22%2F%3E%3Cpath%20d%3D%22M54%203%20L55.8%207.6%20L60.4%209.4%20L55.8%2011.2%20L54%2015.8%20L52.2%2011.2%20L47.6%209.4%20L52.2%207.6%20Z%22%20fill%3D%22%23ffd23f%22%20stroke%3D%22%231d2b4f%22%20stroke-width%3D%221.4%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Five-Minute Thinkers">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#1d2b4f; --mute:#4a587a; --page:#fff6e3; --card:#fff;
  --orange:#d95b00; --orange-s:#ffe2c4; --orange-m:#ff9a3d;
  --pink:#d6246e;   --pink-s:#ffd8ea;   --pink-m:#ff6fa8;
  --teal:#0b8a7c;   --teal-s:#c8f3ec;   --teal-m:#2fd0bd;
  --green:#1f8f45;  --green-s:#d3f4dd;  --green-m:#4fd37c;
  --purple:#6d3fd8; --purple-s:#e4dbff; --purple-m:#a07cff;
  --blue:#1b6fd1;   --blue-s:#d5e9ff;   --blue-m:#4fa8ff;
  --display:"Baloo 2","Nunito","Trebuchet MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--page);color:var(--ink);font:700 18px/1.55 var(--body);overflow-x:hidden}
button,a{font-family:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.c-orange{--c:var(--orange);--cs:var(--orange-s);--cm:var(--orange-m)}
.c-pink{--c:var(--pink);--cs:var(--pink-s);--cm:var(--pink-m)}
.c-teal{--c:var(--teal);--cs:var(--teal-s);--cm:var(--teal-m)}
.c-green{--c:var(--green);--cs:var(--green-s);--cm:var(--green-m)}
.c-purple{--c:var(--purple);--cs:var(--purple-s);--cm:var(--purple-m)}
.c-blue{--c:var(--blue);--cs:var(--blue-s);--cm:var(--blue-m)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,246,227,.94);backdrop-filter:blur(6px);border-bottom:2px solid #f1dfb8}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 22px var(--display);cursor:pointer;border:0;background:none;padding:0}
.brand svg{width:44px;height:44px}
.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.top nav a{min-height:44px;display:inline-flex;align-items:center;padding:6px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font:800 17px var(--display);cursor:pointer}
.top nav a:hover{background:#ffe9bd}
@media (max-width:560px){.brand span{display:none}.top nav a{padding:6px 10px;font-size:16px}}

/* ---------- hero ---------- */
.hero{position:relative;background:linear-gradient(180deg,#7ccbff 0%,#b9e6ff 60%,#fff0c9 100%);padding:34px 0 84px;overflow:hidden}
.hero .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift 60s linear infinite}
.hero .cloud::before,.hero .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.a{width:120px;height:34px;top:26px;left:-140px}.cloud.a::before{width:52px;height:52px;left:18px;top:-24px}.cloud.a::after{width:40px;height:40px;left:62px;top:-16px}
.cloud.b{width:90px;height:26px;top:300px;left:-120px;animation-duration:80s;animation-delay:-30s}.cloud.b::before{width:40px;height:40px;left:12px;top:-18px}.cloud.b::after{width:30px;height:30px;left:46px;top:-12px}
@keyframes drift{to{transform:translateX(calc(100vw + 360px))}}
.hero-grid{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(34px,5.6vw,58px);font-weight:800;color:#fff;text-shadow:0 4px 0 #1b6fd1,0 8px 0 rgba(27,111,209,.3)}
.hero .sub{margin:16px 0 0;font:700 clamp(18px,2.3vw,22px)/1.45 var(--body);color:#12306b;max-width:560px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn{min-height:56px;border:0;border-radius:18px;padding:10px 26px;font:800 22px var(--display);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,box-shadow .1s}
.btn.main{background:var(--orange);color:#fff;box-shadow:0 6px 0 #8f3c00}
.btn.main:hover{transform:translateY(-2px);box-shadow:0 8px 0 #8f3c00}
.btn.main:active{transform:translateY(3px);box-shadow:0 2px 0 #8f3c00}
.btn.alt{background:#fff;color:var(--blue);box-shadow:0 6px 0 rgba(20,40,90,.22)}
.btn.alt:hover{transform:translateY(-2px)}
.btn.c{background:var(--c);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.c:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--c,var(--blue));border:3px solid var(--cs,#d5e9ff);min-height:48px;font-size:19px;padding:6px 16px;box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chip{background:rgba(255,255,255,.92);color:#12306b;border-radius:999px;padding:5px 14px;font:800 15px var(--display)}
.demo-box{position:relative;display:flex;justify-content:center;padding:6px 0}
.demo{position:relative;width:min(360px,100%);background:#fff;border-radius:28px;padding:18px 20px 20px;box-shadow:-12px 12px 0 #ffd23f,0 22px 34px rgba(20,40,90,.18);transform:rotate(2deg);animation:bob 4s ease-in-out infinite}

.demo-top{display:flex;align-items:center;gap:10px}
.demo-top .lg{width:38px;flex:0 0 auto}.demo-top b{font:800 18px var(--display);flex:1}
.demo-time{background:var(--orange-s);color:var(--orange);border-radius:999px;padding:3px 12px;font:800 16px var(--display)}
.demo-q{margin:14px 0 4px;font:800 14px var(--display);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.demo-big{margin:0;font:800 24px/1.2 var(--display)}
.demo-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.demo-opts span{border:3px solid var(--blue-s);border-radius:14px;padding:6px 14px;font:800 20px var(--display);color:var(--blue)}
.demo-opts span.pick{background:var(--blue);border-color:var(--blue);color:#fff}
.demo-steps{display:flex;gap:6px;margin-top:16px}
.demo-steps span{flex:1;text-align:center;background:var(--cs,#fff0c9);color:var(--ink);border-radius:12px;padding:6px 2px;font:800 14px var(--display)}
.demo-steps span:nth-child(1){background:#ffe2c4}.demo-steps span:nth-child(2){background:#d3f4dd}.demo-steps span:nth-child(3){background:#d5e9ff}
@keyframes bob{50%{transform:translateY(-9px) rotate(-2deg)}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:54px;width:100%;display:block}
@media (max-width:760px){.cloud.b{display:none}.hero-grid{grid-template-columns:1fr}.demo-box{order:2}.demo{transform:none}.hero{padding-top:20px}}

/* ---------- sections ---------- */
section.block{padding:34px 0 8px}
section.block h2{font-size:clamp(28px,4vw,38px);font-weight:800}
.lead{margin:6px 0 20px;color:var(--mute);font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:3px solid var(--cs);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--cs),0 12px 22px rgba(20,30,60,.08);transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card .art{height:112px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--cs),#fff 140%);font-size:60px;position:relative}
.card .art span.e{filter:drop-shadow(0 5px 0 rgba(0,0,0,.12));display:inline-block}
.tag{position:absolute;top:10px;left:10px;background:#fff;color:var(--c);border-radius:999px;padding:2px 10px;font:800 13px var(--display)}
.tag.right{left:auto;right:10px;background:#ffd23f;color:#5a3d00}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:22px}
.card p{margin:0;font-size:16px;font-weight:700;color:var(--mute);line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.m{font:800 13.5px var(--display);background:var(--cs);color:var(--c);border-radius:999px;padding:2px 11px}
.actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.actions .btn{flex:1;min-width:110px;font-size:20px;min-height:50px}
.card.feature .art{height:132px;font-size:72px}

/* video */
.vrow{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 16px;scroll-snap-type:x proximity}
.vcard{flex:0 0 min(300px,80vw);scroll-snap-align:start;border:0;padding:0;text-align:left;background:var(--card);border-radius:20px;box-shadow:0 6px 0 var(--blue-s),0 12px 22px rgba(20,30,60,.08);overflow:hidden;cursor:pointer;font:inherit;color:inherit}
.vcard .th{position:relative;aspect-ratio:16/9;background:#12306b center/cover}
.vcard .th::after{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.vcard b{display:block;padding:10px 14px 14px;font:800 18px/1.2 var(--display)}
.soon{display:flex;align-items:center;gap:18px;background:#fff;border:3px dashed #9bc7f5;border-radius:24px;padding:18px 22px}
.soon svg{width:84px;height:84px;flex:0 0 auto}
.soon b{font:800 22px var(--display);display:block}
.soon p{margin:2px 0 0;color:var(--mute)}

/* subject tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;cursor:pointer;color:#fff;border-radius:26px;padding:18px;min-height:196px;background:linear-gradient(150deg,var(--cm),var(--c));box-shadow:0 7px 0 rgba(20,30,60,.22),0 16px 26px rgba(20,30,60,.1);overflow:hidden;font:inherit;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-.5deg)}
.tile::before{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16)}
.tile .e{font-size:58px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.18));width:fit-content}
.tile h3{font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile p{margin:0;font-size:15px;opacity:.97}
.tile .n{margin-top:auto;background:#fff;color:var(--c);border-radius:999px;padding:4px 12px;font:800 15px var(--display);width:fit-content}

/* how / promises / about */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.step{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 #f1dfb8;text-align:center}
.step .e{font-size:46px}.step h3{font-size:24px;margin:4px 0}.step p{margin:0;color:var(--mute);font-size:16.5px}
.promises{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin-top:18px}
.promise{display:flex;align-items:center;gap:10px;background:var(--green-s);color:#145d2d;border-radius:18px;padding:12px 16px;font:800 17px var(--display)}
.about{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:#fff;border-radius:28px;padding:22px;box-shadow:0 6px 0 #f1dfb8;margin-top:6px}
.about svg{width:140px}
.about h2{font-size:30px}.about p{margin:8px 0 0;color:var(--mute)}
@media (max-width:640px){.about{grid-template-columns:1fr;text-align:center}.about svg{margin:0 auto}}
footer{margin-top:44px;padding:26px 0 40px;text-align:center;color:var(--mute);font-size:15px;border-top:2px solid #f1dfb8}

/* roadmap */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-bottom:18px}
.goal{background:#fff;border-radius:22px;padding:16px;box-shadow:0 5px 0 #f1dfb8;display:flex;gap:12px;align-items:flex-start}
.goal .e{font-size:38px;line-height:1}.goal h3{font-size:22px}.goal p{margin:2px 0 0;color:var(--mute);font-size:16px}
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.ri{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ri h3{font-size:19px}.ri p{margin:0;font-size:15.5px;line-height:1.4}
.ri.now{background:var(--green-s);color:#145d2d;border:3px solid #a8e6bd}
.ri.now p{color:#245f3a}
.ri.next,.ri.later{background:#eceff3;color:#6b7690;border:3px dashed #c3cad8}
.ri.next h3,.ri.later h3{color:#68738e}.ri.next p,.ri.later p{color:#7b859d}
.ri.later{opacity:.8}
.when{align-self:flex-start;border-radius:999px;padding:1px 10px;font:800 12.5px var(--display);margin-bottom:4px}
.now .when{background:#fff;color:var(--green)}.next .when,.later .when{background:#dde2ec;color:#6b7690}
.fine{margin:14px 0 0;color:var(--mute);font-size:15.5px}
/* the "All" page: every lesson and tool in one list */
.alln{color:var(--mute);margin:2px 0 10px}
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--cs);border-radius:18px;padding:8px 12px}
.rw .e{font-size:30px;width:40px;text-align:center}
.rw .t{flex:1;min-width:0}.rw .t b{display:block;font:800 18px/1.15 var(--display)}.rw .t span{font-size:14px;color:var(--mute)}
.rw .btn{min-height:44px;font-size:18px;padding:6px 16px;flex:0 0 auto}
.rw .tg{font:800 12.5px var(--display);background:var(--cs);color:var(--c);border-radius:999px;padding:1px 9px;margin-left:6px}
@media (max-width:560px){.rw{flex-wrap:wrap}.rw .t{flex-basis:calc(100% - 60px)}}
/* ---------- inner pages ---------- */
.crumb{padding:18px 0 4px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 18px;border:0;border-radius:999px;background:#fff;color:var(--ink);font:800 18px var(--display);cursor:pointer;box-shadow:0 4px 0 rgba(20,30,60,.16)}
.page-head{display:flex;align-items:center;gap:16px;margin:10px 0 4px}
.page-head .e{font-size:62px;line-height:1}
.page-head h1{font-size:clamp(30px,5vw,46px);color:var(--c)}
.topic{display:inline-flex;margin:26px 0 12px;background:var(--cs);color:var(--c);border-radius:999px;padding:6px 18px;font:800 21px var(--display)}
.proj{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;margin-top:14px;align-items:start}
.proj .box{background:#fff;border-radius:26px;padding:20px;box-shadow:0 6px 0 var(--cs);border:3px solid var(--cs)}
.proj h2{font-size:24px;margin-bottom:8px}
.embed{position:relative;aspect-ratio:16/9;background:#12306b;border-radius:20px;overflow:hidden}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.vlist button{min-height:46px;text-align:left;border:3px solid var(--cs);background:#fff;border-radius:14px;padding:8px 14px;font:800 17px var(--display);cursor:pointer;color:var(--ink)}
.vlist button[aria-current=true]{background:var(--cs)}
.tip{margin-top:12px;background:var(--cs);border-radius:18px;padding:12px 16px;font-size:16.5px}
@media (max-width:820px){.proj{grid-template-columns:1fr}}

/* ---------- My Passport ---------- */
.mechip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px 4px 8px;border-radius:999px;background:#fff;border:3px solid var(--orange-s);color:var(--ink);text-decoration:none;font:800 17px var(--display);cursor:pointer;white-space:nowrap}
.mechip:hover{background:#fff0dc}
.mechip .mav{font-size:26px;line-height:1}
@media (max-width:560px){.top nav a.hm{display:none}.mechip{padding:4px 10px 4px 6px}}
.pp-page{padding-bottom:24px}
.pp-page h1{font-size:clamp(30px,5vw,44px);color:var(--c,var(--orange))}
.pp-h{font-size:clamp(24px,3.4vw,30px);margin:30px 0 8px}
.pp-head{display:flex;gap:18px;align-items:center;margin:20px 0 14px;background:#fff;border:3px solid var(--orange-s);border-radius:28px;padding:18px;box-shadow:0 6px 0 var(--orange-s)}
.pp-me{font-size:76px;line-height:1;flex:0 0 auto;background:var(--orange-s);border-radius:50%;width:112px;height:112px;display:flex;align-items:center;justify-content:center}
.pp-me.sm{font-size:40px;width:64px;height:64px}
.pp-ht{flex:1;min-width:0}.pp-ht h1{margin-bottom:2px}
.pp-lv{font:800 24px var(--display);color:var(--ink)}
.pp-s{color:var(--mute);font-size:16px;margin:6px 0 0}
.pp-gift{margin-top:10px;background:#fff3c4;color:#6b4a00;border-radius:14px;padding:8px 14px;font:800 17px var(--display)}
.pp-bar{height:18px;border-radius:999px;background:#f3e6c9;overflow:hidden;margin-top:8px}
.pp-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb52e,#ff7a1a);border-radius:999px;transition:width .6s}
@media (max-width:560px){.pp-head{flex-direction:column;text-align:center}.pp-me{width:96px;height:96px;font-size:62px}}
.pp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pp-stat{background:#fff;border-radius:22px;padding:12px 8px;text-align:center;box-shadow:0 5px 0 #f1dfb8}
.pp-stat .e{font-size:28px}.pp-stat b{display:block;font:800 34px/1.1 var(--display)}.pp-stat span{font-size:14.5px;color:var(--mute)}
.pp-link{display:inline-block;margin-top:12px;border:0;background:none;color:var(--blue);font:800 16px var(--display);text-decoration:underline;cursor:pointer;padding:8px 4px;min-height:44px}
.pp-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
.pp-badge{background:#ececec;color:#7b8294;border-radius:20px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:3px}
.pp-badge .e{font-size:38px;filter:grayscale(1);opacity:.7}.pp-badge b{font:800 17px/1.15 var(--display)}.pp-badge span{font-size:13.5px;line-height:1.3}
.pp-badge.on{background:#fff2c2;color:#5a3d00;box-shadow:0 5px 0 #ffd23f}.pp-badge.on .e{filter:none;opacity:1}
.pp-stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.pp-stamp{border:3px dashed var(--cs);background:#fff;border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;cursor:pointer;font:inherit;color:var(--mute)}

/* ---------- My Passport (included into the page by build-hub.cjs) ----------
   Records what a child does in the lessons, as a ledger: every earned spark is one line with a fixed key, so the same event
   can arrive twice and still counts once, and two devices can be merged by simply joining their ledgers.
   Stored on the device (localStorage). Nothing leaves the device except a save code the grown-up makes on purpose. */
var PP=(function(){
var KEY='fmt_passport_v1';
var AV=[{id:'lion',e:'🦁',n:'Lion'},{id:'fox',e:'🦊',n:'Fox'},{id:'panda',e:'🐼',n:'Panda'},{id:'owl',e:'🦉',n:'Owl'},{id:'frog',e:'🐸',n:'Frog'},{id:'penguin',e:'🐧',n:'Penguin'}];

var BADGES=[
 {id:'first',e:'🌱',name:'First Idea',how:'Finish your first lesson',ok:function(d){return d.nIdeas>=1}},
 {id:'guess',e:'🎯',name:'Brave Guesser',how:'Make 10 predictions',ok:function(d){return d.cnt.pred>=10}},
 {id:'retry',e:'💪',name:'Try-Again Champion',how:'Miss, try again, and get it 5 times',ok:function(d){return d.cnt.retry>=5}},
 {id:'ask',e:'🙋',name:'Smart Asker',how:'Ask for a hint 5 times. Asking is smart!',ok:function(d){return d.cnt.help>=5}},
 {id:'warm',e:'🔥',name:'Warm-Up Pro',how:'Pass 3 warm-ups',ok:function(d){return d.cnt.gate>=3}},
 {id:'d3',e:'📅',name:'Three-Day Thinker',how:'Think on 3 different days',ok:function(d){return d.nDays>=3}},
 {id:'d7',e:'🗓️',name:'Seven-Day Thinker',how:'Think on 7 different days',ok:function(d){return d.nDays>=7}},
 {id:'topics',e:'🧭',name:'Topic Hopper',how:'Learn ideas in 3 different topics',ok:function(d){return d.nTopics>=3}},
 {id:'s100',e:'✨',name:'100 Sparks',how:'Collect 100 sparks',ok:function(d){return d.sparks>=100}},
 {id:'s500',e:'🌟',name:'500 Sparks',how:'Collect 500 sparks',ok:function(d){return d.sparks>=500}}
];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function blank(){return{v:1,who:null,kids:{},rewards:{},backedUp:0}}
function load(){try{var s=JSON.parse(ls(KEY));if(s&&typeof s==='object'&&s.kids)return s}catch(e){}return blank()}
var st=load();
function save(){ls(KEY,JSON.stringify(st))}
function avOf(id){for(var i=0;i<AV.length;i++)if(AV[i].id===id)return AV[i];return null}
function kid(id){var k=st.kids[id];if(!k)k=st.kids[id]={ledger:{},done:{}};if(!k.ledger)k.ledger={};if(!k.done)k.done={};return k}
function slug(l){return String(l||'').split('.').pop()}
function byPP(s){for(var i=0;i<P.length;i++)if(P[i].pp===s)return P[i];return null}
function dayOf(ts){var d=new Date(ts*1000);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

/* what an event is worth. Effort and good habits earn sparks; speed never does, and nothing is ever taken away. */
function worth(k,evt){

    case 'hint_used':return['help|'+id+'|'+it,1,'help',ts];

  }

  w.appendChild(E('p','lead','A save code holds every child\'s sparks, badges, stamps and lessons in progress. Paste it into the Grown-ups page on another iPad or computer to bring everything over. Do this now and then as a backup, too: Safari can clear a website\'s data if it is not opened for a week. Adding this site to the Home Screen avoids that.'));
  w.appendChild(E('p','pp-s',st.backedUp?('Last save code made '+(days===0?'today':days+' days ago')+'.'):'You have not made a save code yet.'));
  var ta=E('textarea','pp-ta');ta.rows=4;ta.placeholder='Your save code appears here. To load one, paste it here and press "Load this code".';ta.setAttribute('aria-label','Save code');
  var r1=E('div','pp-row');
  var mk=E('button','btn c','Make a save code');mk.type='button';mk.onclick=function(){encode(bundle()).then(function(code){ta.value=code;st.backedUp=Date.now();save();ta.select();var ok=function(){note.textContent='Save code made ('+Math.round(code.length/1024)+' KB). Copied. Keep it somewhere safe, like a note to yourself.'};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(ok,function(){note.textContent='Save code made. Press and hold the text above, then Copy.'});else note.textContent='Save code made. Select the text above and copy it.'}).catch(function(e){note.textContent='Could not make a code: '+e.message})};
  var fl=E('button','btn ghost','Save as a file');fl.type='button';fl.onclick=function(){encode(bundle()).then(function(code){st.backedUp=Date.now();save();var a=E('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download='five-minute-thinkers-save.txt';document.body.appendChild(a);a.click();a.remove();note.textContent='Saved as a file.'})};
  r1.appendChild(mk);r1.appendChild(fl);
  var r2=E('div','pp-row');var ld=E('button','btn c','Load this code');ld.type='button';ld.onclick=function(){loadCode(ta.value,note)};
  var ff=E('label','btn ghost','Load from a file');var fi=E('input');fi.type='file';fi.accept='.txt,text/plain';fi.style.display='none';fi.onchange=function(){var f=fi.files&&fi.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){loadCode(String(rd.result),note)};rd.readAsText(f)};ff.appendChild(fi);r2.appendChild(ld);r2.appendChild(ff);
  var note=E('p','pp-s');note.setAttribute('role','status');
  w.appendChild(ta);w.appendChild(r1);w.appendChild(r2);w.appendChild(note);
  app.appendChild(w)}

/* ---------- save codes ---------- */
function bundle(){var saves={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^fmlos\.sample\..+\.h_[a-z]+\.v1$/.test(k)||/^rnk_state:[a-z]+$/.test(k)||k==='mathfacts_progress_v1')saves[k]=localStorage.getItem(k)}}catch(e){}
  return{fmt:'FMT-SAVE',v:1,at:Date.now(),passport:{kids:st.kids,rewards:st.rewards},saves:saves}}
function b64u(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var s=atob(t),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
function pipe(bytes,Ctor){return new Response(new Blob([bytes]).stream().pipeThrough(new Ctor('deflate'))).arrayBuffer()}
function encode(o){var json=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream)return pipe(json,CompressionStream).then(function(b){return 'FMT1.'+b64u(b)});
  return Promise.resolve('FMT0.'+b64u(json))}
function decode(code){var m=/^FMT([01])\.([A-Za-z0-9_-]+)$/.exec(String(code).replace(/\s+/g,''));
  if(!m)return Promise.reject(new Error('That does not look like a save code.'));
  var b=unb64u(m[2]);if(m[1]==='1'&&!window.DecompressionStream)return Promise.reject(new Error('This browser is too old to read this code. Update it, or open the code on a newer device.'));
  return(m[1]==='1'?pipe(b,DecompressionStream):Promise.resolve(b.buffer)).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))})}
function loadCode(text,note){
  decode(text).then(function(o){
    if(!o||o.fmt!=='FMT-SAVE'||!o.passport||typeof o.passport.kids!=='object')throw new Error('That code is not a Five-Minute Thinkers save.');
    var added=0,kids=0;
    Object.keys(o.passport.kids).forEach(function(id){if(!avOf(id))return;var src=o.passport.kids[id],k=kid(id);kids++;
      Object.keys(src.ledger||{}).forEach(function(key){var e=src.ledger[key];if(!Array.isArray(e)||e.length<4||typeof e[0]!=='number'||typeof e[1]!=='number'||typeof key!=='string'||key.length>120)return;if(!k.ledger[key]){k.ledger[key]=[e[0],e[1],String(e[2]).slice(0,8),String(e[3]).slice(0,60),+e[4]||0];added++}});
      Object.keys(src.done||{}).forEach(function(f){if(f.length<16)k.done[f]=1})});
    var rw=o.passport.rewards||{};Object.keys(rw).forEach(function(n){if(!st.rewards[n]&&typeof rw[n]==='string')st.rewards[n]=rw[n].slice(0,80)});
    var fresh=0;Object.keys(o.saves||{}).forEach(function(k){if(/^fmlos\.sample\..+\.h_[a-z]+\.v1$/.test(k)||/^rnk_state:[a-z]+$/.test(k)||k==='mathfacts_progress_v1'){if(ls(k)===null&&typeof o.saves[k]==='string'){ls(k,o.saves[k]);fresh++}}});
    save();chip();note.textContent='Loaded: '+kids+(kids===1?' child':' children')+', '+added+' new records, '+fresh+' lessons in progress. Everything already on this device was kept.';
    var d0=who();if(!d0){var ids=Object.keys(st.kids).filter(avOf);if(ids.length===1){st.who=ids[0];save();chip()}}
  }).catch(function(e){note.textContent='Could not load that: '+e.message})}

document.addEventListener('visibilitychange',function(){if(document.hidden)return;ingestQueue();chip();if(connected())sync().then(chip).catch(function(){})});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
return{view:view,pick:pick,who:who,chip:chip,ctx:ctx,counts:counts,snapshot:snapshot,recap:recap,ingest:ingestQueue,save:save}
})();

  if(!location.hash||location.hash==='#'){var el=document.getElementById(t);if(el)el.scrollIntoView()}else{location.hash='#/'+t}}});
