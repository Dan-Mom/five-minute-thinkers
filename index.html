<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Matters Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#1d2b4f; --mute:#4f5d7e; --page:#fff6e3; --card:#ffffff;
  --orange:#d95b00; --orange-s:#ffe2c4; --orange-m:#ff9a3d;
  --pink:#d6246e;   --pink-s:#ffd8ea;   --pink-m:#ff6fa8;
  --teal:#0b8a7c;   --teal-s:#c8f3ec;   --teal-m:#2fd0bd;
  --green:#1f8f45;  --green-s:#d3f4dd;  --green-m:#4fd37c;
  --purple:#6d3fd8; --purple-s:#e4dbff; --purple-m:#a07cff;
  --blue:#1b6fd1;   --blue-s:#d5e9ff;   --blue-m:#4fa8ff;
  --gray:#4b5a7a;   --gray-s:#e6eaf2;   --gray-m:#8a97b3;
  --display:"Baloo 2","Nunito","Trebuchet MS","Segoe UI Rounded",ui-rounded,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:700 17px/1.45 var(--body);overflow-x:hidden}
button,a{font-family:inherit}
.c-orange{--c:var(--orange);--cs:var(--orange-s);--cm:var(--orange-m)}
.c-pink{--c:var(--pink);--cs:var(--pink-s);--cm:var(--pink-m)}
.c-teal{--c:var(--teal);--cs:var(--teal-s);--cm:var(--teal-m)}
.c-green{--c:var(--green);--cs:var(--green-s);--cm:var(--green-m)}
.c-purple{--c:var(--purple);--cs:var(--purple-s);--cm:var(--purple-m)}
.c-blue{--c:var(--blue);--cs:var(--blue-s);--cm:var(--blue-m)}
.c-gray{--c:var(--gray);--cs:var(--gray-s);--cm:var(--gray-m)}

/* ---------- hero ---------- */
.hero{position:relative;background:linear-gradient(180deg,#7ccbff 0%,#b9e6ff 55%,#fff0c9 100%);padding:28px 16px 70px;overflow:hidden}
.hero .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;filter:blur(.3px);animation:drift 40s linear infinite}
.hero .cloud::before,.hero .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.a{width:120px;height:34px;top:22px;left:-140px}.cloud.a::before{width:52px;height:52px;left:18px;top:-24px}.cloud.a::after{width:40px;height:40px;left:62px;top:-16px}
.cloud.b{width:90px;height:26px;top:96px;left:-120px;animation-duration:55s;animation-delay:-18s}.cloud.b::before{width:40px;height:40px;left:12px;top:-18px}.cloud.b::after{width:30px;height:30px;left:46px;top:-12px}
.cloud.c{width:140px;height:38px;top:50px;left:-160px;animation-duration:70s;animation-delay:-40s}.cloud.c::before{width:60px;height:60px;left:22px;top:-28px}.cloud.c::after{width:46px;height:46px;left:76px;top:-18px}
@keyframes drift{to{transform:translateX(calc(100vw + 360px))}}
.spark{position:absolute;font-size:26px;animation:floaty 5s ease-in-out infinite;opacity:.9}
@keyframes floaty{50%{transform:translateY(-12px) rotate(8deg)}}
.hero-in{position:relative;max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.mascot{width:158px;height:158px;flex:0 0 auto;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(31,42,68,.12))}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.hero h1{margin:0;font:800 clamp(34px,6vw,56px)/1.02 var(--display);color:#fff;text-shadow:0 4px 0 #1b6fd1,0 8px 0 rgba(27,111,209,.35);letter-spacing:.5px}
.hero .tag{margin:10px 0 0;font:700 clamp(17px,2.4vw,21px)/1.35 var(--body);color:#12306b;max-width:560px}
.hero .tag small{display:block;font-weight:700;color:#2a4a8a;font-size:.88em;margin-top:2px}
.starbar{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#fff;color:var(--ink);border-radius:999px;padding:8px 18px;font:800 18px var(--display);box-shadow:0 4px 0 rgba(31,42,68,.14)}
.starbar .big{font-size:24px;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.18) rotate(10deg)}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:48px;display:block;width:100%}

/* ---------- layout ---------- */
main{max-width:1080px;margin:0 auto;padding:6px 16px 40px;min-height:50vh}
h2.sect{font:800 clamp(24px,4vw,32px)/1.1 var(--display);margin:6px 0 4px}
.lead{margin:0 0 18px;color:var(--mute);font-weight:700}

/* ---------- world tiles ---------- */
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,236px),1fr));gap:18px;margin-top:8px}
.world{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;cursor:pointer;color:#fff;border-radius:28px;padding:20px 20px 18px;min-height:230px;background:linear-gradient(150deg,var(--cm) 0%,var(--c) 100%);box-shadow:0 8px 0 rgba(20,30,60,.22),0 18px 28px rgba(20,30,60,.12);transition:transform .15s,box-shadow .15s;overflow:hidden;font:inherit}
.world:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 13px 0 rgba(20,30,60,.2),0 24px 32px rgba(20,30,60,.14)}
.world:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(20,30,60,.22)}
.world .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.16)}
.world .b1{width:150px;height:150px;right:-40px;top:-40px}.world .b2{width:90px;height:90px;right:60px;bottom:-34px}
.world .em{font-size:76px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18));animation:bob 3.4s ease-in-out infinite;display:inline-block;width:fit-content}
.world:nth-child(2) .em{animation-delay:-.8s}.world:nth-child(3) .em{animation-delay:-1.6s}.world:nth-child(4) .em{animation-delay:-2.4s}
.world h3{margin:6px 0 0;font:800 28px/1.05 var(--display);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.world p{margin:0;font-weight:700;font-size:16px;opacity:.97}
.world .zh{font-size:14px;opacity:.9}
.world .foot{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);color:var(--c);border-radius:999px;padding:6px 14px;font:800 16px var(--display)}
.go{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--c);font-size:24px;font-weight:800}

/* ---------- inside a world ---------- */
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 8px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 18px;border:0;border-radius:999px;background:#fff;color:var(--ink);font:800 18px var(--display);cursor:pointer;box-shadow:0 4px 0 rgba(20,30,60,.18);transition:transform .12s}
.back:hover{transform:translateY(-2px)}
.world-title{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.world-title .em{font-size:54px;line-height:1}
.world-title h2{margin:0;font:800 clamp(30px,5vw,42px)/1 var(--display);color:var(--c)}
.group-h{display:inline-flex;align-items:center;gap:10px;margin:26px 0 12px;background:var(--cs);color:var(--c);border-radius:999px;padding:7px 18px;font:800 20px var(--display)}
.group-h small{font:700 15px var(--body);color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--cs),0 12px 22px rgba(20,30,60,.1);border:3px solid var(--cs);transition:transform .15s,box-shadow .15s;animation:rise .45s both}
.card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 10px 0 var(--cs),0 18px 26px rgba(20,30,60,.12)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card .art{display:flex;align-items:center;justify-content:center;height:104px;background:linear-gradient(150deg,var(--cs),#fff 140%);font-size:58px;position:relative}
.card .art span{filter:drop-shadow(0 5px 0 rgba(0,0,0,.12));display:inline-block;transition:transform .2s}
.card:hover .art span{transform:scale(1.14) rotate(-6deg)}
.card .ribbon{position:absolute;top:10px;right:10px;background:#ffd23f;color:#5a3d00;border-radius:999px;padding:3px 10px;font:800 13px var(--display);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.card .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font:800 21px/1.12 var(--display)}
.card .zh{margin:0;color:var(--mute);font-size:14.5px;font-weight:700;line-height:1.4}
.card .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag-chip{font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--cs);color:var(--c)}
.tag-chip.low{background:#eceff5;color:#4b5a7a}
.actions{margin-top:auto;display:flex;gap:8px;align-items:center;padding-top:8px;flex-wrap:wrap}
.play{flex:1;min-height:52px;border:0;border-radius:16px;background:var(--c);color:#fff;font:800 22px var(--display);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-width:130px}
.play:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(0,0,0,.25)}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.play[aria-disabled=true]{background:#b8c0d2;box-shadow:0 5px 0 rgba(0,0,0,.12);pointer-events:none}
.tab{min-height:48px;min-width:48px;border:3px solid var(--cs);background:#fff;color:var(--c);border-radius:14px;font:800 20px var(--display);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.tab:hover{background:var(--cs)}
.note{margin:6px 0 0;font-size:13px;color:var(--mute)}
.area{background:#fff;border-radius:22px;padding:16px 18px;margin:0 0 14px;box-shadow:0 5px 0 var(--cs);border:3px solid var(--cs)}
.area h3{margin:0 0 4px;font:800 21px var(--display)}
.area .next{margin:10px 0 0;padding:10px 12px;background:var(--cs);border-radius:14px;font-size:15px}
footer{max-width:1080px;margin:0 auto;padding:6px 16px 40px;color:var(--mute);font-size:14px;font-weight:700;text-align:center}

/* ---------- play window ---------- */
#viewer{position:fixed;inset:0;background:rgba(18,30,70,.62);display:none;z-index:50;flex-direction:column;padding:10px}
#viewer.on{display:flex}
#viewer .bar{display:flex;gap:10px;align-items:center;background:var(--c,#1b6fd1);color:#fff;border-radius:20px 20px 0 0;padding:8px 10px}
#viewer .bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 20px var(--display)}
#viewer .vb{min-height:48px;border:0;border-radius:14px;padding:6px 18px;font:800 18px var(--display);cursor:pointer;background:#fff;color:var(--c,#1b6fd1);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
#viewer iframe{flex:1;border:0;background:#fff;width:100%;border-radius:0 0 20px 20px}
:focus-visible{outline:4px solid #ffd23f;outline-offset:2px;box-shadow:0 0 0 2px #1d2b4f}
@media (max-width:560px){.spark{display:none}.hero{padding-bottom:60px}.mascot{width:96px;height:96px}.world{min-height:200px}.world .em{font-size:64px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

function allItems(){var a=[];DATA.sections.forEach(function(s){(s.groups||[]).forEach(function(g){g.items.forEach(function(i){a.push(i)})})});return a}
function updateStars(){var s=seenGet(),n=0;allItems().forEach(function(i){if(i.href&&s[i.href])n++});document.getElementById('starN').textContent=n+' of '+allItems().filter(function(i){return i.href}).length}
function sec(id){for(var i=0;i<DATA.sections.length;i++)if(DATA.sections[i].id===id)return DATA.sections[i];return null}

function renderHome(){
  main.innerHTML='';
  main.appendChild(E('h2','sect','Choose your world'));
  main.appendChild(E('p','lead','Every world has lessons and games you can play right now.'));
  var wr=E('div','worlds');
  DATA.sections.forEach(function(s){
    var b=E('button','world c-'+s.color);b.type='button';b.setAttribute('aria-label',s.en+' - '+s.count+' things to play');
    b.appendChild(E('span','bubble b1'));b.appendChild(E('span','bubble b2'));
    b.appendChild(E('span','em',s.emoji));b.appendChild(E('h3',null,s.en));b.appendChild(E('p',null,s.tag));b.appendChild(E('p','zh',s.zh));
    var f=E('div','foot');f.appendChild(E('span','pill',s.count+(s.areas?' projects':' to play')));f.appendChild(E('span','go','→'));b.appendChild(f);
    b.onclick=function(){location.hash=s.id};wr.appendChild(b)});
  main.appendChild(wr);
}
function card(it,g,idx){
  var c=E('div','card c-'+(it.color||g.color));c.style.animationDelay=(Math.min(idx,12)*35)+'ms';
  var art=E('div','art');art.appendChild(E('span',null,it.emoji||'⭐'));
  var seen=it.href&&seenGet()[it.href];if(seen)art.appendChild(E('span','ribbon','⭐ Played'));
  c.appendChild(art);
  var b=E('div','body');b.appendChild(E('h3',null,it.title));if(it.zh)b.appendChild(E('p','zh',it.zh));
  if(!DATA.site&&it.status){var tg=E('div','tags');tg.appendChild(E('span','tag-chip'+(it.tone==='low'?' low':''),it.status));if(it.meta)tg.appendChild(E('span','tag-chip low',it.meta));b.appendChild(tg)}
  var ac=E('div','actions');
  if(it.href){
    var p=E('button','play','▶ Play');p.type='button';p.onclick=function(){openIt(it)};ac.appendChild(p);
    if(DATA.site||DATA.cur==='math'){var a=E('a','tab','↗');a.href=withHome(it.href);a.target='_blank';a.rel='noopener';a.setAttribute('aria-label','Open '+it.title+' in a new tab');a.title='Open in a new tab';a.onclick=function(){seenSet(it.href)};ac.appendChild(a)}
  }else{var d=E('span','play','Coming soon');d.setAttribute('aria-disabled','true');ac.appendChild(d)}
  b.appendChild(ac);if(it.note)b.appendChild(E('p','note',it.note));c.appendChild(b);return c}
function renderWorld(s){
  DATA.cur=s.id;main.innerHTML='';main.className='c-'+s.color;
  var cr=E('div','crumb');var bk=E('button','back','← All worlds');bk.type='button';bk.onclick=function(){location.hash=''};cr.appendChild(bk);main.appendChild(cr);
  var t=E('div','world-title');t.appendChild(E('span','em',s.emoji));var h=E('h2',null,s.en);t.appendChild(h);main.appendChild(t);
  main.appendChild(E('p','lead',s.tag+'  ·  '+s.zh));
  if(s.areas){s.areas.forEach(function(a){var d=E('div','area c-'+s.color);d.appendChild(E('h3',null,a.title));d.appendChild(E('p','zh',a.zh));var tg=E('div','tags');tg.appendChild(E('span','tag-chip',a.status));if(a.waiting)tg.appendChild(E('span','tag-chip low',a.waiting));if(a.updated)tg.appendChild(E('span','tag-chip low','updated '+a.updated));d.appendChild(tg);if(a.next)d.appendChild(E('p','next','Next: '+a.next));if(a.extra)d.appendChild(E('p','note',a.extra));main.appendChild(d)});return}
  var idx=0;
  s.groups.forEach(function(g){
    if(g.en||g.zh){var gh=E('div','group-h c-'+g.color,g.en||g.zh);if(g.en&&g.zh)gh.appendChild(E('small',null,g.zh));main.appendChild(gh)}
    var gr=E('div','grid c-'+g.color);g.items.forEach(function(it){gr.appendChild(card(it,g,idx++))});main.appendChild(gr)});
  if(s.id==='math'&&!DATA.site)main.appendChild(E('p','note','Math lessons also have a private backup on GitHub (Dan-Mom/five-minute-math).'))}
function route(){
  var id=(location.hash||'').replace('#','');var s=id&&sec(id);
  main.className='';DATA.cur=null;
  if(s)renderWorld(s);else renderHome();
  updateStars();window.scrollTo(0,0)}
function openIt(it){
  seenSet(it.href);document.getElementById('vt').textContent=it.title;
  var bar=V.querySelector('.bar');V.style.setProperty('--c',getComputedStyle(main.firstChild&&main.className?main:document.body).getPropertyValue('--c')||'#1b6fd1');
  document.getElementById('vnew').href=withHome(it.href);
  if(it.video){window.open(it.href,'_blank');return}
  VF.src=/^https?:/.test(it.href)?it.href:it.href+'?v='+DATA.v;V.classList.add('on');document.getElementById('vx').focus()}
function closeV(){V.classList.remove('on');VF.src='about:blank';route()}
document.getElementById('vx').onclick=closeV;
