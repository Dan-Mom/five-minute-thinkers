<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'">
<title>Math lesson</title>
<style>
/* FMMath manipulatives — styles. Prefix .fm- ; inline this whole file into a course's preview.html <style>.
   No external fonts, images or network. Reduced motion: html.rm OR the OS setting kills every animation + transition. */

.fm-root{
  --fm-ink:#1f2a44; --fm-muted:#56607a; --fm-line:#b9c3d9; --fm-bg:#ffffff; --fm-soft:#eef3fb;
  --fm-a:#d93a40;  --fm-b:#2059c9;   /* counter A (disc) / counter B (diamond) */
  --fm-one:#f0a800; --fm-ten:#1f9d63; --fm-hun:#6b4bc4;
  --fm-focus:#1e5c93;
  --fm-cell:clamp(44px,7vmin,68px);
  --fm-u:clamp(9px,1.6vmin,14px);          /* place-value unit size */
  --fm-dot:clamp(20px,3.6vmin,34px);       /* array dot cell */
  position:relative; box-sizing:border-box; color:var(--fm-ink);
  font-family:"Segoe UI Rounded","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:clamp(15px,2.2vmin,19px); line-height:1.35;
  /* a wide widget (e.g. a two-digit-column ArrayGrid) must never push the whole PAGE into horizontal scroll —
     it scrolls inside its own box instead. Every earlier course stayed narrow enough that this was never exercised;
     area-model-multiply's up-to-19-column split trays are the first to need it (confirmed by real portrait testing). */
  max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.fm-root *,.fm-root *::before,.fm-root *::after{box-sizing:border-box}

/* visually hidden live region (one per widget, created once, never re-rendered) */
.fm-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* buttons */
.fm-btn{
  min-width:44px;min-height:44px;padding:8px 14px;border:2px solid var(--fm-line);border-radius:14px;
  background:var(--fm-bg);color:var(--fm-ink);font:inherit;font-weight:600;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.fm-btn:hover:not(:disabled){background:var(--fm-soft);border-color:var(--fm-focus)}
.fm-btn[aria-pressed="true"]{background:var(--fm-soft);border-color:var(--fm-focus);box-shadow:inset 0 0 0 2px var(--fm-focus)}
.fm-btn:disabled{opacity:.45;cursor:not-allowed}
.fm-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.fm-root :focus-visible{outline:3px solid var(--fm-focus);outline-offset:2px}

/* ---------- Ten frame ---------- */
.fm-frames{display:flex;flex-wrap:wrap;gap:clamp(10px,2vmin,20px);align-items:flex-start}
.fm-paint .fm-frames{touch-action:none}
.fm-frame{display:flex;flex-direction:column;gap:6px}
.fm-frame-label{font-size:.85em;color:var(--fm-muted);font-weight:600}
.fm-grid10{
  display:grid;grid-template-columns:repeat(5,var(--fm-cell));grid-auto-rows:var(--fm-cell);
  gap:0;border:3px solid var(--fm-ink);border-radius:10px;background:var(--fm-bg);overflow:hidden;width:max-content;
}
.fm-grid10{position:relative}
.fm-lid{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.1em;border-radius:6px;background:repeating-linear-gradient(45deg,#e39b00 0,#e39b00 14px,#f0a800 14px,#f0a800 28px)}
.fm-lid[hidden]{display:none}
.fm-cell{
  position:relative;display:flex;align-items:center;justify-content:center;margin:0;padding:0;
  border:1px solid var(--fm-line);background:transparent;border-radius:0;cursor:default;font:inherit;
}
button.fm-cell{cursor:pointer}
button.fm-cell:hover{background:var(--fm-soft)}
.fm-cell::after{
  content:"";width:68%;height:68%;background:transparent;
  transition:transform .18s ease,background .18s ease;transform:scale(.4);opacity:0;
}
.fm-cell.fm-c1::after{background:var(--fm-a);border-radius:50%;transform:scale(1);opacity:1}
.fm-cell.fm-c2::after{background:var(--fm-b);border-radius:24%;transform:rotate(45deg) scale(.86);opacity:1}
.fm-cell.fm-sel{background:#fff6d6;outline:3px solid var(--fm-focus);outline-offset:-3px}
.fm-move .fm-cell.fm-c1,.fm-move .fm-cell.fm-c2{touch-action:none;cursor:grab}
.fm-brushes{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.fm-brush-dot{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.25em;margin-right:6px}
.fm-brush-dot.fm-d1{background:var(--fm-a);border-radius:50%}
.fm-brush-dot.fm-d2{background:var(--fm-b);border-radius:24%;transform:rotate(45deg) scale(.8)}
.fm-ghost{
  position:fixed;z-index:9999;pointer-events:none;width:44px;height:44px;
  margin:-22px 0 0 -22px;border-radius:50%;opacity:.9;box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.fm-ghost.fm-g1{background:#d93a40}
.fm-ghost.fm-g2{background:#2059c9;border-radius:24%}

/* ---------- Place-value blocks ---------- */
.fm-pv{display:flex;gap:clamp(10px,2vmin,22px);align-items:stretch;flex-wrap:wrap}
.fm-pv-col{
  display:flex;flex-direction:column;gap:8px;min-width:clamp(120px,22vmin,190px);flex:1 1 0;
  padding:10px;border:2px solid var(--fm-line);border-radius:16px;background:var(--fm-bg);
}
.fm-pv-head{font-weight:700}
.fm-pv-mat{
  min-height:calc(var(--fm-u)*12);display:flex;flex-wrap:wrap;gap:calc(var(--fm-u)*.6);align-content:flex-start;
  padding:6px;border-radius:12px;background:var(--fm-soft);
}
.fm-ones{display:grid;grid-template-columns:repeat(5,var(--fm-u));gap:2px;margin-right:calc(var(--fm-u)*.6)}
.fm-cube{width:var(--fm-u);height:var(--fm-u);background:var(--fm-one);border:1px solid #b07a00;border-radius:2px}
.fm-rod{
  width:var(--fm-u);height:calc(var(--fm-u)*10);border:1px solid #0f6b41;border-radius:2px;
  background:repeating-linear-gradient(to bottom,var(--fm-ten) 0,var(--fm-ten) calc(var(--fm-u) - 1px),#0f6b41 calc(var(--fm-u) - 1px),#0f6b41 var(--fm-u));
}
.fm-flat{
  width:calc(var(--fm-u)*10);height:calc(var(--fm-u)*10);border:1px solid #47308f;border-radius:3px;
  background:
    repeating-linear-gradient(to right,transparent 0,transparent calc(var(--fm-u) - 1px),rgba(255,255,255,.55) calc(var(--fm-u) - 1px),rgba(255,255,255,.55) var(--fm-u)),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--fm-u) - 1px),rgba(255,255,255,.55) calc(var(--fm-u) - 1px),rgba(255,255,255,.55) var(--fm-u)),
    var(--fm-hun);
}
.fm-pv-row{display:flex;gap:8px}
.fm-pv-row .fm-btn{flex:1 1 0;font-size:1.1em}
.fm-pv-trade{display:flex;flex-direction:column;gap:6px}
.fm-pv-trade .fm-btn{font-size:.85em;font-weight:600;line-height:1.2;padding:6px 8px}
.fm-pv-count{font-size:1.4em;font-weight:800;text-align:center}
.fm-pop{animation:fm-pop .28s ease-out}
@keyframes fm-pop{from{transform:scale(.55);opacity:.4}to{transform:scale(1);opacity:1}}

/* ---------- Array / area model ---------- */
.fm-ar{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.fm-ar-controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.fm-step{display:flex;align-items:center;gap:6px}
.fm-step output{min-width:2ch;text-align:center;font-weight:800;font-size:1.2em}
.fm-step-label{font-weight:600;margin-right:2px}
.fm-ar-grid{display:grid;gap:4px;padding:10px;border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg);max-width:100%}
.fm-dot{width:var(--fm-dot);height:var(--fm-dot);display:block}
.fm-dot::after{content:"";display:block;width:100%;height:100%;background:var(--fm-a);border-radius:50%}
.fm-dot.fm-pb::after{background:var(--fm-b);border-radius:24%;transform:rotate(45deg) scale(.84)}
.fm-dot.fm-gapl{margin-left:calc(var(--fm-dot)*.55)}
.fm-split{display:flex;flex-direction:column;gap:4px;width:min(100%,440px)}
.fm-split label{font-weight:600}
.fm-split input[type=range]{width:100%;height:44px;accent-color:var(--fm-focus);margin:0}
.fm-partials{display:flex;gap:16px;flex-wrap:wrap;font-weight:700}
.fm-partials span:nth-child(1){color:var(--fm-a)} .fm-partials span:nth-child(2){color:var(--fm-b)}
.fm-total{font-weight:800;font-size:1.15em}

/* ---------- Fraction bar ---------- */
/* .fm-fb itself needs an explicit width: in display mode (no stepper controls, review-found P0) there is
   nothing else inside .fm-root to give the flex-item ancestor (.fmp-visual) a min-content width to stretch
   from, so .fm-fb-bar's own width:min(100%,520px) resolves against near-zero and the bar collapses to a few
   px. Same fix shape as .fm-cal/.fm-coins (both also set width:100% on their own root for the same reason). */
.fm-fb{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%}
.fm-fb-bar{display:grid;gap:3px;width:min(100%,520px);height:clamp(48px,9vmin,72px);border:2px solid var(--fm-ink);border-radius:10px;overflow:hidden;background:var(--fm-bg)}
.fm-fb-seg{background:var(--fm-soft);border-right:1px solid var(--fm-line)}
.fm-fb-seg:last-child{border-right:none}
.fm-fb-seg.fm-fb-shaded{background:repeating-linear-gradient(45deg,var(--fm-a) 0,var(--fm-a) 8px,#b32a30 8px,#b32a30 16px)}

/* ---------- Decimal grid (tenths strips / hundredths squares) ---------- */
/* width:100% on the root for the same reason as .fm-fb (display mode has no stepper to give the flex ancestor a width).
   The grid is a square: grid-auto-flow:column fills 10 squares down a column, then moves right - so one column is one tenth. */
.fm-dg{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%}
.fm-dg-grid{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);grid-auto-flow:column;width:min(100%,clamp(200px,40vmin,320px));aspect-ratio:1/1;margin:0 auto;border:2px solid var(--fm-ink);border-radius:10px;overflow:hidden;background:var(--fm-bg)}
.fm-dg-grid.fm-dg-tenths{grid-template-rows:1fr}
.fm-dg-cell{background:var(--fm-soft);border:1px solid #8a96b2}
.fm-dg-tenths .fm-dg-cell{border-top:0;border-bottom:0}
/* the squares fill column by column: every cell of columns 2-10 gets a heavier left line, so the 10 columns (one tenth each) read as columns */
.fm-dg-cell.fm-dg-colsep{border-left:3px solid var(--fm-ink)}
.fm-dg-cell.fm-dg-shaded{background:repeating-linear-gradient(45deg,var(--fm-a) 0,var(--fm-a) 6px,#b32a30 6px,#b32a30 12px);border-color:#8f2025}

/* ---------- Fraction pair (two bars, same width, for comparing) ---------- */
.fm-fp{display:flex;flex-direction:column;gap:16px;align-items:stretch;width:100%}
.fm-fp-sec{display:flex;flex-direction:column;gap:6px}
.fm-fp-name{font-weight:800;font-size:1.05em;color:var(--fm-ink)}
.fm-fp-steps{display:flex;flex-wrap:wrap;gap:6px 14px}
.fm-fp-bar{width:min(100%,520px);height:clamp(40px,7vmin,60px)}

/* ---------- reduced motion: ONE switch (html.rm) + the OS setting; kills animation AND transition ---------- */
html.rm .fm-root *,html.rm .fm-root *::before,html.rm .fm-root *::after,
html.rm .fm-ghost{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  .fm-root *,.fm-root *::before,.fm-root *::after,.fm-ghost{animation:none!important;transition:none!important}
}

/* ---------- Clock ---------- */
.fm-ck{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.fm-ck-face{width:min(100%,260px);height:auto;display:block}
.fm-ck-rim{fill:var(--fm-bg);stroke:var(--fm-line);stroke-width:4}
.fm-ck-tick{stroke:var(--fm-line);stroke-width:1.5}
.fm-ck-tick5{stroke:var(--fm-ink,#222);stroke-width:3}
.fm-ck-num{font:700 15px system-ui,sans-serif;fill:var(--fm-ink,#222)}
.fm-ck-hour{stroke:var(--fm-a);stroke-width:9;stroke-linecap:round}
.fm-ck-min{stroke:var(--fm-b);stroke-width:4;stroke-linecap:round}
.fm-ck-pin{fill:var(--fm-ink,#222)}

/* ---------- Calendar ---------- */
.fm-cal{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%}
.fm-cal .fm-step,.fm-cal .fm-total{align-self:flex-start}
.fm-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;min-width:min(340px,78vw);max-width:380px;padding:10px;border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg)}
.fm-cal-hd{font:700 12px system-ui,sans-serif;color:var(--fm-muted);text-align:center;font-style:normal;padding-bottom:3px}
.fm-cal-day{font:600 16px system-ui,sans-serif;color:var(--fm-ink);text-align:center;padding:8px 0;border-radius:8px;font-style:normal}
.fm-cal-sel{background:var(--fm-a);color:#fff;font-weight:800;box-shadow:0 0 0 3px var(--fm-ink)}

/* ---------- Coins ---------- */
.fm-coins{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%}
.fm-coins .fm-total{align-self:flex-start}
.fm-coin-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:56px;padding:4px 8px;border:2px solid var(--fm-line);border-radius:12px;background:var(--fm-bg)}
.fm-coin-line .fm-step{flex:0 0 auto}
.fm-coin-line .fm-step-label{min-width:5.4em}
.fm-coin-line .fm-coin-row{flex:1 1 130px;min-width:0;min-height:0}
.fm-coin-tray{display:flex;flex-direction:column;gap:6px;padding:10px;border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg);min-height:48px}
.fm-coin-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px}
.fm-coin{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font:800 14px system-ui,sans-serif;font-style:normal;border:2px solid #5d4a2a;box-sizing:border-box}
.fm-coin-p{width:42px;height:42px;background:#9c5b27;color:#fff}
.fm-coin-n{width:50px;height:50px;background:#d5d9e0;color:#1f2a44;border-color:#6b7385}
.fm-coin-d{width:38px;height:38px;background:#e3e6ec;color:#1f2a44;border-color:#6b7385;font-size:13px}
.fm-coin-q{width:58px;height:58px;background:#cfd4dc;color:#1f2a44;border-color:#6b7385;font-size:16px}
.fm-coin-gap{display:block;width:40px;height:40px}
.fm-faces-name .fm-coin{font-size:12px;letter-spacing:0}

/* FMPlayer — five-minute math lesson player styles. Inline into a course's preview.html together with manipulatives.css. */
:root{
  --p-bg:#fff8ec; --p-card:#ffffff; --p-ink:#1f2a44; --p-muted:#56607a; --p-line:#ecd9ae;
  --p-accent:#1e5c93; --p-accent-soft:#e6f0fa; --p-good:#0f7a45; --p-good-bg:#dcf5e7; --p-hint:#8a5a00; --p-hint-bg:#fff0cf;
  --p-orange:#f28c1b;
}
html{-webkit-text-size-adjust:100%}
.fmp [hidden]{display:none!important}
body.fmp{margin:0;background:var(--p-bg);color:var(--p-ink);
  font-family:"Segoe UI Rounded","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:clamp(16px,2.3vmin,21px);line-height:1.45}
.fmp *{box-sizing:border-box}
.fmp-skip{position:absolute;left:-999px;top:0;background:#fff;padding:12px 16px;z-index:100;border:2px solid var(--p-accent)}
.fmp-skip:focus{left:8px;top:8px}
.fmp :focus-visible{outline:3px solid var(--p-accent);outline-offset:2px}
.fmp-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* header */
.fmp-header{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:64px;padding:6px 12px;background:#fff;border-bottom:2px solid var(--p-line)}
.fmp-title{margin:0 auto 0 0;font-size:clamp(17px,2.6vmin,24px);font-weight:800}
.fmp-seg{display:inline-flex;border:2px solid #d5c08f;border-radius:14px;overflow:hidden;background:#fff}
.fmp-seg button,.fmp-tool{min-height:44px;min-width:44px;border:0;background:#fff;color:var(--p-ink);font:inherit;font-weight:600;padding:6px 12px;cursor:pointer}
.fmp-seg button+button{border-left:2px solid #d5c08f}
.fmp-seg button[aria-pressed="true"]{background:var(--p-accent);color:#fff}
.fmp-tool{border:2px solid #d5c08f;border-radius:14px}
.fmp-tool[aria-pressed="true"]{background:var(--p-accent-soft);border-color:var(--p-accent)}
.fmp-stepline{display:flex;gap:10px;align-items:center;padding:6px 14px;color:var(--p-muted);font-weight:600}
.fmp-dots{display:flex;gap:6px}
.fmp-dots i{width:12px;height:12px;border-radius:50%;background:#ead9b0}
.fmp-dots i.on{background:var(--p-orange)} .fmp-dots i.cur{background:var(--p-accent);transform:scale(1.25)}

/* stage */
main.fmp-main{padding:6px 12px 96px}
.fmp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.fmp-left,.fmp-right{background:var(--p-card);border:2px solid var(--p-line);border-radius:20px;padding:14px}
.fmp-left{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;min-width:0}
.fmp-left:has(.fm-ar){justify-content:flex-start;padding-top:6px}   /* the array widget grows: keep its steppers fixed under the finger, don't re-centre (review F-05) */
.fmp-cap{color:var(--p-muted);font-size:.9em;text-align:center;margin:0}
/* .fmp-left's own min-width:0 is not enough on its own: .fmp-visual is itself a flex ITEM of .fmp-left and,
   like .fmp-left, defaults to min-width:auto (sized to its content), so a wide manipulative (e.g. a two-digit-
   column ArrayGrid) still forced the whole page into horizontal scroll even with .fm-root's own overflow-x:auto
   (confirmed by real portrait testing on area-model-multiply, up to 19 columns). Without this, .fm-root's own
   max-width:100% just matches an already-oversized parent, so it never actually has anything to clip or scroll. */
/* width:100% (review-found P0, FractionBar): .fmp-left's align-items:center means a flex item with no explicit
   cross-size shrink-wraps to its own content instead of stretching - harmless for every earlier widget (they
   size from fixed/intrinsic content: dot grids, fixed-size blocks), but FractionBar's bar is itself
   width:min(100%,520px), so with nothing concrete to resolve "100%" against it collapsed to a few px. Safe for
   existing widgets: max-width:100% already capped them, and their own intrinsic content width - not this
   element's width - is what determined their rendered size. */
.fmp-visual{min-width:0;max-width:100%;width:100%}
@media (min-width:900px) and (orientation:landscape){
  main.fmp-main{padding-bottom:8px}
  .fmp-grid{grid-template-columns:minmax(0,56fr) minmax(0,44fr);height:var(--stage-h,auto)}
  .fmp-left,.fmp-right{max-height:100%;overflow-y:auto}
  .fmp-left{position:relative}
}
@media (max-width:899px),(orientation:portrait){ .fmp-left{min-height:200px} }

/* right panel parts */
.fmp-panel-title{margin:0 0 6px;font-size:1.25em;font-weight:800}
.fmp-narr{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.fmp-narr svg{flex:0 0 auto;width:56px;height:56px}
.fmp-bubble{background:var(--p-accent-soft);border-radius:16px;padding:10px 14px;margin:0;flex:1 1 auto}
.fmp-bubble p{margin:0 0 6px} .fmp-bubble p:last-child{margin:0}
.fmp-q{font-weight:800;margin:6px 0 8px;font-size:1.05em}
.fmp-choices{display:grid;gap:8px;grid-template-columns:1fr}
.fmp-choice,.fmp-btn{min-height:52px;min-width:44px;padding:10px 16px;border:2px solid #cdbb8b;border-radius:16px;background:#fff;color:var(--p-ink);font:inherit;font-weight:700;text-align:left;cursor:pointer}
.fmp-choice:hover:not([aria-disabled="true"]),.fmp-btn:hover:not(:disabled){background:#fff6df;border-color:var(--p-accent)}
.fmp-choice[aria-disabled="true"]{cursor:default}
.fmp-choice.tried{opacity:.5;text-decoration:line-through}
.fmp-choice.chosen{border-color:var(--p-accent);background:var(--p-accent-soft);box-shadow:inset 0 0 0 2px var(--p-accent)}
.fmp-btn{text-align:center}
.fmp-btn.primary{background:var(--p-accent);border-color:var(--p-accent);color:#fff}
.fmp-btn.primary:hover:not(:disabled){background:#174a78}
.fmp-btn:disabled{opacity:.45;cursor:not-allowed}
.fmp-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fmp-fb{margin:10px 0;padding:10px 14px;border-radius:14px;font-weight:600}
.fmp-fb.good{background:var(--p-good-bg);color:#0b5a33}
.fmp-fb.hint{background:var(--p-hint-bg);color:var(--p-hint)}
.fmp-fb.info{background:var(--p-accent-soft);color:var(--p-ink)}
.fmp-fb p{margin:0 0 4px} .fmp-fb p:last-child{margin:0}
.fmp-sentence{font-size:1.15em;font-weight:800;margin:8px 0;line-height:1.7}
.fmp-blank{display:inline-block;min-width:2.4em;padding:0 8px;border-bottom:4px solid var(--p-accent);text-align:center;color:var(--p-accent)}
.fmp-blank.cur{background:#fff3c4}
.fmp-derived{border:3px solid var(--p-accent);border-radius:16px;padding:12px 14px;background:#fff;margin:10px 0;font-weight:800;color:var(--p-accent);font-size:1.15em}
.fmp-derived small{display:block;font-weight:600;color:var(--p-muted);margin-bottom:4px}
.fmp-status{color:var(--p-muted);font-weight:600;margin:8px 0}
.fmp-list{margin:6px 0 6px 1.2em;padding:0} .fmp-list li{margin:4px 0}
.fmp-cmp{display:grid;gap:8px;margin:10px 0} .fmp-cmp div{padding:10px 14px;border-radius:14px;background:#fff6df;font-weight:700}

/* start screen */
.fmp-start{max-width:820px;margin:0 auto;padding:18px 8px;text-align:center}
.fmp-start h1{margin:8px 0 4px;font-size:clamp(24px,4vmin,36px)}
.fmp-start p{color:var(--p-muted);margin:4px 0 14px}
.fmp-start svg{width:clamp(96px,18vmin,160px);height:auto}
.fmp-levels{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:14px 0;text-align:left}
.fmp-level{padding:14px;border:3px solid #cdbb8b;border-radius:18px;background:#fff;font:inherit;color:var(--p-ink);cursor:pointer;min-height:44px}
.fmp-level[aria-pressed="true"]{border-color:var(--p-accent);background:var(--p-accent-soft)}
.fmp-level b{display:block;font-size:1.1em;margin-bottom:4px}

/* footer */
.fmp-footer{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 14px;background:#fff;border-top:2px solid var(--p-line)}
.fmp-footer .fmp-btn{min-width:120px;min-height:56px;font-size:1.05em}
.fmp-footer-msg{color:var(--p-muted);font-weight:600;text-align:center;flex:1 1 auto}
@media (max-width:899px),(orientation:portrait){ .fmp-footer-msg{display:none} }

/* self-test report */
.fmp-selftest{position:fixed;right:8px;top:72px;z-index:50;max-width:min(420px,92vw);padding:10px 14px;border-radius:12px;font-weight:700;background:#dcf5e7;color:#0b5a33;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.fmp-selftest.fail{background:#fde0e0;color:#8a1b1b}
.fmp-selftest pre{white-space:pre-wrap;font:12px/1.4 Consolas,monospace;margin:6px 0 0}

/* the one motion switch */
html.rm .fmp *,html.rm .fmp *::before,html.rm .fmp *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){ .fmp *,.fmp *::before,.fmp *::after{animation:none!important;transition:none!important} }

/* custom "covered box" picture used by hook scenes */
.fmp-boxes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.fmp-box{min-width:150px;padding:10px 12px;border:4px solid #b85f00;border-radius:16px;background:#fff3dd;text-align:center}
.fmp-box.lid{background:repeating-linear-gradient(45deg,#e39b00 0,#e39b00 14px,#f0a800 14px,#f0a800 28px);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2em;min-height:110px}
.fmp-box .apples{font-size:clamp(24px,4.4vmin,40px);line-height:1.2;letter-spacing:2px}
.fmp-box small{display:block;color:var(--p-muted);font-weight:700;margin-bottom:4px}
.fmp-total{font-weight:800;font-size:1.1em;text-align:center;margin:0 0 6px}

/* bigger touch-friendly manipulatives inside the lesson stage */
.fmp-left .fm-root{--fm-cell:clamp(52px,9vmin,84px);--fm-dot:clamp(24px,5vmin,42px)}

/* narrow / portrait: header is one compact row and scrolls away (never permanently >15% of the screen) */
.fmp-short{display:none}
@media (max-width:599px){ .fmp-long{display:none} .fmp-short{display:inline} .fmp-title{font-size:15px} .fmp-header{padding:4px 8px} .fmp-stepline{padding:4px 10px;font-size:.85em} }
@media (max-width:899px),(orientation:portrait){ .fmp-header{position:static} }

.fmp-stars{margin-left:auto;font-weight:800;color:#b85f00;white-space:nowrap}

/* who is playing (start screen) */
.fmp-who{margin:10px 0 6px}
.fmp-who-q{margin:0 0 6px;font-weight:800;color:var(--p-ink)}
.fmp-who-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.fmp-whobtn{min-width:104px;min-height:88px;border:3px solid #cdbb8b;border-radius:18px;background:#fff;color:var(--p-ink);font:inherit;font-weight:800;padding:6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.fmp-whobtn .wi{font-size:34px;line-height:1}
.fmp-whobtn small{font-weight:600;color:var(--p-muted)}
.fmp-whobtn[aria-pressed="true"]{border-color:var(--p-accent);background:var(--p-accent-soft);box-shadow:inset 0 0 0 2px var(--p-accent)}
.fmp-who-hint{color:var(--p-hint);font-weight:700;margin:6px 0 0}
.fmp-btn:disabled{cursor:not-allowed}
/* panel title row with the read-aloud button */
.fmp-panel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.fmp-panel-head .fmp-panel-title{margin:0;flex:1 1 auto}
.fmp-listen{white-space:nowrap}

<body class="fmp">
<noscript>This lesson needs JavaScript.</noscript>
<script>
/* FMMath — Five-Minute Learning OS math manipulatives (vanilla JS, no dependencies, no network, works over file://).
   Inline this whole file into a course's preview.html <script> (see README.md). Exposes window.FMMath:
     FMMath.setLang('zh'|'en')            re-labels every live widget
     FMMath.TenFrame(host, opts)          ten frame(s): display | paint | move
     FMMath.PlaceValueBlocks(host, opts)  hundreds / tens / ones blocks with trading (regrouping)
     FMMath.ArrayGrid(host, opts)         rows x columns dots, optional "cut" for area-model splitting
     FMMath.SquareGrow(host, opts)        a k x k square that grows one L-shaped layer (odd number) at a time
     FMMath.FractionBar(host, opts)       a bar cut into N equal parts, k of them shaded (a/b)
     FMMath.Clock(host, opts)             an analog clock (hour + minute hand), steppers for hour and minutes
     FMMath.Calendar(host, opts)          one month as a grid (7 columns), a chosen day ringed, steppers for day and week
     FMMath.Coins(host, opts)             a tray of US coins (penny, nickel, dime, quarter), a stepper per kind
     FMMath.DecimalGrid(host, opts)       one whole as a square: 10 tenth-strips or 100 hundredth-squares, shaded column by column
     FMMath.FractionPair(host, opts)      TWO fraction bars of the same width, stacked, each with a name (for comparing fractions)
     FMMath.math                          pure answer/derivation functions + selfTest()
   Design rules baked in: DOM built once (focus + the aria-live node survive updates); every target >= 44px;
   tap-to-select-then-tap-to-place is ALWAYS available beside dragging; nothing shows a total/answer unless a
   show* option asks for it; colour is never the only signal (disc vs diamond shapes). */
(function (global) {
  'use strict';
  var FM = global.FMMath = global.FMMath || {};
  var lang = 'en';   // English by default (Owner decision 2026-09-26); FMMath.setLang('zh') still works
  var widgets = [];

  /* ---------------- tiny helpers ---------------- */
  function el(tag, cls, attrs) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (attrs) for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    return e;
  }
  function zh(a, b) { return lang === 'zh' ? a : b; }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function clamp(v, lo, hi) { v = v | 0; return v < lo ? lo : v > hi ? hi : v; }
  function makeLive(root) {
    var live = el('div', 'fm-sr', { 'aria-live': 'polite', role: 'status' });
    root.appendChild(live);
    var flip = false;
    return function say(text) { flip = !flip; live.textContent = text + (flip ? '' : '​'); };
  }
  function register(w) {
    widgets.push(w);
    w.destroy = function () {
      var i = widgets.indexOf(w); if (i >= 0) widgets.splice(i, 1);
      if (w.root && w.root.parentNode) w.root.parentNode.removeChild(w.root);
    };
    return w;
  }
  FM.setLang = function (l) {
    lang = l === 'en' ? 'en' : 'zh';
    widgets.forEach(function (w) { w.relabel(); });
  };
  FM.getLang = function () { return lang; };

  /* ================================================================
     Pure math (single source of truth for every checker + self-test)
     ================================================================ */
  var M = FM.math = {};
  M.decompositions = function (n) { var r = []; for (var a = 0; a <= n; a++) r.push([a, n - a]); return r; };
  /* make-ten: a is the number being filled toward 10 (a <= 10), b is the number we borrow from. */
  M.makeTen = function (a, b) {
    var need = Math.max(0, 10 - a), moved = Math.min(need, b);
    return { need: need, moved: moved, filled: a + moved === 10, rest: b - moved, total: a + b };
  };
  M.toBlocks = function (n) { n = clamp(n, 0, 999); return { h: (n / 100) | 0, t: ((n / 10) | 0) % 10, o: n % 10 }; };
  M.fromBlocks = function (b) { return b.h * 100 + b.t * 10 + b.o; };
  M.regroupUp = function (b, from) {           // 10 ones -> 1 ten, or 10 tens -> 1 hundred
    var r = { h: b.h, t: b.t, o: b.o };
    if (from === 'o' && r.o >= 10) { r.o -= 10; r.t += 1; }
    else if (from === 't' && r.t >= 10) { r.t -= 10; r.h += 1; }
    return r;
  };
  M.regroupDown = function (b, from) {         // 1 ten -> 10 ones, or 1 hundred -> 10 tens
    var r = { h: b.h, t: b.t, o: b.o };
    if (from === 't' && r.t >= 1) { r.t -= 1; r.o += 10; }
    else if (from === 'h' && r.h >= 1) { r.h -= 1; r.t += 10; }
    return r;
  };
  M.arrayTotal = function (rows, cols) { return rows * cols; };
  /* subtraction bridging through ten: n is 10+ones (11..99 range used at 11..19 in practice), s is what is taken away.
     Take the ones first (up to `ones`), then whatever is still owed comes off the ten. Single source of truth for
     the "break the ten" strategy (subtract-through-ten course); mirrors makeTen's shape. */
  M.subtractBridge = function (n, s) {
    var ones = M.toBlocks(n).o, takeFromOnes = Math.min(ones, s), remain = Math.max(0, s - takeFromOnes);
    return { ones: ones, takeFromOnes: takeFromOnes, takeFromTen: remain, total: n - s, bridges: s > ones };
  };
  /* fair-share division: total shared equally into `groups` groups. Single source of truth for division-sharing. */
  M.divide = function (total, groups) {
    var each = Math.floor(total / groups), remainder = total - each * groups;
    return { each: each, remainder: remainder, exact: remainder === 0 };
  };
  /* area-model split: cut after column k -> the two partial products */
  M.partials = function (rows, cols, split) { split = clamp(split, 0, cols); return [rows * split, rows * (cols - split)]; };
  /* column multiplication by ONE digit, place by place, with carries (the carry lesson's answer key) */
  M.multiplyByOneDigit = function (n, d) {
    var digits = String(n).split('').reverse().map(Number), carry = 0, steps = [];
    for (var p = 0; p < digits.length; p++) {
      var raw = digits[p] * d, withCarry = raw + carry;
      steps.push({ place: p, digit: digits[p], product: raw, carryIn: carry, sum: withCarry, write: withCarry % 10, carryOut: (withCarry / 10) | 0 });
      carry = (withCarry / 10) | 0;
    }
    return { steps: steps, finalCarry: carry, total: n * d };
  };
  /* column addition, place by place, with carries (the add-regroup lesson's answer key). Same step shape as
     multiplyByOneDigit (write/carryOut per place) so a course can reuse the same scene-writing pattern. */
  M.addTwoDigit = function (a, b) {
    var da = String(a).split('').reverse().map(Number), db = String(b).split('').reverse().map(Number);
    var len = Math.max(da.length, db.length), carry = 0, steps = [];
    for (var p = 0; p < len; p++) {
      var x = da[p] || 0, y = db[p] || 0, rawSum = x + y, withCarry = rawSum + carry;
      steps.push({ place: p, x: x, y: y, rawSum: rawSum, carryIn: carry, sum: withCarry, write: withCarry % 10, carryOut: (withCarry / 10) | 0 });
      carry = (withCarry / 10) | 0;
    }
    return { steps: steps, finalCarry: carry, total: a + b };
  };
  /* column subtraction, place by place, with borrowing (the subtract-regroup lesson's answer key). a must be
     >= b (this project never shows a child a negative number). Mirrors addTwoDigit's step shape: `x` is the
     ORIGINAL digit at that place (before any borrow is applied), `y` the digit being subtracted, `borrowIn` the
     ten borrowed away by the previous (lower) place, `write` the single digit 0-9 left after borrowing and
     subtracting, `borrowOut` 1 if this place itself had to borrow from the next place up. */
  M.subtractTwoDigit = function (a, b) {
    var da = String(a).split('').reverse().map(Number), db = String(b).split('').reverse().map(Number);
    var len = Math.max(da.length, db.length), borrow = 0, steps = [];
    for (var p = 0; p < len; p++) {
      var x = da[p] || 0, y = db[p] || 0, effX = x - borrow, borrowOut = 0;
      if (effX < y) { effX += 10; borrowOut = 1; }
      steps.push({ place: p, x: x, y: y, borrowIn: borrow, effX: effX, write: effX - y, borrowOut: borrowOut });
      borrow = borrowOut;
    }
    return { steps: steps, total: a - b };
  };
  /* the odd-numbers-squares lesson's single source of truth: growing a k x k square by one "L-shaped" layer
     (the last row + last column of the new size, corner counted once) always adds an odd number, 2k-1, and the
     running total after k layers is always the perfect square k^2 - this is 1+3+5+...+(2k-1) = k^2. */
  M.squareLayer = function (k) { return { size: k, added: 2 * k - 1, total: k * k }; };
  /* fractions (fraction-intro lesson's single source of truth): a fraction is always kept as {num, den} - never
     auto-simplified, since "simplify" is itself something a course explicitly teaches, not something the data
     model should do silently. */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a || 1; }
  M.simplifyFraction = function (num, den) { var g = gcd(num, den); return { num: num / g, den: den / g }; };
  M.fractionsEqual = function (n1, d1, n2, d2) { return n1 * d2 === n2 * d1; };
  /* cross-multiplication compare, valid for positive denominators (this project never uses zero/negative ones):
     -1 if the first fraction is smaller, 0 if equal, 1 if bigger. */
  M.compareFractions = function (n1, d1, n2, d2) {
    var l = n1 * d2, r = n2 * d1;
    return l < r ? -1 : l > r ? 1 : 0;
  };
  /* ---- clock maths (used by FMMath.Clock and the telling-time lessons) ---- */
  /* ---- pure clock maths (goes with the other M.* functions) ---- */
  M.clockAngles = function (hour, minute) { return { hour: (hour % 12) * 30 + minute * 0.5, minute: minute * 6 }; };
  M.minutesOf = function (hour, minute) { return (hour % 12) * 60 + minute; };                    /* minutes after 12:00 (0..719) */
  M.timeFromMinutes = function (total) { total = ((total % 720) + 720) % 720; var h = Math.floor(total / 60); return { hour: h === 0 ? 12 : h, minute: total % 60 }; };
  M.addMinutes = function (hour, minute, delta) { return M.timeFromMinutes(M.minutesOf(hour, minute) + delta); };
  /* elapsedMinutes: forward from the first time to the second, within 12 hours; the same time twice gives 0 (not 720) */
  M.elapsedMinutes = function (h1, m1, h2, m2) { return (((M.minutesOf(h2, m2) - M.minutesOf(h1, m1)) % 720) + 720) % 720; };   /* forward, within 12 hours */
  M.digital = function (hour, minute) { return hour + ':' + (minute < 10 ? '0' : '') + minute; };
  M.timeWords = function (hour, minute) {
    var next = hour === 12 ? 1 : hour + 1;
    if (minute === 0) return hour + " o'clock";
    if (minute === 15) return 'quarter past ' + hour;
    if (minute === 30) return 'half past ' + hour;
    if (minute === 45) return 'quarter to ' + next;
    if (minute < 30) return minute + ' minute' + (minute === 1 ? '' : 's') + ' past ' + hour;
    return (60 - minute) + ' minute' + (60 - minute === 1 ? '' : 's') + ' to ' + next;
  };

  /* ---- calendar maths (used by FMMath.Calendar and the calendar lessons). Weekdays are numbered 0 = Sunday ... 6 = Saturday. ---- */
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  M.weekdayName = function (w) { return WEEKDAYS[((w % 7) + 7) % 7]; };
  /* startDay = the weekday of the 1st of the month; returns the weekday of `day` */
  M.weekdayOf = function (startDay, day) { return (((startDay + day - 1) % 7) + 7) % 7; };
  M.weekdayAfter = function (weekday, daysLater) { return (((weekday + daysLater) % 7) + 7) % 7; };
  M.weeksAndDays = function (n) { return { weeks: Math.floor(n / 7), days: n % 7 }; };

  /* ---- coin maths (US coins) used by FMMath.Coins and the money lessons. Counts are objects {p, n, d, q} = pennies, nickels, dimes, quarters. ---- */
  var COIN_VALUE = { p: 1, n: 5, d: 10, q: 25 };
  M.coinValue = function (type) { return COIN_VALUE[type]; };
  M.totalCents = function (c) { return (c.p || 0) * 1 + (c.n || 0) * 5 + (c.d || 0) * 10 + (c.q || 0) * 25; };
  M.coinCount = function (c) { return (c.p || 0) + (c.n || 0) + (c.d || 0) + (c.q || 0); };
  M.centsToText = function (cents) { return cents >= 100 ? '$' + Math.floor(cents / 100) + '.' + (cents % 100 < 10 ? '0' : '') + (cents % 100) : cents + '\u00a2'; };
  /* the fewest coins for an amount (greedy is optimal for US coins; selfTest proves it against a dynamic-programming search) */
  M.fewestCoins = function (cents) { var q = Math.floor(cents / 25), r = cents % 25, d = Math.floor(r / 10); r %= 10; var n = Math.floor(r / 5); return { q: q, d: d, n: n, p: r % 5 }; };
  M.changeFrom = function (paid, cost) { return paid - cost; };

  /* ---- decimal maths (used by FMMath.DecimalGrid and the decimals lessons). A decimal is ALWAYS kept as a whole
     number of HUNDREDTHS (0.35 -> 35, 0.4 -> 40, 1 -> 100): no floating point anywhere, so 0.1 + 0.2 style surprises
     and "0.4 vs 0.40" comparisons can never go wrong. Text conversion is string-based for the same reason. ---- */
  M.hundredthsOf = function (tenths, hundredths) { return tenths * 10 + hundredths; };
  M.decimalDigits = function (v) { return { whole: Math.floor(v / 100), tenths: Math.floor((v % 100) / 10), hundredths: v % 10 }; };
  /* places = 1 (tenths) or 2 (hundredths). Asking for 1 place on a value that is not a whole number of tenths falls back to 2. */
  M.decimalText = function (v, places) {
    var whole = Math.floor(v / 100), frac = v % 100;
    if (places === 1 && frac % 10 === 0) return whole + '.' + (frac / 10);
    return whole + '.' + (frac < 10 ? '0' : '') + frac;
  };
  /* the shortest honest text: 0.4 for 40, 0.35 for 35, 1.0 for 100 */
  M.decimalAuto = function (v) { return M.decimalText(v, v % 10 === 0 ? 1 : 2); };
  /* the inverse; returns NaN for anything that is not digits[.1-2 digits] */
  M.parseDecimal = function (str) {
    var m = /^(\d+)(?:\.(\d{1,2}))?$/.exec(String(str));
    if (!m) return NaN;
    var f = m[2] || '';
    return parseInt(m[1], 10) * 100 + (f.length === 0 ? 0 : f.length === 1 ? parseInt(f, 10) * 10 : parseInt(f, 10));
  };
  M.compareDecimals = function (a, b) { return a < b ? -1 : a > b ? 1 : 0; };
  /* least common multiple of two positive integers (NaN otherwise) - the common bottom number for comparing/adding fractions */
  M.lcm = function (a, b) {
    if (typeof a !== 'number' || typeof b !== 'number' || !Number.isInteger(a) || !Number.isInteger(b) || a < 1 || b < 1) return NaN;
    var r = a / gcd(a, b) * b;
    return Number.isSafeInteger(r) ? r : NaN;
  };
  /* rewrite num/den over a new bottom number that is a multiple of den: 2/3 over 12 -> 8 (the new top); NaN if it does not divide evenly */
  M.rescaleFraction = function (num, den, newDen) {
    if (![num, den, newDen].every(function (x) { return typeof x === 'number' && Number.isInteger(x); }) || den < 1 || newDen < 1 || num < 0 || newDen % den !== 0) return NaN;
    var r = num * (newDen / den) + 0;   /* + 0 turns -0 into 0 */
    return Number.isSafeInteger(r) ? r : NaN;
  };
  /* a PROPER fraction (0 <= num <= den) whose bottom number divides 100 (1, 2, 4, 5, 10, 20, 25, 50, 100) as whole hundredths:
     3/10 -> 30, 1/4 -> 25. NaN for anything else - another denominator (never rounds), an improper or negative fraction, a
     fractional or non-number argument (strings, null, BigInt are NOT coerced). This is how "two names for one amount" is checked. */
  M.fractionToHundredths = function (num, den) {
    if (typeof num !== 'number' || typeof den !== 'number' || !Number.isInteger(num) || !Number.isInteger(den)) return NaN;
    return den > 0 && 100 % den === 0 && num >= 0 && num <= den ? num * 100 / den : NaN;
  };

  M.selfTest = function () {
    var fails = [], n = 0;
    function ok(c, msg) { n++; if (!c) fails.push(msg); }
    var i, a, b, r, c, s, k, d;
    for (i = 0; i <= 20; i++) {
      var ds = M.decompositions(i);
      ok(ds.length === i + 1, 'decompositions length ' + i);
      ds.forEach(function (p) { ok(p[0] + p[1] === i && p[0] >= 0 && p[1] >= 0, 'decomposition sum ' + i); });
    }
    for (i = 0; i <= 999; i++) {
      var bl = M.toBlocks(i);
      ok(M.fromBlocks(bl) === i && bl.h <= 9 && bl.t <= 9 && bl.o <= 9, 'blocks roundtrip ' + i);
    }
    for (a = 0; a <= 9; a++) for (b = 0; b <= 12; b++) {
      r = M.makeTen(a, b);
      ok(r.moved <= b && r.moved <= r.need, 'makeTen bounds ' + a + '+' + b);
      if (a + b >= 10) { ok(r.filled && r.rest === a + b - 10, 'makeTen full ' + a + '+' + b); }
      else { ok(!r.filled || a + b === 10, 'makeTen short ' + a + '+' + b); ok(r.rest === 0, 'makeTen short rest ' + a + '+' + b); }
    }
    for (r = 1; r <= 12; r++) for (c = 0; c <= 20; c++) for (s = 0; s <= c; s++) {
      var pp = M.partials(r, c, s);
      ok(pp[0] + pp[1] === M.arrayTotal(r, c), 'partials ' + r + 'x' + c + '/' + s);

<script>
/* FMPlayer — data-driven five-minute MATH lesson player (vanilla JS, no deps, no network, file:// safe).

(function (global) {

    correct: 'Yes!', saved: 'Got it — your guess is saved.', nextStep: 'Next step', again: 'Watch again', stepOf: function (a, b) { return 'Step ' + a + ' of ' + b; },
    level: 'Level', reduce: 'Reduce motion', pickBlank: 'Pick the answer for the blank.', yourSentence: 'Your sentence',
    lookBack: 'Look back', myGuess: 'Your first guess', myExplain: 'Your explanation', teaser: 'Next time', practice: 'Practice pack', grownups: 'For grown-ups',
    done: 'Done', nextQ: 'Next question', needsPractice: 'Worth practising again', allDone: 'Practice pack finished.', progress: 'Progress',

    count: function () { return this.peek().length; },
    clear: function () { try { localStorage.removeItem(LS_EVENTS); } catch (e) { /* ignore */ } }
  };

        return 'Today your child worked on multiplication as equal rows (Level ' + s.level + '). ' + s.firstTry + ' of ' + s.judged + ' checked questions were right on the first try' + (s.tags.length ? ', and one idea to keep practising is: ' + (TAGS[s.tags[0]] || s.tags[0]).charAt(0).toLowerCase() + (TAGS[s.tags[0]] || s.tags[0]).slice(1) : '') + '.';
      }
    },
    selfCheck: selfCheck
  };
})();

</script>
<script>
FMPlayer.run(COURSE);
</script>
