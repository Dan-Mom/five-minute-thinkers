<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'">
<title>Math lesson</title>
<style>
/* FMMath manipulatives — styles. Prefix .fm- ; inline this whole file into a course's preview.html <style>.
   No external fonts, images or network. Reduced motion: html.rm OR the OS setting kills every animation + transition. */

.fm-root{
  --fm-ink:#1f2a44; --fm-muted:#56607a; --fm-line:#b9c3d9; --fm-bg:#ffffff; --fm-soft:#eef3fb;
  --fm-a:#d93a40;  --fm-b:#2059c9;   /* counter A (disc) / counter B (diamond) */
  --fm-one:#f0a800; --fm-ten:#1f9d63; --fm-hun:#6b4bc4;
  --fm-focus:#1e5c93;
  --fm-cell:clamp(44px,7vmin,68px);
  --fm-u:clamp(9px,1.6vmin,14px);          /* place-value unit size */
  --fm-dot:clamp(20px,3.6vmin,34px);       /* array dot cell */
  position:relative; box-sizing:border-box; color:var(--fm-ink);
  font-family:"Segoe UI Rounded","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:clamp(15px,2.2vmin,19px); line-height:1.35;
  /* a wide widget (e.g. a two-digit-column ArrayGrid) must never push the whole PAGE into horizontal scroll —
     it scrolls inside its own box instead. Every earlier course stayed narrow enough that this was never exercised;
     area-model-multiply's up-to-19-column split trays are the first to need it (confirmed by real portrait testing). */
  max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.fm-root *,.fm-root *::before,.fm-root *::after{box-sizing:border-box}

/* visually hidden live region (one per widget, created once, never re-rendered) */
.fm-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* buttons */
.fm-btn{
  min-width:44px;min-height:44px;padding:8px 14px;border:2px solid var(--fm-line);border-radius:14px;
  background:var(--fm-bg);color:var(--fm-ink);font:inherit;font-weight:600;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.fm-btn:hover:not(:disabled){background:var(--fm-soft);border-color:var(--fm-focus)}
.fm-btn[aria-pressed="true"]{background:var(--fm-soft);border-color:var(--fm-focus);box-shadow:inset 0 0 0 2px var(--fm-focus)}
.fm-btn:disabled{opacity:.45;cursor:not-allowed}
.fm-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.fm-root :focus-visible{outline:3px solid var(--fm-focus);outline-offset:2px}

/* ---------- Ten frame ---------- */
.fm-frames{display:flex;flex-wrap:wrap;gap:clamp(10px,2vmin,20px);align-items:flex-start}
.fm-paint .fm-frames{touch-action:none}
.fm-frame{display:flex;flex-direction:column;gap:6px}
.fm-frame-label{font-size:.85em;color:var(--fm-muted);font-weight:600}
.fm-grid10{
  display:grid;grid-template-columns:repeat(5,var(--fm-cell));grid-auto-rows:var(--fm-cell);
  gap:0;border:3px solid var(--fm-ink);border-radius:10px;background:var(--fm-bg);overflow:hidden;width:max-content;
}
.fm-grid10{position:relative}
.fm-lid{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.1em;border-radius:6px;background:repeating-linear-gradient(45deg,#e39b00 0,#e39b00 14px,#f0a800 14px,#f0a800 28px)}
.fm-lid[hidden]{display:none}
.fm-cell{
  position:relative;display:flex;align-items:center;justify-content:center;margin:0;padding:0;
  border:1px solid var(--fm-line);background:transparent;border-radius:0;cursor:default;font:inherit;
}
button.fm-cell{cursor:pointer}
button.fm-cell:hover{background:var(--fm-soft)}
.fm-cell::after{
  content:"";width:68%;height:68%;background:transparent;
  transition:transform .18s ease,background .18s ease;transform:scale(.4);opacity:0;
}
.fm-cell.fm-c1::after{background:var(--fm-a);border-radius:50%;transform:scale(1);opacity:1}
.fm-cell.fm-c2::after{background:var(--fm-b);border-radius:24%;transform:rotate(45deg) scale(.86);opacity:1}
.fm-cell.fm-sel{background:#fff6d6;outline:3px solid var(--fm-focus);outline-offset:-3px}
.fm-move .fm-cell.fm-c1,.fm-move .fm-cell.fm-c2{touch-action:none;cursor:grab}
.fm-brushes{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.fm-brush-dot{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.25em;margin-right:6px}
.fm-brush-dot.fm-d1{background:var(--fm-a);border-radius:50%}
.fm-brush-dot.fm-d2{background:var(--fm-b);border-radius:24%;transform:rotate(45deg) scale(.8)}
.fm-ghost{
  position:fixed;z-index:9999;pointer-events:none;width:44px;height:44px;
  margin:-22px 0 0 -22px;border-radius:50%;opacity:.9;box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.fm-ghost.fm-g1{background:#d93a40}
.fm-ghost.fm-g2{background:#2059c9;border-radius:24%}

/* ---------- Place-value blocks ---------- */
.fm-pv{display:flex;gap:clamp(10px,2vmin,22px);align-items:stretch;flex-wrap:wrap}
.fm-pv-col{
  display:flex;flex-direction:column;gap:8px;min-width:clamp(120px,22vmin,190px);flex:1 1 0;
  padding:10px;border:2px solid var(--fm-line);border-radius:16px;background:var(--fm-bg);
}
.fm-pv-head{font-weight:700}
.fm-pv-mat{
  min-height:calc(var(--fm-u)*12);display:flex;flex-wrap:wrap;gap:calc(var(--fm-u)*.6);align-content:flex-start;
  padding:6px;border-radius:12px;background:var(--fm-soft);
}
.fm-ones{display:grid;grid-template-columns:repeat(5,var(--fm-u));gap:2px;margin-right:calc(var(--fm-u)*.6)}
.fm-cube{width:var(--fm-u);height:var(--fm-u);background:var(--fm-one);border:1px solid #b07a00;border-radius:2px}
.fm-rod{
  width:var(--fm-u);height:calc(var(--fm-u)*10);border:1px solid #0f6b41;border-radius:2px;
  background:repeating-linear-gradient(to bottom,var(--fm-ten) 0,var(--fm-ten) calc(var(--fm-u) - 1px),#0f6b41 calc(var(--fm-u) - 1px),#0f6b41 var(--fm-u));
}
.fm-flat{
  width:calc(var(--fm-u)*10);height:calc(var(--fm-u)*10);border:1px solid #47308f;border-radius:3px;
  background:
    repeating-linear-gradient(to right,transparent 0,transparent calc(var(--fm-u) - 1px),rgba(255,255,255,.55) calc(var(--fm-u) - 1px),rgba(255,255,255,.55) var(--fm-u)),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--fm-u) - 1px),rgba(255,255,255,.55) calc(var(--fm-u) - 1px),rgba(255,255,255,.55) var(--fm-u)),
    var(--fm-hun);
}
.fm-pv-row{display:flex;gap:8px}
.fm-pv-row .fm-btn{flex:1 1 0;font-size:1.1em}
.fm-pv-trade{display:flex;flex-direction:column;gap:6px}
.fm-pv-trade .fm-btn{font-size:.85em;font-weight:600;line-height:1.2;padding:6px 8px}
.fm-pv-count{font-size:1.4em;font-weight:800;text-align:center}
.fm-pop{animation:fm-pop .28s ease-out}
@keyframes fm-pop{from{transform:scale(.55);opacity:.4}to{transform:scale(1);opacity:1}}

/* ---------- Array / area model ---------- */
.fm-ar{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.fm-ar-controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.fm-step{display:flex;align-items:center;gap:6px}
.fm-step output{min-width:2ch;text-align:center;font-weight:800;font-size:1.2em}
.fm-step-label{font-weight:600;margin-right:2px}
.fm-ar-grid{display:grid;gap:4px;padding:10px;border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg);max-width:100%}
.fm-dot{width:var(--fm-dot);height:var(--fm-dot);display:block}
.fm-dot::after{content:"";display:block;width:100%;height:100%;background:var(--fm-a);border-radius:50%}
.fm-dot.fm-pb::after{background:var(--fm-b);border-radius:24%;transform:rotate(45deg) scale(.84)}
.fm-dot.fm-gapl{margin-left:calc(var(--fm-dot)*.55)}
.fm-split{display:flex;flex-direction:column;gap:4px;width:min(100%,440px)}
.fm-split label{font-weight:600}
.fm-split input[type=range]{width:100%;height:44px;accent-color:var(--fm-focus);margin:0}
.fm-partials{display:flex;gap:16px;flex-wrap:wrap;font-weight:700}
.fm-partials span:nth-child(1){color:var(--fm-a)} .fm-partials span:nth-child(2){color:var(--fm-b)}
.fm-total{font-weight:800;font-size:1.15em}
/* ArrayGrid tile look (opt-in tiles:true): square tiles that touch with thin seams, no turned diamonds; the cut still shows as a gap */
.fm-ar-tiles .fm-ar-grid{gap:0;padding:6px}
.fm-ar-tiles .fm-dot::after{border-radius:3px;box-shadow:inset 0 0 0 2px var(--fm-bg)}
.fm-ar-tiles .fm-dot.fm-pb::after{border-radius:3px;transform:none}

/* ---------- Fraction bar ---------- */
/* .fm-fb itself needs an explicit width: in display mode (no stepper controls, review-found P0) there is
   nothing else inside .fm-root to give the flex-item ancestor (.fmp-visual) a min-content width to stretch
   from, so .fm-fb-bar's own width:min(100%,520px) resolves against near-zero and the bar collapses to a few
   px. Same fix shape as .fm-cal/.fm-coins (both also set width:100% on their own root for the same reason). */
.fm-fb{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%}
.fm-fb-bar{display:grid;gap:3px;width:min(100%,520px);height:clamp(48px,9vmin,72px);border:2px solid var(--fm-ink);border-radius:10px;overflow:hidden;background:var(--fm-bg)}
.fm-fb-seg{background:var(--fm-soft);border-right:1px solid var(--fm-line)}
.fm-fb-seg:last-child{border-right:none}
.fm-fb-seg.fm-fb-shaded{background:repeating-linear-gradient(45deg,var(--fm-a) 0,var(--fm-a) 8px,#b32a30 8px,#b32a30 16px)}

/* ---------- Decimal grid (tenths strips / hundredths squares) ---------- */
/* width:100% on the root for the same reason as .fm-fb (display mode has no stepper to give the flex ancestor a width).
   The grid is a square: grid-auto-flow:column fills 10 squares down a column, then moves right - so one column is one tenth. */
.fm-dg{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%}
.fm-dg-grid{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);grid-auto-flow:column;width:min(100%,clamp(200px,40vmin,320px));aspect-ratio:1/1;margin:0 auto;border:2px solid var(--fm-ink);border-radius:10px;overflow:hidden;background:var(--fm-bg)}
.fm-dg-grid.fm-dg-tenths{grid-template-rows:1fr}
.fm-dg-cell{background:var(--fm-soft);border:1px solid #8a96b2}
.fm-dg-tenths .fm-dg-cell{border-top:0;border-bottom:0}
/* the squares fill column by column: every cell of columns 2-10 gets a heavier left line, so the 10 columns (one tenth each) read as columns */
.fm-dg-cell.fm-dg-colsep{border-left:3px solid var(--fm-ink)}
.fm-dg-cell.fm-dg-shaded{background:repeating-linear-gradient(45deg,var(--fm-a) 0,var(--fm-a) 6px,#b32a30 6px,#b32a30 12px);border-color:#8f2025}

/* ---------- Fraction pair (two bars, same width, for comparing) ---------- */
.fm-fp{display:flex;flex-direction:column;gap:16px;align-items:stretch;width:100%}
.fm-fp-sec{display:flex;flex-direction:column;gap:6px}
.fm-fp-name{font-weight:800;font-size:1.05em;color:var(--fm-ink)}
.fm-fp-steps{display:flex;flex-wrap:wrap;gap:6px 14px}
.fm-fp-bar{width:min(100%,520px);height:clamp(40px,7vmin,60px)}

/* ---------- reduced motion: ONE switch (html.rm) + the OS setting; kills animation AND transition ---------- */
html.rm .fm-root *,html.rm .fm-root *::before,html.rm .fm-root *::after,
html.rm .fm-ghost{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  .fm-root *,.fm-root *::before,.fm-root *::after,.fm-ghost{animation:none!important;transition:none!important}
}

/* ---------- Clock (clock2) ----------
   Replaces the whole old "Clock" section of manipulatives.css (the block that starts with the line "Clock" and ends before "Calendar").
   Sizes of ticks / hands / text come from the JavaScript (M.clockGeometry) as drawing attributes, so only colours, caps and the
   face width live here. Colours are the same hex values as FMMath.math.clockColors (the self-test compares them). */
.fm-ck{display:flex;flex-direction:column;gap:12px;align-items:flex-start;--ck-w:260px;--ck-ink:#1f2a44;--ck-bg:#ffffff;--ck-hour:#b3262c;--ck-min:#1b4aa8}
.fm-ck.fm-ck-large{--ck-w:340px}
.fm-ck-face{width:min(100%,var(--ck-w));height:auto;display:block}
.fm-ck-rim{fill:var(--ck-bg);stroke:var(--ck-ink)}
.fm-ck-tick,.fm-ck-tick5{stroke:var(--ck-ink);stroke-linecap:butt}
.fm-ck-num,.fm-ck-lbl{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-weight:700;fill:var(--ck-ink)}
.fm-ck-halo{stroke:var(--ck-bg);stroke-linecap:round}
.fm-ck-hour{stroke:var(--ck-hour);stroke-linecap:round}
.fm-ck-min{stroke:var(--ck-min);stroke-linecap:round}
.fm-ck-pin{fill:var(--ck-ink)}
.fm-ck-hidden{display:none}
.fm-ck .fm-step{flex-wrap:wrap}

/* ---------- Calendar ---------- */
.fm-cal{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%}
.fm-cal .fm-step,.fm-cal .fm-total{align-self:flex-start}
.fm-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;min-width:min(340px,78vw);max-width:380px;padding:10px;border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg)}
.fm-cal-hd{font:700 12px system-ui,sans-serif;color:var(--fm-muted);text-align:center;font-style:normal;padding-bottom:3px}
.fm-cal-day{font:600 16px system-ui,sans-serif;color:var(--fm-ink);text-align:center;padding:8px 0;border-radius:8px;font-style:normal}
.fm-cal-sel{background:var(--fm-a);color:#fff;font-weight:800;box-shadow:0 0 0 3px var(--fm-ink)}

/* ---------- Coins ---------- */
.fm-coins{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%}
.fm-coins .fm-total{align-self:flex-start}
.fm-coin-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:56px;padding:4px 8px;border:2px solid var(--fm-line);border-radius:12px;background:var(--fm-bg)}
.fm-coin-line .fm-step{flex:0 0 auto}
.fm-coin-line .fm-step-label{min-width:5.4em}
.fm-coin-line .fm-coin-row{flex:1 1 130px;min-width:0;min-height:0}
.fm-coin-tray{display:flex;flex-direction:column;gap:6px;padding:10px;border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg);min-height:48px}
.fm-coin-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px}
.fm-coin{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font:800 14px system-ui,sans-serif;font-style:normal;border:2px solid #5d4a2a;box-sizing:border-box}
.fm-coin-p{width:42px;height:42px;background:#9c5b27;color:#fff}
.fm-coin-n{width:50px;height:50px;background:#d5d9e0;color:#1f2a44;border-color:#6b7385}
.fm-coin-d{width:38px;height:38px;background:#e3e6ec;color:#1f2a44;border-color:#6b7385;font-size:13px}
.fm-coin-q{width:58px;height:58px;background:#cfd4dc;color:#1f2a44;border-color:#6b7385;font-size:16px}
.fm-coin-gap{display:block;width:40px;height:40px}
.fm-faces-name .fm-coin{font-size:12px;letter-spacing:0}

/* ======== shared-tool batch (A89): CountField, ShapeSorter, GeoBoard, DataGraph, Ruler, NumberLine, FourBox, RuleMachine ======== */
/* FMMath.CountField - styles. Prefix .fm-cf- ; load AFTER manipulatives.css (it reuses .fm-root, .fm-btn, .fm-sr and the --fm-* colours).
   No external fonts, images or network. Reduced motion: html.rm OR the OS setting kills every animation + transition. */

.fm-cf{--fm-cf-ok:#0f7a49;--fm-cf-twice:#a8321f;width:100%}
.fm-cf-wrap{width:100%;max-width:100%}
.fm-cf-mat{box-sizing:border-box;width:100%;background:var(--fm-soft);border:2px solid var(--fm-line);border-radius:16px}
.fm-cf-field{position:relative;margin:0 auto;max-width:100%}

/* one thing. The tap target is the whole circle (JS sets width/height >= 44px and the position). */
.fm-cf-obj{
  position:absolute;display:block;margin:0;padding:0;box-sizing:border-box;border-radius:50%;
  border:3px solid var(--fm-line);background:var(--fm-bg);color:var(--fm-ink);font:inherit;cursor:pointer;
  transition:left .35s ease,top .35s ease,border-color .15s ease;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
span.fm-cf-obj{cursor:default}
.fm-cf-art{position:absolute;inset:14%;display:block;pointer-events:none}
.fm-cf-art svg{display:block;width:100%;height:100%;overflow:visible}
button.fm-cf-obj:hover{border-color:var(--fm-focus)}

/* a thing that has been counted: a thick ring AND a tick badge (shape, never colour alone) */
.fm-cf-obj.fm-cf-done{border:5px solid var(--fm-cf-ok)}
.fm-cf-obj.fm-cf-twice{border:5px double var(--fm-cf-twice)}
.fm-cf-badge{
  position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;border-radius:11px;
  background:var(--fm-cf-ok);color:#fff;font-weight:800;font-size:14px;line-height:22px;text-align:center;pointer-events:none;
  display:none;align-items:center;justify-content:center;
}
.fm-cf-done .fm-cf-badge{display:inline-flex}
.fm-cf-twice .fm-cf-badge{background:var(--fm-cf-twice)}
.fm-cf-badge svg{display:block}
.fm-cf-num{display:block;font-variant-numeric:tabular-nums}
.fm-cf-obj.fm-cf-again{animation:fm-cf-shake .4s ease}
@keyframes fm-cf-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* display mode: just the things, no circle */
.fm-cf-display .fm-cf-obj{border-color:transparent;background:transparent}

/* build mode: an empty spot is a dashed circle, a put-out thing fills it */
.fm-cf-build .fm-cf-obj.fm-cf-spot{border:3px dashed var(--fm-line);background:transparent}
.fm-cf-build .fm-cf-obj.fm-cf-spot .fm-cf-art{visibility:hidden}
.fm-cf-build .fm-cf-obj.fm-cf-on{border:3px solid var(--fm-line);background:var(--fm-bg)}

.fm-cf-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fm-cf-last{font-weight:800}

/* ShapeSorter styles (prefix .fm-ss-). Paste at the end of manipulatives.css. Uses the .fm-root tokens. */
.fm-ss{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:100%;max-width:100%}
.fm-ss-tray{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:2px dashed var(--fm-line);border-radius:14px;background:var(--fm-soft);min-height:84px;align-items:center}
.fm-ss-tray.fm-ss-empty{min-height:0;padding:4px}
.fm-ss-display .fm-ss-tray{border-style:solid;background:var(--fm-bg)}
.fm-ss-card{
  position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:clamp(76px,11vmin,104px);min-width:76px;min-height:76px;aspect-ratio:1/1;margin:0;padding:4px;
  border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg);color:var(--fm-ink);font:inherit;cursor:pointer;
}
span.fm-ss-card{cursor:default}
.fm-ss-card[hidden]{display:none}
.fm-ss-card:hover{border-color:var(--fm-focus)}
.fm-ss-card .fm-ss-pic{display:block;width:100%;height:100%;flex:1 1 auto;min-height:0}
.fm-ss-card.fm-ss-s .fm-ss-pic{width:58%;height:58%;flex:0 0 auto}
.fm-ss-card.fm-ss-m .fm-ss-pic{width:80%;height:80%;flex:0 0 auto}
.fm-ss-card.fm-ss-l .fm-ss-pic{width:100%;height:100%}
.fm-ss-cap{font-size:.72em;font-weight:700;line-height:1.1;text-align:center}
/* selected: thick outline AND a corner tick, never colour alone */
.fm-ss-card.fm-sel{border-color:var(--fm-focus);border-width:4px;background:#fff6d6;box-shadow:0 0 0 2px var(--fm-focus)}
.fm-ss-card.fm-sel::after{content:"\2713";position:absolute;top:2px;right:6px;font-weight:800;color:var(--fm-focus)}
.fm-ss-pick .fm-ss-card,.fm-ss-sort .fm-ss-card,.fm-ss-place .fm-ss-card{touch-action:none}
.fm-ss-chip{width:60px;min-width:60px;min-height:60px;padding:2px}
.fm-ss-chip[data-check="ok"]::before{content:"\2713";position:absolute;left:3px;bottom:0;font-weight:800;font-size:.9em}
.fm-ss-chip[data-check="no"]::before{content:"\2715";position:absolute;left:3px;bottom:0;font-weight:800;font-size:.9em}
.fm-ss-bar{display:flex;gap:8px;flex-wrap:wrap}
.fm-ss-boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fm-ss-box{display:flex;flex-direction:column;gap:6px;padding:8px;border:3px solid var(--fm-ink);border-radius:16px;background:var(--fm-bg);min-width:0}
.fm-ss-box.fm-ss-target{border-style:dashed}
.fm-ss-boxbtn{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:72px;width:100%;padding:8px;margin:0;
  border:2px solid var(--fm-line);border-radius:12px;background:var(--fm-soft);color:var(--fm-ink);font:inherit;font-weight:800;cursor:pointer;
}
.fm-ss-boxbtn:hover{border-color:var(--fm-focus)}
.fm-ss-boxicon{width:34px;height:34px;flex:0 0 auto}
.fm-ss-boxlab{overflow-wrap:anywhere;text-align:center}
.fm-ss-held{display:flex;flex-wrap:wrap;gap:6px;min-height:8px}
.fm-ss-ghost{position:fixed;z-index:9999;pointer-events:none;width:60px;height:60px;margin:-30px 0 0 -30px;opacity:.9;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.fm-ss-ghost svg{width:100%;height:100%}
/* place mode: a 3 x 3 scene, the landmark in the middle */
.fm-ss-scene{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(84px,auto);gap:6px;width:min(100%,380px);padding:8px;border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg)}
.fm-ss-cell{position:relative;min-width:0;display:flex}
.fm-ss-centre{min-height:120px}
.fm-ss-landmark{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.fm-ss-spot{
  position:relative;display:flex;align-items:center;justify-content:center;flex:1 1 auto;min-width:44px;min-height:76px;margin:0;padding:2px;
  border:2px dashed var(--fm-line);border-radius:12px;background:transparent;color:var(--fm-ink);font:inherit;cursor:pointer;
}
.fm-ss-spot .fm-ss-pic{width:70%;height:70%;max-height:72px}
.fm-ss-spot.fm-ss-target{border-color:var(--fm-focus);background:rgba(30,92,147,.08)}
.fm-ss-spot-front,.fm-ss-spot-behind{position:absolute;left:0;right:0;min-height:56px;height:calc(50% - 3px)}
.fm-ss-spot-behind{top:0;z-index:1}
.fm-ss-spot-front{bottom:0;z-index:3}
.fm-ss-spotword{position:absolute;bottom:1px;left:2px;right:2px;font-size:.7em;font-weight:700;text-align:center;background:var(--fm-bg);border-radius:6px}
.fm-ss-spotword:empty{display:none}
html.rm .fm-ss *{animation:none!important;transition:none!important}

/* GeoBoard styles (prefix .fm-gb-). Paste at the end of manipulatives.css. Uses the .fm-root tokens. */
.fm-gb{display:flex;flex-direction:column;gap:12px;align-items:flex-start;width:100%;max-width:100%;--fm-gb-smax:clamp(44px,9vmin,64px)}
.fm-gb-controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.fm-gb-scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden}
.fm-gb-board{
  position:relative;width:min(100%,calc(var(--n)*var(--fm-gb-smax)));aspect-ratio:var(--n)/var(--m);
  outline:2px solid var(--fm-line);outline-offset:-2px;border-radius:12px;background:var(--fm-bg);
}
/* a board you must tap on keeps every peg / square at least 44px: it never shrinks below that, it scrolls inside its own box */
.fm-gb-band .fm-gb-board,.fm-gb-tile .fm-gb-board{min-width:calc(var(--n)*44px)}
/* A89 fix (P3-2, finished in fix pass 2): on a narrow phone screen the page gutters leave less room than the pegs need (7 pegs at 44px = 308px; a
   320px screen in the lesson player leaves 264px, in a plain page 284px). On phone-width screens the board's own scroll box now borrows from the
   side gutters exactly what the pegs still need, up to 22px a side, and always leaves 6px of gutter (the page never widens). Targets stay 44px; a bigger
   board still scrolls inside its own box. --n (pegs or squares across) is set on the scroll box by the library; without it nothing is borrowed. */
.fm-gb-scroll{overscroll-behavior-x:contain;--fm-gb-bleed:0px}
@media (max-width:420px){
  .fm-gb-band .fm-gb-scroll,.fm-gb-tile .fm-gb-scroll{--fm-gb-bleed:min(0px,max(-22px,calc((100% - 100vw)/2 + 6px),calc((100% - var(--n,1)*44px)/2)));margin-inline:var(--fm-gb-bleed);width:calc(100% - 2*var(--fm-gb-bleed));max-width:none}
}
.fm-gb-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fm-gb-dot{fill:var(--fm-muted)}
.fm-gb-gridline{stroke:var(--fm-line);stroke-width:1}
.fm-gb-shape{stroke:var(--fm-ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;fill:none}
.fm-gb-closed{fill:rgba(32,89,201,.14)}
.fm-gb-filled{fill:var(--fm-b);fill-opacity:.35;stroke:var(--fm-b);stroke-width:.04}
.fm-gb-outline{fill:none;stroke:var(--fm-ink);stroke-width:4;stroke-linejoin:round}
.fm-gb-guide{fill:none;stroke:var(--fm-ink);stroke-width:3;stroke-dasharray:3 6}
.fm-gb-walked{stroke:var(--fm-a);stroke-width:0;fill:none}
.fm-gb-walked.fm-gb-on{stroke-width:9;stroke-dasharray:10 6;stroke-linecap:butt;opacity:.9}
.fm-gb-walker{fill:var(--fm-ink);stroke:#fff;stroke-width:.04}
.fm-gb-labels{position:absolute;inset:0;pointer-events:none}
.fm-gb-len,.fm-gb-sidenum{position:absolute;font-weight:800;font-size:clamp(12px,.85em,16px);line-height:1;padding:2px 5px;border-radius:8px;background:var(--fm-bg);border:1.5px solid var(--fm-ink);white-space:nowrap}
.fm-gb-sidenum{font-size:clamp(11px,.72em,13px);background:var(--fm-soft);border-color:var(--fm-line)}
.fm-gb-sidenum.fm-gb-on{background:var(--fm-a);color:#fff;border-color:var(--fm-ink)}
/* pegs and squares: real buttons, each one a whole grid cell (>= 44px) so fingers hit them; no two overlap */
.fm-gb-peg,.fm-gb-cell{position:absolute;margin:0;padding:0;border:0;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font:inherit}
.fm-gb-cell{border-radius:6px;touch-action:none}
.fm-gb-peg:hover{background:rgba(30,92,147,.12)}
.fm-gb-cell:hover{background:rgba(30,92,147,.10)}
.fm-gb-cell[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--fm-b)}
.fm-gb-badge{display:none;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:var(--fm-ink);color:#fff;font-weight:800;font-size:13px;line-height:22px;text-align:center}
.fm-gb-used .fm-gb-badge{display:block}
.fm-gb-first .fm-gb-badge{border-radius:4px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--fm-ink)}
.fm-gb-bar,.fm-gb-sides{display:flex;flex-wrap:wrap;gap:8px}
.fm-gb-sidebtn{min-width:44px}
.fm-gb-sidebtn[hidden]{display:none}
.fm-gb-sum{font-weight:800;font-size:1.1em}
.fm-gb-sum[hidden],.fm-gb-sides[hidden]{display:none}
html.rm .fm-gb *{animation:none!important;transition:none!important}

/* FMMath.DataGraph — styles (prefix .fm-dgr-). Paste at the end of manipulatives.css. Uses the existing --fm-* colour variables,
   .fm-root, .fm-btn, .fm-step, .fm-sr, .fm-total. No external fonts, images or network. Reduced motion needs nothing extra
   (this tool has no animation; the global html.rm / prefers-reduced-motion rules still apply). */

.fm-dgr{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:100%}
.fm-dgr-glyph{display:inline-block;vertical-align:middle;stroke:var(--fm-ink);stroke-width:1.6;stroke-linejoin:round}
.fm-dgr-s0{fill:var(--fm-a)} .fm-dgr-s1{fill:var(--fm-b)} .fm-dgr-s2{fill:var(--fm-one)} .fm-dgr-s3{fill:var(--fm-ten)} .fm-dgr-s4{fill:var(--fm-hun)}

/* ---- steppers (build, tally / picture / bar) ---- */
.fm-dgr-ctl{display:flex;flex-wrap:wrap;gap:6px 22px}
.fm-dgr-row .fm-step-label{min-width:5.2em}

/* ---- tally + picture rows ---- */
.fm-dgr-view{width:100%}
.fm-dgr-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:44px;padding:4px 10px;border-bottom:1px solid var(--fm-line)}
.fm-dgr-line:last-child{border-bottom:0}
.fm-dgr-rowname{display:inline-flex;align-items:center;gap:6px;min-width:6.5em;font-weight:700}
.fm-dgr-marks{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1 1 140px;color:var(--fm-ink)}
.fm-dgr-icon{display:inline-block;line-height:0;flex:0 0 auto}
.fm-dgr-partial{overflow:hidden;border-right:2px dashed var(--fm-muted)}
.fm-dgr-partial .fm-dgr-glyph{max-width:none}
.fm-dgr-rowval{font-weight:800;font-size:1.15em;min-width:2ch;text-align:right}
.fm-dgr-key{font-size:.9em;color:var(--fm-muted);font-weight:600}
.fm-dgr-tally{display:block}

/* ---- bar graph ---- */
.fm-dgr-plot{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;width:100%;max-width:560px;padding:12px 8px 6px 4px;border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg)}
.fm-dgr-build .fm-dgr-plot{touch-action:none;cursor:pointer}
.fm-dgr-axis{position:relative;grid-column:1;grid-row:1;min-width:1.8em;font-size:.82em;font-weight:700;color:var(--fm-muted)}
.fm-dgr-ax{position:absolute;right:0;transform:translateY(50%);line-height:1;padding:1px 3px;border-radius:5px}
.fm-dgr-ax.fm-dgr-hit{color:var(--fm-ink);border:2px solid var(--fm-ink);background:#fff6d6;padding:0 3px;font-weight:800}
.fm-dgr-field{position:relative;grid-column:2;grid-row:1;height:max(160px,calc(var(--fm-dgr-lines,11) * 1.55em));border-left:3px solid var(--fm-ink);border-bottom:3px solid var(--fm-ink)}
.fm-dgr-gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--fm-line);pointer-events:none}
.fm-dgr-cols{position:absolute;inset:0;display:grid;gap:0;align-items:end}
.fm-dgr-col{height:100%;display:flex;align-items:flex-end;justify-content:center}
.fm-dgr-bar{position:relative;width:72%;min-height:0;border:2px solid var(--fm-ink);border-bottom:0;border-radius:6px 6px 0 0}
.fm-dgr-bar.fm-dgr-sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--fm-ink)}
.fm-dgr-p0{background:repeating-linear-gradient(45deg,var(--fm-a) 0,var(--fm-a) 7px,#b32a30 7px,#b32a30 14px)}
.fm-dgr-p1{background:repeating-linear-gradient(0deg,var(--fm-b) 0,var(--fm-b) 6px,#173f91 6px,#173f91 12px)}
.fm-dgr-p2{background:radial-gradient(#7a5200 2px,transparent 2.5px) 0 0/10px 10px,var(--fm-one)}
.fm-dgr-p3{background:repeating-linear-gradient(90deg,var(--fm-ten) 0,var(--fm-ten) 6px,#0f6b41 6px,#0f6b41 12px)}
.fm-dgr-p4{background:repeating-linear-gradient(-45deg,var(--fm-hun) 0,var(--fm-hun) 7px,#47308f 7px,#47308f 14px)}
.fm-dgr-val{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);padding:0 4px;font-weight:800;font-size:.95em;color:var(--fm-ink)}
.fm-dgr-guide{position:absolute;left:0;right:0;height:0;border-top:3px dashed var(--fm-ink);pointer-events:none}
.fm-dgr-xlabels{grid-column:2;grid-row:2;display:grid;gap:0;margin-top:6px}
.fm-dgr-xl{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;min-width:0;text-align:center;font-weight:700;font-size:.85em;overflow-wrap:anywhere}
button.fm-dgr-xl{min-height:44px;min-width:44px;min-width:44px;padding:4px 2px;border-radius:10px}
.fm-dgr-name{min-width:0}

/* ---- sorting ---- */
.fm-dgr-sort{display:flex;flex-direction:column;gap:12px}
.fm-dgr-boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.fm-dgr-box{display:flex;flex-direction:column;gap:6px;padding:8px;border:2px dashed var(--fm-line);border-radius:14px;background:var(--fm-bg);min-width:0}
.fm-dgr-build .fm-dgr-box{cursor:pointer}
.fm-dgr-box[hidden]{display:none}
.fm-dgr-pilebox{background:var(--fm-soft)}
.fm-dgr-put{width:100%;font-size:.95em;line-height:1.2}
.fm-dgr-boxname{font-weight:800}
.fm-dgr-boxitems{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;align-content:flex-start}
.fm-dgr-item{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;margin:0;padding:4px;border:2px solid var(--fm-line);border-radius:12px;background:var(--fm-bg);font:inherit;cursor:pointer;touch-action:none}
.fm-dgr-static{cursor:default;touch-action:auto;border-color:transparent}
.fm-dgr-item.fm-dgr-chosen{background:#fff6d6;border-color:var(--fm-focus);outline:3px solid var(--fm-focus);outline-offset:-3px}
.fm-dgr-ghost{position:fixed;z-index:9999;pointer-events:none;width:48px;height:48px;margin:-24px 0 0 -24px;opacity:.9;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}

/* ---- data table (the text alternative) ---- */
.fm-dgr-tablewrap{overflow-x:auto;max-width:100%}
.fm-dgr-table{border-collapse:collapse;font-size:.92em}
.fm-dgr-table caption{text-align:left;font-weight:700;padding-bottom:4px}
.fm-dgr-table th,.fm-dgr-table td{border:1px solid var(--fm-line);padding:4px 10px;text-align:left}
.fm-dgr-table thead th{background:var(--fm-soft)}

/* FMMath.Ruler + FMMath.drawScale — styles (prefixes .fm-rl- and .fm-scale-). Paste at the end of manipulatives.css.
   Uses the existing --fm-* variables, .fm-root, .fm-btn, .fm-sr. No external fonts, images or network.
   No animation in this tool, so nothing extra is needed for reduced motion. */

/* ---------- the reusable scale (ticks + numbers) ---------- */
.fm-scale{position:relative;display:block;color:var(--fm-ink)}
.fm-scale-h{height:2.7em}
.fm-scale-v{width:3em;height:100%}
.fm-scale-tick{position:absolute;display:block;background:var(--fm-ink)}
.fm-scale-h .fm-scale-tick{top:0;width:2px;margin-left:-1px}
.fm-scale-h .fm-scale-major{height:1.15em}
.fm-scale-h .fm-scale-minor{height:.7em;background:var(--fm-muted)}
.fm-scale-v .fm-scale-tick{right:0;height:2px;margin-bottom:-1px}
.fm-scale-v .fm-scale-major{width:1.15em}
.fm-scale-v .fm-scale-minor{width:.7em;background:var(--fm-muted)}
.fm-scale-num{position:absolute;font-weight:800;line-height:1;white-space:nowrap}
.fm-scale-h .fm-scale-num{top:1.3em;transform:translateX(-50%)}
.fm-scale-v .fm-scale-num{right:1.4em;transform:translateY(50%)}

/* ---------- the ruler ---------- */
.fm-rl{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:100%;--fm-rl-pad:max(12px,min(1.1em,5vw))}
.fm-rl-stage{width:100%;max-width:640px;touch-action:auto}
.fm-rl-build .fm-rl-stage{touch-action:none;cursor:pointer}
.fm-rl-track{position:relative;width:100%}
.fm-rl-lane,.fm-rl-tilelane{padding:0 var(--fm-rl-pad)}
.fm-rl-lane{height:4.2em}
.fm-rl-tilelane{height:3.2em}
.fm-rl-obj{position:absolute;top:.5em;height:2.2em;border:3px solid var(--fm-ink);border-radius:8px;background:repeating-linear-gradient(45deg,#f6d365 0,#f6d365 9px,#f0b93a 9px,#f0b93a 18px);box-shadow:inset 6px 0 0 rgba(31,42,68,.35),inset -6px 0 0 rgba(31,42,68,.35)}
.fm-rl-o-pencil{background:repeating-linear-gradient(90deg,#f0a800 0,#f0a800 14px,#d98e00 14px,#d98e00 28px);border-radius:3px 14px 14px 3px}
.fm-rl-o-eraser{background:repeating-linear-gradient(135deg,#ffb3c1 0,#ffb3c1 9px,#ff8fa3 9px,#ff8fa3 18px)}
.fm-rl-o-crayon{background:repeating-linear-gradient(0deg,#6bb6ff 0,#6bb6ff 7px,#2d82d8 7px,#2d82d8 14px);border-radius:3px 14px 14px 3px}
.fm-rl-endline{position:absolute;top:1.5em;height:2.7em;width:0;margin-left:-1px;border-left:2px dashed var(--fm-muted);pointer-events:none}
.fm-rl-tilerow{position:absolute;top:.4em;height:2.2em;display:flex}
.fm-rl-tile{flex:1 1 0;min-width:0;border:2px solid var(--fm-ink);background:repeating-linear-gradient(-45deg,#9ed8c0 0,#9ed8c0 8px,#6fc3a3 8px,#6fc3a3 16px)}
.fm-rl-tile+.fm-rl-tile{margin-left:-2px}
.fm-rl-tilerow.fm-rl-gap .fm-rl-tile{margin:0 6px;flex:1 1 0}
.fm-rl-ruler{position:relative;padding:0 var(--fm-rl-pad) 1.2em;border:2px solid var(--fm-ink);border-top:3px solid var(--fm-ink);border-radius:4px 4px 10px 10px;background:linear-gradient(#fff9e0,#fdf0b8)}
.fm-rl-ruler .fm-rl-track{padding-top:0}
.fm-rl-unit{position:absolute;right:var(--fm-rl-pad);bottom:.25em;font-size:.78em;font-weight:700;color:var(--fm-muted)}

/* ---------- controls + readout ---------- */
.fm-rl-ctl{display:flex;flex-wrap:wrap;gap:10px}
.fm-rl-btn{font-size:1em}
.fm-rl-readout{font-weight:800;font-size:1.05em}

/* ==== NumberLine (FMMath.NumberLine) - paste into manipulatives.css above the reduced-motion block ==== */
.fm-nl{padding-bottom:2px;display:flex;flex-direction:column;gap:14px;align-items:stretch;width:100%}
.fm-nl-controls{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.fm-nl-stage{width:100%;min-width:0;padding:0 24px;display:flex;flex-direction:column;gap:10px}
.fm-nl-bar{display:grid;height:clamp(34px,6vmin,46px);border:2px solid var(--fm-ink);border-radius:8px;overflow:hidden;background:var(--fm-bg)}
.fm-nl-seg{background:var(--fm-soft);border-right:1px solid var(--fm-line)}
.fm-nl-seg:last-child{border-right:none}
.fm-nl-seg.fm-nl-wholeseg{border-left:3px solid var(--fm-ink)}
.fm-nl-seg.fm-nl-shaded{background:repeating-linear-gradient(45deg,var(--fm-a) 0,var(--fm-a) 8px,#b32a30 8px,#b32a30 16px)}
.fm-nl-line{position:relative;height:96px;width:100%}
.fm-nl-axis{position:absolute;left:-4px;right:-4px;top:46px;height:4px;border-radius:2px;background:var(--fm-ink)}
.fm-nl-dyn{position:absolute;inset:0;pointer-events:none}
.fm-nl-tick{position:absolute;top:38px;width:2px;height:20px;margin-left:-1px;background:var(--fm-ink)}
.fm-nl-tick.fm-nl-whole{top:31px;width:4px;height:34px;margin-left:-2px;border-radius:2px}
.fm-nl-num{position:absolute;top:68px;transform:translateX(-50%);font-weight:800;font-size:1.1em;line-height:1}
.fm-nl-lab{position:absolute;top:62px;transform:translateX(-50%);line-height:1}
.fm-nl-frac{display:inline-flex;flex-direction:column;align-items:center;font-weight:700;font-size:.72em;line-height:1.1}
.fm-nl-frac span:last-child{border-top:2px solid var(--fm-ink);padding-top:1px;min-width:1.2em;text-align:center}
.fm-nl-marker{position:absolute;top:33px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--fm-a);border:4px solid var(--fm-ink);box-sizing:border-box;transition:left .2s ease;pointer-events:none}
.fm-nl-marker[hidden],.fm-nl-mlabel[hidden]{display:none}
.fm-nl-mlabel{position:absolute;top:2px;transform:translateX(-50%);font-weight:800;background:var(--fm-bg);padding:0 4px;border-radius:6px;transition:left .2s ease}
.fm-nl-hop{position:absolute;top:14px;height:30px;border:3px solid var(--fm-b);border-bottom:0;border-radius:999px 999px 0 0;box-sizing:border-box}
.fm-nl-hopn{position:absolute;top:-2px;transform:translateX(-50%);font-weight:700;font-size:.8em;color:var(--fm-b);line-height:1}
.fm-nl-point{position:absolute;top:2px;height:44px;width:28px;margin-left:-14px;text-align:center}
.fm-nl-point b{position:absolute;left:0;right:0;top:0;font-size:1em;line-height:1;font-weight:800}
.fm-nl-point i{position:absolute;left:7px;top:19px;width:14px;height:14px;background:var(--fm-b);border:2px solid var(--fm-ink);transform:rotate(45deg);box-sizing:border-box}
.fm-nl-point::after{content:"";position:absolute;left:13px;top:33px;width:2px;height:11px;background:var(--fm-b)}
.fm-nl-hit{position:absolute;left:-24px;right:-24px;top:0;bottom:0;min-height:56px;border-radius:12px;cursor:pointer;touch-action:pan-y}
.fm-nl-hit:focus-visible{outline:3px solid var(--fm-focus);outline-offset:2px}
.fm-nl-move{flex:0 1 auto}
.fm-nl .fm-step{flex-wrap:wrap}

/* ==== FourBox (FMMath.FourBox) - paste into manipulatives.css above the reduced-motion block ==== */
.fm-fx{padding-bottom:2px;display:flex;flex-direction:column;gap:12px;align-items:stretch;width:100%}
.fm-fx-controls{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.fm-fx-cut{flex:0 1 auto;text-align:left;line-height:1.2}
.fm-fx-cut[hidden],.fm-fx-box[hidden],.fm-fx-head[hidden],.fm-fx-cap[hidden],.fm-fx-val[hidden],.fm-fx-in[hidden],.fm-fx-sumrow[hidden]{display:none}
.fm-fx-grid{display:grid;gap:4px;width:100%;max-width:480px;min-width:0}
.fm-fx-head{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15em;padding:2px 4px;min-height:28px}
.fm-fx-top{border-bottom:3px solid var(--fm-ink)}
.fm-fx-side{border-right:3px solid var(--fm-ink);min-width:2.2ch}
.fm-fx-box{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:3px;min-width:0;border:2px solid var(--fm-ink);border-radius:10px;background:var(--fm-soft)}
.fm-fx-cap{font-size:.8em;font-weight:700;color:var(--fm-muted);line-height:1.1;text-align:center}
.fm-fx-val{font-weight:800;font-size:1.3em;line-height:1.1}
.fm-fx-in{box-sizing:border-box;width:100%;max-width:120px;min-width:44px;min-height:44px;padding:4px 2px;border:2px solid var(--fm-line);border-radius:10px;background:var(--fm-bg);color:var(--fm-ink);font:inherit;font-weight:800;font-size:1.2em;text-align:center}
.fm-fx-in:focus-visible{outline:3px solid var(--fm-focus);outline-offset:1px}
.fm-fx-mark{font-weight:800;font-size:.85em;line-height:1.1}
.fm-fx-right{border-style:solid;border-color:#1f7a4d}
.fm-fx-wrong{border-style:dashed;border-color:#b32a30}
.fm-fx-sumrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.fm-fx-sumlab{font-weight:700}
.fm-fx-sum{max-width:140px}
.fm-fx-sumline{font-weight:800;font-size:1.1em}
.fm-fx .fm-step{flex-wrap:wrap}

/* ==== RuleMachine (FMMath.RuleMachine) - paste into manipulatives.css above the reduced-motion block ==== */
.fm-rm{padding-bottom:2px;display:flex;flex-direction:column;gap:12px;align-items:stretch;width:100%}
.fm-rm-pic{display:flex;flex-direction:column;gap:10px}
.fm-rm-line{display:flex;align-items:center;gap:clamp(4px,1.6vw,12px);flex-wrap:wrap}
.fm-rm-name{flex:1 0 100%;font-weight:800}
.fm-rm-name[hidden]{display:none}
.fm-rm-io{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:52px;padding:0 8px;border:3px solid var(--fm-ink);border-radius:50%;background:var(--fm-bg);font-weight:800;font-size:1.3em}
.fm-rm-out{border-radius:12px;background:var(--fm-soft)}
.fm-rm-arrow{font-size:1.4em;color:var(--fm-muted)}
.fm-rm-box{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(64px,26vw,150px);max-width:100%;box-sizing:border-box;height:64px;padding:0 12px;border:4px solid var(--fm-ink);border-radius:14px;background:repeating-linear-gradient(45deg,#e8eefb 0,#e8eefb 10px,#dbe5f7 10px,#dbe5f7 20px);font-weight:800;font-size:1.35em;letter-spacing:.02em}
.fm-rm-box.fm-rm-open{background:var(--fm-bg)}
.fm-rm-feed{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.fm-rm-chips{display:flex;flex-wrap:wrap;gap:8px}
.fm-rm-chip{min-width:48px}
.fm-rm-chip.fm-rm-done{border-style:dashed}
.fm-rm-msg{min-height:1.4em;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--fm-soft)}
.fm-rm-msg[hidden]{display:none}
.fm-rm-msg.fm-rm-good{border-left:6px solid #1f7a4d}
.fm-rm-msg.fm-rm-bad{border-left:6px dashed #b32a30}
.fm-rm-table{border-collapse:collapse;table-layout:fixed;width:min(100%,460px);background:var(--fm-bg)}
.fm-rm-table th,.fm-rm-table td{border:2px solid var(--fm-line);padding:6px 4px;text-align:center;font-weight:700;overflow-wrap:anywhere;word-break:break-word}
.fm-rm-table th{background:var(--fm-soft)}
.fm-rm-table td.fm-rm-empty{color:var(--fm-muted);font-weight:600}
.fm-rm-newest td{background:#fff9e0}
.fm-rm-fit{color:#1f7a4d}
.fm-rm-nofit{color:#b32a30;text-decoration:underline dotted}
.fm-rm-guess{display:flex;flex-direction:column;gap:10px;padding:10px;border:2px solid var(--fm-line);border-radius:14px;background:var(--fm-bg)}
.fm-rm-grow{display:flex;flex-direction:column;gap:6px}
.fm-rm-gtitle{font-weight:800}
.fm-rm-ops{display:flex;flex-wrap:wrap;gap:6px}
.fm-rm-op{flex:0 1 auto}
.fm-rm-acts{display:flex;flex-wrap:wrap;gap:10px}
.fm-rm-test,.fm-rm-feedbtn,.fm-rm-run{font-weight:800}
.fm-rm .fm-step{flex-wrap:wrap}

/* FMPlayer — five-minute math lesson player styles. Inline into a course's preview.html together with manipulatives.css. */
:root{
  --p-bg:#fff8ec; --p-card:#ffffff; --p-ink:#1f2a44; --p-muted:#56607a; --p-line:#ecd9ae;
  --p-accent:#1e5c93; --p-accent-soft:#e6f0fa; --p-good:#0f7a45; --p-good-bg:#dcf5e7; --p-hint:#8a5a00; --p-hint-bg:#fff0cf;
  --p-orange:#f28c1b;
}
html{-webkit-text-size-adjust:100%}
.fmp [hidden]{display:none!important}
body.fmp{margin:0;background:var(--p-bg);color:var(--p-ink);
  font-family:"Segoe UI Rounded","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:clamp(16px,2.3vmin,21px);line-height:1.45}
.fmp *{box-sizing:border-box}
.fmp-skip{position:absolute;left:-999px;top:0;background:#fff;padding:12px 16px;z-index:100;border:2px solid var(--p-accent)}
.fmp-skip:focus{left:8px;top:8px}
.fmp :focus-visible{outline:3px solid var(--p-accent);outline-offset:2px}
.fmp-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* header */
.fmp-header{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:64px;padding:6px 12px;background:#fff;border-bottom:2px solid var(--p-line)}
.fmp-title{margin:0 auto 0 0;font-size:clamp(17px,2.6vmin,24px);font-weight:800}
.fmp-seg{flex:0 0 auto;display:inline-flex;border:2px solid #d5c08f;border-radius:14px;overflow:hidden;background:#fff}
.fmp-seg button,.fmp-tool{min-height:44px;min-width:44px;border:0;background:#fff;color:var(--p-ink);font:inherit;font-weight:600;padding:6px 12px;cursor:pointer}
.fmp-seg button+button{border-left:2px solid #d5c08f}
.fmp-seg button[aria-pressed="true"]{background:var(--p-accent);color:#fff}
.fmp-tool{border:2px solid #d5c08f;border-radius:14px}
.fmp-tool[aria-pressed="true"]{background:var(--p-accent-soft);border-color:var(--p-accent)}
.fmp-stepline{display:flex;gap:10px;align-items:center;padding:6px 14px;color:var(--p-muted);font-weight:600}
.fmp-dots{display:flex;gap:6px}
.fmp-dots i{width:12px;height:12px;border-radius:50%;background:#ead9b0}
.fmp-dots i.on{background:var(--p-orange)} .fmp-dots i.cur{background:var(--p-accent);transform:scale(1.25)}

/* stage */
main.fmp-main{padding:6px 12px 96px}
.fmp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.fmp-left,.fmp-right{background:var(--p-card);border:2px solid var(--p-line);border-radius:20px;padding:14px}
.fmp-left{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;min-width:0}
.fmp-left:has(.fm-ar){justify-content:flex-start;padding-top:6px}   /* the array widget grows: keep its steppers fixed under the finger, don't re-centre (review F-05) */
.fmp-cap{color:var(--p-muted);font-size:.9em;text-align:center;margin:0}
/* .fmp-left's own min-width:0 is not enough on its own: .fmp-visual is itself a flex ITEM of .fmp-left and,
   like .fmp-left, defaults to min-width:auto (sized to its content), so a wide manipulative (e.g. a two-digit-
   column ArrayGrid) still forced the whole page into horizontal scroll even with .fm-root's own overflow-x:auto
   (confirmed by real portrait testing on area-model-multiply, up to 19 columns). Without this, .fm-root's own
   max-width:100% just matches an already-oversized parent, so it never actually has anything to clip or scroll. */
/* width:100% (review-found P0, FractionBar): .fmp-left's align-items:center means a flex item with no explicit
   cross-size shrink-wraps to its own content instead of stretching - harmless for every earlier widget (they
   size from fixed/intrinsic content: dot grids, fixed-size blocks), but FractionBar's bar is itself
   width:min(100%,520px), so with nothing concrete to resolve "100%" against it collapsed to a few px. Safe for
   existing widgets: max-width:100% already capped them, and their own intrinsic content width - not this
   element's width - is what determined their rendered size. */
.fmp-visual{min-width:0;max-width:100%;width:100%}
@media (min-width:900px) and (orientation:landscape){
  main.fmp-main{padding-bottom:8px}
  .fmp-grid{grid-template-columns:minmax(0,56fr) minmax(0,44fr);height:var(--stage-h,auto)}
  .fmp-left,.fmp-right{max-height:100%;overflow-y:auto}
  .fmp-left{position:relative}
}
@media (max-width:899px),(orientation:portrait){ .fmp-left{min-height:200px} }

/* right panel parts */
.fmp-panel-title{margin:0 0 6px;font-size:1.25em;font-weight:800}
.fmp-narr{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.fmp-narr svg{flex:0 0 auto;width:56px;height:56px}
.fmp-bubble{background:var(--p-accent-soft);border-radius:16px;padding:10px 14px;margin:0;flex:1 1 auto}
.fmp-bubble p{margin:0 0 6px} .fmp-bubble p:last-child{margin:0}
.fmp-q{font-weight:800;margin:6px 0 8px;font-size:1.05em}
.fmp-choices{display:grid;gap:8px;grid-template-columns:1fr}
.fmp-choice,.fmp-btn{min-height:52px;min-width:44px;padding:10px 16px;border:2px solid #cdbb8b;border-radius:16px;background:#fff;color:var(--p-ink);font:inherit;font-weight:700;text-align:left;cursor:pointer}
.fmp-choice:hover:not([aria-disabled="true"]),.fmp-btn:hover:not(:disabled){background:#fff6df;border-color:var(--p-accent)}
.fmp-choice[aria-disabled="true"]{cursor:default}
.fmp-choice.tried{opacity:.5;text-decoration:line-through}
.fmp-choice.chosen{border-color:var(--p-accent);background:var(--p-accent-soft);box-shadow:inset 0 0 0 2px var(--p-accent)}
.fmp-btn{text-align:center}
.fmp-btn.primary{background:var(--p-accent);border-color:var(--p-accent);color:#fff}
.fmp-btn.primary:hover:not(:disabled){background:#174a78}
.fmp-btn:disabled{opacity:.45;cursor:not-allowed}
.fmp-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fmp-fb{margin:10px 0;padding:10px 14px;border-radius:14px;font-weight:600}
.fmp-fb.good{background:var(--p-good-bg);color:#0b5a33}
.fmp-fb.hint{background:var(--p-hint-bg);color:var(--p-hint)}
.fmp-fb.info{background:var(--p-accent-soft);color:var(--p-ink)}
.fmp-fb p{margin:0 0 4px} .fmp-fb p:last-child{margin:0}
.fmp-sentence{font-size:1.15em;font-weight:800;margin:8px 0;line-height:1.7}
.fmp-blank{display:inline-block;min-width:2.4em;padding:0 8px;border-bottom:4px solid var(--p-accent);text-align:center;color:var(--p-accent)}
.fmp-blank.cur{background:#fff3c4}
.fmp-derived{border:3px solid var(--p-accent);border-radius:16px;padding:12px 14px;background:#fff;margin:10px 0;font-weight:800;color:var(--p-accent);font-size:1.15em}
.fmp-derived small{display:block;font-weight:600;color:var(--p-muted);margin-bottom:4px}
.fmp-status{color:var(--p-muted);font-weight:600;margin:8px 0}
.fmp-list{margin:6px 0 6px 1.2em;padding:0} .fmp-list li{margin:4px 0}
.fmp-cmp{display:grid;gap:8px;margin:10px 0} .fmp-cmp div{padding:10px 14px;border-radius:14px;background:#fff6df;font-weight:700}

/* start screen */
.fmp-start{max-width:820px;margin:0 auto;padding:18px 8px;text-align:center}
.fmp-start h1{margin:8px 0 4px;font-size:clamp(24px,4vmin,36px)}
.fmp-start p{color:var(--p-muted);margin:4px 0 14px}
.fmp-start svg{width:clamp(96px,18vmin,160px);height:auto}
.fmp-levels{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:14px 0;text-align:left}
.fmp-level{padding:14px;border:3px solid #cdbb8b;border-radius:18px;background:#fff;font:inherit;color:var(--p-ink);cursor:pointer;min-height:44px}
.fmp-level[aria-pressed="true"]{border-color:var(--p-accent);background:var(--p-accent-soft)}
.fmp-level b{display:block;font-size:1.1em;margin-bottom:4px;overflow-wrap:anywhere}
.fmp-level .fmp-lvl{display:block;font-weight:700;font-size:.85em;opacity:.8;margin-bottom:4px}

/* footer */
.fmp-footer{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 14px;background:#fff;border-top:2px solid var(--p-line)}
.fmp-footer .fmp-btn{min-width:120px;min-height:56px;font-size:1.05em}
.fmp-footer-msg{color:var(--p-muted);font-weight:600;text-align:center;flex:1 1 auto}
@media (max-width:899px),(orientation:portrait){ .fmp-footer-msg{display:none} }

/* self-test report */
.fmp-selftest{position:fixed;right:8px;top:72px;z-index:50;max-width:min(420px,92vw);padding:10px 14px;border-radius:12px;font-weight:700;background:#dcf5e7;color:#0b5a33;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.fmp-selftest.fail{background:#fde0e0;color:#8a1b1b}
.fmp-selftest pre{white-space:pre-wrap;font:12px/1.4 Consolas,monospace;margin:6px 0 0}

/* the one motion switch */
html.rm .fmp *,html.rm .fmp *::before,html.rm .fmp *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){ .fmp *,.fmp *::before,.fmp *::after{animation:none!important;transition:none!important} }

/* custom "covered box" picture used by hook scenes */
.fmp-boxes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.fmp-box{min-width:150px;padding:10px 12px;border:4px solid #b85f00;border-radius:16px;background:#fff3dd;text-align:center}
.fmp-box.lid{background:repeating-linear-gradient(45deg,#e39b00 0,#e39b00 14px,#f0a800 14px,#f0a800 28px);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2em;min-height:110px}
.fmp-box .apples{font-size:clamp(24px,4.4vmin,40px);line-height:1.2;letter-spacing:2px}
.fmp-box small{display:block;color:var(--p-muted);font-weight:700;margin-bottom:4px}
.fmp-total{font-weight:800;font-size:1.1em;text-align:center;margin:0 0 6px}

/* bigger touch-friendly manipulatives inside the lesson stage */
.fmp-left .fm-root{--fm-cell:clamp(52px,9vmin,84px);--fm-dot:clamp(24px,5vmin,42px)}

/* narrow / portrait: header is one compact row and scrolls away (never permanently >15% of the screen) */
.fmp-short{display:none}
@media (max-width:599px){ .fmp-long{display:none} .fmp-short{display:inline} .fmp-title{font-size:15px} .fmp-header{padding:4px 8px} .fmp-stepline{padding:4px 10px;font-size:.85em} }
@media (max-width:899px),(orientation:portrait){ .fmp-header{position:static} }

.fmp-stars{margin-left:auto;font-weight:800;color:#b85f00;white-space:nowrap}

/* who is playing (start screen) */
.fmp-who{margin:10px 0 6px}
.fmp-who-q{margin:0 0 6px;font-weight:800;color:var(--p-ink)}
.fmp-who-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.fmp-whobtn{min-width:104px;min-height:88px;border:3px solid #cdbb8b;border-radius:18px;background:#fff;color:var(--p-ink);font:inherit;font-weight:800;padding:6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.fmp-whobtn .wi{font-size:34px;line-height:1}
.fmp-whobtn small{font-weight:600;color:var(--p-muted)}
.fmp-whobtn[aria-pressed="true"]{border-color:var(--p-accent);background:var(--p-accent-soft);box-shadow:inset 0 0 0 2px var(--p-accent)}
.fmp-who-hint{color:var(--p-hint);font-weight:700;margin:6px 0 0}
.fmp-btn:disabled{cursor:not-allowed}
/* panel title row with the read-aloud button */
.fmp-panel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.fmp-panel-head .fmp-panel-title{margin:0;flex:1 1 auto}
.fmp-listen{white-space:nowrap}

/* landscape (tablet / laptop): the Start row stays at the bottom of the screen even when the start page is taller than the window
   (1280x720: Start used to sit under the fold). A short window also gets a tighter start page, so usually nothing needs scrolling at all. */
@media (min-width:900px) and (orientation:landscape){
  .fmp-start-act{position:sticky;bottom:0;z-index:10;background:var(--p-bg);padding:6px 0 10px;box-shadow:0 -10px 8px -6px var(--p-bg)}
}
@media (min-width:900px) and (orientation:landscape) and (max-height:820px){
  .fmp-start{padding-top:6px;padding-bottom:6px}
  .fmp-start svg{width:clamp(64px,11vmin,96px)}
  .fmp-start h1{margin:2px 0}
  .fmp-start p{margin:2px 0 8px}
  .fmp-levels{margin:8px 0;gap:8px}
  .fmp-level{padding:10px 14px}
  .fmp-who{margin:6px 0 4px}
  .fmp-whobtn{min-height:72px}
  .fmp-start .fmp-who-hint{margin:0 0 6px}
  .fmp-start-act .fmp-row{margin:4px 0}
  /* a little less air in the right column on a short window, so more of the question + answers + newest feedback fit without scrolling the column */
  .fmp-right{padding:10px 14px}
  .fmp-narr{margin:0 0 6px}
  .fmp-narr svg{width:44px;height:44px}
  .fmp-bubble{padding:8px 12px}
  .fmp-q{margin:4px 0 6px}
  .fmp-choices{gap:6px}
  .fmp-choice,.fmp-btn{min-height:48px;padding:8px 16px}
  .fmp-fb{margin:6px 0;padding:8px 12px}
  .fmp-row{margin:6px 0}
}

/* ======================================================================================================================
   PHONE / TABLET LAYOUT (A81, 2026-10-12)
   player.js sets  html[data-fmp-layout]  to one of
     wide    >= 900 px landscape: the two-column stage defined above (nothing below changes it, except short windows, see the end)
     split-v portrait (phones, iPad upright): the picture is pinned on top (scaled to fit), the question / feedback / buttons panel
             scrolls on its own underneath and keeps the newest feedback and its button row in view
     split-h landscape phone / small window (640-899 px): the same two columns as wide, picture left, panel right
     stack   fallback for very small windows or a picture that cannot be fitted: the one-column page of before
   ====================================================================================================================== */
html[data-fmp-layout="split-v"] main.fmp-main,html[data-fmp-layout="split-h"] main.fmp-main{padding:6px 8px 8px}
html[data-fmp-layout="split-v"] .fmp-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:8px;height:var(--stage-h,calc(100vh - 260px))}
html[data-fmp-layout="split-h"] .fmp-grid{grid-template-columns:minmax(0,56fr) minmax(0,44fr);gap:10px;height:var(--stage-h,calc(100vh - 200px))}
@supports (height:100dvh){
  html[data-fmp-layout="split-v"] .fmp-grid{height:var(--stage-h,calc(100dvh - 260px))}
  html[data-fmp-layout="split-h"] .fmp-grid{height:var(--stage-h,calc(100dvh - 200px))}
}
html[data-fmp-layout="split-v"] .fmp-left,html[data-fmp-layout="split-h"] .fmp-left,
html[data-fmp-layout="split-v"] .fmp-right,html[data-fmp-layout="split-h"] .fmp-right{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
html[data-fmp-layout="split-v"] .fmp-left{max-height:var(--pic-max,45%);padding:8px 8px;gap:6px}
html[data-fmp-layout="split-h"] .fmp-left{max-height:100%;padding:8px 8px;gap:6px}
html[data-fmp-layout="split-v"] .fmp-right,html[data-fmp-layout="split-h"] .fmp-right{max-height:100%;scroll-padding:8px;padding:10px 12px 12px}
/* the step caption that "Show me" also writes under the picture is repeated in the panel's newest feedback: not needed while the panel is right there */
html[data-fmp-layout="split-v"] .fmp-wkcap,html[data-fmp-layout="split-h"] .fmp-wkcap{display:none}
html[data-fmp-layout="split-v"] .fmp-left > *,html[data-fmp-layout="split-h"] .fmp-left > *{flex-shrink:0}
/* only the GRAPHIC parts of a picture are scaled to fit (player.js sets --fmp-fit); steppers, sliders, buttons and labels keep their real size,
   so every tap target stays >= 44 px */
html[data-fmp-layout="split-v"] .fmp-left .fm-pv-mat,html[data-fmp-layout="split-h"] .fmp-left .fm-pv-mat,
html[data-fmp-layout="split-v"] .fmp-left .fm-ar-grid,html[data-fmp-layout="split-h"] .fmp-left .fm-ar-grid,
html[data-fmp-layout="split-v"] .fmp-left .fm-ck-face,html[data-fmp-layout="split-h"] .fmp-left .fm-ck-face,
html[data-fmp-layout="split-v"] .fmp-left .fm-dg-grid,html[data-fmp-layout="split-h"] .fmp-left .fm-dg-grid,
html[data-fmp-layout="split-v"] .fmp-left .fm-cal-grid,html[data-fmp-layout="split-h"] .fmp-left .fm-cal-grid,
html[data-fmp-layout="split-v"] .fmp-left .fm-coin-row,html[data-fmp-layout="split-h"] .fmp-left .fm-coin-row,

   can never be scrolled to (count-how-many Stretch step 2 at large text, the 18-star ring, ...). "safe center" keeps the centring while the picture fits and starts at the top

    return { q: p[2] + ' ÷ ' + p[0] + ' = ?', expect: p[1], options: mk(p[1], [{ val: p[0], tag: 'other-division-fact' }, { val: p[2] - p[0], tag: 'subtracts-instead' }], 1 + (i % 2)), reveal: p[0] + ' × ' + p[1] + ' = ' + p[2] + ', so ' + p[2] + ' ÷ ' + p[0] + ' = ' + p[1] + '.' };
  });
  var A_w4 = [[42, 7, 6], [36, 4, 9], [40, 8, 5]].map(function (p, i) {
    rec('A warm4.' + i, p[2], p[0] / p[1]); NEG.push(p[0] - p[1]);
    return { q: p[0] + ' flowers are put in vases with ' + p[1] + ' in each vase. How many vases?', expect: p[2], options: mk(p[2], [{ val: p[1], tag: 'other-division-fact' }, { val: p[0] - p[1], tag: 'subtracts-instead' }], 1 + (i % 2)), reveal: p[2] + ' × ' + p[1] + ' = ' + p[0] + ', so ' + p[0] + ' ÷ ' + p[1] + ' = ' + p[2] + '.' };
  });
  var A_warm = [{ variants: A_w1 }, { variants: A_w2 }, { variants: A_w3 }, { variants: A_w4 }];
  A_warm.forEach(function (w) { w.hints = ['Think about the fact family: the same three numbers.', 'Division undoes multiplication.']; });

  /* ================= Level B (about age 8-9): use the inverse as a tool — check, and find missing numbers ================= */
  /* teaching scenes use 42-6-7 (s1-s3), 40-5-7 (s4), 45-5-9 (s5); transfer pool totals: 63, 72, 84 */
  var B_tv = [
    { kind: 'miss', a: 7, c: 63, q: '7 × ? = 63. What number goes in the box?', pos: 1 },
    { kind: 'claim', a: 9, c: 72, claim: 7, q: 'Ana says 72 ÷ 9 = 7. What is the true answer?', pos: 2 },
    { kind: 'story', a: 12, c: 84, q: 'A farmer packs 84 eggs into boxes of 12. How many boxes does he need?', pos: 1 }
  ];
  var B_transfer = B_tv.map(function (v, i) {
    var want = v.c / v.a, wrongs;
    if (v.kind === 'miss') wrongs = [{ val: v.c - v.a, tag: 'subtracts-instead', nudge: 'Subtracting does not undo multiplication. Ask: ' + v.a + ' times what makes ' + v.c + '?' }, { val: v.c + v.a, tag: 'adds-instead', nudge: 'Adding does not undo multiplication. Use division: ' + v.c + ' ÷ ' + v.a + '.' }];
    else if (v.kind === 'claim') wrongs = [{ val: v.claim, tag: 'trusts-unchecked', nudge: 'Check it: 7 × 9 = 63, not 72. Ana’s answer does not check.' }, { val: v.c / want, tag: 'other-division-fact', nudge: 'That answers 72 ÷ 8, a different division. Multiply back to check which number works with 9.' }];
    else wrongs = [{ val: v.a, tag: 'copies-number', nudge: 'That is how many eggs fit in one box. How many boxes hold ' + v.c + '?' }, { val: v.c - v.a, tag: 'subtracts-instead', nudge: 'Subtracting does not undo multiplication. ' + v.a + ' times what makes ' + v.c + '?' }];
    rec('B transfer ' + i, want, [9, 8, 7][i]);   /* hand-computed: 63/7, 72/9, 84/12 */ wrongs.forEach(function (w) { NEG.push(w.val); });
    return {
      q: v.q, expect: want, options: mk(want, wrongs, v.pos),
      hints: [v.kind === 'claim' ? 'Multiply Ana’s answer by 9 and see whether you get 72.' : 'Turn it into a division and check by multiplying back.', v.kind === 'miss' ? 'Division undoes multiplication: ' + v.c + ' ÷ ' + v.a + '.' : 'Build a tray with ' + v.a + ' in each row if it helps, and stop at ' + v.c + '.'],
      reveal: v.a + ' × ' + want + ' = ' + v.c + ', so ' + v.c + ' ÷ ' + v.a + ' = ' + want + '.',
      worked: function (w) { w.set({ rows: Math.min(v.a, want), cols: Math.max(v.a, want) }); }   /* rows <= 8 (the tool's max) */
    };
  });
  var B_explain = B_tv.map(function (v, i) {
    var want = v.c / v.a, r0, r1, r2, slotAns;
    if (v.kind === 'miss') { r0 = { tag: 'multiplies-instead', nudge: 'Multiplying does not undo multiplication. Divide instead.', t: 'I multiplied ' + v.c + ' by ' + v.a + ' to find the missing part' }; r1 = 'I did ' + v.c + ' ÷ ' + v.a + ', which undoes the multiplication'; r2 = { tag: 'irrelevant-reason', nudge: 'That may be true, but it does not help find the missing number.', t: 'the numbers are big, so the answer must be big too' }; }
    else if (v.kind === 'claim') { r0 = { tag: 'trusts-unchecked', nudge: 'A good reason checks the answer by multiplying back.', t: 'Ana is usually right, so I trusted Ana’s answer' }; r1 = 'when I multiply back, 8 × 9 = 72 but 7 × 9 = 63'; r2 = { tag: 'adds-instead', nudge: 'Adding does not check a division.', t: 'I added 72 and 9 to check the division answer' }; }
    else { r0 = { tag: 'multiplies-instead', nudge: 'That multiplies instead of dividing.', t: 'I multiplied ' + v.c + ' by ' + v.a }; r1 = v.a + ' × ' + want + ' = ' + v.c; r2 = { tag: 'irrelevant-reason', nudge: 'That may be true, but it does not help find how many boxes.', t: 'eggs come in boxes' }; }
    var so = v.kind === 'miss' ? 'the missing number is ' : v.kind === 'claim' ? 'the true answer is ' : 'he needs ';
    var end = v.kind === 'story' ? ' boxes' : '';
    var w1 = v.kind === 'miss' ? [{ val: v.c + v.a, tag: 'adds-instead', nudge: 'That adds. Use the division from your reason.' }, { val: v.c - v.a, tag: 'subtracts-instead', nudge: 'That subtracts. Use the division from your reason.' }] : v.kind === 'claim' ? [{ val: v.claim, tag: 'trusts-unchecked', nudge: 'That is Ana’s answer, and it did not check.' }, { val: v.c / want, tag: 'other-division-fact', nudge: 'That answers 72 ÷ 8. Here we divided by 9.' }] : [{ val: v.a, tag: 'copies-number', nudge: 'That is the number in one box. How many boxes?' }, { val: v.c - v.a, tag: 'subtracts-instead', nudge: 'That subtracts. Use the multiplication fact from your reason.' }];
    return {
      template: 'Because {0}, {1}.',
      slots: [
        { q: 'Why?', options: [txt({ id: 'r0', tag: r0.tag, nudge: r0.nudge }, r0.t), txt({ id: 'r1', ok: true }, r1), txt({ id: 'r2', tag: r2.tag, nudge: r2.nudge }, r2.t)] },
        { q: 'So what is the answer?', options: [
          txt({ id: 'c0', tag: w1[0].tag, nudge: w1[0].nudge, val: w1[0].val }, so + w1[0].val + end),
          txt({ id: 'c1', ok: true, val: want }, so + want + end),
          txt({ id: 'c2', tag: w1[1].tag, nudge: w1[1].nudge, val: w1[1].val }, so + w1[1].val + end)
        ] }
      ]
    };
  });

  var B_scenes = [
    { id: 's1', kind: 'choice', predict: true, name: 'Guess first', time: '0:00',
      narr: 'Cou-Cou worked out 42 ÷ 6 = 7. He wants to be sure, and he wants to check using multiplication.',
      visual: { type: 'mascot' },
      q: 'Which check do you think will work?',
      options: [{ id: 'a', text: '7 + 6' }, { id: 'b', text: '7 × 6' }, { id: 'c', text: '42 × 6' }],
      afterPredict: 'Let’s build a tray and see what checks the answer.' },

    { id: 's2', kind: 'explore', name: 'Build the check', time: '0:50',
      narr: 'Cou-Cou says 42 ÷ 6 = 7. Make 6 rows with 7 in each row and look at the total.',
      visual: buildFree({}),
      task: 'Make 6 rows of 7. Does the tray show 42?',
      hints: ['Use the Rows + and Columns + buttons to reach 6 rows and 7 in each row.', 'Watch the total at the bottom. What should it say for the answer to be right?'],
      check: function (st, r) {
        var done = st.rows === 6 && st.cols === 7;
        if (!done && r.done) return { done: false, status: 'You already reached the goal. Press Next when you are ready.' };   /* keep the completion latched (no repeated events) but never show a stale hint */
        return { done: done, status: done ? null : rw(st.rows) + ' of ' + st.cols + ' = ' + (st.rows * st.cols) + '. Aim for 6 rows of 7.' };
      },
      success: function () { return '6 rows of 7 make 42. Multiplying the answer back gives the number you started with, so 42 ÷ 6 = 7 checks out.'; } },

    { id: 's3', kind: 'story', name: 'A check that catches a mistake', time: '1:50',
      narr: 'A check is only useful if it can catch a wrong answer. Tap “Next step” when you are ready.',
      visual: grid(6, 8, { caption: 'A tray to test an answer.' }),
      steps: [
        { caption: 'Suppose Cou-Cou had said 42 ÷ 6 = 8. Check by multiplying back: 6 rows of 8.', apply: function (w) { w.set({ rows: 6, cols: 8 }); } },
        { caption: '6 × 8 = 48. That is not 42, so 8 cannot be right.', apply: function (w) { w.set({ rows: 6, cols: 8 }); } },
        { caption: 'Try 7: 6 rows of 7 is 42. It checks, so 42 ÷ 6 = 7. Multiplying back always tests a division.', apply: function (w) { w.set({ rows: 6, cols: 7 }); } }
      ] },

    { id: 's4', kind: 'choice', name: 'Read the check', time: '2:40',
      narr: 'Mia says 40 ÷ 5 = 7. She checks by multiplying: 7 × 5.',
      visual: { type: 'mascot' },
      q: 'What does her check show?',
      options: tx('k', 'It equals 35, not 40, so her answer is wrong', null, [
        { t: 'It equals 40, so her answer is right', tag: 'wrong-check', nudge: 'Work it out: 7 × 5. Does it really get back to 40?' },
        { t: 'It equals 12, so her answer is right', tag: 'adds-instead', nudge: '12 is 7 + 5. The check is 7 × 5, not 7 + 5.' }
      ], 1),
      hints: ['Work out 7 × 5. Then compare it with the number Mia started with: 40.', 'If multiplying back does not give 40, the division was wrong.'],
      reveal: '7 × 5 = 35, not 40. The check does not get back to 40, so 7 is wrong (40 ÷ 5 is 8).' },

    { id: 's5', kind: 'fill', name: 'Divide, then check', time: '3:20',
      narr: 'Count the dots. Then divide, and check your answer by multiplying.',
      visual: grid(5, 9, { caption: 'Count the dots.', opts: { rows: 5, cols: 9, mode: 'display', label: 'An array of dots, arranged in equal rows.' } }),
      template: '{0} ÷ 5 = {1}. Check: {2} × 5 = {3}.',
      slots: [
        { q: 'How many dots in all?', options: mk(45, [{ val: 5, tag: 'confuses-rows-and-each', nudge: 'That is the number of rows, not the total.' }, { val: 9, tag: 'confuses-rows-and-each', nudge: 'That is how many are in one row, not the total.' }], 2) },
        { q: 'What is that total ÷ 5?', options: mk(9, [{ val: 5, tag: 'copies-number', nudge: 'That is the number you divided by. What is 45 shared into 5 rows?' }, { val: 40, tag: 'subtracts-instead', nudge: 'That subtracts. Division undoes multiplication: 5 times what makes 45?' }], 1) },
        { q: 'To check, multiply your answer by 5. Which number do you multiply?', options: mk(9, [{ val: 45, tag: 'total-as-factor', nudge: 'The total is what the check should equal, not what you multiply.' }, { val: 14, tag: 'adds-instead', nudge: 'Check by multiplying your answer, not adding numbers.' }], 2) },
        { q: 'What should the check equal, if the answer is right?', options: mk(45, [{ val: 9, tag: 'wrong-check', nudge: 'A right check gets back to the number you started with.' }, { val: 14, tag: 'adds-instead', nudge: 'That adds 9 + 5. Multiplying back gets you to the starting total.' }], 1) }
      ],
      hints: ['Count all the dots first, then divide by the number of rows.', 'The check goes back the other way: your answer × 5 should equal the number you started with.'],
      reveal: '45 ÷ 5 = 9, and 9 × 5 = 45 — the check gets back to the total.' },

    { id: 's6', kind: 'choice', role: 'transfer', name: 'New numbers', time: '4:00',
      narr: 'New numbers and new stories. Build a tray if you like.',
      visual: tool(),
      variants: B_transfer },

    { id: 's7', kind: 'fill', name: 'Because … so …', time: '4:30', syncVariant: 's6',
      narr: 'Explain your answer: pick a reason, then the answer that follows.',
      visual: { type: 'mascot' },
      variants: B_explain,
      hints: ['Think about which multiplication fact goes with the division.', 'A good reason multiplies back, or names the fact that matches.'],
      reveal: 'That is a full explanation.' }
  ];

  /* Level B warm-up (mascot only) */
  var B_w1 = [[4, 9, 36], [7, 6, 42], [9, 8, 72]].map(function (p, i) {
    rec('B warm1.' + i, p[1], p[2] / p[0]); NEG.push(p[2] - p[0], p[2] + p[0]);
    return { q: p[0] + ' × ? = ' + p[2] + '. What is the missing number?', expect: p[1], options: mk(p[1], [{ val: p[2] - p[0], tag: 'subtracts-instead' }, { val: p[2] + p[0], tag: 'adds-instead' }], 1 + (i % 2)), reveal: p[2] + ' ÷ ' + p[0] + ' = ' + p[1] + ', so ' + p[0] + ' × ' + p[1] + ' = ' + p[2] + '.' };
  });
  var B_w2 = [[54, 9, 6], [48, 6, 8], [35, 5, 7]].map(function (p, i) {
    rec('B warm2.' + i, p[2] * p[1], p[0]);
    return { q: 'Which multiplication checks ' + p[0] + ' ÷ ' + p[1] + ' = ' + p[2] + '?', options: tx('m', p[2] + ' × ' + p[1] + ' = ' + p[0], null, [
      { t: p[2] + ' + ' + p[1] + ' = ' + (p[2] + p[1]), tag: 'adds-instead' },
      { t: p[0] + ' × ' + p[1] + ' = ' + (p[0] * p[1]), tag: 'wrong-check' }
    ], 1 + (i % 2)), reveal: p[2] + ' × ' + p[1] + ' = ' + p[0] + ' gets back to the number you started with.' };
  });
  var B_w3 = [
    { c: 63, a: 7, say: 8, real: 9 },
    { c: 45, a: 5, say: 9, real: 9 },
    { c: 56, a: 7, say: 9, real: 8 }
  ].map(function (v, i) {
    var right = v.say === v.real; rec('B warm3.' + i, v.say * v.a === v.c, right);
    var okT = right ? 'Yes, because ' + v.say + ' × ' + v.a + ' = ' + v.c : 'No, because ' + v.say + ' × ' + v.a + ' = ' + (v.say * v.a) + ', not ' + v.c;
    var w1 = right ? { t: 'No, because ' + v.say + ' × ' + v.a + ' = ' + v.c, tag: 'wrong-check' } : { t: 'Yes, because ' + v.say + ' × ' + v.a + ' = ' + v.c, tag: 'wrong-check' };
    var w2 = right ? { t: 'No, because ' + v.c + ' − ' + v.a + ' = ' + (v.c - v.a), tag: 'subtracts-instead' } : { t: 'Yes, because Kim usually gets these right', tag: 'trusts-unchecked' };
    NEG.push(v.c - v.a);
    return { q: 'Kim says ' + v.c + ' ÷ ' + v.a + ' = ' + v.say + '. Is Kim right?', options: tx('c', okT, null, [w1, w2], 1 + (i % 2)), reveal: v.a + ' × ' + v.real + ' = ' + v.c + ', so ' + v.c + ' ÷ ' + v.a + ' = ' + v.real + (right ? ' — Kim is right.' : ' — Kim’s answer does not check.') };
  });
  var B_w4 = [[32, 4, 8], [54, 9, 6], [63, 9, 7]].map(function (p, i) {
    rec('B warm4.' + i, p[2], p[0] / p[1]); NEG.push(p[0] - p[1]);
    return { q: p[0] + ' cards are dealt equally to ' + p[1] + ' players. How many cards does each player get?', expect: p[2], options: mk(p[2], [{ val: p[1], tag: 'counts-groups-not-each' }, { val: p[0] - p[1], tag: 'subtracts-instead' }], 1 + (i % 2)), reveal: p[1] + ' × ' + p[2] + ' = ' + p[0] + ', so ' + p[0] + ' ÷ ' + p[1] + ' = ' + p[2] + '.' };
  });
  var B_warm = [{ variants: B_w1 }, { variants: B_w2 }, { variants: B_w3 }, { variants: B_w4 }];
  B_warm.forEach(function (w) { w.hints = ['Multiply back to test an answer.', 'Division undoes multiplication.']; });

  /* ---------- independent re-derivation with plain arithmetic (not FMMath) ---------- */
  function selfCheck() {
    var problems = [];
    CHECKS.forEach(function (c) { if (c.ok !== c.want) problems.push(c.label + ': builder value ' + c.ok + ' but plain arithmetic says ' + c.want); });
    [[A_tv, A_transfer, 'A'], [B_tv, B_transfer, 'B']].forEach(function (t) {
      t[0].forEach(function (v, i) {
        if (v.c % v.a !== 0) problems.push(t[2] + ' transfer ' + i + ': ' + v.c + ' does not divide by ' + v.a);
        if (v.b != null && v.a * v.b !== v.c) problems.push(t[2] + ' transfer ' + i + ': ' + v.a + ' × ' + v.b + ' is not ' + v.c);
        var okv = t[1][i].options.filter(function (o) { return o.ok; })[0], want = v.ans != null ? v.ans : v.c / v.a;
        if (okv.val !== want) problems.push(t[2] + ' transfer ' + i + ': expected ' + want + ' got ' + okv.val);
        if (M.arrayTotal(v.a, v.b != null ? v.b : v.c / v.a) !== v.c) problems.push(t[2] + ' transfer ' + i + ': FMMath.arrayTotal disagrees');
      });
    });
    NEG.forEach(function (n) { if (!(n >= 0)) problems.push('a distractor value is negative or not a number: ' + n); });
    /* anti-spoiler: teaching totals (12,30,16 / 42,40,45) must not be transfer totals (28,54,24 / 63,72,84) */
    var teachA = [12, 30, 16], teachB = [42, 40, 45];
    A_tv.forEach(function (v) { if (teachA.indexOf(v.c) >= 0) problems.push('A transfer total ' + v.c + ' was already shown in a teaching scene'); });
    B_tv.forEach(function (v) { if (teachB.indexOf(v.c) >= 0) problems.push('B transfer total ' + v.c + ' was already shown in a teaching scene'); });
    /* explain scenes: every "ok" reason must mention numbers that are true */
    A_tv.forEach(function (v, i) { var t = A_explain[i].slots[0].options[1].text; if (t.indexOf(String(v.c)) < 0) problems.push('A explain ' + i + ': reason does not mention the total'); });
    return problems;
  }

  return {
    id: 'mult-div-inverse', lessonId: 'math.g3.mult-div-inverse', langs: ['en'], title: 'Cou-Cou’s Fact Family',
    blurb: 'Discover that one tray tells four number stories — and that division undoes multiplication.',
    levels: {
      A: { levelLabel: 'Level 3', label: 'A fact family', desc: 'One multiplication fact gives you division facts for free.' },
      B: { levelLabel: 'Level 3', label: 'Check and find', desc: 'Use multiplication to check a division and to find a missing number.' }
    },
    scenes: { A: A_scenes, B: B_scenes }, warmup: { A: A_warm, B: B_warm },
    summary: { predict: 's1', explain: 's7', teaser: 'What if the numbers do not share out evenly — what about 22 ÷ 5? Where do the leftovers go?' },
    parent: {
      goal: 'Multiplication and division are opposites that undo each other. 3 × 4 = 12 gives the whole fact family: 4 × 3 = 12, 12 ÷ 3 = 4 and 12 ÷ 4 = 3 — the same three numbers. Because of this, you can solve a division by asking “what times this makes that?”, and you can check a division by multiplying the answer back. Tip: read each question aloud to your child, or tap “Read to me” on the page.',
      questions: [
        'If you know 6 × 7 = 42, what other facts do you know for free?',
        'Someone says 35 ÷ 5 = 6. How could you check that without dividing again?',
        'How is finding “7 × ? = 63” the same as solving 63 ÷ 7? (Stretch)'
      ],
      tags: TAGS, report: K.report(TAGS, 'how multiplication and division undo each other (fact families)')
    },
    selfCheck: selfCheck
  };
})();
