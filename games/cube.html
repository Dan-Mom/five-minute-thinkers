<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src 'self' blob: data:; font-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>Little Cube Quest</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-column "lesson desk" — sticky header, page sections swap; bottom tab bar on phones, top tabs on desktop. Cube sticker colors are the palette. */
:root {
  --bg: #EDF1F5;
  --surface: #FFFFFF;
  --surface-2: #E2E8EF;
  --ink: #17212C;
  --muted: #5A6777;
  --line: #CDD6E0;
  --go: #11864F;
  --go-ink: #FFFFFF;
  --go-soft: #D8F1E3;
  --sun: #FFC72C;
  --sun-soft: #FFF1C7;
  --warn: #C4362F;
  --warn-soft: #FBE1DF;
  --st-W: #F6F6F0; --st-Y: #FFD500; --st-G: #009B48; --st-R: #C41E3A; --st-B: #0046AD; --st-O: #FF5800;
  --plastic: #16181C;
  --shadow: 0 1px 0 rgba(23,33,44,.06), 0 6px 18px rgba(23,33,44,.07);
  --f-display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --f-note: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151C; --surface: #18212B; --surface-2: #222D39; --ink: #EEF3F8; --muted: #9DAAB8; --line: #2E3A48;
    --go: #2DBE78; --go-ink: #07160E; --go-soft: #173828; --sun: #FFD453; --sun-soft: #3A3115; --warn: #FF7A70; --warn-soft: #3D1D1B;
    --plastic: #0A0B0D; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151C; --surface: #18212B; --surface-2: #222D39; --ink: #EEF3F8; --muted: #9DAAB8; --line: #2E3A48;
  --go: #2DBE78; --go-ink: #07160E; --go-soft: #173828; --sun: #FFD453; --sun-soft: #3A3115; --warn: #FF7A70; --warn-soft: #3D1D1B;
  --plastic: #0A0B0D; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.sub { display: block; font-family: var(--f-note); font-size: .78em; color: var(--muted); line-height: 1.35; font-weight: 400; }
.inl .sub, .sub.inl { display: inline; margin-left: .4em; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.2; }
.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 0 110px; }
/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; background: var(--plastic); border-radius: 9px; flex: none; }
.logo i { border-radius: 2px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: 1.35rem; }
.brand .sub { font-size: .75rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--sun-soft); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 1.2rem; flex: none; }
/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(var(--ntabs, 5), 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { border: 0; background: none; padding: 8px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 62px; font-size: .78rem; font-weight: 500; }
.tab .ic { font-size: 1.35rem; line-height: 1.1; }
.tab .sub { font-size: .66rem; }
.tab[aria-selected="true"] { color: var(--go); }
.tab[aria-selected="true"] .ic { transform: translateY(-1px) scale(1.12); }
@media (min-width: 820px) {
  .tabs { position: static; display: flex; gap: 6px; background: none; border: 0; max-width: 1000px; margin: 0 auto; padding: 10px 16px 0; }
  .tab { flex-direction: row; gap: 8px; min-height: 0; padding: 10px 16px; border-radius: 999px; }
  .tab .sub { font-size: .75rem; }
  .tab[aria-selected="true"] { background: var(--go); color: var(--go-ink); }
  .tab[aria-selected="true"] .sub { color: inherit; opacity: .85; }
  .wrap { padding-block-end: 48px; }
}
.page { padding-top: 18px; display: grid; gap: 18px; }
.page > * { min-width: 0; }
.ptitle { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ptitle h2 { font-size: 1.7rem; }
/* cards */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.btn { border: 0; border-radius: 14px; padding: 12px 18px; min-height: 48px; font-weight: 700; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn .sub { font-weight: 500; color: inherit; opacity: .75; }
.btn.go { background: var(--go); color: var(--go-ink); }
.btn.big { font-size: 1.25rem; padding: 16px 24px; min-height: 64px; width: 100%; border-radius: 18px; }
.btn.warn { background: var(--warn); color: #fff; }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 8px 14px; min-height: 42px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); color: var(--go); }
/* stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); min-width: 0; }
.stat b { display: block; font-size: 1.7rem; font-family: var(--f-note); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .85rem; }
.stat .sub { font-size: .7rem; }
.bar { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--go); border-radius: 99px; transition: width .4s; }
/* day card */
.day { display: grid; gap: 14px; }
.day-h { display: flex; gap: 12px; align-items: flex-start; }
.wk { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-family: var(--f-note); font-weight: 800; color: #fff; line-height: 1; text-align: center; font-size: .72rem; }
.wk b { font-size: 1.35rem; display: block; }
.wk.lt { color: #17212C; }
.day-h h3 { font-size: 1.5rem; }
.day-h .meta { font-size: .85rem; color: var(--muted); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; counter-increment: s; }
.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-family: var(--f-note); font-size: .95rem; }
.steps li > div { min-width: 0; }
.algs { display: grid; gap: 10px; }
.alg { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.alg .nt { flex: 1 1 200px; min-width: 0; }
.notation { font-family: var(--f-note); font-weight: 800; font-size: 1.45rem; letter-spacing: .02em; word-spacing: .18em; overflow-wrap: anywhere; }
.alg .nm { font-size: .9rem; }
.reps { display: flex; gap: 10px; align-items: center; background: var(--sun-soft); border-radius: 14px; padding: 10px 14px; font-weight: 500; }
.reps .ic, .tip .ic { font-size: 1.4rem; flex: none; }
.tip { display: flex; gap: 10px; align-items: flex-start; border: 2px dashed var(--line); border-radius: 14px; padding: 10px 14px; font-size: .95rem; }
.tip strong { font-weight: 700; }
.done-stamp { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 14px; border-radius: 18px; background: var(--go-soft); color: var(--go); font-weight: 800; font-size: 1.15rem; }
.lockmsg { text-align: center; padding: 14px; border-radius: 16px; background: var(--surface-2); color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 16px; background: var(--go-soft); }
.banner .ic { font-size: 2rem; }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 6px; font-size: .9rem; }
/* habits */
.habitline { border: 0; text-align: left; display: flex; gap: 8px; align-items: flex-start; background: var(--go-soft); border-radius: 14px; padding: 10px 14px; font-size: .95rem; width: 100%; }
.habitline strong { color: var(--go); }
.cfop { margin-top: 4px; font-size: .85rem; }
.cfop b { font-family: var(--f-note); }
.habits-entry { border: 0; display: flex; gap: 12px; align-items: center; width: 100%; }
.habits-entry .ic { font-size: 2rem; flex: none; }
.habits { display: grid; gap: 12px; }
@media (min-width: 820px) { .habits { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.habit { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px 12px; align-items: start; }
.habit .em { font-size: 2rem; line-height: 1.1; }
.habit h3 { font-size: 1.15rem; }
.habit p { margin: 6px 0 0; font-size: .92rem; }
.habit.on { box-shadow: 0 0 0 3px var(--go) inset, var(--shadow); }
.hcheck { grid-column: 2; justify-self: start; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 12px 6px 6px; display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 700; min-height: 44px; }
.hcheck .sub { display: inline; }
.hcheck .box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; color: var(--go-ink); }
.hcheck[aria-checked="true"] { border-color: var(--go); }
.hcheck[aria-checked="true"] .box { background: var(--go); border-color: var(--go); }
.nextsteps { display: grid; gap: 12px; }
/* course */
.week { display: grid; gap: 12px; }
.week-h { display: flex; align-items: center; gap: 12px; }
.week-h > div:not(.wk) { flex: 1; min-width: 0; }
.week-h h3 { font-size: 1.25rem; }
.week-h .goal { font-size: .9rem; color: var(--muted); }
.week-p { display: flex; align-items: center; gap: 10px; font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.week-p .bar { flex: 1; }
.dgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dt { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 2px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--f-note); }
.dt b { font-size: 1.15rem; font-weight: 800; line-height: 1; }
.dt small { font-size: .7rem; color: var(--muted); }
.dt.done { background: var(--go); border-color: var(--go); color: var(--go-ink); }
.dt.done small { color: inherit; }
.dt.cur { border-color: var(--sun); background: var(--sun-soft); box-shadow: 0 0 0 3px var(--sun) inset; }
.dt.locked { opacity: .5; }
.toggle { display: inline-flex; align-items: center; gap: 10px; border: 0; background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 6px; box-shadow: var(--shadow); font-size: .9rem; }
.toggle .sw { width: 42px; height: 26px; border-radius: 99px; background: var(--surface-2); position: relative; transition: background .2s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.toggle[aria-checked="true"] .sw { background: var(--go); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(16px); }
/* viewer */
.viewer { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.viewer > *, .tgrid > * { min-width: 0; }
@media (min-width: 820px) { .viewer { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; } }
.stage-card { padding: 12px; display: grid; gap: 10px; }
.stage { position: relative; width: 100%; aspect-ratio: 1 / 0.9; max-width: 100%; perspective: 1000px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; border-radius: 14px; background: radial-gradient(circle at 50% 40%, var(--surface) 0%, var(--surface-2) 100%); overflow: hidden; }
.stage:active { cursor: grabbing; }
.scene { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.cubie { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.fc { position: absolute; background: var(--plastic); backface-visibility: hidden; }
.fc > i { position: absolute; inset: 6%; border-radius: 12%; }
.st-W { background: var(--st-W); } .st-Y { background: var(--st-Y); } .st-G { background: var(--st-G); }
.st-R { background: var(--st-R); } .st-B { background: var(--st-B); } .st-O { background: var(--st-O); }
.stage-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.hint { font-size: .8rem; color: var(--muted); }
.movebox { display: flex; gap: 14px; align-items: center; background: var(--sun-soft); border-radius: 16px; padding: 12px 14px; min-height: 84px; }
.movebox .big { font-family: var(--f-note); font-weight: 800; font-size: 2.4rem; min-width: 64px; text-align: center; line-height: 1; }
.movebox .arrow { font-size: 1.6rem; }
.movebox > div:last-child { min-width: 0; }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; }
.tok { font-family: var(--f-note); font-weight: 800; font-size: 1.35rem; min-width: 44px; padding: 6px 8px; text-align: center; border-radius: 10px; background: var(--surface-2); transition: background .15s, transform .15s; }
.tok.past { color: var(--muted); }
.tok.now { background: var(--sun); color: #17212C; transform: translateY(-2px); }
.ctrls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ctrls .btn { padding: 8px 4px; font-size: 1.3rem; min-height: 56px; flex-direction: column; gap: 0; }
.ctrls .btn .sub { font-size: .65rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > label { font-weight: 700; font-size: .95rem; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.stepper button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--surface); font-size: 1.2rem; font-weight: 800; }
.stepper output { min-width: 44px; text-align: center; font-weight: 800; font-family: var(--f-note); font-variant-numeric: tabular-nums; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: .95rem; }
.check input { width: 22px; height: 22px; accent-color: var(--go); }
.custom { display: flex; gap: 8px; }
.custom input { flex: 1; min-width: 0; font: 700 1.1rem var(--f-note); padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.err { color: var(--warn); font-size: .9rem; }
.lib { display: grid; gap: 14px; }
@media (min-width: 820px) { .lib { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.lib h4 { margin: 0 0 6px; font-size: 1rem; font-family: var(--f-display); font-weight: 400; }
.lib-list { display: grid; gap: 6px; }
.lib-item { border: 2px solid transparent; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; text-align: left; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.lib-item > span:first-child { min-width: 0; }
.lib-item .notation { font-size: 1rem; }
.lib-item .tag { flex: none; font-size: .75rem; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: var(--surface); }
.lib-item.on { border-color: var(--go); background: var(--go-soft); }
/* timer */
.pad { width: 100%; border: 0; border-radius: 24px; min-height: 230px; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; touch-action: none; user-select: none; -webkit-user-select: none; padding: 16px; }
.pad .time { font-family: var(--f-note); font-weight: 800; font-size: clamp(3.2rem, 15vw, 6rem); font-variant-numeric: tabular-nums; line-height: 1; }
.pad .say { font-size: 1rem; }
.pad.holding { background: var(--warn-soft); }
.pad.holding .time { color: var(--warn); }
.pad.ready { background: var(--go-soft); }
.pad.ready .time { color: var(--go); }
.pad.running .time { color: var(--ink); }
.scr { display: grid; gap: 8px; }
.scr .notation { font-size: clamp(1.3rem, 5vw, 1.9rem); line-height: 1.4; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 420px; overflow-y: auto; }
.hist li { display: grid; grid-template-columns: 36px 1fr auto 40px; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 6px 8px; font-variant-numeric: tabular-nums; }
.hist li .n { color: var(--muted); font-size: .85rem; text-align: center; }
.hist li .t { font-family: var(--f-note); font-weight: 800; font-size: 1.15rem; }
.hist li .d { font-size: .78rem; color: var(--muted); }
.hist li.pb { background: var(--sun-soft); }
.hist li button { width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--surface); font-size: 1rem; }
.empty { text-align: center; color: var(--muted); padding: 18px; }
.tgrid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .tgrid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; } }
/* badges */
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 12px; text-align: center; display: grid; gap: 4px; align-content: start; position: relative; }
.badge .em { font-size: 2.8rem; line-height: 1.1; }
.badge .bn { font-family: var(--f-display); font-size: 1.1rem; }
.badge .cond { font-size: .78rem; color: var(--muted); }
.badge.locked .em { filter: grayscale(1); opacity: .35; }
.badge.locked .bn { color: var(--muted); }
.badge .lk { position: absolute; top: 8px; right: 10px; font-size: .9rem; }
.badge .when { font-size: .72rem; color: var(--go); font-weight: 700; }
/* modal & toast */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,15,20,.55); display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--bg); border-radius: 22px; width: 100%; max-width: 560px; max-height: calc(100% - 20px); overflow-y: auto; padding: 18px; display: grid; gap: 14px; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-h h3 { font-size: 1.35rem; }
.pop { text-align: center; }
.pop .em { font-size: 5rem; line-height: 1.1; animation: bounce .9s ease both; }
@keyframes bounce { 0% { transform: scale(.2) rotate(-20deg); } 60% { transform: scale(1.2) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; max-width: calc(100% - 32px); text-align: center; }

<script>
/*MODEL-START*/
const FACE_AXIS = { R: [0, 1], L: [0, -1], U: [1, 1], D: [1, -1], F: [2, 1], B: [2, -1], x: [0, 1], y: [1, 1], z: [2, 1] };
/* Real cube, white opposite yellow, green opposite blue, red opposite orange. Held white-down with green in front, ORANGE is on the right and RED on the left
   (white-up/green-front puts red on the right; flipping to yellow-up turns it half a turn around the front-back axis). The old table had these two swapped, a mirror-image cube. */
const COLOR_OF = { '0,1': 'O', '0,-1': 'R', '1,1': 'Y', '1,-1': 'W', '2,1': 'G', '2,-1': 'B' };
function makeCube(n) {
  const h = (n - 1) / 2, c = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let k = 0; k < n; k++) {
    const p = [i - h, j - h, k - h];
    if (Math.max(Math.abs(p[0]), Math.abs(p[1]), Math.abs(p[2])) < h) continue;
    const st = [];
    for (let a = 0; a < 3; a++) for (const s of [1, -1]) if (p[a] * s === h) {
      const nv = [0, 0, 0]; nv[a] = s; st.push({ n: nv, c: COLOR_OF[a + ',' + s] });
    }
    c.push({ p, st, id: c.length });
  }
  return { n, h, c };
}
function rot1(v, a) {
  let r;
  if (a === 0) r = [v[0], -v[2], v[1]];
  else if (a === 1) r = [v[2], v[1], -v[0]];
  else r = [-v[1], v[0], v[2]];
  return [r[0] + 0, r[1] + 0, r[2] + 0];
}
function normTok(t) { return String(t).replace(/[’′`´]/g, "'").replace(/^([A-Za-z])2'$/, '$12'); }
function tokInfo(t) {
  const m = /^([RLUDFBxyz])(2|')?$/.exec(normTok(t));
  if (!m) return null;
  const [a, s] = FACE_AXIS[m[1]];
  const mult = m[2] === '2' ? 2 : m[2] === "'" ? -1 : 1;
  return { face: m[1], axis: a, sign: s, q: -s * mult, whole: /[xyz]/.test(m[1]) };
}
function parseAlg(alg) {
  const toks = String(alg).replace(/[’′`´]/g, "'").replace(/[()]/g, ' ').trim().split(/\s+/).filter(Boolean).map(normTok);
  for (const t of toks) if (!tokInfo(t)) throw new Error('Bad move: ' + t);
  return toks;
}
function inLayer(cubie, info) { return info.whole || cubie.p[info.axis] * info.sign > 0; }
function applyTok(cube, t) {
  const info = tokInfo(t); if (!info) throw new Error('Bad move: ' + t);
  const k = ((info.q % 4) + 4) % 4;
  for (const cb of cube.c) {
    if (!inLayer(cb, info)) continue;
    for (let i = 0; i < k; i++) {
      cb.p = rot1(cb.p, info.axis);
      for (const s of cb.st) s.n = rot1(s.n, info.axis);
    }
  }
  return cube;
}
function applyAlg(cube, alg) { const toks = Array.isArray(alg) ? alg : parseAlg(alg); for (const t of toks) applyTok(cube, t); return cube; }
function invertTok(t) { t = normTok(t); return t.endsWith('2') ? t : t.endsWith("'") ? t.slice(0, -1) : t + "'"; }
function invertSeq(toks) { return toks.slice().reverse().map(invertTok); }
function isSolved(cube) {
  const m = {};
  for (const cb of cube.c) for (const s of cb.st) { const k = s.n.join(','); (m[k] = m[k] || new Set()).add(s.c); }
  return Object.values(m).every(set => set.size === 1);
}
/*MODEL-END*/

/* ================= DATA =================
   Every human-readable string is an i18n pair written "中文|English" and rendered by tx()/bi()/biI() below.
   Notation letters (R U R' U') are the same in every language. */
/*DATA-START*/
/* Said on the hard cross days so nobody feels stuck: written in English only (no new Chinese), shown in every language */
const CROSS_SAFE = "Stuck on the bottom cross today? Go back to white on top. That is fine, and this week can take more than 7 days. Take the days you need.";
const ALGS = {
  spin:   { n: 3, alg: "y y y y", name: "认识六个面|Meet the six faces", reps: 1, setup: false, w: 1 },
  nR:     { n: 3, alg: "R R'", name: "R 和 R'|R and R'", reps: 1, setup: false, w: 1 },
  nU:     { n: 3, alg: "U U'", name: "U 和 U'|U and U'", reps: 1, setup: false, w: 1 },
  n2:     { n: 3, alg: "R2 U2", name: "转两次：R2 U2|Double turns: R2 U2", reps: 1, setup: false, w: 1 },
  nF:     { n: 3, alg: "F F'", name: "F 和 F'|F and F'", reps: 1, setup: false, w: 1 },
  nLDB:   { n: 3, alg: "L L' D D' B B'", name: "L、D、B|L, D and B", reps: 1, setup: false, w: 1 },
  sexy:   { n: 3, alg: "R U R' U'", name: "万能公式|The magic move", reps: 1, setup: false, w: 1 },
  sexy6:  { n: 3, alg: "R U R' U'", name: "万能公式 ×6 回到原样|The magic move ×6 brings the cube back", reps: 6, setup: false, w: 1 },
  ur6:    { n: 3, alg: "U R U' R'", name: "U R U' R' ×6 回到原样|U R U' R' ×6 brings the cube back", reps: 6, setup: false, w: 1 },
  sexy2x6:{ n: 2, alg: "R U R' U'", name: "2阶上的万能公式 ×6|The magic move ×6 on the 2x2", reps: 6, setup: false, w: 2 },
  c2:     { n: 2, alg: "R U R' U'", name: "放一个白色角块（2阶）|Put a white corner in its home (2x2)", reps: 3, setup: true, w: 2 },
  sune2:  { n: 2, alg: "R U R' U R U2 R'", name: "小鱼公式：黄色朝上（2阶）|Sune: turn the yellow stickers up (2x2)", cfop: "Sune (the same move is OLL 27 on a 3x3)", reps: 1, setup: true, w: 3 },
  aperm2: { n: 2, alg: "R' F R' B2 R F' R' B2 R2", name: "换角公式（2阶）|Corner swap (2x2)", cfop: "A-perm (the same move is a PLL on a 3x3)", reps: 1, setup: true, w: 3 },
  drill:  { n: 2, alg: "R U R' U'", name: "手指练习：万能公式 ×4|Finger drill: the magic move ×4", reps: 4, setup: false, w: 4 },
  f2:     { n: 3, alg: "F2", name: "辅助轮：小雏菊 → F2（以后要去掉）|Training wheels: daisy, then F2 (we drop this later)", reps: 1, setup: true, w: 5 },
  crossF2:{ n: 3, alg: "F2", pre: "z2", name: "直接做十字：底下的白棱用 F2 拿上来|Direct cross: bring a white edge up with F2", reps: 1, setup: true, w: 5 },
  crossR: { n: 3, alg: "R", pre: "z2", name: "直接做十字：中层白色朝前，R 送上去|Direct cross: white faces you in the middle layer, R puts it in", reps: 1, setup: true, w: 5 },
  crossB: { n: 3, alg: "R'", pre: "z2", name: "Direct cross: white faces away from you in the middle layer, R' puts it in", reps: 1, setup: true, w: 5, en: true },
  crossS: { n: 3, alg: "F", pre: "z2", name: "Direct cross: white faces the side in the middle layer, F puts it in", reps: 1, setup: true, w: 5, en: true },
  crossBot:{ n: 3, alg: "R F' R'", pre: "z2", name: "Direct cross: a white edge in the bottom layer with white on its side, R F' R'", reps: 1, setup: true, w: 5, en: true },
  crossFlip:{ n: 3, alg: "F U' R U", pre: "z2", name: "Direct cross: an edge in the right place but flipped (white on its side), F U' R U", reps: 1, setup: true, w: 5, en: true },
  crossZ2:{ n: 3, alg: "z2", name: "十字转到底下：z2（像方向盘转半圈）|Move the cross to the bottom: z2 (half a steering-wheel turn)", reps: 1, setup: true, w: 5 },
  c3:     { n: 3, alg: "R U R' U'", name: "第一层角块（3阶）|First-layer corner (3x3)", reps: 3, setup: true, w: 6 },
  eR:     { n: 3, alg: "U R U' R' U' F' U F", name: "第二层：往右放|Second layer: edge goes to the right", reps: 1, setup: true, w: 6 },
  eL:     { n: 3, alg: "U' L' U L U F U' F'", name: "第二层：往左放|Second layer: edge goes to the left", reps: 1, setup: true, w: 6 },

 { t: "认识魔方和字母|Meet the cube and its letters", g: "学会字母，会做万能公式|Learn the move letters and the magic move", n: 3, c: "G", days: [
  ["认识魔方|Meet the cube", ["找到六种颜色：白、黄、绿、红、蓝、橙|Find all six colors: white, yellow, green, red, blue and orange.", "白色朝下，黄色朝上，绿色对着你|Hold the cube with white on the bottom, yellow on top and green facing you.", "这时右边是橙色，左边是红色，后面是蓝色|Now orange is on the right, red is on the left and blue is at the back.", "中间那块叫中心块，它们永远不会互相换位置|The square in the middle of each side is a center. Centers never trade places."], ["spin"], "闭上眼睛说出每个面的颜色 3 遍|Close your eyes and name the color of every side. Do it 3 times.", "以后每天都这样拿魔方：白下、黄上、绿前。这是以后学 CFOP 的好习惯。|Have your child hold the cube this way every day: white down, yellow up, green in front. It is the same way experts hold it for CFOP."],
  ["字母 R 和 U|The letters R and U", ["每个面有一个字母：R右 L左 U上 D下 F前 B后|Every side has a letter: R is Right, L is Left, U is Up, D is Down, F is Front and B is Back.", "R：像看着右边那样，右边一层顺时针转（往上）|R means: look at the right side and turn it clockwise. The front of that side goes up.", "手法：右手腕往上翻|Finger trick: flip your right wrist up, like you are revving a bike.", "U：右手食指把顶层往左推|U means: push the top layer to the left with your right pointer finger."], ["nR", "nU"], "R 做 4 次，魔方回到原样；U 也做 4 次|Do R four times and the cube is back to normal. Then do U four times.", "提醒孩子用手腕和食指，不要整只手抓着转。|Remind your child to turn with the wrist and the fingertip, not by grabbing with the whole hand."],
  ["撇号 ' 和 数字 2|The ' mark and the number 2", ["' 读作“撇”，意思是反方向（逆时针）|The little mark ' is called “prime”. It means turn the other way, counter-clockwise.", "R'：右手腕往下翻|R' means: flip your right wrist down.", "U'：左手食指把顶层往右推|U' means: push the top layer to the right with your left pointer finger.", "2 表示转两次，比如 R2|A 2 means turn it twice. R2 is two R turns."], ["nR", "nU", "n2"], "R R' 做 5 遍，U U' 做 5 遍|Do R then R' five times, and U then U' five times.", "游戏：家长说字母，孩子转；然后交换角色。|Play a game: you call out a letter and your child turns it. Then swap jobs."],
  ["F、L、D、B 四个字母|The letters F, L, D and B", ["F：前面顺时针转，像方向盘往右打|F means: turn the front side clockwise, like a steering wheel turning right.", "L：左边一层往下转（朝你这边）|L means: turn the left side down toward you.", "D：底层往右转|D means: turn the bottom layer to the right.", "B：后面一层，从后面看是顺时针|B means: turn the back side clockwise, as if you were looking at it from behind."], ["nF", "nLDB"], "每个字母做 1 次，再做它的反方向 1 次|Do each letter once, then do it the other way (with ') once.", "L 和 R 的方向正好相反，最容易弄错。慢慢来，可以对着动画。|L turns the opposite way from R. This is the most common mix-up, so go slowly and check the animation."],
  ["万能公式 R U R' U'|The magic move: R U R' U'", ["慢慢做：R U R' U'|Go slowly: R, U, R', U'.", "边做边念出字母|Say each letter out loud as you turn.", "右手腕做 R，右手食指做 U|Use your right wrist for R and your right pointer finger for U.", "左手食指做 U'|Use your left pointer finger for U'."], ["sexy"], "做 10 遍，一遍比一遍顺|Do it 10 times. Try to make each one smoother than the last.", "像念儿歌一样有节奏地念：R—U—R撇—U撇。|Chant it together with a steady beat: R, U, R-prime, U-prime."],
  ["神奇的 ×6|The ×6 magic trick", ["从还原好的魔方开始|Start with a solved cube.", "做 U R U' R' 六遍|Do U R U' R' six times in a row.", "看！魔方又变回来了|Look! The cube is solved again.", "再试试 R U R' U' 六遍|Now try R U R' U' six times."], ["ur6", "sexy6"], "每个公式做 6 遍，各 2 轮|Do each one 6 times, and do 2 rounds of each.", "如果没有变回来，说明中间有一步转错了。从头再来，不批评。|If the cube does not come back, one turn slipped. Just start again. No blame."],
  ["复习挑战日|Review challenge day", ["家长说字母，孩子马上转|A grown-up calls out letters and you turn them fast.", "闭眼背出 R U R' U'|Say R U R' U' with your eyes closed.", "给家长讲：每个字母和 ' 是什么意思|Teach your grown-up what each letter and the ' mark mean."], ["sexy6"], "万能公式 ×6，做 2 轮|Do the magic move 6 times, two rounds.", "让孩子当小老师。能讲出来，才是真的学会了。|Let your child be the teacher. If they can explain it, they really know it."],
 ]},
 { t: "2阶：做好白色底层|2x2: build the white bottom layer", g: "一次放好一个角块|Put in one corner at a time", n: 2, c: "R", days: [
  ["认识2阶魔方|Meet the 2x2", ["2阶只有 8 个角块，每块有 3 种颜色|The 2x2 has only 8 pieces. They are all corners, and each one has 3 colors.", "2阶没有中心块，用白色角块认方向|There are no centers, so a white corner shows you which way to hold it.", "把一个白色角块放在底层左前，白色朝下|Put one white corner at the bottom front left, with white facing down."], ["sexy2x6"], "在2阶上做万能公式 ×6，也会回到原样|Try the magic move 6 times on the 2x2. It comes back too!", "白色永远在底下。以后3阶也是一样。|White always goes on the bottom. It will be the same on the 3x3."],
  ["角块的家|A corner's home", ["在顶层找一个有白色的角块|Find a corner on the top layer that has white on it.", "转 U，让它到右前上方，正好在它的“家”上面|Turn U until it sits at the top front right, right above its home.", "它的家在右前下方：另外两个颜色要和旁边的底层块对上|Its home is the bottom front right spot. Its other two colors must match the pieces next to it."], ["c2"], "找到 4 个角块的家，各说一遍|Point to the home of all 4 white corners and say where each one goes.", "可以问：“这个角块的家在哪？为什么？”|Ask: “Where is this corner's home? How do you know?”"],
  ["用万能公式放进去|Use the magic move to put it in", ["角块在右前上方，家在它正下方|The corner is at the top front right, and its home is right below it.", "做 R U R' U'，看看白色是不是朝下了|Do R U R' U'. Is white facing down now?", "没有就再做一遍，直到放好（1、3 或 5 遍）|If not, do it again until the corner is in. It takes 1, 3 or 5 times."], ["c2"], "放好 3 个角块|Put 3 corners in their homes.", "边做边数遍数。最多 5 遍就一定能放好。|Count the turns out loud. It always works in 5 tries or fewer."],
  ["角块卡在底层怎么办|When a corner is stuck in the bottom", ["白色角块在底层，但方向错了|A white corner is in the bottom layer, but it is twisted the wrong way.", "把它转到右前下方，做一遍 R U R' U'|Hold the cube so it is at the bottom front right and do R U R' U' once.", "它就跑到顶层了，再按昨天的方法放进去|Now it has popped up to the top. Put it in the way you learned yesterday."], ["c2"], "故意把角块放错，再救出来 3 次|Put a corner in wrong on purpose, then rescue it. Do it 3 times.", "这是解决“卡住”的万能办法，让孩子自己发现。|This trick fixes every stuck corner. Let your child discover it."],
  ["完成白色底层|Finish the white layer", ["打乱魔方|Mix up the cube.", "一个一个放好 4 个白色角块|Put all 4 white corners in, one at a time.", "检查：底层四周的颜色两两对上了吗？|Check the sides of the bottom layer: do the colors match in pairs?"], ["c2"], "完整做 2 次白色底层|Build the whole white layer 2 times.", "白色面做好但侧面颜色不对，也算错哦。|A white face with mixed-up side colors is not finished yet."],
  ["底层小速度|Bottom layer speed", ["打乱，做白色底层|Mix up the cube and build the white layer.", "试着少看动画，自己判断|Try to decide on your own without the animation.", "做完给家长讲每一步|Then explain each step to your grown-up."], ["c2"], "做 3 次底层|Build the bottom layer 3 times.", "只夸过程：“你刚才找角块好快！”|Praise the work, not the result: “You found that corner so fast!”"],
  ["挑战日：独立底层|Challenge: the bottom layer on your own", ["家长打乱|A grown-up mixes up the cube.", "孩子不看任何提示做好白色底层|Build the white layer without any hints.", "成功了就给自己鼓掌|Give yourself a clap when it is done!"], ["c2"], "独立完成 2 次|Do it on your own 2 times.", "做不出也没关系，明天再试。今天打卡照样算。|If it does not work yet, that is fine. Try again tomorrow. Today still counts."],
 ]},
 { t: "2阶：完整还原|2x2: the full solve", g: "黄色朝上，再换好角块|Turn yellow up, then swap the corners", n: 2, c: "B", days: [
  ["小鱼公式|The Sune", ["底层做好后，黄色朝上|After the white layer is done, yellow is on top.", "学新公式：R U R' U R U2 R'|Learn a new move: R U R' U R U2 R'.", "先背熟字母，再上手|Learn the letters by heart first, then try it on the cube."], ["sune2"], "从还原状态做 6 遍，会回到原样|Do it 6 times on a solved cube and it comes back.", "这个公式叫 Sune（小鱼），以后3阶还会用。|This move is called the Sune. Your child will use it again on the 3x3."],
  ["只有一个黄色朝上|Only one yellow on top", ["数一数：顶面有几个黄色？|Count how many yellow stickers are on top.", "只有 1 个：把它转到左前上方|If there is just 1, turn U until it is at the top front left.", "做小鱼公式；没好就再看一次再做|Do the Sune. Not done yet? Look again and do it once more."], ["sune2"], "练 5 次这个情况|Practice this case 5 times.", "只用 U 转顶层来找位置，不要整个翻魔方。|Only turn the top layer (U) to line it up. Do not flip the whole cube."],
  ["0 个或 2 个黄色朝上|Zero or two yellow on top", ["0 个：转 U，让左前上角块的黄色朝左|Zero yellow on top: turn U until the top front left corner has its yellow facing left.", "2 个：转 U，让左前上角块的黄色朝前|Two yellow on top: turn U until the top front left corner has its yellow facing you.", "做小鱼公式，再数一数，重复（最多 3 次）|Do the Sune, count again and repeat. It takes 3 times at most."], ["sune2"], "把顶面做成全黄 3 次|Make the whole top yellow 3 times.", "口诀：1 个放左前；0 个黄朝左；2 个黄朝前。|A rhyme to remember: one goes front left; zero, yellow left; two, yellow front."],
  ["换角公式|The corner swap", ["看侧面：有没有两个角块颜色一样？像一对车灯|Look at the sides. Are two corners the same color on one side? They look like car headlights.", "把车灯转到后面|Turn U until the headlights are at the back.", "做：R' F R' B2 R F' R' B2 R2|Then do: R' F R' B2 R F' R' B2 R2."], ["aperm2"], "慢慢做 5 遍公式|Do the move slowly 5 times.", "这个公式长，可以分两半背：R' F R' B2 ／ R F' R' B2 R2。|It is a long one. Learn it in two halves: R' F R' B2, then R F' R' B2 R2."],
  ["换好角块|Finish the corners", ["找车灯，放在后面，做换角公式|Find the headlights, put them at the back and do the corner swap.", "没有车灯？随便做一遍，就会出现车灯|No headlights? Do the swap once from any side and they will show up.", "最后转 U，让颜色全部对齐|Last, turn U until all the colors line up."], ["aperm2"], "做 3 次最后一步|Do this last step 3 times.", "让孩子说出“车灯”在哪，再动手。|Have your child point to the headlights before turning."],
  ["第一次完整还原|Your first full solve", ["打乱|Mix up the cube.", "底层 → 黄色朝上 → 换角|White layer, then yellow on top, then the corner swap.", "可以看动画帮忙|It is fine to use the animations for help."], ["c2", "sune2", "aperm2"], "完整还原 2 次|Solve the whole cube 2 times.", "第一次还原值得拍照留念！|Take a photo of the first solve!"],
  ["庆祝日：2阶小高手|Party day: you can solve the 2x2!", ["独立还原一次给家人看|Solve it once on your own for your family.", "讲三步的名字：底层、小鱼、换角|Name the 3 steps: white layer, Sune, corner swap.", "去计时页记录第一次成绩|Go to the Timer and record your first time."], ["sune2", "aperm2"], "还原 3 次|Solve it 3 times.", "第一次计时不要比较快慢，只记录。|For the first timed solve, just record it. No comparing."],
 ]},
 { t: "2阶：越来越熟练|2x2: getting smooth", g: "计时、手法、不看提示|Timer, finger tricks and solving without hints", n: 2, c: "O", days: [
  ["Try the timer if you like", ["Open the Timer and choose 2x2. Hold the big button, let go to start, and tap it to stop. You can skip this part.", "Mix up the cube by following the scramble letters.", "Solve it once. Before each step, say its name out loud."], ["c2"], "Solve 3 times, naming each step before you start it.", "Times save by themselves. The timer only measures; it never decides whether you did well."],
  ["手指练习|Finger tricks", ["R 用手腕，U 用食指|Use your wrist for R and your pointer finger for U.", "万能公式连做 4 遍不停|Do the magic move 4 times without stopping.", "越来越快，但不能乱|Go a little faster, but keep every turn neat."], ["drill"], "万能公式 ×4，做 5 轮|Do the magic move 4 times, for 5 rounds.", "看孩子的手：手腕在翻，而不是整只手在抓。|Watch the hands: the wrist should flip instead of the whole hand grabbing."],
  ["小鱼公式的手法|Sune finger tricks", ["R U R' U：食指推 U|In R U R' U, push each U with your pointer finger.", "U2：食指连推两下|For U2, push twice in a row with your pointer finger.", "做小鱼公式 10 遍|Do the Sune 10 times."], ["sune2"], "小鱼公式 10 遍|Do the Sune 10 times.", "可以计时看看 10 遍要多久。|Try timing how long 10 Sunes take."],
  ["不看提示还原|Solve without hints", ["今天不打开动画|No animations today.", "遇到困难先想一想|When you get stuck, stop and think first.", "实在想不起再看公式库|Only check the move library if you really cannot remember."], [], "不看提示还原 3 次|Solve 3 times with no hints.", "孩子卡住时先问：“现在是哪一步？”|When your child is stuck, ask: “Which step are you on?”"],
  ["Looking back: average of 5", ["Solve 5 times in a row. Timing them is optional.", "If you timed them, look at your Average of 5: the fastest and slowest are left out, and the middle three are averaged.", "Whether you timed or not, ask yourself: which step was the hardest, and why?"], [], "Solve 5 times and name the hardest step.", "If you timed yourself, an average is steadier than one lucky time. Either way, the real question is what each step is for."],
  ["Smoother, not just faster", ["Warm up with the magic move 6 times.", "Solve 5 times. Look for what got smoother: where did your fingers help, or where did you look ahead?", "Tell your grown-up one thing that got easier since last week."], ["drill"], "Solve 5 times and notice what got smoother.", "Praise the work, not the result: \"You looked ahead so well!\" A timer is optional, and a new best time is not needed."],
  ["挑战日：小老师|Challenge: be the teacher", ["教家长做白色底层|Teach your grown-up how to build the white layer.", "讲解小鱼和换角公式|Explain the Sune and the corner swap.", "下周开始3阶！|Next week you start the 3x3!"], ["c2", "sune2", "aperm2"], "教会家长一步|Teach your grown-up one whole step.", "家长故意做错，让孩子来纠正。|Make a mistake on purpose and let your child correct you."],
 ]},
 { t: "3阶：认识块，做白十字|3x3: pieces and the white cross", g: "中心块不动，棱块配对中心|Centers stay put, and edges match their centers", n: 3, c: "Y", days: [
  ["三种块和中心块|The three kinds of pieces", ["中心块：1 种颜色，6 个，永远不会互相换位置|Centers have 1 color. There are 6, and they never trade places.", "棱块：2 种颜色，12 个|Edges have 2 colors. There are 12 of them.", "角块：3 种颜色，8 个|Corners have 3 colors. There are 8 of them.", "中心块就是地图：每个面是什么颜色，看中心块|Centers are your map: each side's color is the color of its center."], ["spin"], "找 3 个棱块和 3 个角块，说出它们的家|Find 3 edges and 3 corners, and say where each one belongs.", "问孩子：有没有一个块是红色和橙色？（没有，它们是对面！）|Ask: is there a piece with red and orange? (No! They are on opposite sides.)"],
  ["小雏菊：辅助轮，以后要去掉|The daisy: training wheels we drop later", ["🚲 辅助轮：小雏菊只是帮你看清十字长什么样，以后要去掉|🚲 Training wheels: the daisy only shows you what a cross looks like. We stop using it soon.", "黄色朝上，把 4 个白色棱块围着黄中心，白色朝上|With yellow on top, put the 4 white edges around the yellow center, white facing up.", "转 U 让花瓣的另一个颜色对上中心块，做 F2 送下去|Turn U until a petal's other color matches its center, then do F2 to send it down."], ["f2"], "用小雏菊做 2 次白十字|Make the white cross with the daisy 2 times.", "辅助轮，以后要去掉。高手不用小雏菊；明天开始直接做十字，目标是十字在底部。|Training wheels only. Experts don't use the daisy. From tomorrow your child builds the cross directly, and the goal is the cross on the bottom."],
  ["直接做十字（白色朝上）|Build the cross directly (white on top)", ["白色中心朝上，绿色还在前面（这时红色在右边）|Hold white on top with green still in front. For now, red is on the right.", "找一个白色棱块，看它的另一个颜色|Find a white edge and look at its other color.", "把它放到白中心旁边，另一个颜色对上同色中心块|Move it next to the white center so its other color matches the center of the same color.", "一次放一块，放好的不要弄乱|Place one edge at a time, without breaking the ones you already placed."], ["crossF2", "crossR", "crossB", "crossS", "crossBot", "crossFlip"], "放好 4 个白棱，做 2 次|Place all 4 white edges, 2 times.", "先让孩子说“这块要去哪”，再动手。这就是高手做十字的方法，不用小雏菊。|Ask your child to say where each piece goes before moving it. This is how experts build the cross."],
  ["十字转到底下：z2|Move the cross to the bottom: z2", ["白色朝上直接做好十字|Build the cross directly with white on top.", "检查：四个侧面颜色都对上中心块|Check that all 4 side colors match their centers.", "做 z2：整个魔方像方向盘一样转半圈，十字到了底下|Do z2: turn the whole cube like a steering wheel, half a turn. Now the cross is on the bottom.", "现在白色在下、绿色在前、橙色在右，可以做第一层了|Now white is on the bottom, green is in front and orange is on the right. You are ready for the first layer.", CROSS_SAFE], ["crossZ2"], "白色朝上做十字 + z2，做 3 次|Build the cross with white on top, then do z2. Do it 3 times.", "目标是十字在底部（CFOP 的习惯）。白色朝上只是为了先看清楚。|The goal is the cross on the bottom, which is the CFOP habit. White on top is only for seeing it first."],

/* ---- Prediction builder (pure: needs only the cube model) ---- */
const COLOR_NAME = { W: "White", Y: "Yellow", G: "Green", R: "Red", B: "Blue", O: "Orange" };
const SIDE_NAME = { R: "right", L: "left", U: "top", D: "bottom", F: "front", B: "back" };
const FACE_OF_VEC = { "1,0,0": "R", "-1,0,0": "L", "0,1,0": "U", "0,-1,0": "D", "0,0,1": "F", "0,0,-1": "B" };
function posName(p) {
  const a = [];
  if (p[1] > 0) a.push("top"); else if (p[1] < 0) a.push("bottom");
  if (p[2] > 0) a.push("front"); else if (p[2] < 0) a.push("back");
  if (p[0] > 0) a.push("right"); else if (p[0] < 0) a.push("left");
  return a.join(" ");
}
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
function pieceByColors(cube, cols) { const k = cols.slice().sort().join(""); return cube.c.find(cb => cb.st.map(s => s.c).sort().join("") === k); }
function heldCube(n, pre) { const c = makeCube(n); if (pre) applyAlg(c, pre); return c; }
/* choose three believable wrong answers: names that share the most words with the right one, in a fixed order */
function pickOpts(ans, pool, slot) {
  const aw = ans.split(" ");
  const others = pool.filter(x => x !== ans).map(x => [x, x.split(" ").filter(w => aw.includes(w)).length]).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, 3).map(x => x[0]);
  const at = slot % 4; others.splice(at, 0, ans);
  return { opts: others.map(capFirst), a: at };
}
function buildPred(sp, slot) {
  if (!sp) return null;
  if (sp.type === "mc") return { q: sp.q, opts: sp.opts.slice(), a: sp.a, x: sp.x };
  slot = slot || 0;
  if (sp.type === "track") {
    const start = makeCube(sp.n).c.find(cb => posName(cb.p) === sp.from);
    const c = applyAlg(makeCube(sp.n), sp.alg), end = c.c.find(cb => cb.id === start.id);
    const ans = posName(end.p);
    const pool = makeCube(sp.n).c.filter(cb => cb.st.length === start.st.length).map(cb => posName(cb.p));
    const o = pickOpts(ans, pool, slot);
    const one = sp.alg.split(" ").length === 1;
    return { q: "Look at the " + sp.from + " corner of the cube, the one where the top, front and right sides meet. You turn " + sp.alg + (one ? "" : ", one turn after the other") + ". Where does that corner end up?", opts: o.opts, a: o.a,
      x: (one ? sp.alg + " turns the whole " + SIDE_NAME[sp.alg.charAt(0)] + " layer, and that corner is part of it. It rides along to the " + ans + " corner."
              : "A piece only moves when it is in the layer being turned. Follow it turn by turn and it ends up at the " + ans + " corner.") + " Try it on your cube and follow that one corner with your finger." };
  }
  if (sp.type === "home") {
    const c = heldCube(sp.n, sp.pre), pc = pieceByColors(c, sp.cols), ans = posName(pc.p);
    const pool = c.c.filter(cb => cb.st.length === sp.cols.length).map(cb => posName(cb.p));
    const o = pickOpts(ans, pool, slot);
    const big = heldCube(3, sp.pre);
    const sides = sp.cols.map(col => { const ce = big.c.find(cb => cb.st.length === 1 && cb.st[0].c === col); return { col, side: SIDE_NAME[FACE_OF_VEC[ce.st[0].n.join(",")]] }; });
    const names = sp.cols.map(k => COLOR_NAME[k].toLowerCase());
    const list = names.length === 2 ? names[0] + " and " + names[1] : names[0] + ", " + names[1] + " and " + names[2];
    return { q: "A piece has " + list + " stickers. You hold the cube with " + sp.hold + ". Where is its home?", opts: o.opts, a: o.a,
      x: "Its home is where its colors match the centers around it: " + sides.map(s => COLOR_NAME[s.col].toLowerCase() + " is the " + s.side + " side").join(", ") + ". So it belongs in the " + ans + " spot." };
  }
  if (sp.type === "face") {
    const c = heldCube(sp.n, sp.pre); if (sp.alg) applyAlg(c, sp.alg);
    const want = { R: "1,0,0", L: "-1,0,0", U: "0,1,0", D: "0,-1,0", F: "0,0,1", B: "0,0,-1" }[sp.ask];
    const ce = c.c.find(cb => cb.st.length === 1 && cb.st[0].n.join(",") === want);
    const ans = COLOR_NAME[ce.st[0].c];
    const four = ["Red", "Orange", "Blue", "Green"].filter(x => x !== ans).slice(0, 3);
    const at = slot % 4; four.splice(at, 0, ans);
    return { q: "You hold the cube with " + sp.hold + (sp.alg ? ". You do " + sp.alg : "") + ". Which color is on the " + SIDE_NAME[sp.ask] + (sp.alg ? " now" : "") + "?", opts: four, a: at, x: sp.x };
  }
  return null;
}

/* ================= STORAGE (safe: works when the browser blocks storage) ================= */
const Store = (function () {
  const mem = {}; let ok = true;
  const has = k => Object.prototype.hasOwnProperty.call(mem, k);
  function probe() {
    try { const k = "__fmt_probe__"; localStorage.setItem(k, "1"); const r = localStorage.getItem(k); localStorage.removeItem(k); ok = r === "1"; }
    catch (e) { ok = false; }
    return ok;
  }
  function get(k) {
    if (ok) { try { return localStorage.getItem(k); } catch (e) { ok = false; } }
    return has(k) ? mem[k] : null;
  }
  function set(k, v) {
    mem[k] = v;
    if (!ok) return false;
    try { localStorage.setItem(k, v); return true; } catch (e) { ok = false; return false; }
  }
  return { probe, get, set, get ok() { return ok; } };
})();

/* ================= HOST CONTEXT (the Five-Minute Thinkers site) ================= */
/* The site opens a lesson with ?profile=<animal>&host=<its own address>. Only a valid animal is a player; without one this page
   reports nothing at all and behaves exactly as a stand-alone page. Events go to this device's own storage and, when the page sits
   inside the site (same address), to the site page that holds it. Nothing is ever sent over the network. */
const PP_ANIMALS = ["lion", "fox", "panda", "owl", "frog", "penguin"];
const HOSTCTX = (function () {
  const c = { profile: null, hostOk: false };
  try {
    const q = new URLSearchParams(location.search), p = q.get("profile");
    if (PP_ANIMALS.indexOf(p) >= 0) c.profile = p;
    c.hostOk = c.profile !== null && q.get("host") === location.origin && location.origin !== "null";
  } catch (e) { c.profile = null; c.hostOk = false; }
  return c;
})();

/* ================= PASSPORT HOOK (My Passport; same event shape as the other lessons, schema 1) =================
   lesson_id "puzzles.g3.cube" (the passport reads the last part, "cube", and matches it to projects.json "passport").
   unit    = "week1".."week8" for the Course days, "quest-g0".."quest-g4" for the Quest lessons.
   item    = "d<0-55>" / "q<0-20>" (predictions), activity = "day<1-7>" / "l<0-20>" (finished things).
   Effort only: a finished day or lesson, a prediction, a hint asked for, a right answer after a wrong one. Speed and the timer send nothing. */
const Hook = (function () {
  const LESSON = "puzzles.g3.cube", QK = "lp_events_v1", MAX = 500;
  const sid = (function () { let s = ""; try { const a = new Uint8Array(8); crypto.getRandomValues(a); a.forEach(x => { s += (x % 36).toString(36); }); } catch (e) { s = Math.random().toString(36).slice(2, 10); } return s; })();
  let memQ = [], started = false, segStart = Date.now(), ended = false;
  function queue(ev) {
    let base = null;
    try { const raw = Store.get(QK); const a = raw ? JSON.parse(raw) : []; base = Array.isArray(a) ? a : []; } catch (e) { base = null; }
    if (base === null) base = memQ;
    base = base.slice(); base.push(ev); while (base.length > MAX) base.shift();
    memQ = base; Store.set(QK, JSON.stringify(base));
  }
  function emit(name, data) {
    if (!HOSTCTX.profile) return null;                    /* no valid ?profile= : nothing is reported */
    try {
      const d = {}; for (const k in (data || {})) d[k] = data[k];
      const ev = { schema: 1, lesson_id: LESSON, event: String(name), ts: new Date().toISOString().replace(/\.\d+Z$/, "Z"), session: sid, profile: HOSTCTX.profile, data: d };
      started = true;
      try { queue(ev); } catch (e) { /* storage blocked: not kept */ }
      try { if (HOSTCTX.hostOk && window.parent && window.parent !== window) window.parent.postMessage({ type: "learning-event", event: ev }, location.origin); } catch (e) { /* ignore */ }
      return ev;
    } catch (e) { return null; }
  }
  function hide() { if (ended || !started) return; ended = true; const sec = Math.round((Date.now() - segStart) / 1000); if (sec > 0) emit("session_end", { seconds: sec }); }
  function show() { ended = false; segStart = Date.now(); }
  try {
    document.addEventListener("visibilitychange", () => { try { document.visibilityState === "hidden" ? hide() : show(); } catch (e) {} });
    window.addEventListener("pagehide", () => { try { hide(); } catch (e) {} });
  } catch (e) { /* no document: tests */ }
  return { emit, peek: () => memQ.slice(), LESSON };
})();
/*EMIT-END*/

/* ================= STATE ================= */

const KEY = HOSTCTX.profile ? "fmlos.sample.cube.h_" + HOSTCTX.profile + ".v1" : "fmt_cube_v1";

  return { v: 1, lang: "en", done: {}, parent: false, times: { 2: [], 3: [] }, badges: {}, anim: 0, deleted: 0, bestStreak: 0,
    timerMode: "hold", timerCube: 2, speed: "mid", habits: {}, pred: {}, active: {}, sent: {}, mute: false, quest: { done: {}, stars: {}, imported: false, at: {} } };

let S = defaultState();
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isId = s => typeof s === "string" && /^[A-Za-z0-9_.:-]{1,48}$/.test(s);

function sanitize(o) {

  if (o.badges && typeof o.badges === "object") for (const b of BADGES) if (isDate(o.badges[b.id])) r.badges[b.id] = o.badges[b.id];
  if (o.habits && typeof o.habits === "object") for (const h of HABITS) if (isDate(o.habits[h.id])) r.habits[h.id] = o.habits[h.id];
  if (o.active && typeof o.active === "object") { const ks = Object.keys(o.active).filter(isDate).sort().slice(-400); for (const k of ks) r.active[k] = 1; }
  if (o.pred && typeof o.pred === "object") for (const k of Object.keys(o.pred)) { const p = o.pred[k]; if (isId(k) && p && typeof p === "object") r.pred[k] = { n: nonNeg(p.n, 99), ok: !!p.ok, first: !!p.first, at: isDate(p.at) ? p.at : "" }; }
  if (o.sent && typeof o.sent === "object") for (const k of Object.keys(o.sent).slice(0, 200)) if (isId(k) && o.sent[k]) r.sent[k] = 1;
  r.mute = !!o.mute;

    r.quest.imported = !!o.quest.imported;
    if (o.quest.done && typeof o.quest.done === "object") for (const k of Object.keys(o.quest.done)) if (isId(k) && isDate(o.quest.done[k])) r.quest.done[k] = o.quest.done[k];
    if (o.quest.stars && typeof o.quest.stars === "object") for (const k of Object.keys(o.quest.stars)) if (isId(k)) r.quest.stars[k] = nonNeg(o.quest.stars[k], 3);
    /* where a child stopped inside a lesson: lesson number -> { k: moves done, h: 1 if Show me was used } (lesson numbers 0..20 only) */
    if (o.quest.at && typeof o.quest.at === "object") for (const k of Object.keys(o.quest.at)) {
      const a = o.quest.at[k];
      if (/^\d{1,2}$/.test(k) && +k <= 20 && a && typeof a === "object") { const kk = nonNeg(a.k, 200); if (kk > 0) r.quest.at[k] = { k: kk, h: a.h ? 1 : 0 }; }

      .map(t => ({ ms: Math.round(+t.ms), at: Number.isFinite(+t.at) ? +t.at : 0, scr: typeof t.scr === "string" ? t.scr.slice(0, 200) : "" })).slice(-200);

  r.timerMode = o.timerMode === "tap" ? "tap" : "hold";

function scramble(n) {

let confettiRun = 0;
function confetti(count = 140) {
  if (reduceMotion) return;
  const cv = $("#confetti"); cv.hidden = false;
  const W = cv.width = innerWidth, H = cv.height = innerHeight, ctx = cv.getContext("2d");
  const cs = getComputedStyle(document.documentElement);
  const cols = ["W", "Y", "G", "R", "B", "O"].map(k => cs.getPropertyValue("--st-" + k).trim() || "#fc0");
  const ps = Array.from({ length: count }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 6 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * 6)] }));
  const id = ++confettiRun, t0 = performance.now();
  const fr = now => {
    if (id !== confettiRun) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.strokeRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore(); }
    if (now - t0 < 2600) requestAnimationFrame(fr); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  };
  requestAnimationFrame(fr);
}

function notePred(key, right, unit) {
  const st = S.pred[key] || { n: 0, ok: false, first: false, at: "" };
  if (st.ok) return st;
  st.n = Math.min(99, st.n + 1);
  if (st.n === 1) Hook.emit("prediction_made", { unit, item: key });
  Hook.emit("answer_checked", { unit, item: key, correct: right, attempt: st.n });
  if (right) { st.ok = true; st.first = st.n === 1; st.at = today(); }
  S.pred[key] = st; markActive(); save();

}

  const p = predFor(i); if (!p) return;
  if (S.pred["d" + i] && S.pred["d" + i].ok) return;
  const right = k === p.a;
  notePred("d" + i, right, "week" + (Math.floor(i / 7) + 1));
  if (!right) (predWrong[i] = predWrong[i] || []).push(k);

p once. Which move brings it back?","ik":{"zh":"002-zh","en":"003-en"},"goalText":"撤销一步，让六面恢复同色。|Undo one turn and restore the cube.","tip":"右上和右下，是一对相反动作。|Right up and right down undo each other.","setup":["R"],"beats":[{"m":["R'"],"n":"右上和右下，是一对相反动作。|Right up and right down undo each other.","k":{"zh":"004-zh","en":"005-en"},"h":null}],"goal":{"kind":"solved"},"pick":null,"kind":"undo","hints":false,"quiz":{"q":"转过以后，怎样回到刚才？|How do you undo a turn?","o":["同一层，反方向转|Turn the same layer the other way","随便换一层转|Turn any other layer"],"a":0,"x":"是的！同一层的相反动作，会把它带回来。|Yes! The opposite turn on the same layer brings it back.","qk":{"zh":"course-2-zh","en":"course-5-en"},"xk":{"zh":"course-1-zh","en":"course-4-en"}},"demo":null},{"id":3,"g":0,"t":"两步小侦探|Two-move detective","c":"To undo several moves, undo the last one first (reverse order).","intro":"先撤销最后一步，再撤销第一步。试试让魔方回家。|Undo the last move first, then the first move. Bring the cube home.","ik":{"zh":"006-zh","en":"007-en"},"goalText":"按相反顺序撤销两步。|Undo two moves in reverse order.","tip":"原来是右上、顶左。回去就是顶右、右下。|It was right up, then top left. Undo with top right, then right down.","setup":["R","U"],"beats":[{"m":["U'"],"n":"原来是右上、顶左。回去就是顶右、右下。|It was right up, then top left. Undo with top right, then right down.","k":{"zh":"008-zh","en":"009-en"},"h":null},{"m":["R'"],"n":"原来是右上、顶左。回去就是顶右、右下。|It was right up, then top left. Undo with top right, then right down.","k":{"zh":"008-zh","en":"009-en"},"h":null}],"goal":{"kind":"solved"},"pick":null,"kind":"undo","hints":false,"quiz":{"q":"撤销两步时，先撤销哪一步？|When undoing two moves, which do you undo first?","o":["最后做的那一步|The move you did last","最先做的那一步|The move you did first"],"a":0,"x":"倒着退回来：先撤销最后一步，再撤销第一步。|Go back in reverse: undo the last move, then the first.","qk":{"zh":"course-13-zh","en":"course-15-en"},"xk":{"zh":"course-12-zh","en":"course-14-en"}},"demo":null},{"id":4,"g":0,"t":"四拍小舞步|The four-move dance","c":"A four-move dance (R U R' U') is one set: the middle looks messy, so /* goals.js - goal checkers for the 20 guided lessons ("quest").
 *
 * Works in Node (require) and in a plain browser <script> (window.QuestGoals).
 * Framework-free, no dependencies. Written against the Cube Class model:
 *   cube = { n, h, c: [ { p:[x,y,z], st:[ { n:[x,y,z], c:'W'|'Y'|'R'|'O'|'G'|'B' } ] , id } ] }
 *   made by makeCube(n), turned by applyAlg(cube, tokens).
 * Axes: +x = Right, +y = Up, +z = Front (toward the viewer).
 *
 * The checkers never look at colour NAMES except where a lesson itself says a colour
 * (white layer, "white down", "yellow facing down", "pick the corner with W,R,B").
 * "Home" of a piece is computed from a freshly made solved cube of the same size, so the
 * checkers keep working whichever way round the page colours the right/left faces.
 *
 * Usage:
 *   const G = QuestGoals.bind({ makeCube, applyAlg });      // pass the page's model functions
 *   G.check({kind:'solved'}, cube)                           // -> true / false
 *   G.check({kind:'pick-corner', colors:['W','R','B']}, cube, { picked: cubieId })
 *   G.check({kind:'quiz', answer:1}, cube, { quizAnswer: 1 })
 *   G.check({kind:'history-ends-with', moves:['R',"R'"]}, cube, { history: [...] })
 *   G.stateAfter(lesson, k)    // cube after lesson.setup + first k solution moves
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.QuestGoals = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var FACE_VEC = {
    U: [0, 1, 0], D: [0, -1, 0], R: [1, 0, 0], L: [-1, 0, 0], F: [0, 0, 1], B: [0, 0, -1]
  };
