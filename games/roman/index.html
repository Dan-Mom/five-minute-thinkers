<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roman Kingdom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5b3a8c">
<title>Roman Numeral Kingdom Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
/*== STAGE 1: base theme + layout ==*/
:root{
  --sky:#8fd3f4;--sky2:#d6f1ff;--gold:#f6b93b;--gold2:#c98a12;--terra:#e0702f;--terra2:#b1471a;
  --marble:#fbf5e6;--marble2:#eadfc4;--stone:#dccca6;--stone2:#a8946a;--purple:#5b3a8c;--purple2:#3d2566;
  --olive:#46701a;--ink:#2f2340;--good:#1f9d4d;--bad:#c2410c;--r:18px;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
  --font:"Trebuchet MS","Avenir Next Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--purple2);font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:0 var(--sr) var(--sb) var(--sl);
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,#f4e7c5 100%)}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(6px + var(--st)) 10px 6px;background:linear-gradient(var(--purple),var(--purple2));
  color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);position:relative;z-index:60} /* above the modal dim layer so Map/Mute/Scroll stay reachable */
#hud .sp{flex:1}
.hbtn{min-width:52px;height:52px;border-radius:16px;border:0;background:rgba(255,255,255,.16);color:#fff;font:800 15px var(--font);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.hbtn:active{background:rgba(255,255,255,.35)}
.hbtn svg{width:30px;height:30px}
.pill{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:rgba(0,0,0,.28);font:800 20px var(--font)}
.pill svg{width:26px;height:26px}
.pill.bump{animation:bump .5s}
#stage{flex:1;min-height:0;position:relative}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px}
.screen.on{display:flex}
body[data-screen="title"] #hud .home,body[data-screen="title"] #hud .pill{visibility:hidden}
.btn{min-height:64px;min-width:64px;padding:0 28px;border-radius:22px;border:0;color:#fff;font:800 22px var(--font);letter-spacing:.3px;
  background:linear-gradient(var(--terra),var(--terra2));box-shadow:0 6px 0 #7a2f10,0 10px 16px rgba(0,0,0,.25);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #7a2f10,0 3px 6px rgba(0,0,0,.25)}
.btn.gold{background:linear-gradient(#ffd45e,var(--gold2));color:#4b2d00;box-shadow:0 6px 0 #8a5a06,0 10px 16px rgba(0,0,0,.25)}
.btn.green{background:linear-gradient(#22803f,#17703a);box-shadow:0 6px 0 #0b4a22,0 10px 16px rgba(0,0,0,.25)} /* white text >= 4.9:1 */
.btn.ghost{background:rgba(255,255,255,.75);color:var(--purple2);box-shadow:0 5px 0 rgba(61,37,102,.35)}
.btn.small{min-height:48px;min-width:48px;padding:0 18px;font-size:17px;border-radius:16px}
.btn[disabled]{opacity:.5;filter:grayscale(.5);pointer-events:none}
.ic{width:1em;height:1em}
.h1{font:900 clamp(30px,6vw,54px)/1.05 var(--serif);color:var(--purple2);text-shadow:0 3px 0 #fff,0 6px 12px rgba(0,0,0,.2);margin:0;text-align:center}
.center{flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.coach{flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;min-height:96px;margin-top:auto;padding-top:6px}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/*== STAGE 2: selftest panel ==*/
#selftest{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:999;background:#fff;color:#222;border:6px solid #999;border-radius:16px;padding:20px 26px;font:600 17px/1.5 var(--font);max-width:90vw;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#selftest.pass{border-color:#1f9d4d}#selftest.pass b{color:#1f9d4d;font-size:34px}
#selftest.fail{border-color:#c00}#selftest.fail b{color:#c00;font-size:34px}
#selftest button{margin-top:10px;min-height:48px;padding:0 20px;font-size:16px}
/*== STAGE 3: overlay, modal, confetti ==*/
#overlay{position:fixed;top:var(--hudb,0px);right:0;bottom:0;left:0;z-index:50;pointer-events:none} /* starts below the HUD (--hudb set by JS) */
.modal-back{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(40,20,80,.62);display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:12px 12px calc(12px + var(--sb))}
.modal{background:linear-gradient(#fffaf0,var(--marble2));border:6px solid var(--gold);border-radius:28px;width:min(94vw,680px);max-height:calc(100vh - 24px - var(--hudb,0px) - var(--sb));max-height:calc(100dvh - 24px - var(--hudb,0px) - var(--sb));overflow-y:auto;padding:18px 22px 22px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:mpop .35s cubic-bezier(.2,1.5,.4,1)}
.modal h2{margin:0 0 8px;font:900 clamp(24px,4.5vw,34px) var(--serif);color:var(--purple2)}
.mbody{font:600 clamp(17px,2.6vw,21px)/1.45 var(--font);margin:6px 0 14px}
.mbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
@keyframes mpop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#fx{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden;z-index:90}
#fx i{position:absolute;top:-16px;width:12px;height:18px;border-radius:3px;animation:cfall 2.4s ease-in forwards}
@keyframes cfall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.floaty{position:fixed;z-index:95;pointer-events:none;font:900 28px var(--font);color:#fff;text-shadow:0 2px 0 #b1471a,0 0 8px #ffd23f;transform:translate(-50%,-50%);animation:fup .9s ease-out forwards}
@keyframes fup{to{transform:translate(-50%,-150%);opacity:0}}
svg.star{width:34px;height:34px}svg.star.off{filter:grayscale(1) brightness(1.6);opacity:.55}
/*== STAGE 4a: mascot ==*/
.mascot{display:flex;align-items:flex-end;gap:6px;width:100%}
.mfig{flex:0 0 auto;width:clamp(72px,11vw,104px);transform-origin:50% 100%;animation:mbob 3s ease-in-out infinite}
.mfig .m-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.m-open{display:none}.mfig.cheer .m-open,.mfig.talk.cheer .m-open{display:block}.mfig.cheer .m-mouth{display:none}
.m-eyes{animation:blink 4.5s infinite;transform-origin:60px 60px}
.mfig.cheer{animation:mjump .7s ease}.mfig.oops{animation:mwob .7s ease}.mfig.think{animation:mthink 1s ease}
.bubble{position:relative;flex:1;background:#fff;border:4px solid var(--purple);border-radius:22px;padding:10px 14px;font:700 clamp(15px,2.3vw,20px)/1.35 var(--font);color:var(--ink);box-shadow:0 5px 12px rgba(0,0,0,.18);visibility:hidden;min-height:48px}
.bubble::before{content:"";position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right:14px solid var(--purple);border-left:0}
.bubble::after{content:"";position:absolute;left:-8px;bottom:20px;border:8px solid transparent;border-right:11px solid #fff;border-left:0}
.bubble.pop{animation:bpop .35s cubic-bezier(.2,1.6,.4,1)}
.bubble b{color:var(--terra2)}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes mjump{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.1,.86)}55%{transform:translateY(-26px) scale(.94,1.08)}100%{transform:translateY(0) scale(1)}}
@keyframes mwob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes mthink{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg) translateY(-3px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes bpop{from{transform:scale(.7);opacity:.2}to{transform:scale(1);opacity:1}}
/*== STAGE 4b: city ==*/
.city{width:100%;border-radius:20px;overflow:hidden;border:5px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25);background:#9fdcf7;line-height:0;flex:0 0 auto}
.city-svg{width:100%;height:auto;display:block}
.bld{transform-box:fill-box;transform-origin:50% 100%}
.bld.grow{animation:grow 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes grow{0%{transform:scale(0,0)}60%{transform:scale(1.2,1.2)}100%{transform:scale(1,1)}}
.cloud{animation:drift 40s linear infinite alternate}.cloud.c2{animation-duration:55s}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.one-bld{width:min(46vw,190px);height:auto}
/*== STAGE 4c: scroll + shop ==*/
.modal.scroll{background:linear-gradient(#f9ebc0,#f0d99c);border:6px solid #b07a2a;border-radius:14px 14px 30px 30px;width:min(96vw,720px);position:relative}
.scroll-wrap{text-align:left}
.sc-tabs{display:flex;gap:6px;margin-bottom:10px}
.sc-tab{flex:1;min-height:52px;border:3px solid #b07a2a;background:#fff8e0;border-radius:14px;font:800 clamp(14px,2.4vw,18px) var(--font);color:var(--purple2)}
.sc-tab.on{background:var(--purple);color:#fff;border-color:var(--purple2)}
.sc-page{max-height:calc(100dvh - 300px);min-height:220px;overflow-y:auto;font:600 clamp(15px,2.3vw,19px)/1.4 var(--font)}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sc-card{background:#fffdf3;border:3px solid #d9b56a;border-radius:16px;padding:6px 8px;text-align:center}
.sc-l{font:900 clamp(34px,6vw,48px) var(--serif);color:var(--purple2);line-height:1}.sc-v{font:900 22px var(--font);color:var(--terra2)}.sc-t{font-size:14px;color:#6a5a3a}
.sc-rule{background:#fffdf3;border:3px solid #d9b56a;border-radius:16px;padding:8px 14px;margin-bottom:10px}
.sc-rule h3{margin:0;font:900 20px var(--serif);color:var(--purple2)}.sc-rule p{margin:4px 0}.tiny{font-size:14px;color:#6a5a3a}
.sc-pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sc-pairs div{background:#efe2ff;border:2px solid var(--purple);border-radius:12px;padding:4px;text-align:center;font-size:17px}
.sc-pairs b{font:900 24px var(--serif);color:var(--purple2)}.sc-pairs small{display:block;font-size:13px;color:#555}
.sc-tbl{border-collapse:separate;border-spacing:4px;width:100%;text-align:center}
.sc-tbl th{font:800 13px var(--font)}.sc-tbl td{background:#fffdf3;border:2px solid #d9b56a;border-radius:8px;font:900 clamp(17px,3vw,24px) var(--serif);padding:2px}
.ka{color:#d9622b}.kb{color:#2a6fd1}.kc{color:#1f8a44}
.sc-split{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;text-align:center;font:800 clamp(18px,3vw,26px) var(--serif);margin:8px 0}
.sc-split div{background:#efe2ff;border:2px solid var(--purple);border-radius:10px;padding:4px}.sc-split .dn{background:none;border:0;color:var(--terra2)}.sc-split .wide{grid-column:1/-1;background:#fff3b0;border-color:var(--gold2)}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
.sh{margin:0;font:900 clamp(26px,5vw,40px) var(--serif);color:var(--purple2);text-shadow:0 2px 0 #fff}
.shop-tabs{display:flex;gap:10px;margin:10px 0;flex:0 0 auto;flex-wrap:wrap}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;flex:0 0 auto;margin-bottom:12px}
.shop-card{background:linear-gradient(#fffaf0,#f0e2c0);border:4px solid var(--gold);border-radius:20px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 10px rgba(0,0,0,.18)}
.shop-card .prev{width:100%;display:flex;justify-content:center}.shop-card .prev svg{width:96px;height:auto;max-height:100px}
.shop-card .nm{font:800 16px var(--font);text-align:center}.shop-card .cost{font:900 18px var(--font);display:flex;align-items:center;gap:4px;color:#8a5a06}.shop-card .cost svg{width:22px;height:22px}
.shop-card .btn{width:100%}
/*== STAGE 5a: activity shell ==*/
.act-head{flex:0 0 auto;margin-bottom:6px}
.atitle{font:900 clamp(20px,3.6vw,30px) var(--serif);color:var(--purple2);text-shadow:0 2px 0 #fff;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.atitle small{font:800 14px var(--font);color:#fff;background:var(--purple);border-radius:12px;padding:2px 10px}
.result .rstars{display:flex;justify-content:center;gap:4px}.result svg.star{width:64px;height:64px;animation:starpop .6s both}
.result svg.star:nth-child(2){animation-delay:.2s}.result svg.star:nth-child(3){animation-delay:.4s}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}
.result p{margin:6px 0;font:700 clamp(17px,2.6vw,21px) var(--font)}.rcoin{display:flex;justify-content:center;align-items:center;gap:6px;color:#8a5a06;font-weight:900!important}
.rcoin svg{width:28px;height:28px}
.newb{background:#fff;border:4px dashed var(--purple);border-radius:20px;padding:6px;margin-top:8px;animation:mpop .5s .5s both}.newb p{margin:0}
.intro .mbody{text-align:left}
/*== STAGE 5b: collect ==*/
.cstat{display:flex;gap:8px}.pill2{white-space:nowrap;background:var(--purple);color:#fff;border-radius:20px;padding:6px 14px;font:800 17px var(--font);min-height:40px;display:flex;align-items:center;gap:6px}.pill2 b{font-size:22px}
.cprompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border:4px solid var(--purple);border-radius:22px;padding:6px 14px;margin-bottom:8px;font:800 clamp(17px,3vw,24px) var(--font);min-height:64px}
.cprompt.flash{animation:mpop .4s}
.chip{min-width:56px;height:56px;padding:0 10px;border-radius:14px;background:linear-gradient(#f4ead0,var(--stone));border:3px solid var(--stone2);display:inline-flex;align-items:center;justify-content:center;font:900 32px var(--serif);color:var(--purple2);box-shadow:0 4px 0 var(--stone2)}
.chip.num{font-family:var(--font);color:var(--terra2)}
.field{flex:1 1 0;min-height:220px;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(#c6ecff,#fdf1d2);border:4px solid #fff;box-shadow:inset 0 0 20px rgba(0,0,0,.08);touch-action:none}
.sym{position:absolute;left:0;top:0;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6dc,var(--stone) 60%,var(--stone2));border:4px solid #8f7a4c;display:grid;place-items:center;
  font:900 34px var(--serif);color:var(--purple2);touch-action:none;will-change:transform;box-shadow:0 5px 8px rgba(0,0,0,.25);cursor:grab}
.sym span{display:block;animation:spawn .35s cubic-bezier(.2,1.6,.4,1)}
.sym.held{z-index:5;filter:brightness(1.1) drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.sym.no span{animation:shake .45s}.sym.glow{border-color:#ffd23f;box-shadow:0 0 0 6px rgba(255,210,63,.75),0 0 26px 10px #fff2a0}
.basket{position:absolute;bottom:4px;left:50%;margin-left:-75px;width:150px;height:84px;pointer-events:none}.basket svg{width:100%;height:100%}
.basket.bump{animation:bump .4s}
@keyframes spawn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-8deg)}60%{transform:translateX(9px) rotate(8deg)}}
/*== STAGE 6b: build ==*/
.rs{font-family:var(--serif)}
.btarget{flex:0 0 auto;display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;background:#fff;border:4px solid var(--purple);border-radius:22px;padding:4px 14px;margin-bottom:8px}
.btarget .lbl{font:800 clamp(18px,3vw,24px) var(--font);color:var(--purple2)}.btarget .big{font:900 clamp(40px,8vw,64px)/1.1 var(--font);color:var(--terra2)}
.btarget .split{font:800 clamp(18px,3vw,26px) var(--font);color:var(--olive)}.btarget.flash{animation:mpop .4s}
.lanes{flex:0 0 auto;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.lane{background:rgba(255,255,255,.78);border:4px dashed var(--stone2);border-radius:20px;padding:6px 8px;min-height:104px;display:flex;flex-direction:column;gap:2px;transition:background .15s,border-color .15s}
.lane.await{border-color:var(--terra)}.lanes.await .lane{border-color:var(--terra);background:#fff5e6;animation:pulse 1s infinite}
.lane.hot{border-color:var(--olive);background:#eaffd8;border-style:solid}.lane.ok{border-color:var(--good);border-style:solid;background:#e9ffe8}
.lane.bad{animation:shake .45s}
.lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:800 15px var(--font);color:var(--purple2)}.lh b{font-size:17px}.lsym{font:700 14px var(--serif);color:#666}
.lval{margin-left:auto;background:var(--gold);color:#4b2d00;border-radius:12px;padding:1px 10px;font:900 18px var(--font)}
.tray{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:62px}.tray .ph{color:#6b5a38;font:700 15px var(--font);padding:0 4px}
.lprev{min-height:22px;font:700 15px var(--font);color:var(--olive)}.lprev i{color:#9a5a2a}
.blk{position:relative;width:60px;height:60px;border-radius:12px;background:linear-gradient(#fff6de,var(--stone) 70%,#c9b78a);border:3px solid #8f7a4c;box-shadow:0 5px 0 #8f7a4c,0 8px 8px rgba(0,0,0,.2);
  display:inline-flex;align-items:center;justify-content:center;font:900 30px var(--serif);color:var(--purple2);touch-action:none;flex:0 0 auto}
.blk i{position:absolute;right:4px;bottom:1px;font:800 11px var(--font);color:#7a6a3a;font-style:normal}
.blk.pal{width:64px;height:64px;cursor:grab}.blk.pal.sel{outline:5px solid var(--terra);outline-offset:3px;transform:translateY(-6px)}
.blk.ghost{position:fixed;z-index:200;pointer-events:none;transform:scale(1.15) rotate(-5deg);opacity:.95;width:64px;height:64px}
.blk.drop{animation:drop .35s cubic-bezier(.2,1.5,.4,1)}.blk.hop{animation:hop .5s both}
.palette{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 8px;padding:8px;background:rgba(255,255,255,.5);border-radius:20px}
.bacts{flex:0 0 auto;display:flex;gap:12px;justify-content:center;align-items:center;margin:4px 0}.bacts .btn.green,.bacts .btn.gold{min-width:190px}
.combine{flex:0 0 auto;text-align:center;margin-top:6px;font:900 clamp(22px,4vw,34px) var(--serif);color:var(--purple2)}.combine .pc{display:inline-block;background:#fff;border:3px solid var(--purple);border-radius:14px;padding:0 12px;animation:mpop .4s}
.combine .pl{margin:0 8px;color:var(--terra2)}.combine .big2{background:#fff3b0;border-color:var(--gold2);font-size:1.3em;animation:mpop .5s}
@keyframes drop{0%{transform:translateY(-30px) scale(1.2);opacity:.3}100%{transform:none;opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,112,47,.5)}50%{box-shadow:0 0 0 8px rgba(224,112,47,0)}}
/*== STAGE 7: memory match ==*/
.mgrid{flex:1 1 0;min-height:260px;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);grid-auto-rows:1fr;gap:10px;margin-bottom:6px}
.mc{position:relative;perspective:700px;min-height:72px;cursor:pointer;touch-action:manipulation}
.mc .in{position:absolute;top:0;right:0;bottom:0;left:0;transition:transform .45s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.mc.f .in{transform:rotateY(180deg)}
.face{position:absolute;top:0;right:0;bottom:0;left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 5px 10px rgba(0,0,0,.25)}
.face.back{background:radial-gradient(circle at 50% 40%,#7a4fb0,var(--purple2));border-color:var(--gold)}.face.back svg{width:60%;max-width:80px}
.face.front{transform:rotateY(180deg);background:linear-gradient(#fffdf3,var(--marble2));color:var(--purple2)}
.face .ct{font:900 clamp(24px,6.5vw,44px)/1 var(--serif)}.face.long .ct{font-size:clamp(17px,4.6vw,30px);font-family:var(--font)}.face small{font:800 clamp(11px,1.8vw,14px) var(--font);color:#8a6a3a;text-transform:uppercase;letter-spacing:.5px}
.mc.ok .face.front{background:linear-gradient(#f4ffe8,#c9f0b0);border-color:var(--good)}
.mc.glow .face{box-shadow:0 0 0 6px rgba(255,210,63,.8),0 0 26px 10px #fff2a0;animation:pulse 1s infinite}
/*== STAGE 8: gate ==*/
.gscene{flex:0 0 auto;display:flex;justify-content:center;margin-bottom:6px}.gsvg{width:min(100%,420px);height:auto;max-height:22vh}.gscene.shake{animation:shake .45s}
.dl,.dr{transition:transform 1.1s cubic-bezier(.5,0,.3,1)}.dl{transform-box:fill-box;transform-origin:0 50%}.dr{transform-box:fill-box;transform-origin:100% 50%}
.gsvg.open .dl,.gsvg.open .dr{transform:scaleX(.08)}
.rq{flex:0 0 auto;background:#fff;border:4px solid var(--purple);border-radius:22px;padding:8px 16px 10px;margin-bottom:10px;text-align:center}.rq.flash{animation:mpop .4s}

.node.open{border-color:var(--terra);animation:pulse 1.4s infinite}.node.done{border-color:var(--good);background:linear-gradient(#f4ffe8,#d6f2c0)}
.node.locked{opacity:.6;filter:grayscale(.6);border-style:dashed}.node.hilite{outline:5px solid var(--gold);outline-offset:3px}
.node.gatenode{background:linear-gradient(#fff0c8,#f6d98a);border-color:var(--gold2)}

<script>
'use strict';
/* Host context (SYSTEM-CONTRACT 4.1, review R1): a host can pass ?profile=<id>&lang=<zh|en>&host=<origin> in the address (a cross-origin
   iframe host cannot set our window variables). Read it BEFORE any event is emitted or any save is loaded. window.PE_LEARNING_CONTEXT wins if set. */
const cleanId=x=>String(x).replace(/[^A-Za-z0-9_.-]/g,'_').slice(0,40);
/* only a real http(s) origin counts as a host: "*", "null", javascript: and garbage are rejected (review F4) */
const cleanHost=h=>{try{if(typeof h!=='string'||!h)return null;const u=new URL(h);return(u.protocol==='https:'||u.protocol==='http:')?u.origin:null}catch(e){return null}};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};   /* storage can be blocked: never let a read kill the page (review F1) */
const readContext=(search,c)=>{try{const q=new URLSearchParams(search);
  if(q.get('profile')&&!c.profile)c.profile=cleanId(q.get('profile'));
  if(q.get('host')&&!c.hostOrigin){const h=cleanHost(q.get('host'));if(h)c.hostOrigin=h}
  if(q.get('lang')&&!c.lang)c.lang=q.get('lang')}catch(e){}return c};
try{window.PE_LEARNING_CONTEXT=readContext(location.search,(window.PE_LEARNING_CONTEXT&&typeof window.PE_LEARNING_CONTEXT==='object')?window.PE_LEARNING_CONTEXT:{})}catch(e){}
/*==================================================================================================
  LearningHook  -  progress events for the Five-Minute Academy system (SYSTEM-CONTRACT.md section 4, schema 1)
  lesson_id: math.g3.roman-numeral-kingdom      No personal data anywhere: `profile` is an anonymous random id.

  LearningHook.emit(name, data)  -> builds and delivers ONE event, never throws into the game:
    { schema:1, lesson_id, event:name, ts:"2026-09-26T18:04:05Z", session:"<random per page load>",
      profile:"<anonymous id in localStorage lp_profile_v1:<slot>, or PE_LEARNING_CONTEXT.profile>", data:{...,lang:"en"} }
  Delivery (each step in its own try/catch):
    1. appended to localStorage `lp_events_v1` (JSON array, newest last, max 500, oldest dropped)
    2. window.PE_LEARNING_HOOK(event) if the host defined that function
    3. inside an iframe: parent.postMessage({type:"learning-event",event}, PE_LEARNING_CONTEXT.hostOrigin) - and ONLY when a host origin is known
       (address ?host=<origin> or PE_LEARNING_CONTEXT.hostOrigin). Never "*": with no host the event just stays in the local queue.
  LearningHook.peek() -> copy of the queue;  .count();  .clear();  page address #events shows the queue on screen.
  Notes for the host / parent dashboard (system-review S1-S3):
    - unit "world1" = ones place (I V X), "world2" = tens place (X L C), "world3" = hundreds place (C D M).
    - gate_passed always fires when the gate opens (the game has no fail state): read data.correct / data.total (first-try answers), not "passed".
    - lp_events_v1 is ONE queue shared by every lesson on this browser origin, capped at 500 (oldest dropped): a host should take events through
      PE_LEARNING_HOOK, and treat the queue only as an offline fallback, never as storage.
    - answer_checked.tag values (registry: SYSTEM-CONTRACT 4.1): repeat-limit, bad-subtract, bad-order, wrong-place, wrong-value.
  Events (each fires once per real child action, never on re-render):
    started            {}                          first open per lesson+profile (remembered in localStorage lp_started_v1:<lesson>:<profile>)
    activity_completed {unit:"world1|2|3", activity:"symbol-catch|block-builder|memory-match|master-builder|speedy-catch",
                        score, max, stars, attempts, hints}    score is capped at max; attempts = answer taps/checks/flip-pairs
    gate_passed        {unit, correct, total, attempts}        correct = riddles right on the first try; attempts = answer taps
    unit_completed     {unit, stars_total}                     the first time all 6 nodes of a world are done
    hint_used          {unit, activity}                        each time the mascot hint / reveal / glow help fires
    session_end        {seconds}                               on pagehide / tab hidden, once per hide (seconds visible since load or last return)
==================================================================================================*/
/*==================================================================================================
  Who is playing?  -  one save per child (SYSTEM-CONTRACT section 4.1: "save keys carry the profile")
  Four built-in animal slots, no names and no typing. Each slot has its OWN save (rnk_state:<slot>) and its OWN anonymous
  event id (lp_profile_v1:<slot>), so brothers and sisters on one iPad never overwrite each other and the parent
  dashboard can tell them apart. If a host app sets window.PE_LEARNING_CONTEXT.profile, that profile IS the slot (no picker).
  Old single saves (rnk_state) are copied once to the Lion slot (the old file is left untouched).
  Launch rule: 2 or more children have progress -> always ask; otherwise go straight to the only / last player.
==================================================================================================*/
const Who=(function(){
  const CUR='rnk_who',SLOTS=[{id:'lion',icon:'\uD83E\uDD81',name:'Lion'},{id:'fox',icon:'\uD83E\uDD8A',name:'Fox'},{id:'panda',icon:'\uD83D\uDC3C',name:'Panda'},{id:'owl',icon:'\uD83E\uDD89',name:'Owl'}];
  let mem=null;
  /* a host-given child id is read ONCE at boot and frozen (a host changing it later must not make us write the old child's save into the new key) */
  const HOSTED=(()=>{try{const c=window.PE_LEARNING_CONTEXT;return c&&c.profile?cleanId(c.profile):null}catch(e){return null}})();
  const hostProfile=()=>HOSTED;
  const valid=id=>SLOTS.some(s=>s.id===id);
  function get(){if(HOSTED)return HOSTED;if(mem&&valid(mem))return mem;
    const v=lsGet(CUR);if(valid(v)){mem=v;return v}return null}
  function set(id){if(!valid(id))return;mem=id;try{localStorage.setItem(CUR,id)}catch(e){}}
  const slot=id=>SLOTS.filter(s=>s.id===id)[0]||null;
  /* one-time move of the old single save to the Lion slot; `st` is any storage-like object (tests pass an in-memory one) */
  function migrate(st){try{st=st||localStorage}catch(e){return false}   /* reading the localStorage PROPERTY can throw (blocked cookies, sandboxed iframe) */
    try{if(st.getItem('rnk_legacy_moved')==='1')return false;const legacy=st.getItem('rnk_state');
      if(legacy&&st.getItem('rnk_state:lion'))return false;      /* the Lion already has a save: leave the old one alone and try again later, never abandon it */
      if(legacy){st.setItem('rnk_state:lion',legacy);st.setItem('rnk_legacy_copied','1');
        const lp=st.getItem('lp_profile_v1');if(lp&&!st.getItem('lp_profile_v1:lion'))st.setItem('lp_profile_v1:lion',lp)}
      st.setItem('rnk_legacy_moved','1');return !!legacy}catch(e){return false}}
  /* launch rule (pure): who plays now? cur = remembered player, withData = players that have progress.
     Never silently drop a child into another child's kingdom: when it is not clear whose turn it is, ask. */
  function launch(cur,withData){cur=valid(cur)?cur:null;
    if(withData.length===0)return cur?{pick:cur,chooser:false}:{pick:null,chooser:true};
    if(withData.length===1&&(!cur||cur===withData[0]))return{pick:withData[0],chooser:false};
    return{pick:cur,chooser:true}}
  return{SLOTS,get,set,slot,migrate,launch,hosted:()=>!!HOSTED,hostedId:HOSTED,needChooser:false,
    /* true while nobody has been chosen yet (or the chooser is open): no play, no saving, no events */
    pending(){return !HOSTED&&(this.needChooser||!get())},
    active(){return !HOSTED&&this.needChooser?null:get()},
    icon(){const s=slot(get());return s?s.icon:''},name(){const s=slot(get());return s?s.name:''}};
})();
const LearningHook=(function(){
  const LESSON='math.g3.roman-numeral-kingdom',QK='lp_events_v1',PK='lp_profile_v1',SK='lp_started_v1',MAX=500;
  const rid=n=>{let s='';try{const a=new Uint8Array(n);crypto.getRandomValues(a);a.forEach(x=>s+=(x%36).toString(36))}catch(e){for(let i=0;i<n;i++)s+=Math.floor(Math.random()*36).toString(36)}return s};
  const session=rid(8);let memProfile={},memStarted={},segStart=Date.now(),ended=false;
  const ctx=()=>{try{return(window.PE_LEARNING_CONTEXT&&typeof window.PE_LEARNING_CONTEXT==='object')?window.PE_LEARNING_CONTEXT:{}}catch(e){return{}}};
  function profile(){if(Who.hosted())return Who.hostedId;
    const k=Who.get()?PK+':'+Who.get():PK;  /* one anonymous id per player slot */
    try{let p=localStorage.getItem(k);if(!p){p='p'+rid(10);localStorage.setItem(k,p)}return p}catch(e){return memProfile[k]||(memProfile[k]='p'+rid(10))}}
  /* Bounded queue over a storage-like object {getItem,setItem,removeItem}. If writing (or reading) throws, it keeps a
     bounded in-memory queue (max MAX, oldest dropped, no duplicates) and peek() returns that combined ordered queue. */
  function makeQueue(store,key,max){let mem=[],failed=false;
    const rs=()=>{try{const raw=store.getItem(key);if(raw==null)return[];const a=JSON.parse(raw);return Array.isArray(a)?a:[]}catch(e){return null}};
    function append(ev){let base=failed?mem:rs();if(base===null){failed=true;base=mem}
      base=base.slice();if(base.indexOf(ev)<0)base.push(ev);while(base.length>max)base.shift();
      try{store.setItem(key,JSON.stringify(base));if(failed&&rs()!==null){failed=false;mem=[]}return true}catch(e){failed=true;mem=base;return false}}
    const peek=()=>(failed?mem:(rs()||mem)).slice();
    return{append,peek,count:()=>peek().length,clear(){try{store.removeItem(key)}catch(e){}mem=[];failed=false},get failed(){return failed}}}
  const Q=makeQueue({getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v),removeItem:k=>localStorage.removeItem(k)},QK,MAX);
  function make(name,data){const d=Object.assign({},data||{});d.lang='en';
    return{schema:1,lesson_id:LESSON,event:String(name),ts:new Date().toISOString().replace(/\.\d+Z$/,'Z'),session,profile:profile(),data:d}}
  /* where framed events may go: ONLY the host's declared origin. No host known -> no postMessage at all (the event stays in the local queue). */
  const postTarget=c=>c?cleanHost(c.hostOrigin):null;
  function deliver(ev){
    try{if(typeof window.PE_LEARNING_HOOK==='function')window.PE_LEARNING_HOOK(ev)}catch(e){}
    try{const ho=postTarget(ctx());if(window.parent&&window.parent!==window&&ho)window.parent.postMessage({type:'learning-event',event:ev},ho)}catch(e){}}
  function emit(name,data){try{const ev=make(name,data);Q.append(ev);deliver(ev);return ev}catch(e){return null}}
  const peek=()=>Q.peek();
  return{emit,peek,count:()=>Q.count(),make,makeQueue,MAX,LESSON,postTarget,
    clear(){Q.clear()},
    /* 'started' once per lesson AND profile: key lp_started_v1:<lesson>:<profile>, in-memory fallback if storage is blocked */
    startOnce(){const k=SK+':'+LESSON+':'+profile();if(memStarted[k])return;memStarted[k]=1;
      try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1')}catch(e){}emit('started',{})},
    /* time on the page: one session_end per hide */
    hide(){if(ended)return;ended=true;if(!Who.active())return;/* nobody has picked a player yet: no session to report */emit('session_end',{seconds:Math.max(0,Math.round((Date.now()-segStart)/1000))})},
    /* the child is switching players: close out the OUTGOING child's time now, so it is never billed to the next child (review F3) */
    flush(){if(ended||!Who.active()){segStart=Date.now();return}const sec=Math.round((Date.now()-segStart)/1000);segStart=Date.now();if(sec>0)emit('session_end',{seconds:sec})},
    show(){ended=false;segStart=Date.now()}};
})();
document.addEventListener('visibilitychange',()=>{try{document.visibilityState==='hidden'?LearningHook.hide():LearningHook.show()}catch(e){}});

//==RN-BEGIN
const RN=(function(){
  const VAL={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
  const PAIRS=['IV','IX','XL','XC','CD','CM'];            // the ONLY legal subtractive pairs
  const PLACE=[['I','V','X'],['X','L','C'],['C','D','M'],['M','','']]; // ones, tens, hundreds, thousands
  const PLACE_NAMES=['ones','tens','hundreds','thousands'];
  const WORLD_SYMS={1:['I','V','X'],2:['X','L','C'],3:['C','D','M']};
  const WORLD_PALETTE={1:['I','V','X'],2:['I','V','X','L','C'],3:['I','V','X','L','C','D','M']};
  const SHAPES=['','A','AA','AAA','AB','B','BA','BAA','BAAA','AC']; // the 1-9 pattern; A=one B=five C=ten symbol
  function digitRoman(d,p){const s=PLACE[p];if(d===0)return '';
    return SHAPES[d].replace(/[ABC]/g,k=>s['ABC'.indexOf(k)]);}
  function toRoman(n){
    if(!Number.isInteger(n)||n<1||n>3999)return null;
    let out='';const ds=[Math.floor(n/1000),Math.floor(n/100)%10,Math.floor(n/10)%10,n%10];
    out+='M'.repeat(ds[0]);out+=digitRoman(ds[1],2)+digitRoman(ds[2],1)+digitRoman(ds[3],0);return out;}
  const STD=/^M{0,3}(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/;
  function fromRoman(s){
    if(typeof s!=='string'||!s||!STD.test(s))return null;
    let v=0;for(let i=0;i<s.length;i++){const a=VAL[s[i]],b=VAL[s[i+1]]||0;v+=a<b?-a:a;}
    return toRoman(v)===s?v:null;              // must be exactly the standard spelling
  }
  /* Why is s not standard? -> {ok, value, reason, pair} (used for kind hints) */
  function diagnose(s){
    const v=fromRoman(s);if(v!==null)return{ok:true,value:v};
    if(!s)return{ok:false,reason:'empty'};
    if(/[^IVXLCDM]/.test(s))return{ok:false,reason:'symbol'};
    for(let i=0;i<s.length-1;i++)if(VAL[s[i]]<VAL[s[i+1]]&&!PAIRS.includes(s[i]+s[i+1]))return{ok:false,reason:'pair',pair:s[i]+s[i+1]};
    if(/(.)\1{3}/.test(s))return{ok:false,reason:'four'};
    for(const c of 'VLD')if(s.split(c).length>2)return{ok:false,reason:'twice',sym:c};
    return{ok:false,reason:'order'};
  }
  /* Split by place value: 975 -> [{place:'hundreds',value:900,roman:'CM'},{tens,70,'LXX'},{ones,5,'V'}] (zeros kept, roman '') */
  function split(n){
    const ds=[Math.floor(n/100)%10,Math.floor(n/10)%10,n%10],ps=[2,1,0];
    return ds.map((d,i)=>({place:PLACE_NAMES[ps[i]],p:ps[i],digit:d,value:d*Math.pow(10,ps[i]),roman:digitRoman(d,ps[i])}));
  }
  /* Same 1-9 shape in another place: swapDigit(7,0,1) -> 'LXX' */
  const swapDigit=(d,from,to)=>digitRoman(d,to);
  return{VAL,PAIRS,PLACE,PLACE_NAMES,WORLD_SYMS,WORLD_PALETTE,SHAPES,digitRoman,toRoman,fromRoman,diagnose,split,swapDigit};
})();
//==RN-END==

      if(last){S.finale=true;Store.save()}},1300)}
}));
/*== STAGE 9: title screen + world map (progression, unlocks, skyline) ==*/
Screens.reg('title',{
  enter(root){root.innerHTML='';root.classList.add('center');
    const started=Game.doneCount()>0;
    root.append(h('div',{class:'tlogo'},[h('div',{class:'tsub',text:'Ancient Rome needs you!'}),h('h1',{class:'h1',html:'Roman Numeral<br>Kingdom Builder'})]),
      h('div',{class:'city tcity'}),
      h('div',{class:'trow'},[h('button',{class:'btn gold big',text:started?'Continue ▶':'Play! ▶',onclick:()=>{Snd.unlock();Snd.play('good');Screens.go('map')}})]),
      ...(Who.hosted()?[]:[h('button',{class:'btn small ghost','aria-label':'Playing as '+Who.name()+'. Change player',text:Who.icon()+' '+Who.name()+' \u00B7 Change player',onclick:()=>{Snd.play('tap');Screens.go('who')}})]),
      ...(started?[h('button',{class:'btn small ghost',text:'Start over',onclick:()=>{Snd.play('tap');UI.confirmReset()}})]:[]),
      h('div',{class:'coach tcoach'}),
      h('p',{class:'stip',text:'No sound? Check the silent switch on the side of your iPad.'}));
    City.render($('.tcity',root),{});
    Mascot.mount($('.coach',root));
    Mascot.say(started?'Welcome back, builder! Your city is waiting!':'Salve! I am Leo. Let’s build a Roman city and learn the numbers together!',{mood:'cheer'})}});
Screens.reg('who',{
  enter(root){root.innerHTML='';root.classList.add('center');
    LearningHook.flush();Who.needChooser=true;S=Store.def();Game.refreshHud();   /* show zeros, never the last child's coins; nothing can be saved until an animal is picked */
    const cur=Who.get();
    root.append(h('div',{class:'tlogo'},[h('div',{class:'tsub',text:'Who is playing?'})]),
      h('div',{class:'whoRow',role:'group','aria-label':'Choose your animal'},Who.SLOTS.map(x=>{const m=Store.summary(x.id);
        return h('button',{class:'who'+(x.id===cur?' on':''),'aria-label':x.name+(m.stars?', '+m.stars+' stars':', new player'),onclick:()=>{Snd.unlock();Snd.play('good');Game.choosePlayer(x.id)}},
          [h('span',{class:'wi',text:x.icon}),h('span',{text:x.name}),h('small',{text:m.stars?'\u2B50 '+m.stars:'New!'})])})),
      ...(lsGet('rnk_legacy_copied')==='1'&&Store.has('lion')?[h('div',{class:'whoNote',text:'Your kingdom from before is with the Lion.'})]:[]),
      h('div',{class:'coach tcoach'}));
    Mascot.mount($('.coach',root));Mascot.say('Tap your animal, builder!',{mood:'cheer'})}});
Screens.reg('map',{w:0,
  enter(root,p){root.innerHTML='';root.classList.remove('center');
    if(p.w)this.w=p.w;
    if(!this.w||this.w>S.unlocked)this.w=S.unlocked;
    const w=this.w,W=WORLDS[w];
    root.append(h('div',{class:'row-head'},[h('h2',{class:'sh',text:'Your Kingdom'}),h('button',{class:'btn small gold',text:'Toga Shop',onclick:()=>{Snd.play('tap');Screens.go('shop')}})]));
    const city=h('div',{class:'city'});root.append(city);City.render(city,{grow:p.grow==null?undefined:p.grow});
    const tabs=h('div',{class:'wtabs'});
    [1,2,3].forEach(k=>{const open=k<=S.unlocked,b=h('button',{class:'btn small '+(k===w?'gold':'ghost'),html:(open?'':'🔒 ')+`World ${k}`,'aria-label':`World ${k}, ${WORLDS[k].name}${open?'':', locked'}`,
      onclick:()=>{if(!open){Snd.play('oops');Mascot.say(`Pass the Gate Keeper in ${lc1(WORLDS[k-1].name)} to open ${lc1(WORLDS[k].name)}!`,{mood:'think'});return}Snd.play('tap');this.w=k;this.enter(root,{})}});tabs.append(b)});
    root.append(tabs);
    root.append(h('div',{class:'wbanner',style:`border-color:${W.col}`,html:`<b>${W.name}</b><span>Numbers ${W.range} &middot; symbols <span class="rs">${W.syms}</span></span>`}));
    const path=h('div',{class:'path'});let nextIdx=-1;
    NODES.forEach((n,i)=>{const done=Game.isDone(w,i),open=Game.isOpen(w,i),st=done?Game.node(w,i).s:0;if(open&&!done&&nextIdx<0)nextIdx=i;
      const b=h('button',{class:'node '+(done?'done':open?'open':'locked')+(p.go===i?' hilite':''),'aria-label':`${n.name}${done?', done with '+st+' stars':open?'':', locked'}`,
        onclick:()=>{if(!open){Snd.play('oops');Mascot.say('That one is locked. Finish the one before it first!',{mood:'think'});return}Snd.play('good');Screens.go(n.k,{w,i})}},
        [h('span',{class:'nic',text:open||done?n.icon:'🔒'}),h('span',{class:'nnm',text:n.name}),h('span',{class:'nst',html:done?UI.stars(st):(i===5?'checkpoint':'')})]);
      if(i===5&&open&&!done)b.classList.add('gatenode');path.append(b)});
    root.append(path,h('div',{class:'coach'}));
    Mascot.mount($('.coach',root));
    const all=Game.worldDone(w);
    Mascot.say(p.grow!=null&&p.grow%6===5&&Math.floor(p.grow/6)+1<w?`The gate is open! Welcome to <b>${W.name}</b>!`:p.grow!=null?`Look! A new building appeared: <b>${BLD[p.grow][0]}</b>!`:all&&w<3?`${W.name} is finished! Try the next world.`:S.finale&&all?'You are a Master Builder! Replay any game to earn more coins.':Game.doneCount()===0?'Welcome to '+W.name+'! Start with the basket game.':nextIdx>=0?`Next up: <b>${NODES[nextIdx].name}</b>. Tap it!`:'Pick any game to play again!',{html:true,mood:p.grow!=null?'cheer':undefined});
    if(p.grow!=null)Snd.play('hat')}});
/* Offline install: the service worker is an extra. Only on https or localhost; the game works fully without sw.js. */
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)))
  window.addEventListener('load',()=>{try{
    const ensure=()=>{try{navigator.serviceWorker.ready.then(r=>{try{const w=r.active||navigator.serviceWorker.controller;if(w)w.postMessage('ensure')}catch(e){}}).catch(()=>{})}catch(e){}};
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(ensure,()=>{});
    window.addEventListener('online',ensure);
  }catch(e){}})}catch(e){}
/*== JS-END ==*/
window.addEventListener('DOMContentLoaded',()=>{if(Who.needChooser)Screens.go('who');else{Screens.go('title');LearningHook.startOnce()}if(location.hash==='#selftest')SelfTest.show();else if(location.hash==='#events')EventsView.show()});
</script>
