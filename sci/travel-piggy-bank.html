function pick(copy, lang){ return lang === "zh" ? copy.zh : copy.en; }
function pickLeveled(copy, level, lang){ return pick(copy[level], lang); }
function fillTemplate(text, values){
  return text.replace(/\{(\w+)\}/g, function(_, k){ return values[k] !== undefined ? values[k] : "{"+k+"}"; });
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
});}
function formatUsd(cents){
  var sign = cents < 0 ? "-" : "";
  return sign + "$" + (Math.abs(cents)/100).toFixed(2);
}

/* ---- money math (identical to content.ts) ------------------------------ */
function compoundTable(days, opts){
  opts = opts || {};
  var depositCents = opts.depositCents !== undefined ? opts.depositCents : 500;
  var ratePct = opts.ratePct !== undefined ? opts.ratePct : 1;
  var table = [], balance = 0;
  for (var day = 1; day <= days; day++){
    var interest = Math.round(balance * (ratePct/100));
    balance = balance + interest + depositCents;
    table.push({day:day, interestCents:interest, balanceCents:balance});
  }
  return table;
}
function flatBaseTable(days, opts){
  opts = opts || {};
  var depositCents = opts.depositCents !== undefined ? opts.depositCents : 500;
  var ratePct = opts.ratePct !== undefined ? opts.ratePct : 1;
  var flatInterest = Math.round(depositCents * (ratePct/100));
  var table = [], balance = 0;
  for (var day = 1; day <= days; day++){
    var interest = day === 1 ? 0 : flatInterest;
    balance = balance + interest + depositCents;
    table.push({day:day, interestCents:interest, balanceCents:balance});
  }
  return table;
}
function lumpSumTable(days, startCents, opts){
  opts = opts || {};
  var ratePct = opts.ratePct !== undefined ? opts.ratePct : 1;
  var table = [], balance = startCents;
  for (var day = 1; day <= days; day++){
    var interest = Math.round(balance * (ratePct/100));
    balance = balance + interest;
    table.push({day:day, interestCents:interest, balanceCents:balance});
  }
  return table;
}
var DAD_TABLE_20 = compoundTable(20);
var MODEL_TABLE_10 = compoundTable(10);
var FAIR_MIMI_3 = compoundTable(3);
var FAIR_QIQI_3 = flatBaseTable(3);
var FAIR_COCO_3 = compoundTable(3, {ratePct:2});
var MIA_LUMP_TABLE_3 = lumpSumTable(3, 2000);
function dayOf(day){ return DAD_TABLE_20[Math.max(1, Math.min(day, DAD_TABLE_20.length)) - 1]; }
function usdCell(entry){
  var s = "+" + formatUsd(entry.interestCents) + " → " + formatUsd(entry.balanceCents);
  return {zh:s, en:s};
}

/* ---- completion logic (ported from scenes/common.ts) --------------------*/
function observationCards(level){
  return OBSERVATION.cards.filter(function(c){ return level === "B" || !c.levelBOnly; });
}
function observationDone(r, level){
  var cards = observationCards(level);
  var placed = r.observationPlacements || {};
  var allRight = cards.every(function(c){ return placed[c.id] === c.kind; });
  var explainOk = level === "A" || (OBSERVATION.levelBExplainChoices.find(function(x){return x.id===r.observationExplainChoice;}) || {}).correct === true;
  return allRight && explainOk;
}
function modelDone(r){
  return (r.modelDays||0) >= 3 && (MODEL.check.choices.find(function(c){return c.id===r.modelCheckChoice;})||{}).correct === true;
}
function compareResultOk(r){ return (COMPARE.resultChoices.find(function(c){return c.id===r.compareResultChoice;})||{}).correct === true; }
function compareDone(r){ return !!r.comparePrediction && compareResultOk(r); }
function fairDone(r, level){
  if (level === "A"){
    return FAIRTEST.levelA.experiments.every(function(e){
      return (r.fairAAnswers||{})[e.id] === (e.fair ? "match" : "no-match");
    });
  }
  return (FAIRTEST.levelB.options.find(function(o){return o.id===r.fairChecked;})||{}).correct === true;
}
function transferDone(r, level){
  if (level === "A"){
    var slots = r.transferSlots || [];
    if (slots.length !== TRANSFER.aSlots || slots.some(function(s){return s==null;})) return false;
    return slots.every(function(id, i){ return (TRANSFER.aChips.find(function(c){return c.id===id;})||{}).correctSlot === i; });
  }
  var ev = (TRANSFER.bEvidenceChoices.find(function(c){return c.id===r.transferEvidence;})||{}).correct === true;
  var bc = (TRANSFER.bBecauseChoices.find(function(c){return c.id===r.transferBecause;})||{}).correct === true;
  var so = (TRANSFER.bSoChoices.find(function(c){return c.id===r.transferSo;})||{}).correct === true;
  return ev && bc && so;
}
function cap(s){ return s.length === 0 ? s : s[0].toUpperCase() + s.slice(1); }
function deriveExplanation(r, level, lang){
  if (!transferDone(r, level)) return null;
  if (level === "A"){
    var slots = r.transferSlots || [];
    var sep = lang === "zh" ? "" : " ";
    var growing = pick(TRANSFER.aChips.find(function(c){return c.id===slots[0];}).text, lang);
    var bigger = pick(TRANSFER.aChips.find(function(c){return c.id===slots[1];}).text, lang);
    return pick(TRANSFER.aFramePrefix,lang) + sep + growing + pick(TRANSFER.aFrameMiddle,lang) + sep + bigger + pick(TRANSFER.aFrameSuffix,lang);
  }
  var bc = pick(TRANSFER.bBecauseChoices.find(function(c){return c.id===r.transferBecause;}).label, lang);
  var so = pick(TRANSFER.bSoChoices.find(function(c){return c.id===r.transferSo;}).label, lang);
  return lang === "zh" ? ("因为"+bc+"，所以"+so+"。") : (cap(bc)+", so "+so+".");
}
function isSceneComplete(scene, r, level){
  switch(scene){
    case "hook": return !!r.hookPrediction;
    case "observation": return observationDone(r, level);
    case "model": return modelDone(r);
    case "compare": return compareDone(r);
    case "fairtest": return fairDone(r, level);
    case "transfer": return transferDone(r, level);
    default: return false;
  }
}
function evidenceFor(skill, r){
  switch(skill){
    case "prediction":
      if (!r.hookPrediction) return "not-recorded";
      return r.hookPrediction === "bigger" ? "independent" : "with-support";
    case "mechanism":
      if (!r.observationPlacements) return "not-recorded";
      if (!observationDone(r, state.level)) return "experienced";
      return r.observationHadWrong ? "with-support" : "independent";
    case "saving":
      if (!r.comparePrediction && !r.compareResultChoice) return "not-recorded";
      if (!compareDone(r)) return "experienced";
      return r.compareResultHadWrong ? "with-support" : "independent";
    case "compounding":
      var touched = state.level === "A" ? (!!r.fairAAnswers && Object.keys(r.fairAAnswers).length>0) : !!r.fairChecked;
      if (!touched) return "not-recorded";
      if (!fairDone(r, state.level)) return "experienced";
      return "independent";
    case "transfer":
      var t2 = state.level === "A" ? (r.transferSlots||[]).some(function(s){return s!=null;}) : !!r.transferEvidence;
      if (!t2) return "not-recorded";
      if (!transferDone(r, state.level)) return "experienced";
      return "transferred";
    default: return "not-recorded";
  }
}

function svgCoinJar(principalCents, interestCents, maxCents, label){
  var trackTop=20, trackBottom=148, trackH=trackBottom-trackTop;
  var totalCents = principalCents + interestCents;
  function pxFor(c){ return Math.max(0, Math.min(trackH, (c/maxCents)*trackH)); }
  var principalH = pxFor(principalCents);
  var goldH = interestCents > 0 ? Math.max(2, pxFor(totalCents) - pxFor(principalCents)) : 0;
  var goldTop = trackBottom - principalH - goldH;
  var blueTop = trackBottom - principalH;
  var clipId = "clip"+Math.random().toString(36).slice(2,8);
  return '<svg viewBox="0 0 220 190" role="img" aria-label="'+esc(label)+'">'+
    '<path d="M46 20 L40 150 Q40 168 58 168 L162 168 Q180 168 180 150 L174 20" fill="#fff" stroke="'+INK+'" stroke-opacity="0.3" stroke-width="3"/>'+
    '<line x1="40" y1="'+trackTop+'" x2="180" y2="'+trackTop+'" stroke="'+TEAL+'" stroke-width="2" stroke-dasharray="5 4"/>'+
    '<clipPath id="'+clipId+'"><path d="M46 20 L40 150 Q40 168 58 168 L162 168 Q180 168 180 150 L174 20 Z"/></clipPath>'+
    '<g clip-path="url(#'+clipId+')">'+
    (principalH>0 ? '<rect x="38" y="'+blueTop+'" width="144" height="'+(principalH+20)+'" fill="'+BLUE+'"/>' : '')+
    (goldH>0 ? '<rect x="38" y="'+goldTop+'" width="144" height="'+(goldH+2)+'" fill="'+GOLD+'"/>' : '')+
    '</g>'+
    '<text x="110" y="184" font-size="13" font-weight="700" fill="'+INK+'" text-anchor="middle">'+formatUsd(totalCents)+'</text>'+
  '</svg>';
}
function svgGauge(saveCents, taiLabel, duoduoLabel, dayCue, maxCents, label){
  var gaugeTop=46, gaugeBottom=152, gaugeH=gaugeBottom-gaugeTop, gaugeW=46, leftX=44, rightX=130;
  function fillY(c){ return gaugeBottom - Math.min(1, c/maxCents)*gaugeH; }
  function one(x, cents, name, fill){
    var y = fillY(cents), cx = x+gaugeW/2;
    return '<g><rect x="'+x+'" y="'+gaugeTop+'" width="'+gaugeW+'" height="'+gaugeH+'" rx="9" fill="#fff" stroke="'+INK+'" stroke-opacity="0.28" stroke-width="2"/>'+
      (cents>0 ? '<rect x="'+(x+3)+'" y="'+y+'" width="'+(gaugeW-6)+'" height="'+(gaugeBottom-y)+'" fill="'+fill+'"/>' : '')+
      '<text x="'+cx+'" y="'+(gaugeBottom+18)+'" font-size="11.5" fill="'+INK+'" text-anchor="middle">'+esc(name)+'</text>'+
      '<text x="'+cx+'" y="'+(gaugeBottom+33)+'" font-size="12" font-weight="700" fill="'+INK+'" text-anchor="middle">'+formatUsd(cents)+'</text></g>';
  }
  return '<svg viewBox="0 0 220 200" role="img" aria-label="'+esc(label)+'">'+
    '<text x="110" y="16" font-size="11" fill="#48605d" text-anchor="middle">'+esc(dayCue)+'</text>'+
    '<line x1="30" y1="'+gaugeTop+'" x2="188" y2="'+gaugeTop+'" stroke="'+TEAL+'" stroke-width="1.5" stroke-dasharray="4 4"/>'+
    one(leftX, 0, taiLabel, INK) + one(rightX, saveCents, duoduoLabel, GOLD)+
  '</svg>';
}

  var chips = TRANSFER.aChips;
  var slots = r.transferSlots || [null,null];
  var used = {}; slots.forEach(function(id){ if(id) used[id]=true; });
  var filled = slots.every(function(s){return s!==null;});
  var distractor = filled && slots.some(function(id){ return (chips.find(function(c){return c.id===id;})||{}).correctSlot===-1; });
  var correct = transferDone(r, "A");
  var filledCount = slots.filter(Boolean).length;
  var stateIdx = correct ? 2 : Math.min(filledCount,1);

  var left = lumpSumVisual(stateIdx);
  var right = narratorBox(pickLeveled(TRANSFER.narrator, "A", lang));
  right += '<p class="sentence">'+esc(pick(TRANSFER.aFramePrefix,lang))+' '+
    '<span class="slotbtn'+(slots[0]?" filled":"")+'" data-act="transferA-clear" data-val="0">'+(slots[0]?esc(pick(chips.find(function(c){return c.id===slots[0];}).text,lang)):"1")+'</span> '+
    esc(pick(TRANSFER.aFrameMiddle,lang))+' '+
    '<span class="slotbtn'+(slots[1]?" filled":"")+'" data-act="transferA-clear" data-val="1">'+(slots[1]?esc(pick(chips.find(function(c){return c.id===slots[1];}).text,lang)):"2")+'</span>'+
    esc(pick(TRANSFER.aFrameSuffix,lang))+'</p>';
  right += '<div class="row">'+chips.map(function(c){
    return choiceBtn({act:"transferA-add", val:c.id, inline:true, label:esc(pick(c.text,lang)), disabled:!!used[c.id]});
  }).join("")+'</div>';
  if (filled && distractor) right += feedbackBox("hint", esc(pick(TRANSFER.aWrongChip,lang)));
  if (correct) right += feedbackBox("good", esc(pick(UI.correct,lang)));
  if (slots.some(Boolean)) right += '<button class="ghost-btn" data-act="transferA-reset">'+esc(pick(UI.tryAgain,lang))+'</button>';
  right += '<p class="caption">'+esc(pick(TRANSFER.tip,lang))+'</p>';
  return sceneShell(left, right);
}
function renderTransferB(){
  var r = state.record, lang = state.lang;
  var evidence = r.transferEvidence || null, because = r.transferBecause || null, so = r.transferSo || null;
  var evOk = (TRANSFER.bEvidenceChoices.find(function(c){return c.id===evidence;})||{}).correct===true;
  var bcOk = (TRANSFER.bBecauseChoices.find(function(c){return c.id===because;})||{}).correct===true;
  var soOk = (TRANSFER.bSoChoices.find(function(c){return c.id===so;})||{}).correct===true;
  var done = transferDone(r, "B");
  var anyWrong = (evidence && !evOk) || (because && !bcOk) || (so && !soOk);
  var steps = [evOk,bcOk,soOk].filter(Boolean).length;
  var stateIdx = Math.min(steps,2);

  var left = lumpSumVisual(stateIdx);
  var right = narratorBox(pickLeveled(TRANSFER.narrator, "B", lang));
  right += '<div class="field-label">'+esc(pick(TRANSFER.bEvidencePrompt,lang))+'</div><div class="choices">';
  TRANSFER.bEvidenceChoices.forEach(function(c){
    var picked = evidence===c.id;
    right += choiceBtn({act:"transferB-evidence", val:c.id, label:esc(pick(c.label,lang)), selected:picked, state:picked?(c.correct?"correct":"wrong"):null});
  });
  right += '</div>';
  if (evOk){
    right += '<div class="field-label">'+esc(pick(TRANSFER.bBecausePrompt,lang))+'</div><div class="choices">';
    TRANSFER.bBecauseChoices.forEach(function(c){
      var picked = because===c.id;
      right += choiceBtn({act:"transferB-because", val:c.id, label:esc(pick(c.label,lang)), selected:picked, state:picked?(c.correct?"correct":"wrong"):null});
    });
    right += '</div>';
  }
  if (evOk && bcOk){
    right += '<div class="field-label">'+esc(pick(TRANSFER.bSoPrompt,lang))+'</div><div class="choices">';
    TRANSFER.bSoChoices.forEach(function(c){
      var picked = so===c.id;
      right += choiceBtn({act:"transferB-so", val:c.id, label:esc(pick(c.label,lang)), selected:picked, state:picked?(c.correct?"correct":"wrong"):null});
    });
    right += '</div>';
  }
  if (anyWrong) right += feedbackBox("hint", esc(pick(TRANSFER.bWrong,lang)));
  if (done) right += feedbackBox("good", esc(deriveExplanation(r,"B",lang)));
  right += '<p class="caption">'+esc(pick(TRANSFER.tip,lang))+'</p>';
  return sceneShell(left, right);
}
function renderTransfer(){ return state.level === "A" ? renderTransferA() : renderTransferB(); }

var SCENE_RENDERERS = {
  hook:renderHook, observation:renderObservation, model:renderModel,
  compare:renderCompare, fairtest:renderFairtest, transfer:renderTransfer
};

/* ---- summary / parent ---------------------------------------------------*/

  var start = r.hookPrediction ? hookChoiceLabel(r.hookPrediction, lang) : pick(SUMMARY.notRecorded,lang);
  var end = deriveExplanation(r, level, lang) || pick(SUMMARY.notRecorded,lang);
  var html = '<div style="max-width:720px;margin:0 auto;">'+
    '<h2 style="font-size:24px;">'+esc(pick(SUMMARY.title,lang))+'</h2>'+
    '<div style="border:2px solid '+TEAL+';background:var(--teal-soft);border-radius:20px;padding:16px;margin-bottom:14px;">'+
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:'+TEAL+';">'+esc(pick(SUMMARY.coreIdeaLabel,lang))+'</div>'+
      '<p style="font-size:17px;margin:4px 0 0;">'+esc(pickLeveled(SUMMARY.coreIdea, level, lang))+'</p></div>'+
    '<div class="row" style="align-items:stretch;">'+
      '<div style="flex:1;min-width:220px;border:1px solid rgba(20,49,47,.15);background:#fff;border-radius:16px;padding:12px;">'+
        '<div style="font-weight:700;color:#1e5c93;">'+esc(pick(SUMMARY.yourStartLabel,lang))+'</div><p style="color:#1e5c93;">'+esc(start)+'</p></div>'+
      '<div style="flex:1;min-width:220px;border:1px solid rgba(20,49,47,.15);background:#fff;border-radius:16px;padding:12px;">'+
        '<div style="font-weight:700;color:#1e5c93;">'+esc(pick(SUMMARY.yourEndLabel,lang))+'</div><p style="color:#1e5c93;">'+esc(end)+'</p></div>'+
    '</div>'+
    feedbackBox("hint", '<b>'+esc(pick(SUMMARY.teaserLabel,lang))+':</b> '+esc(pick(SUMMARY.teaser,lang)))+
    '<div class="row" style="margin-top:12px;">'+
      '<button class="primary-btn" data-act="summary-parent">'+esc(pick(SUMMARY.toParentView,lang))+'</button>'+
      '<button class="ghost-btn" data-act="summary-replay">'+esc(pick(SUMMARY.replay,lang))+'</button></div>'+
  '</div>';
  return html;
}
function renderParent(){
  var r = state.record, lang = state.lang, level = state.level;
  var prediction = r.hookPrediction ? hookChoiceLabel(r.hookPrediction, lang) : pick(PARENT.none,lang);
  var explanation = deriveExplanation(r, level, lang) || pick(PARENT.none,lang);
  var rows = [
    [pick(PARENT.rows.level,lang), level==="A"?pick(UI.levelA,lang):pick(UI.levelB,lang)],
    [pick(PARENT.rows.language,lang), lang==="zh"?pick(UI.langZh,lang):pick(UI.langEn,lang)],
    [pick(PARENT.rows.prediction,lang), prediction],
    [pick(PARENT.rows.explanation,lang), explanation]
  ];
  var skills = [["prediction","prediction"],["mechanism","mechanism"],["saving","saving"],["compounding","compounding"],["transfer","transfer"]];
  var html = '<div style="max-width:820px;margin:0 auto;">'+
    '<div class="row" style="justify-content:space-between;"><h2 style="font-size:20px;">'+esc(pick(PARENT.title,lang))+'</h2>'+
    '<button class="ghost-btn" data-act="parent-back">'+esc(pick(UI.backToLesson,lang))+'</button></div>'+
    '<div style="border:2px solid var(--blue);background:var(--blue-soft);border-radius:16px;padding:12px;margin-bottom:12px;font-size:14px;">'+esc(pick(PARENT.demoBanner,lang))+'</div>'+
    '<div class="parent-table" style="border:1px solid rgba(20,49,47,.15);background:#fff;border-radius:16px;padding:0 14px;">'+
    rows.map(function(kv){ return '<div><dt>'+esc(kv[0])+'</dt><dd>'+esc(kv[1])+'</dd></div>'; }).join("")+
    '</div>'+
    '<div style="border:1px solid rgba(20,49,47,.15);background:#fff;border-radius:16px;padding:14px;margin-top:12px;">'+
    '<div style="font-weight:700;">'+esc(pick(PARENT.evidenceTitle,lang))+'</div><div class="small-muted">'+esc(pick(PARENT.evidenceHint,lang))+'</div>'+
    skills.map(function(sk){
      var st = evidenceFor(sk[1], r);
      return '<div class="skill-row">'+esc(pick(PARENT.skills[sk[0]],lang))+' — <b>'+esc(pick(EVIDENCE_STATE_LABEL[st],lang))+'</b></div>';
    }).join("")+
    '</div></div>';
  return html;
}

/* ---- top-level render ----------------------------------------------------*/
function render(){
  var lang = state.lang, level = state.level;
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : "en";
  var prog = state;
  var html = '';
  html += '<div class="note">'+ (lang==="zh"
    ? '这是静态审阅文件——不使用任何本地开发服务器。直接在浏览器里打开这个 HTML 文件即可；以后的改动都会写进这一个文件里。'
    : 'Static review file — no dev server involved. Just open this HTML file directly in a browser; future changes go into this one file.') + '</div>';

  html += '<header class="top">'+
    '<div class="brand"><div><div class="name">'+esc(pick(UI.brandTitle,lang))+'</div><div class="sub">'+esc(pick(UI.brandSubtitle,lang))+'</div></div></div>'+
    '<div class="controls">'+
      '<div class="segmented">'+
        '<button data-act="set-level" data-val="A" class="'+(level==="A"?"active":"")+'">'+esc(pick(UI.levelA,lang))+'</button>'+
        '<button data-act="set-level" data-val="B" class="'+(level==="B"?"active":"")+'">'+esc(pick(UI.levelB,lang))+'</button>'+
      '</div>'+
      '<div class="segmented">'+
        '<button data-act="set-lang" data-val="zh" class="'+(lang==="zh"?"active":"")+'">'+esc(pick(UI.langZh,lang))+'</button>'+
        '<button data-act="set-lang" data-val="en" class="'+(lang==="en"?"active":"")+'">'+esc(pick(UI.langEn,lang))+'</button>'+
      '</div>'+
      '<button class="ghost-btn" data-act="start-over">'+esc(pick(UI.startOver,lang))+'</button>'+
    '</div></header>';

  html += '<nav class="jump">'+
    '<button class="chip'+(state.phase==="start"?" active":"")+'" data-act="goto-start">'+esc(pick(SCENE_LABEL.start,lang))+'</button>'+
    SCENE_ORDER.map(function(s,i){
      return '<button class="chip'+((state.phase==="scene"&&state.sceneIndex===i)?" active":"")+'" data-act="goto-scene" data-val="'+i+'">'+(i+1)+'. '+esc(pick(SCENE_LABEL[s],lang))+'</button>';
    }).join("")+
    '<button class="chip'+(state.phase==="summary"&&!state.showParent?" active":"")+'" data-act="goto-summary">'+esc(pick(SCENE_LABEL.summary,lang))+'</button>'+
  '</nav>';

  if (state.phase === "start"){
    html += '<div class="start-screen">'+
      '<h1>'+esc(pick(UI.brandTitle,lang))+'</h1><p class="small-muted">'+esc(pick(UI.brandSubtitle,lang))+'</p>'+
      '<p style="font-size:16px;">'+esc(pick(UI.startBlurb,lang))+'</p>'+
      '<div class="start-box"><div class="field-label">'+esc(pick(UI.startTitle,lang))+'</div>'+
        '<div class="row" style="margin-top:10px;">'+
          choiceBtn({act:"set-level", val:"A", label:esc(pick(UI.levelA,lang)), selected:level==="A"})+
          choiceBtn({act:"set-level", val:"B", label:esc(pick(UI.levelB,lang)), selected:level==="B"})+
        '</div><div class="row">'+
          choiceBtn({act:"set-lang", val:"zh", label:esc(pick(UI.langZh,lang)), selected:lang==="zh"})+
          choiceBtn({act:"set-lang", val:"en", label:esc(pick(UI.langEn,lang)), selected:lang==="en"})+
        '</div></div>'+
      '<button class="primary-btn" data-act="begin">'+esc(pick(UI.startBegin,lang))+'</button>'+
      '<p class="small-muted" style="margin-top:14px;">'+esc(pick(UI.noDataNote,lang))+'</p>'+
    '</div>';
  } else if (state.phase === "scene"){
    var sceneId = SCENE_ORDER[state.sceneIndex];
    var stepText = fillTemplate(pick(UI.progressStep,lang), {n: state.sceneIndex+1});
    html += '<div class="progress">'+SCENE_ORDER.map(function(_,i){
      var cls = i<state.sceneIndex ? "done" : (i===state.sceneIndex ? "now" : "");
      return '<span class="'+cls+'"></span>';
    }).join("")+'</div>';
    html += '<div class="step-line">'+esc(stepText)+' · '+esc(pick(SCENE_LABEL[sceneId],lang))+' · '+SCENE_TIME_HINT[sceneId]+' · '+esc(level==="A"?pick(UI.levelA,lang):pick(UI.levelB,lang))+'</div>';
    html += SCENE_RENDERERS[sceneId]();
    var canAdvance = isSceneComplete(sceneId, state.record, level);
    html += '<div class="footer-nav">'+
      '<button class="ghost-btn" data-act="back">'+esc(pick(UI.back,lang))+'</button>'+
      '<button class="primary-btn" data-act="next"'+(canAdvance?"":" disabled")+'>'+(state.sceneIndex===SCENE_ORDER.length-1?esc(pick(SCENE_LABEL.summary,lang)):esc(pick(UI.next,lang)))+'</button>'+
    '</div>';
  } else if (state.phase === "summary"){
    html += state.showParent ? renderParent() : renderSummary();
  }

  document.getElementById("app").innerHTML = html;
}

/* ---- event wiring ---------------------------------------------------------*/
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  var val = el.getAttribute("data-val");
  var r = state.record;

  switch(act){
    case "set-level": setState({level: val}); break;
    case "set-lang": setState({lang: val}); break;
    case "start-over":
      if (confirm(state.lang==="zh" ? "要重新开始吗？这会清除这次的学习记录。" : "Start over? This clears this practice run.")){
        state = {level:state.level, lang:state.lang, phase:"start", sceneIndex:0, record:{}, startedAt:null, completedAt:null};
        saveState(); render();
      }
      break;
    case "begin": setState({phase:"scene", sceneIndex:0, startedAt: Date.now(), showParent:false}); break;
    case "goto-start": setState({phase:"start"}); break;
    case "goto-scene": setState({phase:"scene", sceneIndex: parseInt(val,10), showParent:false}); break;
    case "goto-summary": setState({phase:"summary", showParent:false, completedAt: state.completedAt || Date.now()}); break;
    case "back":
      if (state.phase === "scene" && state.sceneIndex > 0) setState({sceneIndex: state.sceneIndex-1});
      break;
    case "next":
      if (state.sceneIndex >= SCENE_ORDER.length-1) setState({phase:"summary", showParent:false, completedAt: Date.now()});
      else setState({sceneIndex: state.sceneIndex+1});
      break;

    case "hook-drop": patchRecord({hookDropped:true}); break;
    case "hook-replay": break;
    case "hook-predict": patchRecord({hookPrediction: val}); break;

    case "obs-nav": patchRecord({obsIdx: parseInt(val,10)}); break;
    case "obs-step": patchRecord({obsIdx: parseInt(val,10)}); break;
    case "obs-place": {
      var cards = observationCards(state.level);
      var idx = r.obsIdx !== undefined ? r.obsIdx : 0;
      idx = Math.min(idx, cards.length-1);
      var card = cards[idx];
      var next = Object.assign({}, r.observationPlacements||{});
      next[card.id] = val;
      var wrongNow = val !== card.kind;
      var patch = {observationPlacements: next, observationHadWrong: r.observationHadWrong || wrongNow};
      if (val === card.kind){
        var nextIncomplete = cards.findIndex(function(x){ return x.id!==card.id && next[x.id]!==x.kind; });
        if (nextIncomplete !== -1) patch.obsIdx = nextIncomplete;
      }
      patchRecord(patch);
      break;
    }
    case "obs-explain": {
      var ok = (OBSERVATION.levelBExplainChoices.find(function(x){return x.id===val;})||{}).correct === true;
      patchRecord({observationExplainChoice: val, observationHadWrong: r.observationHadWrong || !ok});
      break;
    }

    case "model-save": {
      var days = Math.min((r.modelDays||0)+1, 10);
      patchRecord({modelDays: days});
      break;
    }
    case "model-reset": patchRecord({modelDays:0, modelCheckChoice:undefined, modelCheckHadWrong:false}); break;
    case "model-check": {
      var ok2 = (MODEL.check.choices.find(function(c){return c.id===val;})||{}).correct === true;
      patchRecord({modelCheckChoice: val, modelCheckHadWrong: r.modelCheckHadWrong || !ok2});
      break;
    }

    case "compare-predict": patchRecord({comparePrediction: val}); break;
    case "compare-run": patchRecord({compareRan:true, compareTickIndex: TICK_DAYS.length-1}); break;
    case "compare-result": {
      var ok3 = (COMPARE.resultChoices.find(function(c){return c.id===val;})||{}).correct === true;
      patchRecord({compareResultChoice: val, compareResultHadWrong: r.compareResultHadWrong || !ok3});
      break;
    }

    case "fairA-judge": {
      var A = FAIRTEST.levelA;
      var step = Math.min(r.fairAStep||0, A.experiments.length-1);
      var exp = A.experiments[step];
      var right = val === (exp.fair?"match":"no-match");
      var answers = Object.assign({}, r.fairAAnswers||{});
      answers[exp.id] = val;
      patchRecord({fairAAnswers: answers, fairAHadWrong: r.fairAHadWrong || !right});
      break;
    }
    case "fairA-next": {
      var A2 = FAIRTEST.levelA;
      var step2 = Math.min(r.fairAStep||0, A2.experiments.length-1);
      patchRecord({fairAStep: Math.min(step2+1, A2.experiments.length-1)});
      break;
    }
    case "fairB-view": patchRecord({fairBViewIdx: parseInt(val,10)}); break;
    case "fairB-pick": patchRecord({fairChoice: val}); break;
    case "fairB-check": {
      if (!r.fairChoice) break;
      var opt = FAIRTEST.levelB.options.find(function(o){return o.id===r.fairChoice;});
      var correct = opt && opt.correct === true;
      patchRecord({fairChecked: r.fairChoice, fairAttempts: correct ? (r.fairAttempts||0) : (r.fairAttempts||0)+1});
      break;
    }

    case "transferA-add": {
      var slots = (r.transferSlots || [null,null]).slice();
      if (slots.indexOf(val) !== -1) break;
      var emptyIdx = slots.indexOf(null);
      if (emptyIdx === -1) break;
      slots[emptyIdx] = val;
      var doneNow = slots.every(function(s){return s!=null;}) && slots.every(function(id,i){ return (TRANSFER.aChips.find(function(c){return c.id===id;})||{}).correctSlot===i; });
      patchRecord({transferSlots: slots, transferHadWrong: r.transferHadWrong || (slots.every(function(s){return s!=null;}) && !doneNow)});
      break;
    }
    case "transferA-clear": {
      var slots2 = (r.transferSlots || [null,null]).slice();
      slots2[parseInt(val,10)] = null;
      patchRecord({transferSlots: slots2});
      break;
    }
    case "transferA-reset": patchRecord({transferSlots:[null,null]}); break;

    case "transferB-evidence": patchRecord({transferEvidence: val}); break;
    case "transferB-because": patchRecord({transferBecause: val}); break;
    case "transferB-so": patchRecord({transferSo: val}); break;

    case "summary-parent": setState({showParent:true}); break;
    case "summary-replay":
      if (confirm(state.lang==="zh" ? "要重新开始吗？" : "Do it again? This clears this run.")){
        state = {level:state.level, lang:state.lang, phase:"start", sceneIndex:0, record:{}, startedAt:null, completedAt:null};
        saveState(); render();
      }
      break;
    case "parent-back": setState({showParent:false}); break;
  }
});

loadState();
render();
