<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色素侦探 · The Color Detective</title>
<style>
  :root{
    --teal:#1f7a6c; --teal-soft:#e3f3ef; --blue:#3f7fbf; --blue-soft:#eaf2fb;
    --sun:#e8b923; --sun-soft:#fdf3d8; --ink:#22302c; --muted:#5b6b66;
    --ivory:#faf7ef; --card:#ffffff; --line:#dfe4e1; --danger:#c0392b;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ivory);color:var(--ink);}
  body{min-height:100vh;}
  button{font:inherit;cursor:pointer;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  a.skip{position:absolute;left:-9999px;top:0;background:#fff;padding:10px 16px;border-radius:10px;z-index:100;box-shadow:0 0 0 4px rgba(63,127,191,.4);}
  a.skip:focus{left:8px;top:8px;}

  header.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);}
  .top-inner{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{font-size:18px;margin:0;}
  .brand p{font-size:12px;color:var(--muted);margin:0;}
  .guide{width:36px;height:36px;flex:none;}
  .top-controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff;}
  .seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);min-height:38px;}
  .seg button.active{background:var(--teal);color:#fff;}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink);min-height:40px;}
  .ghost:hover{background:var(--blue-soft);}
  label.chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}

  .reviewbar{background:var(--sun-soft);border-bottom:1px solid #e6cf7d;}
  .reviewbar-inner{max-width:1200px;margin:0 auto;padding:10px 20px;}
  .reviewbar p{font-size:12px;margin:0 0 8px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;}
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal);}

  main{flex:1;max-width:1280px;margin:0 auto;width:100%;padding:18px 20px 110px;}
  main.no-footer-pad{padding-bottom:36px;}

  .stepline{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .dots{flex:1;display:flex;gap:6px;}
  .dots span{flex:1;height:6px;border-radius:4px;background:var(--line);}
  .dots span.done{background:var(--teal);}
  .dots span.now{background:var(--blue);}
  .steplabel{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}

  .scene-grid{display:grid;gap:20px;grid-template-columns:1fr;}
  @media (min-width:900px){
    .scene-grid{grid-template-columns:minmax(0,61fr) minmax(0,39fr);align-items:start;}
    .scene-grid.wide{grid-template-columns:minmax(0,70fr) minmax(0,30fr);}
    .scene-grid > .left{position:sticky;top:70px;min-height:0;min-width:0;}
    .scene-grid > .right{max-height:calc(100vh - 160px);overflow-y:auto;padding-right:4px;min-height:0;min-width:0;}
  }
  .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;}
  .panel.visual{min-height:300px;display:flex;flex-direction:column;justify-content:center;}
  .caption{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;}

  .narrator{display:flex;gap:12px;background:#fff;border:1px solid rgba(31,122,108,.25);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .narrator .txt{min-width:0;}
  .narrator .who{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:0 0 4px;}
  .narrator p{margin:0 0 6px;line-height:1.5;font-size:15px;}
  .narrator p:last-child{margin-bottom:0;}

  .stack{display:flex;flex-direction:column;gap:12px;}
  .row-wrap{display:flex;flex-wrap:wrap;gap:8px;}
  .field-label{font-weight:700;font-size:14px;}

  .choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:500;color:var(--ink);min-height:48px;}
  .choice:hover{border-color:var(--blue);background:var(--blue-soft);}
  .choice.inline{width:auto;text-align:center;}
  .choice.selected{border-color:var(--teal);background:var(--teal-soft);}
  .choice.correct{border-color:var(--teal);background:var(--teal-soft);}
  .choice.wrong{border-color:var(--sun);background:var(--sun-soft);}
  .choice:disabled{opacity:.5;cursor:not-allowed;}

  .primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--teal);color:#fff;border-radius:999px;padding:12px 26px;font-weight:700;font-size:15px;min-height:48px;}
  .primary:hover{background:#186257;}
  .primary:disabled{opacity:.4;cursor:not-allowed;}

  .feedback{border:2px solid var(--sun);background:var(--sun-soft);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5;}
  .feedback.good{border-color:var(--teal);background:var(--teal-soft);}

  .hint-btn{margin-top:2px;}
  .hint-box{border:1px solid rgba(63,127,191,.4);background:var(--blue-soft);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5;}

  footer.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(250,247,239,.96);backdrop-filter:blur(4px);border-top:1px solid var(--line);z-index:30;}
  .nav-inner{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .nav-hint{font-size:12px;color:var(--muted);}

  .start-wrap{max-width:760px;margin:0 auto;padding:20px 0;}
  .start-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .start-head .guide{width:56px;height:56px;}
  .start-head h1{font-size:26px;margin:0;}
  .start-head p{margin:4px 0 0;color:var(--muted);}
  .blurb{font-size:17px;line-height:1.6;margin:14px 0 20px;}
  .start-card{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;margin-bottom:20px;}
  .start-card h3{margin:0 0 12px;font-size:15px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .grid2:last-child{margin-bottom:0;}
  .note{font-size:13px;color:var(--muted);}

  .summary-wrap{max-width:760px;margin:0 auto;}
  .core{border:2px solid var(--teal);background:var(--teal-soft);border-radius:22px;padding:18px;margin:16px 0;}
  .core .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);}
  .core p{font-size:17px;line-height:1.6;margin:6px 0 0;}
  .two-col{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px;}
  @media (min-width:640px){.two-col{grid-template-columns:1fr 1fr;}}
  .box{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;}
  .box .lbl{font-weight:700;color:#1e5c93;font-size:15px;}
  .box p{margin:6px 0 0;color:#1e5c93;font-size:16px;line-height:1.5;}

  dl.pinfo{margin:0;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;}
  dl.pinfo > div{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 14px;border-bottom:1px solid #eee;}
  @media (min-width:640px){dl.pinfo > div{grid-template-columns:200px 1fr;}}
  dl.pinfo > div:last-child{border-bottom:none;}
  dl.pinfo dt{font-size:13px;font-weight:700;color:var(--muted);}
  dl.pinfo dd{margin:0;font-size:14px;}

  .skill-row{font-size:14px;margin:8px 0;}
  .tone-muted{color:var(--muted);font-weight:700;}
  .tone-ink{color:var(--ink);font-weight:700;}
  .tone-teal{color:var(--teal);font-weight:700;}

  .banner{border:2px solid var(--blue);background:var(--blue-soft);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;}
  .banner.warn{border-color:var(--sun);background:var(--sun-soft);}

  .food-picker{display:flex;flex-wrap:wrap;gap:8px;}
  .food-btn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;min-height:44px;}
  .food-btn.active{border-color:var(--teal);background:var(--teal-soft);}
  .food-btn.viewed:not(.active){border-color:rgba(31,122,108,.5);}

  .food-detail{border:2px solid rgba(31,122,108,.4);background:#fff;border-radius:18px;padding:16px;margin-top:14px;}
  .food-detail h4{margin:0 0 6px;font-size:17px;}
  .cline{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;margin-top:8px;}
  .cline.flagged{border-color:var(--sun);background:var(--sun-soft);}
  .tag{display:inline-block;margin-top:10px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;background:var(--blue-soft);}
  .tag.own{background:var(--teal-soft);}

  .caution-card{border:2px solid var(--sun);background:var(--sun-soft);border-radius:16px;padding:12px 14px;}
  .caution-card .title{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;}
  .caution-card ul{list-style:none;margin:8px 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:600;font-size:14px;}
  .caution-card .body{font-size:13px;line-height:1.5;margin-top:6px;}

  .gauge-wrap{display:flex;align-items:flex-end;justify-content:center;gap:60px;padding:10px 0 0;}
  .gauge-col{display:flex;flex-direction:column;align-items:center;gap:8px;width:90px;}
  .icon-lg{font-size:40px;line-height:1;}
  .gauge{width:52px;height:150px;border:2px solid var(--line);border-radius:12px;background:#fff;display:flex;flex-direction:column-reverse;overflow:hidden;}
  .gauge .fill{width:100%;background:var(--blue);transition:height .5s ease;}
  .gauge-label{font-size:13px;text-align:center;}
  .gauge-label b{display:block;}

  .fair-cols{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;}
  .fair-col{flex:1;min-width:220px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;}
  .fair-col .hdr{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);}
  .fair-row{display:flex;gap:8px;margin-top:8px;font-size:14px;}
  .fair-row .k{width:120px;flex:none;color:var(--muted);}
  .fair-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-width:80px;}
  .cue{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;background:var(--teal-soft);}
  .cue.diff{background:var(--sun-soft);}

  table.ftable{width:100%;border-collapse:collapse;font-size:13px;}
  table.ftable th,table.ftable td{padding:6px 8px;text-align:left;border-bottom:1px solid #eee;}
  table.ftable thead th{color:var(--teal);border-bottom:2px solid var(--line);font-size:13px;}
  table.ftable tbody th{color:var(--muted);font-weight:600;}

  .table-card{border:2px solid var(--line);border-radius:16px;padding:12px;background:#fff;overflow-x:auto;}
  .table-card.picked{border-color:var(--teal);background:var(--teal-soft);}
  .table-card.checked-right{border-color:var(--teal);background:var(--teal-soft);}
  .table-card.checked-wrong{border-color:var(--sun);background:var(--sun-soft);}

  .flip-hero{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .flip-card{width:220px;min-height:96px;border-radius:16px;border:3px solid var(--line);background:#f3f3f0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;padding:12px;transition:border-color .3s;}
  .flip-card.flipped{border-color:var(--teal);background:#fff;}
  .flip-card .qmark{font-size:26px;color:var(--muted);}

  .sentence-frame{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;font-size:16px;line-height:1.8;}
  .slot-btn{display:inline-flex;align-items:center;margin:0 4px;min-height:34px;border-radius:10px;border:2px dashed var(--line);background:#fff;padding:4px 10px;font-size:14px;font-weight:600;color:var(--muted);vertical-align:middle;}
  .slot-btn.filled{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--ink);}

  .dialog-overlay{position:fixed;inset:0;background:rgba(34,48,44,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80;}
  .dialog{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:18px;}
  .dialog h2{margin:0 0 6px;font-size:18px;}
  .dialog p{margin:0 0 14px;font-size:14px;}
  .dialog .actions{display:flex;justify-content:flex-end;gap:8px;}
  .danger-btn{border:0;background:var(--sun);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;min-height:44px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* =========================================================================
   CONTENT — ported from the reviewed components/lessons/color-label-detective
   module built earlier in this project. Every food/ingredient value here is
   illustrative (no real brand), matching 00-SPEC.md 4/5/11. The 4-name

var SCENE_ORDER = ["hook", "observation", "model", "compare", "fairtest", "transfer"];
var SCENE_LABEL = {
  start:{zh:"开始",en:"Start"},
  hook:{zh:"谜题",en:"Mystery"},
  observation:{zh:"观察还是猜测",en:"Observe or guess"},

var SCENE_TIME = { hook:"0:00–0:30", observation:"0:30–1:15", model:"1:15–2:15", compare:"2:15–3:15", fairtest:"3:15–4:10", transfer:"4:10–5:00" };

var HOOK = {
  intro: {
    A: { zh: "这是一根&ldquo;蓝莓莓味&rdquo;冰棍，颜色是亮蓝色的。旁边是一碗真正的树莓，是红色的。按&ldquo;翻开配料表&rdquo;看看包装背面写了什么。",

  flipButton: { zh: "翻开配料表", en: "Flip the label" },

       en: "See that? The label lists \"Blue 1\" and \"natural raspberry flavoring\" &mdash; two separate lines. Why do you think the popsicle is blue?" },
    B: { zh: "配料表上&ldquo;亮蓝1号&rdquo;是色素，&ldquo;天然树莓香精&rdquo;是香精，是两种不同的原料。你先猜：为什么冰棍会是这个颜色？",
       en: "On the label, \"Blue 1\" is a colorant and \"natural raspberry flavoring\" is a flavoring &mdash; two different ingredients. Predict first: why is the popsicle this color?" }
  },
  guideCaption: { zh: "放大镜也好奇：颜色和味道，是不是本来就是分开加的呢？", en: "The magnifier is curious too: are color and flavor added separately on purpose?" },
  question: { zh: "你的第一个想法是：", en: "My first idea is:" },
  choices: [
    { id: "rare-blue-fruit", zh: "世界上有一种蓝色的树莓，只是很少见", en: "There's a rare blue kind of raspberry in the world" },

var STORAGE_KEY = "fmlos.sample.color-label-detective.v1.standalone";

function freshProgress(){
  return { phase:"start", sceneIndex:0, record:{}, hintsUsed:{}, reviewModeUsed:false, startedAt:null, completedAt:null };
}
function freshState(){
  return { level:"A", lang:"en", reducedMotionPreview:false, reviewMode:false, showParent:false, confirmReset:false,
       byLevel:{ A:freshProgress(), B:freshProgress() } };
}
var STATE = loadState();

function loadState(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return freshState();
    var parsed = JSON.parse(raw);
    var fresh = freshState();
    if (!parsed || !parsed.byLevel || !parsed.byLevel.A || !parsed.byLevel.B) return fresh;
    return {
      level: parsed.level === "B" ? "B" : "A",
      lang: parsed.lang === "zh" ? "zh" : "en",
      reducedMotionPreview: parsed.reducedMotionPreview === true,
      reviewMode: false, showParent:false, confirmReset:false,
      byLevel: parsed.byLevel
    };
  } catch(e){ return freshState(); }
}
function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch(e){ /* ignore: private mode etc. */ }
}
function prog(){ return STATE.byLevel[STATE.level]; }
function record(){ return prog().record; }
function patchRecord(patch){
  var p = prog();
  for (var k in patch) { p.record[k] = patch[k]; }
  saveState(); render();
}

/* =========================================================================
   HELPERS
   ========================================================================= */

function L(copy){ return copy[STATE.lang]; }
function LV(leveled){ return leveled[STATE.level][STATE.lang]; }
function fillTpl(str, vals){ return str.replace(/\{(\w+)\}/g, function(_, k){ return vals[k] !== undefined ? vals[k] : "{"+k+"}"; }); }
function esc(s){ return String(s); } /* content is authored trusted HTML with entities; no user input rendered */
function cls(){
  var out = [];
  for (var i=0;i<arguments.length;i++){ if (arguments[i]) out.push(arguments[i]); }
  return out.join(" ");
}
function observationCards(level){
  return OBSERVATION.cards.filter(function(c){ return level === "B" || !c.levelBOnly; });
}
function observationDone(r, level){
  var cards = observationCards(level);
  var placed = r.observationPlacements || {};
  var allRight = cards.every(function(c){ return placed[c.id] === c.kind; });
  var explainOk = level === "A" || (function(){
    var choice = OBSERVATION.levelBExplainChoices.find(function(x){ return x.id === r.observationExplainChoice; });
    return choice && choice.correct === true;
  })();
  return allRight && explainOk;
}
function modelViewedWithDefault(r){
  var viewed = {}; (r.modelViewedIds||[]).forEach(function(id){ viewed[id]=true; });
  viewed[r.modelSelectedId || MODEL_FOODS[0].id] = true;
  return viewed;
}
function modelDone(r){
  var viewed = modelViewedWithDefault(r);
  var allViewed = MODEL_FOODS.every(function(f){ return viewed[f.id]; });
  var choice = MODEL.checkChoices.find(function(c){ return c.id === r.modelCheckChoice; });
  return allViewed && choice && choice.correct === true;
}
function compareDone(r){
  var choice = COMPARE.resultChoices.find(function(c){ return c.id === r.compareResultChoice; });
  return !!r.comparePrediction && r.compareRevealed === true && choice && choice.correct === true;
}
function fairDone(r, level){
  if (level === "A"){
    return FAIRTEST.levelA.experiments.every(function(e){
      return (r.fairAAnswers||{})[e.id] === (e.fair ? "fair":"unfair");
    });
  }
  var opt = FAIRTEST.levelB.options.find(function(o){ return o.id === r.fairChecked; });
  return opt && opt.correct === true;
}
function transferDone(r, level){
  if (level === "A"){
    var slots = r.transferSlots || [];
    if (slots.length !== 2 || slots[0]==null || slots[1]==null) return false;
    return slots.every(function(id, i){
      var chip = TRANSFER.aChips.find(function(c){ return c.id === id; });
      return chip && chip.slot === i;
    });
  }
  var ev = TRANSFER.bEvidenceChoices.find(function(c){ return c.id === r.transferEvidence; });
  var bc = TRANSFER.bBecauseChoices.find(function(c){ return c.id === r.transferBecause; });
  var so = TRANSFER.bSoChoices.find(function(c){ return c.id === r.transferSo; });
  return !!(ev && ev.correct && bc && bc.correct && so && so.correct);
}
function deriveExplanation(r, level, lang){
  if (!transferDone(r, level)) return null;
  if (level === "A"){
    var slots = r.transferSlots || [];
    var p0 = TRANSFER.aChips.find(function(c){ return c.id === slots[0]; })[lang];
    var p1 = TRANSFER.aChips.find(function(c){ return c.id === slots[1]; })[lang];
    var frame = TRANSFER.aFrame[lang];
    return frame.replace("____", p0).replace("____", p1);
  }
  var bc = TRANSFER.bBecauseChoices.find(function(c){ return c.id === r.transferBecause; })[lang];
  var so = TRANSFER.bSoChoices.find(function(c){ return c.id === r.transferSo; })[lang];
  if (lang === "zh") return "因为" + bc + "，所以" + so + "。";
  return bc.charAt(0).toUpperCase() + bc.slice(1) + ", so " + so + ".";
}
function isSceneComplete(scene, r, level){
  switch(scene){
    case "hook": return !!r.hookPrediction;
    case "observation": return observationDone(r, level);
    case "model": return modelDone(r);
    case "compare": return compareDone(r);
    case "fairtest": return fairDone(r, level);
    case "transfer": return transferDone(r, level);
    default: return false;
  }
}
function evidenceFor(skill, p, level){
  var r = p.record, hints = p.hintsUsed || {};
  switch(skill){
    case "observation": {
      if (!r.observationPlacements) return "not-recorded";
      if (!observationDone(r, level)) return "experienced";
      return r.observationHadWrong ? "with-support" : "independent";
    }
    case "labelReading": {
      if ((r.modelViewedIds||[]).length === 0 && !r.modelCheckChoice) return "not-recorded";
      if (!modelDone(r)) return "experienced";
      return r.modelCheckHadWrong ? "with-support" : "independent";
    }
    case "cautionList": {
      if (!r.comparePrediction && !r.compareResultChoice) return "not-recorded";
      if (!compareDone(r)) return "experienced";
      return r.compareResultHadWrong ? "with-support" : "independent";
    }
    case "fairtest": {
      var touched = level === "A" ? (r.fairAAnswers && Object.keys(r.fairAAnswers).length>0) : !!r.fairChecked;
      if (!touched) return "not-recorded";
      if (!fairDone(r, level)) return "experienced";
      var used = hints.fairtest || 0;
      var wrong = level === "A" ? (r.fairAHadWrong?1:0) : (r.fairAttempts||0);
      if (used>=2) return "with-two-hints";
      if (used===1) return "with-one-hint";
      return wrong>0 ? "with-support" : "independent";
    }
    case "transfer": {
      var touched2 = level === "A" ? (r.transferSlots||[]).some(function(s){return s!=null;}) : !!r.transferEvidence;
      if (!touched2) return "not-recorded";
      if (!transferDone(r, level)) return "experienced";
      return "transferred";
    }
  }
  return "not-recorded";
}

function act(action, value){
  var p = prog(), r = p.record;
  switch(action){
    case "setLevel": STATE.level = value; saveState(); render(); break;
    case "setLang": STATE.lang = value; saveState(); render(); break;
    case "toggleReview": STATE.reviewMode = !STATE.reviewMode; render(); break;
    case "toggleReducedMotion": STATE.reducedMotionPreview = !STATE.reducedMotionPreview; saveState(); render(); break;
    case "begin":
      p.phase = "scene"; p.sceneIndex = 0; p.startedAt = p.startedAt || Date.now(); saveState(); render(); break;
    case "next": {
      if (p.phase !== "scene") break;
      var ni = p.sceneIndex + 1;
      if (ni >= SCENE_ORDER.length){ p.phase = "summary"; p.completedAt = p.completedAt || Date.now(); }
      else { p.sceneIndex = ni; }
      saveState(); render(); break;
    }
    case "back": {
      if (p.phase === "summary"){ p.phase = "scene"; p.sceneIndex = SCENE_ORDER.length-1; }
      else if (p.phase === "scene" && p.sceneIndex > 0){ p.sceneIndex -= 1; }
      saveState(); render(); break;
    }
    case "goToScene": {
      p.phase = "scene"; p.sceneIndex = Math.max(0, Math.min(parseInt(value,10), SCENE_ORDER.length-1));
      p.reviewModeUsed = true; p.startedAt = p.startedAt || Date.now(); STATE.showParent=false; saveState(); render(); break;
    }
    case "goToStart": p.phase = "start"; STATE.showParent=false; saveState(); render(); break;
    case "goToSummary": p.phase = "summary"; p.completedAt = p.completedAt || Date.now(); p.reviewModeUsed = true; STATE.showParent=false; saveState(); render(); break;
    case "openParent": STATE.showParent = true; render(); break;
    case "backToLesson": STATE.showParent = false; render(); break;
    case "askReset": STATE.confirmReset = true; render(); break;
    case "cancelReset": STATE.confirmReset = false; render(); break;
    case "confirmReset": {
      try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
      var lvl = STATE.level, lang = STATE.lang, rmp = STATE.reducedMotionPreview;
      STATE = freshState(); STATE.level = lvl; STATE.lang = lang; STATE.reducedMotionPreview = rmp;
      saveState(); render(); break;
    }
    case "hintReveal": {
      p.hintsUsed[value] = (p.hintsUsed[value]||0) + 1; saveState(); render(); break;
    }

    /* Scene 1 */
    case "hookFlip": patchRecord({ hookFlipped:true }); break;
    case "hookFlipBack": patchRecord({ hookFlipped:false, hookPrediction:undefined }); break;
    case "hookPredict": patchRecord({ hookPrediction:value }); break;

    /* Scene 2 */
    case "obsGoto": OBS_IDX = parseInt(value,10); render(); break;
    case "obsPlace": {
      var cards = observationCards(STATE.level);
      var card = cards[OBS_IDX];
      var placements = Object.assign({}, r.observationPlacements||{});
      var wrongNow = value !== card.kind;
      placements[card.id] = value;
      patchRecord({ observationPlacements: placements, observationHadWrong: !!r.observationHadWrong || wrongNow });
      if (!wrongNow){
        var nextIncomplete = cards.findIndex(function(c){ return c.id !== card.id && placements[c.id] !== c.kind; });
        if (nextIncomplete !== -1){ setTimeout(function(){ OBS_IDX = nextIncomplete; render(); }, 550); }
      }
      break;
    }
    case "obsExplain": {
      var choice = OBSERVATION.levelBExplainChoices.find(function(x){ return x.id === value; });
      patchRecord({ observationExplainChoice:value, observationHadWrong: !!r.observationHadWrong || !(choice&&choice.correct) });
      break;
    }

    /* Scene 3 */
    case "modelSelect": {
      var viewed = modelViewedWithDefault(r);
      viewed[value] = true;
      patchRecord({ modelSelectedId:value, modelViewedIds:Object.keys(viewed) });
      break;
    }
    case "modelCheck": {
      var mc = MODEL.checkChoices.find(function(c){ return c.id === value; });
      patchRecord({ modelCheckChoice:value, modelCheckHadWrong: !!r.modelCheckHadWrong || !(mc&&mc.correct) });
      break;
    }

    /* Scene 4 */
    case "comparePredict": patchRecord({ comparePrediction:value }); break;
    case "compareReveal": patchRecord({ compareRevealed:true }); break;
    case "compareResult": {
      var rc = COMPARE.resultChoices.find(function(c){ return c.id === value; });
      patchRecord({ compareResultChoice:value, compareResultHadWrong: !!r.compareResultHadWrong || !(rc&&rc.correct) });
      break;
    }

    /* Scene 5 */
    case "fairAJudge": {
      var A = FAIRTEST.levelA, step = Math.min(r.fairAStep||0, A.experiments.length-1), exp = A.experiments[step];
      var correctAns = exp.fair ? "fair":"unfair";
      var right = value === correctAns;
      var answers = Object.assign({}, r.fairAAnswers||{}); answers[exp.id] = value;
      patchRecord({ fairAAnswers:answers, fairAHadWrong: !!r.fairAHadWrong || !right });
      if (!right && (p.hintsUsed.fairtest||0) < 2){ p.hintsUsed.fairtest = (p.hintsUsed.fairtest||0)+1; saveState(); }
      break;
    }
    case "fairANext": {
      var A2 = FAIRTEST.levelA;
      patchRecord({ fairAStep: Math.min((r.fairAStep||0)+1, A2.experiments.length-1) });
      break;
    }
    case "fairBView": FAIRB_VIEW_IDX = parseInt(value,10); render(); break;
    case "fairBChoose": patchRecord({ fairChoice:value }); break;
    case "fairBCheck": {
      if (!r.fairChoice) break;
      var B = FAIRTEST.levelB, opt2 = B.options.find(function(o){ return o.id === r.fairChoice; });
      var correct2 = opt2 && opt2.correct === true;
      patchRecord({ fairChecked:r.fairChoice, fairAttempts: correct2 ? (r.fairAttempts||0) : (r.fairAttempts||0)+1 });
      if (!correct2 && (p.hintsUsed.fairtest||0) < 2){ p.hintsUsed.fairtest = (p.hintsUsed.fairtest||0)+1; saveState(); }
      break;
    }

    /* Scene 6 */
    case "transferAAdd": {
      var slots = (r.transferSlots || [null,null]).slice();
      if (slots.indexOf(value) !== -1) break;
      var idx = slots.indexOf(null);
      if (idx === -1) break;
      slots[idx] = value;
      var doneNow = slots.every(function(s){return s!=null;}) && slots.every(function(id,i){
        var chip = TRANSFER.aChips.find(function(c){ return c.id===id; }); return chip && chip.slot===i;
      });
      patchRecord({ transferSlots:slots, transferHadWrong: !!r.transferHadWrong || (slots.every(function(s){return s!=null;}) && !doneNow) });
      break;
    }
    case "transferAClear": {
      var slots2 = (r.transferSlots || [null,null]).slice();
      slots2[parseInt(value,10)] = null;
      patchRecord({ transferSlots:slots2 });
      break;
    }
    case "transferAReset": patchRecord({ transferSlots:[null,null] }); break;
    case "transferBEvidence": patchRecordTransferB("transferEvidence", value, TRANSFER.bEvidenceChoices); break;
    case "transferBBecause": patchRecordTransferB("transferBecause", value, TRANSFER.bBecauseChoices); break;
    case "transferBSo": patchRecordTransferB("transferSo", value, TRANSFER.bSoChoices); break;
  }
}
function patchRecordTransferB(field, value, choices){
  var r = record();
  var choice = choices.find(function(c){ return c.id === value; });
  var patch = {}; patch[field] = value;
  patch.transferHadWrong = !!r.transferHadWrong || !(choice && choice.correct);
  patchRecord(patch);
}

      + '<span class="cue'+(exp.sameMethod?"":" diff")+'">'+(exp.sameMethod?"=":"≠")+' '+(exp.sameMethod?L(A.sameCue):L(A.diffCue))+'</span>'

    + choiceBtn("fairAJudge","fair", L(A.fairButton), answer==="fair"?(answeredRight?"correct":"wrong"):"idle", true)
    + choiceBtn("fairAJudge","unfair", L(A.notFairButton), answer==="unfair"?(answeredRight?"correct":"wrong"):"idle", true)
    + '</div></div>';
  if (answer && !answeredRight){

    });
    right += '</div>';
    if (filled && !correct) right += feedbackBox(L(TRANSFER.aWrongChip), false);
    if (correct) right += feedbackBox(deriveExplanation(r,"A",STATE.lang), true);
    if (slots.some(function(s){return s!=null;})) right += '<button type="button" class="ghost" data-action="transferAReset">'+L(UI.tryAgain)+'</button>';
    right += '<p class="caption">'+L(TRANSFER.tip)+'</p>';
  } else {
    var evOk=false,bcOk=false,soOk=false;
    right += '<div class="stack"><p class="field-label">'+L(TRANSFER.bEvidencePrompt)+'</p><div class="stack">';
    TRANSFER.bEvidenceChoices.forEach(function(c){
      var picked = r.transferEvidence===c.id; if (picked&&c.correct) evOk=true;
      right += choiceBtn("transferBEvidence", c.id, L(c), picked?(c.correct?"correct":"wrong"):"idle", false);
    });
    right += '</div></div>';
    if (evOk){
      right += '<div class="stack"><p class="field-label">'+L(TRANSFER.bBecausePrompt)+'</p><div class="stack">';
      TRANSFER.bBecauseChoices.forEach(function(c){
        var picked = r.transferBecause===c.id; if (picked&&c.correct) bcOk=true;
        right += choiceBtn("transferBBecause", c.id, L(c), picked?(c.correct?"correct":"wrong"):"idle", false);
      });
      right += '</div></div>';
    }
    if (evOk && bcOk){
      right += '<div class="stack"><p class="field-label">'+L(TRANSFER.bSoPrompt)+'</p><div class="stack">';
      TRANSFER.bSoChoices.forEach(function(c){
        var picked = r.transferSo===c.id; if (picked&&c.correct) soOk=true;
        right += choiceBtn("transferBSo", c.id, L(c), picked?(c.correct?"correct":"wrong"):"idle", false);
      });
      right += '</div></div>';
    }
    var anyWrong = (r.transferEvidence&&!evOk)||(r.transferBecause&&!bcOk)||(r.transferSo&&!soOk);
    if (anyWrong) right += feedbackBox(L(TRANSFER.bWrong), false);
    if (transferDone(r,"B")) right += feedbackBox(deriveExplanation(r,"B",STATE.lang), true);
    right += '<p class="caption">'+L(TRANSFER.tip)+'</p>';
  }
  return sceneShellHTML(left, right, false);
}

var SCENE_RENDERERS = { hook:sceneHook, observation:sceneObservation, model:sceneModel, compare:sceneCompare, fairtest:sceneFairtest, transfer:sceneTransfer };

/* =========================================================================
   SHELL — header, start, summary, parent, footer
   ========================================================================= */

function renderHeader(stepText, showStep){
  var p = prog();
  return '<header class="top"><div class="top-inner">'
    + '<div class="brand">'+guideSVG("guide")+'<div><h1>'+L(UI.brandTitle)+'</h1>'
    + (showStep ? '' : '<p style="display:none;">'+L(UI.brandSubtitle)+'</p>') + '</div>'
    + (showStep ? '<span style="font-size:13px;color:var(--muted);font-weight:600;margin-left:6px;">'+stepText+'</span>' : '')
    + '<button type="button" class="ghost" style="margin-left:10px;" data-action="askReset">'+L(UI.startOver)+'</button>'
    + '</div>'
    + '<div class="top-controls">'
    + '<div class="seg">' + ["A","B"].map(function(l){ return '<button type="button" class="'+(STATE.level===l?"active":"")+'" data-action="setLevel" data-value="'+l+'">'+(l==="A"?L(UI.levelA):L(UI.levelB))+'</button>'; }).join('') + '</div>'
    + '<div class="seg">' + ["zh","en"].map(function(l){ return '<button type="button" class="'+(STATE.lang===l?"active":"")+'" data-action="setLang" data-value="'+l+'">'+(l==="zh"?L(UI.langZh):L(UI.langEn))+'</button>'; }).join('') + '</div>'
    + '<label class="chk"><input type="checkbox" '+(STATE.reviewMode?"checked":"")+' data-action="toggleReview"> '+L(UI.reviewMode)+'</label>'
    + '</div></div></header>';
}
function renderReviewBar(){
  if (!STATE.reviewMode) return '';
  var p = prog();
  var chips = '<button type="button" class="chip'+(p.phase==="start"?" active":"")+'" data-action="goToStart">'+L(SCENE_LABEL.start)+'</button>';
  SCENE_ORDER.forEach(function(s,i){
    chips += '<button type="button" class="chip'+(p.phase==="scene"&&p.sceneIndex===i?" active":"")+'" data-action="goToScene" data-value="'+i+'">'+(i+1)+'. '+L(SCENE_LABEL[s])+'</button>';
  });
  chips += '<button type="button" class="chip'+(p.phase==="summary"?" active":"")+'" data-action="goToSummary">'+L(SCENE_LABEL.summary)+'</button>';
  return '<div class="reviewbar"><div class="reviewbar-inner">'
    + '<p>'+L(UI.reviewModeOn)+' · '+(STATE.level==="A"?L(UI.levelA):L(UI.levelB))+'</p>'
    + '<div class="chips">'+chips+'</div>'
    + '<label class="chk" style="margin-top:8px;"><input type="checkbox" '+(STATE.reducedMotionPreview?"checked":"")+' data-action="toggleReducedMotion"> '+L(UI.reducedMotionPreview)+'</label>'
    + '</div></div>';
}
function renderStart(){
  return '<div class="start-wrap">'
    + '<div class="start-head">'+guideSVG("guide")+'<div><h1>'+L(UI.brandTitle)+'</h1><p>'+L(UI.brandSubtitle)+'</p></div></div>'
    + '<p class="blurb">'+L(UI.startBlurb)+'</p>'
    + '<div class="start-card"><h3>'+L(UI.startTitle)+'</h3>'
    + '<div class="grid2">'
      + choiceBtn("setLevel","A",L(UI.levelA),STATE.level==="A"?"selected":"idle",false)
      + choiceBtn("setLevel","B",L(UI.levelB),STATE.level==="B"?"selected":"idle",false)
    + '</div>'
    + '<div class="grid2">'
      + choiceBtn("setLang","zh",L(UI.langZh),STATE.lang==="zh"?"selected":"idle",false)
      + choiceBtn("setLang","en",L(UI.langEn),STATE.lang==="en"?"selected":"idle",false)
    + '</div></div>'
    + '<button type="button" class="primary" data-action="begin">'+L(UI.startBegin)+'</button>'
    + '<p class="note" style="margin-top:16px;">'+L(UI.noDataNote)+'</p>'
    + '</div>';
}
function renderSummary(){
  var p = prog(), r = p.record;
  var start = r.hookPrediction ? hookChoiceLabel(r.hookPrediction, STATE.lang) : L(SUMMARY.notRecorded);
  var end = deriveExplanation(r, STATE.level, STATE.lang) || L(SUMMARY.notRecorded);
  return '<div class="summary-wrap">'
    + '<div class="start-head">'+guideSVG("guide","cheer")+'<h1 style="font-size:24px;">'+L(SUMMARY.title)+'</h1></div>'
    + '<div class="core"><p class="lbl">'+L(SUMMARY.coreIdeaLabel)+'</p><p>'+LV(SUMMARY.coreIdea)+'</p></div>'
    + '<div class="two-col">'
      + '<div class="box"><p class="lbl">'+L(SUMMARY.yourStartLabel)+'</p><p>'+start+'</p></div>'
      + '<div class="box"><p class="lbl">'+L(SUMMARY.yourEndLabel)+'</p><p>'+end+'</p></div>'
    + '</div>'
    + feedbackBox('<b>'+L(SUMMARY.teaserLabel)+':</b> '+L(SUMMARY.teaser), false)
    + '<div class="row-wrap" style="margin-top:16px;">'
      + '<button type="button" class="primary" data-action="openParent">'+L(UI.toParentView)+'</button>'
      + '<button type="button" class="ghost" data-action="askReset">'+L(UI.replay)+'</button>'
    + '</div></div>';
}
function fmtTime(ms){
  if (!ms || ms<0) return "—";
  var t = Math.round(ms/1000);
  return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
}
function renderParent(){
  var p = prog(), r = p.record, hints = p.hintsUsed||{};
  var prediction = r.hookPrediction ? hookChoiceLabel(r.hookPrediction, STATE.lang) : L(PARENT.none);
  var explanation = deriveExplanation(r, STATE.level, STATE.lang) || L(PARENT.none);
  var totalHints = Object.keys(hints).reduce(function(a,k){return a+(hints[k]||0);},0);
  var breakdown = SCENE_ORDER.filter(function(s){return (hints[s]||0)>0;}).map(function(s){return L(SCENE_LABEL[s])+" ×"+hints[s];}).join("; ");
  var hintsText = totalHints===0 ? L(PARENT.hintsNone) : totalHints+" ("+breakdown+")";
  var rows = [
    [L(PARENT.rowLevel), STATE.level==="A"?L(UI.levelA):L(UI.levelB)],
    [L(PARENT.rowLang), STATE.lang==="zh"?L(UI.langZh):L(UI.langEn)],
    [L(PARENT.rowPred), prediction],
    [L(PARENT.rowExpl), explanation],
    [L(PARENT.rowTime), fmtTime(p.completedAt&&p.startedAt?p.completedAt-p.startedAt:null)],
    [L(PARENT.rowHints), hintsText]
  ];
  var skills = [["observation","observation"],["labelReading","labelReading"],["cautionList","cautionList"],["fairtest","fairtest"],["transfer","transfer"]];
  var out = '<div class="summary-wrap">'
    + '<div class="row-wrap" style="justify-content:space-between;align-items:center;">'
    + '<h2 style="margin:0;">'+L(PARENT.title)+'</h2><button type="button" class="ghost" data-action="backToLesson">'+L(UI.backToLesson)+'</button></div>'
    + '<div class="banner" style="margin:14px 0;">'+L(PARENT.demoBanner)+'</div>';
  if (p.reviewModeUsed) out += '<div class="banner warn" style="margin-bottom:14px;">'+L(PARENT.reviewUsedFlag)+'</div>';
  out += '<dl class="pinfo">' + rows.map(function(rr){ return '<div><dt>'+rr[0]+'</dt><dd>'+rr[1]+'</dd></div>'; }).join('') + '</dl>';
  out += '<div class="box" style="margin-top:16px;"><p class="lbl" style="color:var(--ink);">'+L(PARENT.evidenceTitle)+'</p>'
    + '<p class="note">'+L(PARENT.evidenceHint)+'</p>';
  skills.forEach(function(s){
    var st = evidenceFor(s[1], p, STATE.level);
    out += '<p class="skill-row">'+L(PARENT.skills[s[0]])+' — <span class="'+EVIDENCE_TONE[st]+'">'+L(EVIDENCE_LABEL[st])+'</span></p>';
  });
  out += '<p class="banner warn" style="margin-top:10px;">'+L(PARENT.masteryCaveat)+'</p></div>';
  out += '<div class="box" style="margin-top:16px;"><p class="lbl" style="color:var(--ink);">'+L(PARENT.revisitTitle)+'</p><ul>'
    + PARENT.revisitItems.map(function(it){ return '<li style="margin:6px 0;">'+L(it)+'</li>'; }).join('') + '</ul></div>';
  out += '<p class="note" style="margin-top:14px;">'+L(UI.noDataNote)+'</p></div>';
  return out;
}

/* =========================================================================
   MAIN RENDER
   ========================================================================= */

function render(){
  var app = document.getElementById("app");
  document.documentElement.lang = STATE.lang === "zh" ? "zh-Hans" : "en";
  var p = prog();
  var stepText = fillTpl(L(UI.progressStep), { n: p.sceneIndex+1 });
  var html = '<a href="#lesson-stage" class="skip sr-only">'+L(UI.skipToContent)+'</a>';
  html += renderHeader(stepText, p.phase==="scene");
  html += renderReviewBar();
  html += '<main id="lesson-stage" tabindex="-1" class="'+(p.phase==="scene"?"":"no-footer-pad")+'">';

  if (p.phase === "start") html += renderStart();
  if (p.phase === "scene"){
    var sceneId = SCENE_ORDER[p.sceneIndex];
    var dots = SCENE_ORDER.map(function(s,i){ return '<span class="'+(i<p.sceneIndex?"done":i===p.sceneIndex?"now":"")+'"></span>'; }).join('');
    html += '<div class="stepline"><div class="dots">'+dots+'</div><span class="steplabel">'+stepText+' · '+L(SCENE_LABEL[sceneId])+' · '+SCENE_TIME[sceneId]+' · '+(STATE.level==="A"?L(UI.levelA):L(UI.levelB))+'</span></div>';
    html += SCENE_RENDERERS[sceneId]();
  }
  if (p.phase === "summary") html += STATE.showParent ? renderParent() : renderSummary();
  html += '</main>';

  if (p.phase === "scene"){
    var sceneId2 = SCENE_ORDER[p.sceneIndex];
    var canAdvance = isSceneComplete(sceneId2, p.record, STATE.level);
    html += '<footer class="nav"><div class="nav-inner">'
      + '<button type="button" class="ghost" data-action="back">'+L(UI.back)+'</button>'
      + '<div class="row-wrap" style="align-items:center;">'
      + (STATE.reviewMode && !canAdvance ? '<span class="nav-hint">'+L(UI.forcedAdvance)+'</span>' : '')
      + '<button type="button" class="primary" '+((!canAdvance && !STATE.reviewMode)?"disabled":"")+' data-action="next">'
      + (p.sceneIndex === SCENE_ORDER.length-1 ? L(SCENE_LABEL.summary) : L(UI.next)) + '</button>'
      + '</div></div></footer>';
  }

  if (STATE.confirmReset){
    html += '<div class="dialog-overlay"><div class="dialog"><h2>'+L(UI.startOverConfirmTitle)+'</h2><p>'+L(UI.startOverConfirmBody)+'</p>'
      + '<div class="actions"><button type="button" class="ghost" data-action="cancelReset">'+L(UI.cancel)+'</button>'
      + '<button type="button" class="danger-btn" data-action="confirmReset">'+L(UI.confirm)+'</button></div></div></div>';
  }

  app.innerHTML = html;
}

document.getElementById("app").addEventListener("click", function(ev){
  var el = ev.target.closest("[data-action]");
  if (!el) return;
  act(el.getAttribute("data-action"), el.getAttribute("data-value"));
});

render();
</script>
