<style>
:root{
  --ivory:#fbf9f1; --ink:#14312f; --muted:#48605d;
  --teal:#0f6f6b; --teal-soft:#dcefec;
  --blue:#2f7fc0; --blue-soft:#e2eefa;
  --sun:#eab34a; --sun-soft:#fbeecd;
  --own:#1e5c93;
  --land:color-mix(in oklab, #0f6f6b 16%, white);
  --land2:color-mix(in oklab, #2f7fc0 16%, white);
  --water:color-mix(in oklab, #2f7fc0 55%, white);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ivory); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",Roboto,Arial,sans-serif;

button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid rgba(20,49,47,.15)}
.hrow{max-width:1280px;margin:0 auto;padding:.5rem 1rem;display:flex;flex-direction:column;gap:.5rem}
.hmain{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand h1{margin:0;font-size:15px;line-height:1.2;font-weight:700}
.brand p{margin:.1rem 0 0;font-size:12px;color:var(--muted)}
.hctl{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem}
.step{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg{display:flex;border:1px solid rgba(20,49,47,.2);background:#fff;border-radius:999px;padding:3px}
.seg button{min-height:40px;padding:0 .85rem;border:0;background:none;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--teal);color:#fff}
.seglab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chk{display:flex;align-items:center;gap:.4rem;min-height:40px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--teal)}
.ghost,.pill{min-height:44px;padding:0 1rem;border:1px solid rgba(20,49,47,.3);background:#fff;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.ghost:hover,.pill:hover{background:var(--blue-soft)}

/* ---------- review bar ---------- */
.review{background:var(--sun-soft);border-bottom:1px solid rgba(234,179,74,.6)}
.review .in{max-width:1200px;margin:0 auto;padding:.5rem 1rem}
.review p{margin:0;font-size:12px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.chips button{min-height:40px;padding:0 .7rem;border:1px solid rgba(20,49,47,.25);background:#fff;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer}
.chips button[aria-current=true]{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ---------- main ---------- */
main{max-width:1280px;margin:0 auto;padding:1.25rem 1rem 7rem;outline:none}
main.nofoot{padding-bottom:2.5rem}
.dots{display:flex;gap:.35rem;flex:1;min-width:0}
.dots span{height:6px;flex:1;border-radius:999px;background:rgba(20,49,47,.15)}
.dots span.done{background:var(--teal)} .dots span.now{background:var(--blue)}
.topline{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem}

/* two-column landscape workspace: visual left, words right */
.shell{display:grid;gap:1rem}
@media (min-width:900px) and (orientation:landscape){
  .shell{grid-template-columns:minmax(0,61fr) minmax(0,39fr);gap:1.5rem;align-items:start}
  .shell.wide{grid-template-columns:minmax(0,70fr) minmax(0,30fr)}
  .shell>.left{position:sticky;top:.5rem}
  .shell>.right{max-height:calc(100svh - 14rem);min-height:46vh;overflow-y:auto;padding-right:.25rem}
  .brand h1{font-size:20px} .brand p{display:none}
  .step{font-size:16px}
  .hrow{flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:.75rem;padding:.35rem 1rem}
  main{padding-top:.5rem;padding-bottom:5rem}
}
.panel{border:1px solid rgba(20,49,47,.15);background:rgba(255,255,255,.8);border-radius:24px;padding:.75rem}
@media (min-width:900px) and (orientation:landscape){
  .panel{min-height:46vh;display:flex;flex-direction:column;justify-content:center;padding:1rem}
}
.right{display:flex;flex-direction:column;gap:.75rem}
figcaption,.cap{margin:.5rem 0 0;text-align:center;font-size:13px;color:var(--muted)}

/* ---------- narrator ---------- */
.narr{display:flex;gap:.75rem;border:1px solid rgba(15,111,107,.25);background:rgba(255,255,255,.9);border-radius:16px;padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.narr .who{margin:0;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.narr .say{margin:.25rem 0 0;font-size:17px;line-height:1.6}
.narr .say p{margin:0 0 .35rem}
.narr .say p:last-child{margin-bottom:0}
.narr .quip{margin:.5rem 0 0;font-size:14px;font-weight:500;color:var(--own)}
.guide{width:40px;height:40px;flex:0 0 auto}

/* ---------- controls ---------- */
.fieldlab{margin:0;font-size:15px;font-weight:600}
.stack{display:grid;gap:.6rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem}
.choice{min-height:52px;width:100%;text-align:left;padding:.75rem 1.25rem;border:2px solid rgba(20,49,47,.25);background:#fff;border-radius:16px;font-size:17px;font-weight:500;cursor:pointer;transition:background-color .15s,border-color .15s}
.choice:hover{border-color:var(--blue);background:var(--blue-soft)}
.choice[aria-pressed=true]{border-color:var(--teal);background:var(--teal-soft)}
.choice.ok{border-color:var(--teal);background:var(--teal-soft)}
.choice.no{border-color:var(--sun);background:var(--sun-soft)}
.choice.inline{width:auto;text-align:center}
.choice:disabled{opacity:.6;cursor:not-allowed}
.primary{min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:0 1.75rem;border:0;border-radius:999px;background:var(--teal);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.primary:disabled{opacity:.45;cursor:not-allowed}
.primary:hover:not(:disabled){background:color-mix(in oklab,var(--teal),black 10%)}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(47,127,192,.5)}

/* ---------- feedback / hints ---------- */
.fb{display:block;border:2px solid;border-radius:16px;padding:.75rem 1rem;font-size:16px;line-height:1.6}
.fb.good{border-color:var(--teal);background:var(--teal-soft)}
.fb.hint{border-color:var(--sun);background:var(--sun-soft)}
.hintbox{border:1px solid rgba(47,127,192,.4);background:var(--blue-soft);border-radius:16px;padding:.75rem 1rem;font-size:16px;line-height:1.6}
.hintbox b{font-weight:600}

.quote{margin:.5rem 0 0;font-size:20px;font-weight:500;line-height:1.6}
.navdots{display:flex;gap:.5rem;margin-top:1rem}
.navdots button{width:24px;height:24px;border-radius:999px;border:1px solid rgba(20,49,47,.3);background:#fff;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.navdots button[aria-current=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.navdots button.done{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}
.kicker{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bcard{border:2px solid rgba(20,49,47,.2);background:#fff;border-radius:16px;padding:1rem}

.bcard .fr{display:flex;gap:.5rem;align-items:baseline}

.bcard dd{margin:0}

.rule.wrong{border-color:var(--sun);background:var(--sun-soft)}
.rule h4{margin:0 0 .5rem;font-size:15px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);padding:.35rem .5rem .35rem 0}
td{padding:.35rem 0}
tr+tr{border-top:1px solid rgba(20,49,47,.1)}

.fit.nofit{background:var(--sun-soft)}
.slot{min-height:48px;min-width:92px;padding:.5rem .75rem;border:2px dashed rgba(20,49,47,.4);background:#fff;border-radius:12px;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer}
.slot.full{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}

.start{max-width:720px;margin:0 auto;display:grid;gap:1.5rem;padding:1rem 0}

.summary .big p.v{margin:.25rem 0 0;font-size:18px;line-height:1.6}
.twoup{display:grid;gap:.75rem}

.mine{border:1px solid rgba(20,49,47,.15);background:rgba(255,255,255,.8);border-radius:16px;padding:1rem}
.mine .k{margin:0;font-size:16px;font-weight:600;color:var(--own)}
.mine .v{margin:.25rem 0 0;font-size:18px;line-height:1.6;color:var(--own)}
.parent{max-width:920px;margin:0 auto;display:grid;gap:1.25rem}
.banner{border:2px solid rgba(47,127,192,.5);background:var(--blue-soft);border-radius:16px;padding:.75rem 1rem;font-size:14px;line-height:1.6}
.banner.warn{border-color:var(--sun);background:var(--sun-soft)}
.rows{border:1px solid rgba(20,49,47,.15);background:rgba(255,255,255,.8);border-radius:16px;overflow:hidden}
.rows>div{display:grid;gap:.25rem;padding:.75rem 1rem}
.rows>div+div{border-top:1px solid rgba(20,49,47,.1)}

.rows dt{font-size:14px;font-weight:600;color:var(--muted);margin:0}
.rows dd{font-size:15px;margin:0}
.card{border:1px solid rgba(20,49,47,.15);background:rgba(255,255,255,.8);border-radius:16px;padding:1rem}
.card h3{margin:0;font-size:15px;font-weight:700}
.card .hint{margin:.25rem 0 0;font-size:13px;color:var(--muted)}
.card ul{margin:.75rem 0 0;padding-left:1.1rem;display:grid;gap:.4rem;font-size:15px}
.card ul.plain{list-style:none;padding-left:0}
.st{font-weight:600}
.st.good{color:var(--teal)} .st.dim{color:var(--muted)}
.caveat{margin:.75rem 0 0;background:var(--sun-soft);border-radius:12px;padding:.5rem .75rem;font-size:13px;line-height:1.6}

/* ---------- footer nav ---------- */
footer{position:fixed;inset:auto 0 0 0;z-index:40;background:rgba(251,249,241,.95);backdrop-filter:blur(6px);border-top:1px solid rgba(20,49,47,.15)}
footer .in{max-width:1200px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem}

/* ---------- svg motion (all learner-triggered; static under reduced motion) */
svg{display:block;width:100%;margin:0 auto}
.anim .grow{transition:width .7s ease-out,height .7s ease-out,y .7s ease-out,opacity .5s ease-out}

@media (prefers-reduced-motion:reduce){
  .anim .grow,.anim .lit{transition:none}
  .anim .pop{animation:none}
}

%。","en":"A globe: the explanation is {pct}% built."},"oceanNamesCaption":{"zh":"太平洋 · 大西洋 · 印度洋 · 北冰洋","en":"Pacific · Atlantic · Indian · Arctic"},"guide":{"zh":"小罗盘，边界向导","en":"Compass, the boundary guide"}},"HOOK":{"intro":{"A":{"zh":"先看看世界地图。按“放大”两次，看看两处边界长什么样。","en":"Start with the world map. Press “Zoom in” twice to see what two borders look like."},"B":{"zh":"地图上有很多条线，把大陆和海洋分成一块一块。按“放大”，仔细看看两条边界到底是什么样子。","en":"The map is covered in lines that split land and sea into named pieces. Press “Zoom in” and look closely at what two of those borders actually look like."}},"stepCaption":{"0":{"zh":"世界地图，还没有放大。","en":"The world map, not zoomed in yet."},"1":{"zh":"放大：直布罗陀海峡——非洲和欧洲中间，是海。","en":"Zoomed in: the Strait of Gibraltar — sea sits between Africa and Europe."},"2":{"zh":"再放大：欧洲和亚洲交界处——中间是陆地，没有海！","en":"Zoomed in again: the Europe–Asia border — it's land in between, no sea at all!"}},"zoomButton":{"zh":"放大","en":"Zoom in"},"seeStoryButton":{"zh":"看两处边界","en":"See both borders"},"replayButton":{"zh":"再看一次","en":"Watch again"},"narrator":{"A":{"zh":"看到了吗？直布罗陀那边中间是海，可是欧洲和亚洲中间什么海都没有！你猜，为什么它们还算两个洲？","en":"See that? At Gibraltar there's sea in between, but between Europe and Asia there's no sea at all! Why do you think they still count as two continents?"},"B":{"zh":"两张放大图对比一下：一处中间是海，一处中间只有陆地。但地图上，欧洲和亚洲一直被画成两个洲。你先猜：为什么会这样？","en":"Compare the two zoomed-in views: one has sea in between, one has only land. Yet maps always draw Europe and Asia as two continents. Predict first: why is that?"}},"guideCaption":{"zh":"小罗盘也好奇：没有海，那条“看不见的线”到底画在哪儿？","en":"Compass is curious too: with no sea, where is that “invisible line” actually drawn?"},"question":{"zh":"你的第一个想法是：","en":"My first idea is:"},"choices":[{"id":"map-is-wrong","label":{"zh":"其实它们算一个洲，是地图画错了","en":"They're actually one continent — the map is wrong"}},{"id":"agreed-line","label":{"zh":"人们商量好用一条线（比如山脉、河流）当分界线，即使中间没有海","en":"People agreed on a line — like a mountain range or river — even though there's no sea in between"}},{"id":"different-language","label":{"zh":"欧洲和亚洲的人说不同的语言，所以是两个洲","en":"People in Europe and Asia speak different languages, so they're two continents"}},{"id":"different-size","label":{"zh":"欧洲比亚洲小得多，所以要分开算","en":"Europe is much smaller than Asia, so it has to be counted separately"}}]},"OBSERVATION":{"narrator":{"A":{"zh":"把每张卡片放好：这是“观察”，还是“猜测”？观察是我们直接看到的。","en":"Sort each card: is it an observation or a guess? An observation is something we saw directly."},"B":{"zh":"分类四张卡片。观察是直接看到的；猜测是我们没证明的原因；有一张是“可能的解释”，还没有被证明。","en":"Sort four cards. An observation is seen directly; a guess is an unproven reason; one card is a possible explanation that isn't proven yet."}},"buckets":{"observation":{"zh":"观察","en":"Observation"},"guess":{"zh":"猜测","en":"Guess"},"explanation":{"zh":"可能的解释（还没证明）","en":"Possible explanation (not proven)"}},"cards":[{"id":"asia-europe-connected","text":{"zh":"地图上，亚洲和欧洲连在一起，中间没有海。","en":"On the map, Asia and Europe are connected — there's no sea between them."},"kind":"observation","feedback":{"zh":"我们能直接在地图上看到这一点。这是观察。","en":"We can see this directly on the map. That is an observation."}},{"id":"must-be-same-continent","text":{"zh":"没有海隔开，那它们肯定算同一个洲。","en":"If there's no sea between them, they must count as the same continent."},"kind":"guess","feedback":{"zh":"这句话把“有没有海”当成唯一的规则，但我们还没证明这条规则是对的。这是猜测。","en":"This treats “must have sea” as the only rule, but we haven't shown that rule is true. That is a guessed reason."}},{"id":"oceans-one-patch","text":{"zh":"地图上，四大洋的颜色其实连成一整片，中间没有任何缝隙。","en":"On the map, the color of the four oceans is actually all one connected patch — there's no gap anywhere between them."},"kind":"observation","feedback":{"zh":"颜色连不连，我们能直接在地图上看到。这是观察。","en":"Whether the color connects is something we can see directly on the map. That is an observation."}},{"id":"urals-rule","text":{"zh":"因为大家商量好用乌拉尔山脉和乌拉尔河当分界线，所以欧洲和亚洲仍然算两个洲。","en":"Because everyone agreed to use the Ural Mountains and Ural River as the dividing line, Europe and Asia still count as two separate continents."},"kind":"explanation","levelBOnly":true,"feedback":{"zh":"这是地理学家们商定的规则，可能是对的解释，但对这一个例子来说，我们还需要多看几个例子才能确定。这是可能的解释。","en":"This is a rule geographers agreed on — it might be the right explanation, but we'd want to check a few more examples before we're sure. It is a possible explanation."}}],"levelBExplainPrompt":{"zh":"太平洋和大西洋在地图上看起来是分开的两块蓝色，但轮船其实可以直接从一片海开进另一片海，中间没有墙。哪一个解释最合适？","en":"The Pacific and the Atlantic look like two separate patches of blue on the map, but a ship can actually sail straight from one into the other — there's no wall in between. Which explanation fits best?"},"levelBExplainChoices":[{"id":"one-ocean-divided","correct":true,"label":{"zh":"四大洋其实是同一片连着的水，只是被人分区、起了不同的名字。","en":"The four oceans are really one connected body of water, just divided into named zones by people."}},{"id":"different-colors","correct":false,"label":{"zh":"海洋的颜色不一样，所以是不同的水。","en":"The oceans are different colors, so they're different water."}},{"id":"special-gate","correct":false,"label":{"zh":"船有特殊的门，可以穿过海洋之间的墙。","en":"Ships have a special gate that lets them pass through the wall between oceans."}}],"wrongCardFeedback":{"zh":"再想想：这句话是我们直接看到的吗？还是我们没证明的原因，或者还没证明的解释？","en":"Think again: did we see this directly, or is it an unproven reason, or an unproven explanation?"}},"MODEL":{"narrator":{"A":{"zh":"选一种边界类型，地图上就会亮起属于它的那条线。三种都选过之后，回答一个小问题。","en":"Pick a boundary type and its matching line lights up on the map. After you've tried all three, answer a quick question."},"B":{"zh":"这是一个简化模型：选一种边界类型（水面、山脉或河流、人挖或商定的线），看看地图上哪一段亮起来。三种都看过之后，回答一个小问题。","en":"This is a simplified model: pick a boundary type (water, mountain-or-river, or a human-made/agreed line) and see which segment of the map lights up. After trying all three, answer a quick question."}},"legendLabel":{"zh":"边界类型","en":"Boundary type"},"types":[{"id":"water","icon":"🌊","label":{"zh":"水面边界","en":"Water boundary"},"place":{"zh":"直布罗陀海峡（非洲—欧洲）","en":"The Strait of Gibraltar (Africa–Europe)"}},{"id":"mountain-river","icon":"⛰️","label":{"zh":"山脉或河流边界","en":"Mountain-or-river boundary"},"place":{"zh":"乌拉尔山脉与乌拉尔河（欧洲—亚洲）","en":"The Ural Mountains and Ural River (Europe–Asia)"}},{"id":"human-made","icon":"⛏️","label":{"zh":"人们商定或挖出的边界","en":"A human-agreed or human-dug boundary"},"place":{"zh":"苏伊士运河（非洲—亚洲）","en":"The Suez Canal (Africa–Asia)"}}],"caption":{"zh":"这是一个简化模型：真实的边界比这里画出的线更复杂，这里只是帮你看清边界是“哪一种”。","en":"This is a simplified model — real boundaries are more detailed than the lines shown here; this just helps you see what kind of line each border is."},"litSoFar":{"zh":"已点亮 {n} / 3 种","en":"{n} of 3 lit up"},"check":{"prompt":{"zh":"苏伊士运河是人们挖出来的，通常被当作非洲和亚洲的分界。这属于哪一种边界？","en":"The Suez Canal was dug by people and is usually treated as the border between Africa and Asia. Which kind of boundary is that?"},"choices":[{"id":"water","correct":false,"label":{"zh":"水面边界","en":"Water boundary"}},{"id":"mountain-river","correct":false,"label":{"zh":"山脉或河流边界","en":"Mountain-or-river boundary"}},{"id":"human-made","correct":true,"label":{"zh":"人们商定或挖出的边界","en":"A human-agreed or human-dug boundary"}}]},"checkWrong":{"zh":"再想想：运河是天然的海，还是人挖出来的？","en":"Think again: is a canal a natural sea, or something people dug?"}},"COMPARE":{"narrator":{"A":{"zh":"白令海峡（亚洲—北美洲）和直布罗陀海峡（非洲—欧洲），哪一个更宽？先猜，再用同一把尺子量一量。","en":"The Bering Strait (Asia–North America) and the Strait of Gibraltar (Africa–Europe) — which one is wider? Predict first, then measure both with the same ruler."},"B":{"zh":"两个海峡都是真正的水面边界，宽度却差很多。先预测哪个更宽，再运行测量，用同一把尺子比较结果。","en":"Both straits are real water boundaries, but their widths differ a lot. Predict which is wider, then run the measurement and compare the result on the same ruler."}},"predictPrompt":{"zh":"我猜：","en":"My prediction:"},"choices":[{"id":"bering-wider","label":{"zh":"白令海峡更宽","en":"The Bering Strait is wider"}},{"id":"gibraltar-wider","label":{"zh":"直布罗陀海峡更宽","en":"The Strait of Gibraltar is wider"}},{"id":"same","label":{"zh":"差不多宽","en":"About the same width"}}],"run":{"zh":"量一量","en":"Measure"},"runAgain":{"zh":"再量一次","en":"Measure again"},"running":{"zh":"测量中……","en":"Measuring…"},"beringName":{"zh":"白令海峡（亚洲—北美洲）","en":"Bering Strait (Asia–North America)"},"gibraltarName":{"zh":"直布罗陀海峡（非洲—欧洲）","en":"Strait of Gibraltar (Africa–Europe)"},"beringShort":{"zh":"白令海峡","en":"Bering"},"gibraltarShort":{"zh":"直布罗陀海峡","en":"Gibraltar"},"gaugeCaption":{"zh":"海峡宽度（用同一把尺子量出来）","en":"Strait width (measured on the same ruler)"},"gaugeReadout":{"zh":"白令 {bering} 公里 · 直布罗陀 {gibraltar} 公里","en":"Bering {bering} km · Gibraltar {gibraltar} km"},"fullRefLabel":{"zh":"尺子的顶端（约 82 公里）","en":"Top of the ruler (≈ 82 km)"},"resultCheckPrompt":{"zh":"量完之后，哪个海峡更宽？","en":"After measuring, which strait is wider?"},"resultChoices":[{"id":"bering-wider","correct":true,"label":{"zh":"白令海峡","en":"The Bering Strait"}},{"id":"gibraltar-wider","correct":false,"label":{"zh":"直布罗陀海峡","en":"The Strait of Gibraltar"}},{"id":"same","correct":false,"label":{"zh":"差不多宽","en":"About the same"}}],"explain":{"A":{"zh":"两条尺子从同一个起点量起：直布罗陀海峡很快就到头了（约14公里），白令海峡却量到了最后（约82公里）。白令海峡更宽。","en":"Both rulers start from the same point: Gibraltar's ruler stops quickly (about 14 km), but the Bering ruler keeps going all the way to the end (about 82 km). The Bering Strait is wider."},"B":{"zh":"两个海峡都是水面边界，但宽度差了将近六倍：白令海峡约82公里，直布罗陀海峡约14公里。用同一把尺子量，才能公平地比较两者的宽度。","en":"Both straits are water boundaries, but their widths differ by nearly six times: the Bering Strait is about 82 km, the Strait of Gibraltar about 14 km. Measuring both on the same ruler is what makes the comparison fair."}},"wrongResult":{"zh":"再看一眼两把同样长的尺子——哪一把走得更远才碰到对岸？","en":"Look again at the two identical rulers — which one has to travel further before it reaches the far shore?"}},"FAIRTEST":{"narrator":{"A":{"zh":"我们要考验一条规则：“两个洲之间一定有海”。\n看看每个真实的例子，判断它符不符合这条规则？","en":"Let's test a rule: “there is always sea between two continents.”\nLook at each real example — does it fit the rule?" range and a river, but Europe and Asia still count as two continents — this breaks the “must have sea” rule."}},{"id":"panama","place":{"zh":"北美洲—南美洲","en":"North America–South America"},"icon":"⛏️","factLabel":{"zh":"中间有什么","en":"What's in between"},"factValue":{"zh":"运河出现之前，是陆地相连（后来人们挖了巴拿马运河）","en":"Before the canal, solid connected land (people later dug the Panama Canal)"},"fitsRule":false,"whyBreaks":{"zh":"运河出现之前完全是陆地相连，但北美洲和南美洲一直都算两个洲——这也打破了“一定要有海”这条规则。","en":"Before the canal it was completely connected land, but North and South America have always counted as two continents — this also breaks the “must have sea” rule."}}]},"levelB":{"rowHeaders":{"gibraltar":{"zh":"非洲—欧洲（直布罗陀）","en":"Africa–Europe (Gibraltar)"},"urals":{"zh":"欧洲—亚洲（乌拉尔山脉）","en":"Europe–Asia (the Urals)"},"panama":{"zh":"北美洲—南美洲（巴拿马）","en":"North America–South America (Panama)"}},"fitsLabel":{"zh":"符合","en":"Fits"},"breaksLabel":{"zh":"不符合","en":"Doesn't fit"},"options":[{"id":"sea-only","correct":false,"ruleLabel":{"zh":"大陆之间一定隔着海","en":"Continents are always separated by the sea"},"fitsGibraltar":true,"fitsUrals":false,"fitsPanama":false,"whyWrong":{"zh":"这条规则在乌拉尔山脉和巴拿马这两个例子上都说不通——那里都没有海。","en":"This rule fails at both the Urals and Panama — neither has sea in between."}},{"id":"sea-or-landform-or-line","correct":true,"ruleLabel":{"zh":"大陆之间隔着海、山脉、河流，或者是大家商量好（或挖出）的一条线","en":"Continents are separated by sea, a mountain range, a river, or a line people agreed on (or dug)"},"fitsGibraltar":true,"fitsUrals":true,"fitsPanama":true,"whyRight":{"zh":"这条规则在三个例子里都说得通：海、山脉河流、人挖或商定的线，都能算作边界。","en":"This rule holds for all three examples: sea, a mountain-or-river, and a human-made or agreed line can all count as a boundary."}},{"id":"language-culture","correct":false,"ruleLabel":{"zh":"大陆之间隔着的是不同的语言和文化","en":"Continents are separated by different languages and cultures"},"fitsGibraltar":true,"fitsUrals":false,"fitsPanama":false,"whyWrong":{"zh":"乌拉尔山脉两边大多说同一种语言，巴拿马两边也大多说同一种语言——语言和文化并不是划分大陆的规则。","en":"Most people on both sides of the Urals speak the same language, and the same is true near Panama — language and culture aren't what defines a continent boundary."}}],"hint1":{"zh":"把每条规则一行一行地对照三个例子：哪一行“符合”，哪一行“不符合”？","en":"Check each rule row by row against the three examples: which rows say “fits,” which say “doesn't fit”?"},"hint2":{"zh":"真正的规则要在三个例子里都说得通，一个反例都不能有。","en":"The real rule has to hold for all three examples — even one contradiction rules it out."},"correctNote":{"zh":"这就是符合所有例子的规则：边界可以是海、山脉河流，或者是人商定/挖出的线。","en":"This is the rule that holds for every example: a boundary can be sea, a mountain-or-river, or a human-agreed/dug line."},"candidateLabel":{"zh":"规则 {n} / {total}","en":"Rule {n} of {total}"},"pickThis":{"zh":"选这条作为正确的规则","en":"Choose this as the correct rule"},"picked":{"zh":"已选这条","en":"Chosen"}}},"TRANSFER":{"narrator":{"A":{"zh":"新情况：太平洋和大西洋。用词卡拼出一句解释，说说这和欧洲、亚洲有什么像的地方。","en":"New situation: the Pacific and the Atlantic. Build one sentence from word chips explaining how this is like Europe and Asia."},"B":{"zh":"新情况：四大洋。先选出最好的证据，再用“因为……所以……”完成解释。","en":"New situation: the four oceans. First choose the best evidence, then finish the explanation with “because … so …”."}},"aSlots":3,"aChips":[{"id":"connected","correctSlot":0,"text":{"zh":"太平洋和大西洋其实是连在一起的","en":"The Pacific and the Atlantic are actually connected"}},{"id":"divided-by-people","correctSlot":1,"text":{"zh":"人们把它们分成不同的名字","en":"and people split them into different names"}},{"id":"like-europe-asia","correctSlot":2,"text":{"zh":"就像欧洲和亚洲共用一块陆地一样","en":"just like Europe and Asia share one piece of land"}},{"id":"different-colors","correctSlot":-1,"text":{"zh":"它们的颜色不一样","en":"Their colors are different"}},{"id":"cant-sail-across","correctSlot":-1,"text":{"zh":"船没办法从一个洋开到另一个洋","en":"Ships can't sail from one ocean into another"}}],"aWrongChip":{"zh":"这一句不是我们要说明的重点。想想哪句话真的和“连在一起，却被分开命名”有关。","en":"That piece doesn't fit. Think about which lines are really about “connected, but named separately.”"},"aWrongOrder":{"zh":"顺序还不对。先说它们连在一起，再说人们分开命名，最后连回欧洲和亚洲的例子。","en":"The order isn't right yet. First say they're connected, then that people named them separately, then link it back to Europe and Asia."},"bEvidencePrompt":{"zh":"哪一个是最好的证据？","en":"Which one is the best evidence?"},"bEvidenceChoices":[{"id":"ship-sails-through","correct":true,"label":{"zh":"一艘船可以从太平洋一直航行到大西洋，中间不需要穿过陆地或任何墙。","en":"A ship can sail all the way from the Pacific to the Atlantic without crossing land or any wall."}},{"id":"waves-look-similar","correct":false,"label":{"zh":"两片海的海浪看起来很像。","en":"The waves on both oceans look similar."}},{"id":"pacific-is-bigger","correct":false,"label":{"zh":"太平洋比大西洋大。","en":"The Pacific is bigger than the Atlantic."}}],"bBecausePrompt":{"zh":"因为……","en":"Because …"},"bBecauseChoices":[{"id":"no-real-wall","correct":true,"label":{"zh":"海洋之间没有真正的墙，只有人们画在地图上的边界线","en":"there's no real wall between oceans, only a boundary line people drew on the map"}},{"id":"same-temperature","correct":false,"label":{"zh":"两片海的水温差不多","en":"the water temperature is similar on both"}},{"id":"same-fish","correct":false,"label":{"zh":"两片海里的鱼差不多","en":"the fish are similar in both"}}],"bSoPrompt":{"zh":"所以……","en":"so …"},"bSoChoices":[{"id":"one-world-ocean","correct":true,"label":{"zh":"四大洋其实是同一片世界大洋，被分成几块来命名，就像欧洲和亚洲共用一块陆地一样","en":"the four oceans are really one single World Ocean, divided into named pieces — just like Europe and Asia share one piece of land"}},{"id":"pacific-is-real-ocean","correct":false,"label":{"zh":"只有太平洋才算真正的大洋","en":"only the Pacific counts as a real ocean"}},{"id":"sailors-should-be-careful","correct":false,"label":{"zh":"水手应该更小心一点","en":"sailors should be more careful"}}],"bWrong":{"zh":"再想想：哪个证据 / 原因 / 结果真的和“连在一起，只是被人分区命名”有关？","en":"Think again: which evidence / because / so line is really about “connected, but divided into named zones by people”?"},"flowLink":{"zh":"看不见的是画在地图上的边界线；能看见的是海水一直连在一起。","en":"What's invisible is the boundary line drawn on the map; what's visible is the water staying connected the whole way through."},"milestoneLabel":{"zh":"解释拼好了：{pct}%","en":"Explanation built: {pct}%"},"tip":{"zh":"提示：先说“连在一起”，再说“被人分开命名”，最后连回欧洲和亚洲的例子。","en":"Tip: first say they're connected, then that people named them separately, then link it back to Europe and Asia."},"funFact":{"zh":"有趣的是，“北极” Arctic 和“南极” Antarctic 这两个名字的意思正好相反——Arctic 来自古希腊语“熊”，指北方天空的星座；Antarctic 的意思就是“和 Arctic 相反的地方”。有些机构还把南极洲周围的海单独算作“第五大洋”（南大洋），不过这门课只讲最经典的四大洋。","en":"Fun fact: the names “Arctic” and “Antarctic” mean opposite things on purpose — Arctic comes from the ancient Greek word for “bear,” naming the northern-sky constellations, while Antarctic simply means “opposite the Arctic.” Some organizations also count the sea around Antarctica as a separate “fifth ocean” (the Southern Ocean), but this course sticks with the classic four."}},"SUMMARY":{"title":{"zh":"你找到了隐形的边界","en":"You found the invisible borders"},"coreIdeaLabel":{"zh":"核心结论","en":"The core idea"},"coreIdea":{"A":{"zh":"七大洲和四大洋大部分是连在一起的，人们画了一些线把它们分开、起了不同的名字。","en":"Most of the seven continents and four oceans are actually connected — people drew lines and gave the pieces different names."},"B":{"zh":"大陆和大陆之间，有时候是海把它们分开，有时候是山脉、河流，甚至是人们商量好（或挖出）的一条线（比如欧洲和亚洲）；四大洋其实是连成一片的同一片海洋，只是被人分成了几块来命名。","en":"Between two continents, sometimes it's the sea that separates them, but sometimes it's a mountain range, a river, or just a line people agreed on or dug (like between Europe and Asia); the four oceans are really one connected body of water that's been divided up and named in pieces."}},"yourStartLabel":{"zh":"你一开始的想法","en":"Your first idea"},"yourEndLabel":{"zh":"你最后的解释","en":"Your explanation now"},"teaserLabel":{"zh":"下一个问题","en":"Next question"},"teaser":{"zh":"那国家和国家之间的边界，又是怎么被画出来的呢？","en":"So how do the borders between countries end up drawn where they are?"},"toParentView":{"zh":"看家长 / 审阅视图","en":"Open parent / reviewer view"},"replay":{"zh":"再做一次","en":"Do it again"},"notRecord ,"revisitItems":[{"zh":"让孩子只用自己的话再解释一次“欧洲和亚洲为什么算两个洲”，看是否还会说“地图画错了”。","en":"Ask the child to re-explain in their own words why Europe and Asia count as two continents; check they no longer say “the map is wrong.”"},{"zh":"给一个新例子（比如红海把非洲和亚洲分开一部分），看能不能说出这属于哪一种边界类型。","en":"Give a fresh example (like the Red Sea partly separating Africa and Asia) and see if they can name which boundary type it is."},{"zh":"再问一次：四大洋之间真的有墙吗？看孩子会不会说出“只是一条画出来的线”。","en":"Ask again: is there really a wall between the four oceans? See if the child says “it's just a line drawn on the map.”"}]},"SCENE_LABEL":{"start":{"zh":"开始","en":"Start"},"hook":{"zh":"谜题","en":"Mystery"},"observation":{"zh":"观察还是猜测","en":"Observe or guess"},"model":{"zh":"边界探照灯","en":"Boundary spotlight"},"compare":{"zh":"比一比","en":"Compare"},"fairtest":{"zh":"考验规则","en":"Test the rule"},"transfer":{"zh":"换个情境","en":"Transfer"},"summary":{"zh":"总结","en":"Summary"}},"SCENE_TIME_HINT":{"hook":"0:00–0:50","observation":"0:50–1:40","model":"1:40–2:30","compare":"2:30–3:20","fairtest":"3:20–4:20","transfer":"4:20–5:00"},"SCENE_ORDER":["hook","observation","model","compare","fairtest","transfer"],"BERING_KM_BY_STEP":[0,21,41,62,82],"GIBRALTAR_KM_BY_STEP":[0,14,14,14,14],"STRAIT_STEPS":4,"HOOK_STEPS":3,"EVIDENCE_STATE_LABEL":{"not-recorded":{"zh":"未记录","en":"Not recorded"},"experienced":{"zh":"已体验，还没做对","en":"Engaged, not correct yet"},"with-two-hints":{"zh":"用了 2 条提示后做对","en":"Correct after 2 hints"},"with-one-hint":{"zh":"用了 1 条提示后做对","en":"Correct after 1 hint"},"with-support":{"zh":"改正之后做对","en":"Correct after a correction"},"independent":{"zh":"第一次就独立做对","en":"Correct independently, first try"},"transferred":{"zh":"用到了新情境","en":"Used it in a new situation"}}};

/* ==========================================================================
   Continents & Oceans — standalone five-minute course player.
   Plain DOM, no framework, no build step, no network. Opens over file://.
   Content and the real-world map data are inlined above as D and MAP.
   ========================================================================== */

/* ---------- tiny helpers ------------------------------------------------ */
const pick = (c) => (c ? (S.lang === "zh" ? c.zh : c.en) : "");
const lev = (c) => pick(c[S.level]);
const fill = (t, v) => String(t).replace(/\{(\w+)\}/g, (_, k) => (v[k] ?? `{${k}}`));
const esc = (s) =>
  String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const zh = () => S.lang === "zh";

/* ---------- state ------------------------------------------------------- */
const KEY = "fmlos.preview.continents-and-oceans.v1";
const freshLevel = () => ({ rec: {}, hints: {}, startedAt: null, doneAt: null, reviewUsed: false });
let S = {
  lang: "en",
  level: "A",
  phase: "start", // start | scene | summary | parent
  i: 0,
  review: false,
  reduced: false,
  byLevel: { A: freshLevel(), B: freshLevel() },
};
const L = () => S.byLevel[S.level];
const R = () => L().rec;

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {
    /* file:// often blocks storage — the run simply stays in memory */
  }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const v = JSON.parse(raw);
    if (v && v.byLevel && v.byLevel.A && v.byLevel.B) S = Object.assign(S, v);
  } catch (e) {
    /* ignore unreadable state */
  }
}
function patch(o) {
  Object.assign(R(), o);
  save();
  render();
}
function addHint(scene) {
  const h = L().hints;
  h[scene] = (h[scene] || 0) + 1;
  save();
}

/* ---------- completion (mirrors the course's own rules) ----------------- */
const obsCards = () => D.OBSERVATION.cards.filter((c) => S.level === "B" || !c.levelBOnly);
const correct = (list, id) => (list.find((x) => x.id === id) || {}).correct === true;

function obsDone() {
  const p = R().observationPlacements || {};
  const all = obsCards().every((c) => p[c.id] === c.kind);
  const ex = S.level === "A" || correct(D.OBSERVATION.levelBExplainChoices, R().observationExplainChoice);
  return all && ex;
}
const modelDone = () =>
  (R().modelViewed || []).length >= D.MODEL.types.length && correct(D.MODEL.check.choices, R().modelCheckChoice);
const compareDone = () => !!R().comparePrediction && correct(D.COMPARE.resultChoices, R().compareResultChoice);
function fairDone() {
  if (S.level === "A")
    return D.FAIRTEST.levelA.experiments.every(
      (e) => (R().fairAAnswers || {})[e.id] === (e.fitsRule ? "fits" : "breaks"),
    );
  return correct(D.FAIRTEST.levelB.options, R().fairChecked);
}
function transferDone() {
  if (S.level === "A") {
    const s = R().transferSlots || [];
    if (s.length !== D.TRANSFER.aSlots || s.some((x) => x == null)) return false;
    return s.every((id, i) => (D.TRANSFER.aChips.find((c) => c.id === id) || {}).correctSlot === i);
  }
  return (
    correct(D.TRANSFER.bEvidenceChoices, R().transferEvidence) &&
    correct(D.TRANSFER.bBecauseChoices, R().transferBecause) &&
    correct(D.TRANSFER.bSoChoices, R().transferSo)
  );
}
function sceneDone(id) {
  switch (id) {
    case "hook": return !!R().hookPrediction;
    case "observation": return obsDone();
    case "model": return modelDone();
    case "compare": return compareDone();
    case "fairtest": return fairDone();
    case "transfer": return transferDone();
  }
  return false;
}
/** The child's own explanation, rebuilt in the current language from their choices. */
function explanation() {
  if (!transferDone()) return null;
  if (S.level === "A") {
    const parts = (R().transferSlots || []).map((id) => pick(D.TRANSFER.aChips.find((c) => c.id === id).text));
    return parts.join(zh() ? "，" : " ") + (zh() ? "。" : ".");
  }
  const b = pick(D.TRANSFER.bBecauseChoices.find((c) => c.id === R().transferBecause).label);
  const s = pick(D.TRANSFER.bSoChoices.find((c) => c.id === R().transferSo).label);
  return zh() ? `因为${b}，所以${s}。` : `${b.charAt(0).toUpperCase() + b.slice(1)}, so ${s}.`;
}

/* ---------- SVG pieces -------------------------------------------------- */
const INK = "#14312f", TEAL = "#0f6f6b", BLUE = "#2f7fc0", SUN = "#eab34a";
const LAND = "color-mix(in oklab, #0f6f6b 16%, white)";
const LAND2 = "color-mix(in oklab, #2f7fc0 16%, white)";
const WATER = "color-mix(in oklab, #2f7fc0 55%, white)";

const MAP_SCALE = 304 / MAP.w;
const MAP_X = 8;
const MAP_Y = 8 + (174 - MAP.h * MAP_SCALE) / 2;
const onMap = (x, y) => ({ x: MAP_X + x * MAP_SCALE, y: MAP_Y + y * MAP_SCALE });
// Positions verified against the map's own coastlines (see 02-HANDOFF.md).
const GIB = onMap(215.3, 67.2); // 5.6°W, 36°N — the Strait of Gibraltar
const URAL = onMap(291, 36.2);  // 60°E, 58°N — the Ural Mountains

function guideSvg(cls) {
  return `<svg class="${cls || "guide"}" viewBox="0 0 48 56" aria-hidden="true" focusable="false">
    <circle cx="24" cy="26" r="20" fill="#e2eefa" stroke="${TEAL}" stroke-width="2.5"/>
    <circle cx="24" cy="26" r="14" fill="#fff" stroke="${TEAL}" stroke-width="1"/>
    <path d="M24 14 L28 26 L24 24 L20 26 Z" fill="${SUN}"/>
    <path d="M24 38 L28 26 L24 28 L20 26 Z" fill="${TEAL}"/>
    <circle cx="24" cy="26" r="2.4" fill="${INK}"/>
  </svg>`;
}

function worldMapSvg(step) {
  const label = pick(D.HOOK.stepCaption[step]);
  let body = `<rect x="8" y="8" width="304" height="174" rx="14" fill="${WATER}" fill-opacity=".18"/>`;
  if (step === 0) {
    body += `<g stroke="${INK}" stroke-opacity=".07" stroke-width="1">
      <line x1="20" y1="45" x2="300" y2="45"/><line x1="20" y1="95" x2="300" y2="95"/>
      <line x1="20" y1="140" x2="300" y2="140"/><line x1="80" y1="15" x2="80" y2="175"/>
      <line x1="160" y1="15" x2="160" y2="175"/><line x1="240" y1="15" x2="240" y2="175"/></g>
      <g transform="translate(${MAP_X},${MAP_Y}) scale(${MAP_SCALE})">
        <g transform="${MAP.transform}" fill="${LAND}" stroke="none">
          ${MAP.paths.map((d) => `<path d="${d}"/>`).join("")}
        </g>
      </g>
      <circle cx="${GIB.x}" cy="${GIB.y}" r="9" fill="none" stroke="${SUN}" stroke-width="2.5" stroke-dasharray="3 3"/>
      <text x="${GIB.x}" y="${GIB.y - 12}" font-size="9" fill="${INK}" text-anchor="middle">1</text>
      <circle cx="${URAL.x}" cy="${URAL.y}" r="9" fill="none" stroke="${SUN}" stroke-width="2.5" stroke-dasharray="3 3"/>
      <text x="${URAL.x}" y="${URAL.y - 12}" font-size="9" fill="${INK}" text-anchor="middle">2</text>`;
  } else if (step === 1) {
    body += `<rect x="30" y="40" width="110" height="120" rx="16" fill="${LAND}"/>
      <rect x="180" y="40" width="110" height="120" rx="16" fill="${LAND2}"/>
      <rect x="140" y="40" width="40" height="120" fill="${WATER}"/>
      <text x="160" y="30" font-size="11" text-anchor="middle">🌊</text>
      <text x="85" y="176" font-size="11" fill="${INK}" text-anchor="middle">${esc(pick(D.VISUAL.labelAfrica))}</text>
      <text x="235" y="176" font-size="11" fill="${INK}" text-anchor="middle">${esc(pick(D.VISUAL.labelEurope))}</text>`;
  } else {
    body += `<rect x="30" y="40" width="130" height="120" rx="16" fill="${LAND}"/>
      <rect x="160" y="40" width="130" height="120" rx="16" fill="${LAND2}"/>
      <line x1="160" y1="34" x2="160" y2="166" stroke="${INK}" stroke-width="2.5" stroke-dasharray="6 5"/>
      <text x="160" y="24" font-size="10" text-anchor="middle">⛰️</text>
      <text x="95" y="176" font-size="11" fill="${INK}" text-anchor="middle">${esc(pick(D.VISUAL.labelEurope))}</text>
      <text x="225" y="176" font-size="11" fill="${INK}" text-anchor="middle">${esc(pick(D.VISUAL.labelAsia))}</text>`;
  }
  return `<svg viewBox="0 0 320 190" role="img" aria-label="${esc(label)}" style="max-width:720px">${body}</svg>`;
}

const SPOT = [
  { id: "water", x: 60, icon: "🌊" },
  { id: "mountain-river", x: 160, icon: "⛰️" },
  { id: "human-made", x: 260, icon: "⛏️" },
];
function spotlightSvg(sel, n, label) {
  const segs = SPOT.map((s, i) => {
    const on = sel === s.id;
    return `<g><rect x="${s.x - 44}" y="40" width="34" height="90" rx="8" fill="${LAND}"/>
      <rect x="${s.x + 10}" y="40" width="34" height="90" rx="8" fill="${LAND2}"/>
      <line class="lit" x1="${s.x}" y1="130" x2="${s.x}" y2="60" stroke="${on ? SUN : INK}"
        stroke-opacity="${on ? 1 : 0.25}" stroke-width="${on ? 6 : 2.5}"
        ${s.id === "water" ? "" : 'stroke-dasharray="5 4"'}/>
      <text x="${s.x}" y="152" font-size="16" text-anchor="middle">${s.icon}</text>
      <text x="${s.x}" y="24" font-size="9" fill="#48605d" text-anchor="middle">${i + 1}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 320 170" role="img" aria-label="${esc(label)}" style="max-width:720px">
    <rect x="8" y="8" width="304" height="140" rx="14" fill="${WATER}" fill-opacity=".12"/>${segs}
    <text x="160" y="164" font-size="10" fill="#48605d" text-anchor="middle">${n}/3</text></svg>`;
}

function straitSvg(bKm, gKm, label) {
  const MAXKM = 82, top = 96, bot = 176, h = bot - top, w = 46;
  const fy = (km) => bot - (Math.min(km, MAXKM) / MAXKM) * h;
  const gauge = (x, km, name) => {
    const y = fy(km);
    return `<g><rect x="${x}" y="${top}" width="${w}" height="${h}" rx="9" fill="#fff" stroke="${INK}" stroke-opacity=".28" stroke-width="2"/>
      <rect class="grow" x="${x + 3}" y="${y}" width="${w - 6}" height="${bot - y}" fill="${BLUE}"/>
      <rect class="grow" x="${x + 3}" y="${y}" width="${w - 6}" height="3" fill="${TEAL}"/>
      <text x="${x + w / 2}" y="${bot + 16}" font-size="12" fill="${INK}" text-anchor="middle">${esc(name)} <tspan font-weight="700">${Math.round(km)} km</tspan></text></g>`;
  };
  const bGap = 18 + (bKm / MAXKM) * 26, gGap = 18 + (gKm / MAXKM) * 26;
  return `<svg viewBox="0 0 320 210" role="img" aria-label="${esc(label)}" style="max-width:560px">
    <g aria-hidden="true" fill="none" stroke="${INK}" stroke-opacity=".4" stroke-width="2.5">
      <rect x="42" y="16" width="24" height="26" rx="4"/><rect class="grow" x="${42 + 24 + bGap}" y="16" width="24" height="26" rx="4"/>
      <rect x="182" y="16" width="24" height="26" rx="4"/><rect class="grow" x="${182 + 24 + gGap}" y="16" width="24" height="26" rx="4"/></g>
    <text x="91" y="58" font-size="9" fill="#48605d" text-anchor="middle">${esc(pick(D.COMPARE.beringShort))}</text>
    <text x="229" y="58" font-size="9" fill="#48605d" text-anchor="middle">${esc(pick(D.COMPARE.gibraltarShort))}</text>
    <line x1="56" y1="${top}" x2="266" y2="${top}" stroke="${TEAL}" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="56" y="${top - 6}" font-size="9.5" fill="#48605d">${esc(pick(D.COMPARE.fullRefLabel))}</text>
    ${gauge(68, bKm, pick(D.COMPARE.beringShort))}${gauge(206, gKm, pick(D.COMPARE.gibraltarShort))}</svg>`;
}

function globeSvg(progress, label) {
  const steps = Math.round(progress * 4);
  const dots = [0, 1, 2, 3]
    .map((i) => {
      const on = i < steps;
      return `<circle class="${on ? "pop" : ""}" cx="${44 + i * 48}" cy="70" r="6" fill="${on ? TEAL : "none"}"
        stroke="${TEAL}" stroke-opacity="${on ? 1 : 0.3}" stroke-width="2"/>`;
    })
    .join("");
  return `<svg viewBox="0 0 260 150" role="img" aria-label="${esc(label)}" style="max-width:460px">
    <rect x="14" y="30" width="110" height="80" rx="14" fill="${WATER}" fill-opacity=".35"/>
    <rect x="136" y="30" width="110" height="80" rx="14" fill="${WATER}" fill-opacity=".55"/>
    <line x1="130" y1="20" x2="130" y2="120" stroke="${INK}" stroke-opacity=".5" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="130" y="14" font-size="9" fill="#48605d" text-anchor="middle">${esc(pick(D.VISUAL.oceanBoundaryLabel))}</text>
    <line x1="30" y1="70" x2="230" y2="70" stroke="${INK}" stroke-opacity=".15" stroke-width="2"/>${dots}
    <rect x="20" y="128" width="220" height="10" rx="5" fill="#fff" stroke="${INK}" stroke-opacity=".25" stroke-width="1.5"/>
    <rect class="grow" x="22" y="130" width="${Math.max(0, 216 * progress)}" height="6" rx="3" fill="${TEAL}"/></svg>`;
}

/* ---------- small builders --------------------------------------------- */
const narr = (text, quip) =>
  `<div class="narr">${guideSvg()}<div style="min-width:0">
     <p class="who">${esc(pick(D.UI.narrator))}</p>
     <div class="say" aria-live="polite">${String(text).split("\n").map((l) => `<p>${esc(l)}</p>`).join("")}</div>
     ${quip ? `<p class="quip">${esc(quip)}</p>` : ""}
   </div></div>`;
const fb = (tone, text) => `<output class="fb ${tone}">${esc(text)}</output>`;
const lab = (t) => `<p class="fieldlab">${esc(t)}</p>`;
function choices(list, sel, act, state) {
  return `<div class="stack">${list
    .map((c) => {
      const on = sel === c.id;
      const cls = on && state ? (c.correct ? "ok" : "no") : "";
      return `<button class="choice ${cls}" aria-pressed="${on}" data-act="${act}" data-id="${c.id}">${esc(pick(c.label || c.text))}</button>`;
    })
    .join("")}</div>`;
}
function hintPanel(scene, h1, h2) {
  const n = L().hints[scene] || 0;
  let out = "";
  if (n < 1) out += `<button class="ghost" data-act="hint" data-scene="${scene}">${esc(pick(D.UI.hintButton))}</button>`;
  if (n >= 1) out += `<div class="hintbox"><b>${esc(pick(D.UI.hint1Label))}: </b>${esc(h1)}</div>`;
  if (n === 1) out += `<button class="ghost" data-act="hint" data-scene="${scene}">${esc(pick(D.UI.hint2Label))}</button>`;
  if (n >= 2) out += `<div class="hintbox"><b>${esc(pick(D.UI.hint2Label))}: </b>${esc(h2)}</div>`;
  return `<div class="stack">${out}</div>`;
}
const shell = (left, right, wide) =>
  `<div class="shell ${wide ? "wide" : ""}"><section class="left">${left}</section><section class="right">${right}</section></div>`;
const vpanel = (inner) => `<div class="panel">${inner}</div>`;

/* ---------- scene 1: hook ---------------------------------------------- */
function sceneHook() {
  const r = R();
  const step = Math.min(r.hookZoomStep || 0, 2);
  const shown = r.hookRevealed === true;
  const left = vpanel(worldMapSvg(step) + `<p class="cap">${esc(pick(D.HOOK.stepCaption[step]))}</p>`);
  let right = narr(shown ? lev(D.HOOK.narrator) : lev(D.HOOK.intro), shown ? pick(D.HOOK.guideCaption) : "");
  right += `<div class="row">`;
  right += shown
    ? `<button class="ghost" data-act="hook-replay">${esc(pick(D.HOOK.replayButton))}</button>`
    : `<button class="primary" data-act="hook-zoom">${esc(pick(D.HOOK.zoomButton))}</button>`;
  if (S.reduced && !shown)
    right += `<button class="ghost" data-act="hook-jump">${esc(pick(D.HOOK.seeStoryButton))}</button>`;
  right += `</div>`;
  if (shown) {
    right += lab(pick(D.HOOK.question)) + choices(D.HOOK.choices, r.hookPrediction, "hook-pick");
    if (r.hookPrediction) right += fb("good", pick(D.UI.yourIdeaSaved));
  }
  return shell(left, right);
}

/* ---------- scene 2: observation vs guess ------------------------------ */
function sceneObs() {
  const r = R(), cards = obsCards();
  const placed = r.observationPlacements || {};
  const buckets = S.level === "B" ? ["observation", "guess", "explanation"] : ["observation", "guess"];
  let idx = r.obsIdx;
  if (idx == null || idx >= cards.length) {
    const first = cards.findIndex((c) => placed[c.id] !== c.kind);
    idx = first === -1 ? cards.length - 1 : first;
  }
  const card = cards[idx];
  const at = placed[card.id];
  const right_ = at === card.kind, wrong = at && !right_;

  const left = vpanel(
    `<p class="kicker">${idx + 1} / ${cards.length}</p><p class="quote">“${esc(pick(card.text))}”</p>
     <div class="navdots">${cards
       .map((c, i) => `<button data-act="obs-go" data-i="${i}" aria-current="${i === idx}" aria-label="${i + 1}"
         class="${placed[c.id] === c.kind ? "done" : ""}">${i + 1}</button>`)
       .join("")}</div>`,
  );

  let right = narr(lev(D.OBSERVATION.narrator));
  right += `<div class="row">${buckets
    .map((b) => {
      const on = at === b;
      const cls = on ? (right_ ? "ok" : "no") : "";
      return `<button class="choice inline ${cls}" aria-pressed="${on}" data-act="obs-place" data-b="${b}">${esc(pick(D.OBSERVATION.buckets[b]))}</button>`;
    })
    .join("")}</div>`;
  if (right_) right += fb("good", pick(card.feedback));
  if (wrong) right += fb("hint", pick(D.OBSERVATION.wrongCardFeedback));
  right += `<div class="row">
    <button class="ghost" data-act="obs-go" data-i="${Math.max(0, idx - 1)}" ${idx === 0 ? "disabled" : ""}>${esc(pick(D.UI.back))}</button>
    <button class="ghost" data-act="obs-go" data-i="${Math.min(cards.length - 1, idx + 1)}" ${idx >= cards.length - 1 ? "disabled" : ""}>${esc(pick(D.UI.next))}</button></div>`;

  if (S.level === "B" && cards.every((c) => placed[c.id] === c.kind)) {
    right += `<div class="stack" style="border-top:1px solid rgba(20,49,47,.15);padding-top:.75rem">
      ${lab(pick(D.OBSERVATION.levelBExplainPrompt))}
      ${choices(D.OBSERVATION.levelBExplainChoices, r.observationExplainChoice, "obs-explain", true)}</div>`;
    if (r.observationExplainChoice && !correct(D.OBSERVATION.levelBExplainChoices, r.observationExplainChoice))
      right += fb("hint", pick(D.OBSERVATION.wrongCardFeedback));
  }
  if (obsDone()) right += fb("good", pick(D.UI.correct));
  return shell(left, right);
}

/* ---------- scene 3: boundary spotlight -------------------------------- */
function sceneModel() {
  const r = R(), sel = r.modelSelected || null, viewed = r.modelViewed || [];
  const t = D.MODEL.types.find((x) => x.id === sel);
  const cnt = fill(pick(D.MODEL.litSoFar), { n: viewed.length });
  const label = t ? `${cnt} — ${pick(t.label)}：${pick(t.place)}` : cnt;

  const left = vpanel(
    spotlightSvg(sel, viewed.length, label) +
      `<p class="cap">${t ? esc(pick(t.label)) + " — " + esc(pick(t.place)) : esc(pick(D.MODEL.legendLabel))}</p>
       <p class="cap">${esc(pick(D.MODEL.caption))}</p>`,
  );

  let right = narr(lev(D.MODEL.narrator));
  right += lab(pick(D.MODEL.legendLabel));
  right += `<div class="stack">${D.MODEL.types
    .map(
      (x) => `<button class="choice" aria-pressed="${sel === x.id}" data-act="model-pick" data-id="${x.id}">
        <span aria-hidden="true">${x.icon} </span>${esc(pick(x.label))}${viewed.includes(x.id) ? ' <span style="color:#0f6f6b">✓</span>' : ""}</button>`,

      right += fb("hint", pick(D.MODEL.checkWrong));
    if (correct(D.MODEL.check.choices, r.modelCheckChoice)) right += fb("good", pick(D.UI.correct));
  }
  return shell(left, right);
}

/* ---------- scene 4: compare two straits on one ruler ------------------ */
let measureTimer = null;
function sceneCompare() {
  const r = R(), step = r.compareStep || 0;
  const bKm = D.BERING_KM_BY_STEP[step], gKm = D.GIBRALTAR_KM_BY_STEP[step];
  const label = fill(pick(D.VISUAL.compareVisual), { bering: bKm, gibraltar: gKm });
  const running = r.compareRunning === true;

  const left = vpanel(
    straitSvg(bKm, gKm, label) +
      `<p class="cap">${esc(pick(D.COMPARE.gaugeCaption))} — ${esc(fill(pick(D.COMPARE.gaugeReadout), { bering: bKm, gibraltar: gKm }))}</p>` +
      (running ? `<p class="cap">${esc(pick(D.COMPARE.running))}</p>` : ""),

  right += lab(pick(D.COMPARE.predictPrompt)) + choices(D.COMPARE.choices, r.comparePrediction, "cmp-pick");
  if (r.comparePrediction)
    right += `<div class="row"><button class="ghost" data-act="cmp-run" ${running ? "disabled" : ""}>${esc(
      r.compareRan && !running ? pick(D.COMPARE.runAgain) : pick(D.COMPARE.run),

    if (r.compareResultChoice && !correct(D.COMPARE.resultChoices, r.compareResultChoice))
      right += fb("hint", pick(D.COMPARE.wrongResult));
  }
  if (correct(D.COMPARE.resultChoices, r.compareResultChoice)) right += fb("good", lev(D.COMPARE.explain));

}

/* ---------- scene 5: test the rule ------------------------------------- */
function sceneFair() {
  const r = R();
  if (S.level === "A") {
    const A = D.FAIRTEST.levelA;
    const step = Math.min(r.fairAStep || 0, A.experiments.length - 1);
    const e = A.experiments[step];
    const ans = (r.fairAAnswers || {})[e.id];
    const want = e.fitsRule ? "fits" : "breaks";
    const ok = ans === want;

    const left = vpanel(
      `<p class="cap" style="text-align:left;margin:0 0 .5rem">${esc(fill(pick(A.stepLabel), { n: step + 1, total: A.experiments.length }))}</p>
       <div class="bcard"><p class="place">${esc(pick(e.place))}</p>
         <dl><div class="fr"><dt>${esc(pick(e.factLabel))}</dt>
           <dd><span aria-hidden="true">${e.icon} </span>${esc(pick(e.factValue))}</dd></div></dl></div>`,
    );
    let right = narr(lev(D.FAIRTEST.narrator));
    right += lab(pick(A.question));
    right += `<div class="row">
      <button class="choice inline ${ans === "fits" ? (ok ? "ok" : "no") : ""}" aria-pressed="${ans === "fits"}" data-act="fairA" data-v="fits">${esc(pick(A.fitsButton))}</button>
      <button class="choice inline ${ans === "breaks" ? (ok ? "ok" : "no") : ""}" aria-pressed="${ans === "breaks"}" data-act="fairA" data-v="breaks">${esc(pick(A.breaksButton))}</button></div>`;
    if (ans && !ok) {
      right += fb("hint", pick(ans === "fits" ? A.wrongFits : A.wrongBreaks));
      right += hintPanel("fairtest", pick(A.hint1), pick(A.hint2));
    }
    if (ok) right += fb("good", pick(e.fitsRule ? e.whyFits || A.allDone : e.whyBreaks || A.allDone));
    if (ok && step < A.experiments.length - 1)
      right += `<div class="row"><button class="primary" data-act="fairA-next">${esc(pick(A.nextButton))}</button></div>`;
    if (fairDone()) right += fb("good", pick(A.allDone));
    return shell(left, right);
  }

  const B = D.FAIRTEST.levelB;
  const view = Math.min(r.fairView || 0, B.options.length - 1);
  const o = B.options[view];
  const picked = r.fairChoice === o.id;
  const checkedOpt = B.options.find((x) => x.id === r.fairChecked);
  const isOk = checkedOpt && checkedOpt.correct === true;
  const wasChecked = r.fairChecked === o.id;
  const rows = [
    [pick(B.rowHeaders.gibraltar), o.fitsGibraltar],
    [pick(B.rowHeaders.urals), o.fitsUrals],
    [pick(B.rowHeaders.panama), o.fitsPanama],
  ];
  const left = vpanel(
    `<div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem">
       <p class="cap" style="margin:0">${esc(fill(pick(B.candidateLabel), { n: view + 1, total: B.options.length }))}</p>
       <div class="navdots">${B.options
         .map((x, i) => `<button data-act="fairB-view" data-i="${i}" aria-current="${i === view}" aria-label="${i + 1}"
            class="${r.fairChoice === x.id ? "done" : ""}">${i + 1}</button>`)
         .join("")}</div></div>
     <div class="rule ${wasChecked && o.correct ? "picked" : wasChecked ? "wrong" : picked ? "picked" : ""}">
       <h4>${esc(pick(o.ruleLabel))}</h4>
       <table><tbody>${rows
         .map(
           ([n, f]) => `<tr><th>${esc(n)}</th><td><span class="fit ${f ? "" : "nofit"}">
             <span aria-hidden="true">${f ? "✓" : "✗"}</span>${esc(f ? pick(B.fitsLabel) : pick(B.breaksLabel))}</span></td></tr>`,
         )
         .join("")}</tbody></table></div>`,
  );
  let right = narr(lev(D.FAIRTEST.narrator));
  right += `<div class="row">
    <button class="choice inline" aria-pressed="${picked}" data-act="fairB-pick" data-id="${o.id}">${esc(picked ? pick(B.picked) : pick(B.pickThis))}</button>
    <button class="primary" data-act="fairB-check" ${!r.fairChoice || isOk ? "disabled" : ""}>${esc(pick(D.UI.check))}</button></div>`;
  if (r.fairChecked && !isOk && checkedOpt && checkedOpt.whyWrong)
    right += fb("hint", `${pick(D.UI.notYet)} — ${pick(checkedOpt.whyWrong)}`);
  if (r.fairChecked && !isOk) right += hintPanel("fairtest", pick(B.hint1), pick(B.hint2));
  if (isOk) right += fb("good", `${pick(B.correctNote)} ${checkedOpt.whyRight ? pick(checkedOpt.whyRight) : ""}`);
  return shell(left, right);
}

/* ---------- scene 6: transfer to the four oceans ----------------------- */
function sceneTransfer() {
  const r = R();
  if (S.level === "A") {
    const chips = D.TRANSFER.aChips;
    const slots = r.transferSlots || new Array(D.TRANSFER.aSlots).fill(null);
    const used = slots.filter(Boolean);
    const full = slots.every((x) => x != null);
    const distract = full && slots.some((id) => (chips.find((c) => c.id === id) || {}).correctSlot === -1);
    const done = transferDone();
    const prog = done ? 1 : used.length / D.TRANSFER.aSlots;

    const left = vpanel(
      globeSvg(prog, done ? pick(D.VISUAL.oceanGlobeDone) : fill(pick(D.VISUAL.oceanGlobeProgress), { pct: Math.round(prog * 100) })) +
        `<p class="cap">${esc(pick(D.VISUAL.oceanNamesCaption))}</p>`,
    );
    let right = narr(lev(D.TRANSFER.narrator));
    right += `<div class="row">${slots
      .map((id, i) => {
        const c = id ? chips.find((x) => x.id === id) : null;
        return `<button class="slot ${id ? "full" : ""}" data-act="tr-clear" data-i="${i}">${c ? esc(pick(c.text)) : i + 1}</button>`;
      })
      .join("")}</div>`;
    right += `<div class="row">${chips
      .map(
        (c) => `<button class="choice inline" data-act="tr-add" data-id="${c.id}" ${used.includes(c.id) ? "disabled" : ""}>${esc(pick(c.text))}</button>`,
      )
      .join("")}</div>`;
    if (full && distract) right += fb("hint", pick(D.TRANSFER.aWrongChip));
    if (full && !distract && !done) right += fb("hint", pick(D.TRANSFER.aWrongOrder));
    if (done) right += fb("good", pick(D.UI.correct)) + fb("good", pick(D.TRANSFER.funFact));
    if (used.length) right += `<div class="row"><button class="ghost" data-act="tr-reset">${esc(pick(D.UI.tryAgain))}</button></div>`;
    right += `<p class="cap">${esc(pick(D.TRANSFER.tip))}</p>`;
    return shell(left, right);
  }

  const evOk = correct(D.TRANSFER.bEvidenceChoices, r.transferEvidence);
  const bcOk = correct(D.TRANSFER.bBecauseChoices, r.transferBecause);
  const soOk = correct(D.TRANSFER.bSoChoices, r.transferSo);
  const done = transferDone();
  const steps = [evOk, bcOk, soOk].filter(Boolean).length;
  const prog = done ? 1 : 0.15 + steps * 0.28;
  const anyWrong =
    (r.transferEvidence && !evOk) || (r.transferBecause && !bcOk) || (r.transferSo && !soOk);

  const left = vpanel(
    globeSvg(prog, done ? pick(D.VISUAL.oceanGlobeDone) : fill(pick(D.VISUAL.oceanGlobeProgress), { pct: Math.round(prog * 100) })) +
      `<p class="cap">${esc(pick(D.VISUAL.oceanNamesCaption))}</p>`,
  );
  let right = narr(lev(D.TRANSFER.narrator));
  right += lab(pick(D.TRANSFER.bEvidencePrompt)) + choices(D.TRANSFER.bEvidenceChoices, r.transferEvidence, "tr-ev", true);
  if (evOk) right += lab(pick(D.TRANSFER.bBecausePrompt)) + choices(D.TRANSFER.bBecauseChoices, r.transferBecause, "tr-bc", true);
  if (evOk && bcOk) right += lab(pick(D.TRANSFER.bSoPrompt)) + choices(D.TRANSFER.bSoChoices, r.transferSo, "tr-so", true);
  if (anyWrong) right += fb("hint", pick(D.TRANSFER.bWrong));
  if (done) right += fb("good", explanation()) + fb("good", pick(D.TRANSFER.funFact));
  right += `<p class="cap">${esc(pick(D.TRANSFER.tip))}</p>`;
  return shell(left, right);
}

function evidenceFor(skill) {
  const r = R(), h = L().hints;
  const st = (x) => x;
  if (skill === "observation") {
    if (!r.observationPlacements) return "not-recorded";
    if (!obsDone()) return "experienced";
    return r.observationHadWrong ? "with-support" : "independent";
  }
  if (skill === "boundary") {
    if (!(r.modelViewed || []).length && !r.modelCheckChoice) return "not-recorded";
    if (!modelDone()) return "experienced";
    return r.modelCheckHadWrong ? "with-support" : "independent";
  }
  if (skill === "width") {
    if (!r.comparePrediction && !r.compareResultChoice) return "not-recorded";
    if (!compareDone()) return "experienced";
    return r.compareResultHadWrong ? "with-support" : "independent";
  }
  if (skill === "ruletest") {
    const touched = S.level === "A" ? !!r.fairAAnswers && Object.keys(r.fairAAnswers).length : !!r.fairChecked;
    if (!touched) return "not-recorded";
    if (!fairDone()) return "experienced";
    const used = h.fairtest || 0;
    if (used >= 2) return "with-two-hints";
    if (used === 1) return "with-one-hint";
    const wrong = S.level === "A" ? (r.fairAHadWrong ? 1 : 0) : r.fairAttempts || 0;
    return wrong > 0 ? "with-support" : "independent";
  }
  if (skill === "transfer") {
    const touched = S.level === "A" ? (r.transferSlots || []).some((x) => x != null) : !!r.transferEvidence;
    if (!touched) return "not-recorded";
    if (!transferDone()) return "experienced";
    return "transferred";
  }
  return "not-recorded";
}

    <div class="hmain"><div class="brand">${guideSvg("guide")
      .replace('class="guide"', 'class="guide" style="width:34px;height:34px"')}
      <div><h1>${esc(pick(D.UI.brandTitle))}</h1><p>${esc(pick(D.UI.brandSubtitle))}</p></div></div>
      <div style="display:flex;align-items:center;gap:.5rem">
        ${inScene ? `<span class="step">${esc(stepText)}</span>` : ""}
        <button class="pill" data-act="restart">${esc(pick(D.UI.startOver))}</button></div></div>
    <div class="hctl">
      <span class="seglab">${esc(pick(D.UI.levelLabel))}</span>
      <div class="seg"><button aria-pressed="${S.level === "A"}" data-act="level" data-v="A">${esc(pick(D.UI.levelA))}</button>
        <button aria-pressed="${S.level === "B"}" data-act="level" data-v="B">${esc(pick(D.UI.levelB))}</button></div>
      <span class="seglab">${esc(pick(D.UI.langLabel))}</span>
      <div class="seg"><button aria-pressed="${S.lang === "zh"}" data-act="lang" data-v="zh">${esc(pick(D.UI.langZh))}</button>
        <button aria-pressed="${S.lang === "en"}" data-act="lang" data-v="en">${esc(pick(D.UI.langEn))}</button></div>
      <label class="chk"><input type="checkbox" data-act="review" ${S.review ? "checked" : ""}>${esc(pick(D.UI.reviewMode))}</label>
    </div></div></header>`;

  const reviewBar = S.review
    ? `<div class="review"><div class="in">
        <p>${esc(pick(D.UI.reviewModeOn))} · ${esc(S.level === "A" ? pick(D.UI.levelA) : pick(D.UI.levelB))}</p>
        <div class="chips">
          <button data-act="goto" data-p="start" aria-current="${S.phase === "start"}">${esc(pick(D.SCENE_LABEL.start))}</button>
          ${D.SCENE_ORDER.map((s, i) => `<button data-act="goto" data-p="scene" data-i="${i}" aria-current="${inScene && S.i === i}">${i + 1}. ${esc(pick(D.SCENE_LABEL[s]))}</button>`).join("")}
          <button data-act="goto" data-p="summary" aria-current="${S.phase === "summary"}">${esc(pick(D.SCENE_LABEL.summary))}</button></div>
        <label class="chk" style="margin-top:.5rem"><input type="checkbox" data-act="reduced" ${S.reduced ? "checked" : ""}>${esc(pick(D.UI.reducedMotionPreview))}</label>
      </div></div>`
    : "";

  let body = "";
  if (S.phase === "start") body = startScreen();
  else if (S.phase === "summary") body = summaryScreen();
  else if (S.phase === "parent") body = parentScreen();
  else {
    body = `<div class="topline">
        <div class="dots">${D.SCENE_ORDER.map((_, i) => `<span class="${i < S.i ? "done" : i === S.i ? "now" : ""}"></span>`).join("")}</div>
        <span class="step">${esc(stepText)} · ${esc(pick(D.SCENE_LABEL[id]))} · ${D.SCENE_TIME_HINT[id]} · ${esc(S.level === "A" ? pick(D.UI.levelA) : pick(D.UI.levelB))}</span>
      </div>${SCENES[id]()}`;
  }

  const footer = inScene
    ? `<footer><div class="in"><button class="ghost" data-act="back">${esc(pick(D.UI.back))}</button>
        <div style="display:flex;align-items:center;gap:.5rem">
          ${S.review && !canNext ? `<span class="step">${esc(pick(D.UI.forcedAdvance))}</span>` : ""}
          <button class="primary" data-act="next" ${!canNext && !S.review ? "disabled" : ""}>${esc(
            S.i === D.SCENE_ORDER.length - 1 ? pick(D.SCENE_LABEL.summary) : pick(D.UI.next),
          )}</button></div></div></footer>`
    : "";

  document.documentElement.lang = zh() ? "zh-Hans" : "en";
  document.body.className = S.reduced ? "" : "anim";
  document.getElementById("app").innerHTML =
    `<a class="sr skip" href="#stage">${esc(pick(D.UI.skipToContent))}</a>` +
    header + reviewBar +
    `<main id="stage" tabindex="-1" class="${inScene ? "" : "nofoot"}">${body}</main>` +
    footer;
}

/* ---------- events ------------------------------------------------------ */
function goScene(i) {
  S.i = Math.max(0, Math.min(i, D.SCENE_ORDER.length - 1));
  S.phase = "scene";
  if (!L().startedAt) L().startedAt = Date.now();
  save();
  render();
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b || b.tagName === "INPUT") return;
  const a = b.dataset.act, r = R();

  switch (a) {
    case "lang": S.lang = b.dataset.v; save(); render(); return;
    case "level": S.level = b.dataset.v; save(); render(); return;
    case "begin": goScene(0); return;
    case "next":
      if (S.i >= D.SCENE_ORDER.length - 1) { S.phase = "summary"; L().doneAt = L().doneAt || Date.now(); save(); render(); }
      else goScene(S.i + 1);
      return;
    case "back":
      if (S.i === 0) { S.phase = "start"; save(); render(); } else goScene(S.i - 1);
      return;
    case "goto":
      L().reviewUsed = true;
      if (b.dataset.p === "start") { S.phase = "start"; save(); render(); }
      else if (b.dataset.p === "summary") { S.phase = "summary"; L().doneAt = L().doneAt || Date.now(); save(); render(); }
      else goScene(+b.dataset.i);
      return;
    case "parent": S.phase = "parent"; save(); render(); return;
    case "back-summary": S.phase = "summary"; save(); render(); return;
    case "restart":
      if (!confirm(pick(D.UI.startOverConfirmTitle) + "\n" + pick(D.UI.startOverConfirmBody))) return;
      S.byLevel = { A: freshLevel(), B: freshLevel() };
      S.phase = "start"; S.i = 0; save(); render();
      return;
    case "hint": addHint(b.dataset.scene); render(); return;

    /* scene 1 */
    case "hook-zoom": {
      const n = Math.min(2, (r.hookZoomStep || 0) + 1);
      patch({ hookZoomStep: n, hookRevealed: n >= 2 || r.hookRevealed === true });
      return;
    }
    case "hook-jump": patch({ hookZoomStep: 2, hookRevealed: true }); return;
    case "hook-replay": patch({ hookZoomStep: 0, hookRevealed: false, hookPrediction: undefined }); return;
    case "hook-pick": patch({ hookPrediction: b.dataset.id }); return;

    /* scene 2 */
    case "obs-place": {
      const cards = obsCards();
      let idx = r.obsIdx;
      if (idx == null || idx >= cards.length) {
        const f = cards.findIndex((c) => (r.observationPlacements || {})[c.id] !== c.kind);
        idx = f === -1 ? cards.length - 1 : f;
      }
      const card = cards[idx];
      const placed = Object.assign({}, r.observationPlacements, { [card.id]: b.dataset.b });
      const wrongNow = b.dataset.b !== card.kind;
      patch({ observationPlacements: placed, observationHadWrong: r.observationHadWrong || wrongNow, obsIdx: idx });
      if (!wrongNow) {
        const nextI = cards.findIndex((c) => c.id !== card.id && placed[c.id] !== c.kind);
        if (nextI !== -1) setTimeout(() => patch({ obsIdx: nextI }), 550);
      }
      return;
    }
    case "obs-go": patch({ obsIdx: +b.dataset.i }); return;
    case "obs-explain":
      patch({
        observationExplainChoice: b.dataset.id,
        observationHadWrong: r.observationHadWrong || !correct(D.OBSERVATION.levelBExplainChoices, b.dataset.id),
      });
      return;

    /* scene 3 */
    case "model-pick": {
      const v = r.modelViewed || [];
      patch({ modelSelected: b.dataset.id, modelViewed: v.includes(b.dataset.id) ? v : v.concat(b.dataset.id) });
      return;
    }
    case "model-check":
      patch({
        modelCheckChoice: b.dataset.id,
        modelCheckHadWrong: r.modelCheckHadWrong || !correct(D.MODEL.check.choices, b.dataset.id),
      });
      return;

    /* scene 4 */
    case "cmp-pick": patch({ comparePrediction: b.dataset.id }); return;
    case "cmp-run": {
      if (measureTimer) clearInterval(measureTimer);
      if (S.reduced) { patch({ compareRan: true, compareStep: D.STRAIT_STEPS, compareRunning: false }); return; }
      patch({ compareRan: true, compareStep: 0, compareRunning: true });
      let s = 0;
      measureTimer = setInterval(() => {
        s += 1;
        const last = s >= D.STRAIT_STEPS;
        if (last) { clearInterval(measureTimer); measureTimer = null; }
        patch({ compareStep: s, compareRunning: !last });
      }, 550);
      return;
    }
    case "cmp-result":
      patch({
        compareResultChoice: b.dataset.id,
        compareResultHadWrong: r.compareResultHadWrong || !correct(D.COMPARE.resultChoices, b.dataset.id),
      });
      return;

    /* scene 5 */
    case "fairA": {
      const A = D.FAIRTEST.levelA;
      const step = Math.min(r.fairAStep || 0, A.experiments.length - 1);
      const e = A.experiments[step];
      const v = b.dataset.v;
      const right_ = v === (e.fitsRule ? "fits" : "breaks");
      patch({
        fairAAnswers: Object.assign({}, r.fairAAnswers, { [e.id]: v }),
        fairAHadWrong: r.fairAHadWrong || !right_,
      });
      if (!right_ && (L().hints.fairtest || 0) < 2) { addHint("fairtest"); render(); }
      return;
    }
    case "fairA-next":
      patch({ fairAStep: Math.min((r.fairAStep || 0) + 1, D.FAIRTEST.levelA.experiments.length - 1) });
      return;
    case "fairB-view": patch({ fairView: +b.dataset.i }); return;
    case "fairB-pick": patch({ fairChoice: b.dataset.id }); return;
    case "fairB-check": {
      if (!r.fairChoice) return;
      const ok = correct(D.FAIRTEST.levelB.options, r.fairChoice);
      patch({ fairChecked: r.fairChoice, fairAttempts: ok ? r.fairAttempts || 0 : (r.fairAttempts || 0) + 1 });
      if (!ok && (L().hints.fairtest || 0) < 2) { addHint("fairtest"); render(); }
      return;
    }

    /* scene 6 */
    case "tr-add": {
      const slots = (r.transferSlots || new Array(D.TRANSFER.aSlots).fill(null)).slice();
      if (slots.includes(b.dataset.id)) return;
      const i = slots.indexOf(null);
      if (i === -1) return;
      slots[i] = b.dataset.id;
      const filled = slots.every((x) => x != null);
      const okAll = filled && slots.every((id, k) => (D.TRANSFER.aChips.find((c) => c.id === id) || {}).correctSlot === k);
      patch({ transferSlots: slots, transferHadWrong: r.transferHadWrong || (filled && !okAll) });
      return;
    }
    case "tr-clear": {
      const slots = (r.transferSlots || new Array(D.TRANSFER.aSlots).fill(null)).slice();
      slots[+b.dataset.i] = null;
      patch({ transferSlots: slots });
      return;
    }
    case "tr-reset": patch({ transferSlots: new Array(D.TRANSFER.aSlots).fill(null) }); return;
    case "tr-ev":
      patch({ transferEvidence: b.dataset.id, transferHadWrong: r.transferHadWrong || !correct(D.TRANSFER.bEvidenceChoices, b.dataset.id) });
      return;
    case "tr-bc":
      patch({ transferBecause: b.dataset.id, transferHadWrong: r.transferHadWrong || !correct(D.TRANSFER.bBecauseChoices, b.dataset.id) });
      return;
    case "tr-so":
      patch({ transferSo: b.dataset.id, transferHadWrong: r.transferHadWrong || !correct(D.TRANSFER.bSoChoices, b.dataset.id) });
      return;
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (!t.dataset || !t.dataset.act) return;
  if (t.dataset.act === "review") { S.review = t.checked; save(); render(); }
  if (t.dataset.act === "reduced") { S.reduced = t.checked; save(); render(); }
});

/* ---------- go ---------------------------------------------------------- */
load();
render();
</script>

  var h; try { h = decodeURIComponent(m[1]); } catch (e) { return; }
  if (!/^[A-Za-z0-9._%~/-]+$/.test(h) || h.indexOf('//') >= 0) return;
  var a = document.createElement('a'); a.href = h; a.textContent = '← 总览 Home';
  a.setAttribute('style', 'position:fixed;left:10px;bottom:10px;z-index:2147483647;background:#1f5f99;color:#fff;font:600 14px system-ui,sans-serif;padding:10px 14px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.35);opacity:.92');
  document.body.appendChild(a);
})()</script></body>
