<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脂肪侦探 · Fat Detective</title>
<style>
  :root{
    --ivory:#fbf9f1; --ink:#14312f; --muted:#48605d;
    --teal:#0f6f6b; --teal-soft:#dcefec;
    --blue:#2f7fc0; --blue-soft:#e2eefa;
    --sun:#eab34a; --sun-soft:#fbeecd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ivory);color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  h1,h2,h3,p{margin:0;}
  button{font:inherit;cursor:pointer;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  /* A4 — a visible focus ring on everything that can be reached by keyboard/switch */
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px;}
  [tabindex="-1"]:focus{outline:3px solid var(--blue);outline-offset:3px;}
  #stage:focus{outline:none;}
  .skip{position:absolute;left:-9999px;top:0;background:#fff;padding:12px 16px;min-height:44px;
    display:inline-flex;align-items:center;border-radius:8px;z-index:100;}
  .skip:focus{left:16px;top:16px;}
  [hidden]{display:none!important;}

  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
    border-bottom:1px solid rgba(20,49,47,.15);backdrop-filter:blur(4px);}
  .header-inner{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;
    flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand h1{font-size:18px;font-weight:800;white-space:nowrap;}
  .brand .sub{font-size:12px;color:var(--muted);}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .seg{display:flex;border:1px solid rgba(20,49,47,.2);border-radius:999px;padding:3px;background:#fff;}
  .seg button{border:none;background:transparent;border-radius:999px;padding:0 14px;
    font-size:13px;font-weight:600;color:var(--muted);min-height:44px;min-width:44px;}
  .seg button.active{background:var(--teal);color:#fff;}
  /* A4 — the whole label is the 44px target, and the box itself is finger-sized */
  .chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
    white-space:nowrap;min-height:44px;padding:0 8px;cursor:pointer;}
  .chk input[type="checkbox"]{width:22px;height:22px;margin:0;}
  .ghost-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;
    border-radius:999px;border:1px solid rgba(20,49,47,.3);background:#fff;color:var(--ink);
    padding:0 16px;font-size:13px;font-weight:600;}
  .ghost-btn:hover{background:var(--blue-soft);}
  .primary-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;
    border-radius:999px;border:none;background:var(--teal);color:#fff;padding:0 26px;
    font-size:16px;font-weight:700;}
  .primary-btn:hover{background:#0b5b57;}
  .primary-btn:disabled{opacity:.4;cursor:not-allowed;}

  main{max-width:1280px;margin:0 auto;padding:20px 16px 110px;min-height:60vh;}
  .progress-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .dots{display:flex;gap:6px;flex:1;}
  .dot{height:6px;flex:1;border-radius:4px;background:rgba(20,49,47,.15);}
  .dot.done{background:var(--teal);}
  .dot.current{background:var(--blue);}
  .step-label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}

  .scene-grid{display:grid;gap:20px;align-items:start;}
  @media (min-width:900px) and (orientation:landscape){
    /* U3/U5/U6 — the stage is a fixed-height shell (viewport minus header and the
       fixed footer). Each column scrolls inside itself, so the PAGE never scrolls and
       the fixed footer can never hide the question the child has to answer next.
       --stage-h is measured from real geometry after every render (syncStageHeight). */
    main{padding-bottom:16px;}
    .scene-grid{grid-template-columns:minmax(0,60fr) minmax(0,40fr);height:var(--stage-h,auto);}
    .left-col,.right-col{max-height:100%;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;}
  }
  /* Portrait / narrow: let the header scroll away instead of eating a quarter of a
     phone screen (the 44px targets make it taller). */
  @media (max-width:899px){ header{position:static;} }
  .panel{border-radius:22px;background:rgba(255,255,255,.85);border:1px solid rgba(20,49,47,.15);
    padding:18px;}
  .visual-panel{min-height:320px;display:flex;flex-direction:column;justify-content:center;}
  .right-col{display:flex;flex-direction:column;gap:14px;}

  .narrator{display:flex;gap:12px;border-radius:18px;border:1px solid rgba(15,111,107,.25);
    background:rgba(255,255,255,.92);padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .narrator .who{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--teal);margin-bottom:4px;}
  .narrator p{font-size:16px;line-height:1.55;margin-bottom:6px;}
  .avo{width:38px;height:38px;flex:none;}

  .choice-btn{display:block;width:100%;text-align:left;border-radius:16px;border:2px solid rgba(20,49,47,.22);
    background:#fff;padding:12px 16px;font-size:15px;line-height:1.4;color:var(--ink);min-height:48px;}
  .choice-btn:hover{border-color:var(--blue);background:var(--blue-soft);}
  .choice-btn.selected{border-color:var(--teal);background:var(--teal-soft);}
  .choice-btn.wrong{border-color:var(--sun);background:var(--sun-soft);}
  .choice-btn.inline{display:inline-block;width:auto;}
  .choice-row{display:flex;flex-wrap:wrap;gap:8px;}
  .choice-col{display:flex;flex-direction:column;gap:8px;}

  .feedback{border-radius:16px;border:2px solid var(--teal);background:var(--teal-soft);
    padding:12px 16px;font-size:15px;line-height:1.5;}
  .feedback.hint{border-color:var(--sun);background:var(--sun-soft);}
  .field-label{font-size:14px;font-weight:700;}
  .caption{text-align:center;font-size:13px;color:var(--muted);margin-top:8px;}

  footer.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,249,241,.97);
    border-top:1px solid rgba(20,49,47,.15);backdrop-filter:blur(4px);z-index:20;}
  .nav-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;
    align-items:center;justify-content:space-between;}

  .label-card{border-radius:16px;border:2px solid var(--teal);background:#fff;padding:14px;
    width:150px;text-align:center;}
  .label-card.dim{background:var(--blue-soft);}
  .label-card .icon{font-size:34px;}
  .label-card .name{font-size:12px;color:var(--muted);margin-top:6px;}
  .label-card .badge{display:inline-block;margin-top:8px;border-radius:999px;background:var(--sun-soft);
    border:1px solid var(--sun);font-size:10.5px;font-weight:700;padding:3px 10px;}
  .label-card .row{display:flex;justify-content:space-between;border-top:1px solid rgba(20,49,47,.15);
    margin-top:10px;padding-top:8px;font-size:12px;}
  .label-card .row .g{font-weight:800;color:var(--teal);font-size:16px;}
  .label-pair{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}

  .food-shape{width:150px;margin:0 auto;text-align:center;}
  .food-shape .icon{font-size:38px;}
  .food-shape .shape{margin:12px auto;height:60px;display:flex;align-items:center;justify-content:center;}
  .shape-solid{width:90px;height:54px;border-radius:10px;background:color-mix(in oklab, var(--sun) 45%, white);
    border:2.5px solid var(--sun);}
  .shape-liquid{width:110px;height:26px;border-radius:50%;background:color-mix(in oklab, var(--teal) 35%, white);
    border:2.5px solid var(--teal);}
  .food-shape .tag{font-size:13px;font-weight:700;margin-top:4px;}

  .gauge-wrap{display:flex;justify-content:center;gap:60px;align-items:flex-end;padding-top:10px;}
  .gauge-col{text-align:center;}
  .gauge-top-icon{height:26px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .butter-pat{width:34px;height:20px;border-radius:4px;background:color-mix(in oklab, var(--sun) 45%, white);border:2px solid var(--sun);}
  .oil-drop{width:26px;height:18px;border-radius:50%;background:color-mix(in oklab, var(--teal) 30%, white);border:2px solid var(--teal);}
  .gauge-20g{font-size:10px;color:var(--muted);margin-bottom:6px;}
  .gauge{width:46px;height:130px;border:2px solid rgba(20,49,47,.28);border-radius:9px;background:#fff;
    position:relative;overflow:hidden;display:flex;flex-direction:column-reverse;}
  /* M1/M2 — a bar only animates on the render the child's own press created (.anim);
     every other render paints the static end state, so nothing replays by itself. */
  .gauge .seg{width:100%;}
  .gauge .seg.anim{animation:growY .6s ease-out both;transform-origin:bottom;}
  .gauge .seg.goeasy.anim{animation-delay:.25s;}
  @keyframes growY{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .gauge .seg.friendly{background:var(--teal);}
  .gauge .seg.goeasy{background:var(--sun);}
  .gauge-label{margin-top:8px;font-size:12px;font-weight:600;}
  .legend{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:12px;color:var(--muted);}
  .legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

  table.fair-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.fair-table th,table.fair-table td{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(20,49,47,.1);}
  table.fair-table thead th{color:var(--teal);border-bottom:2px solid rgba(20,49,47,.2);font-weight:700;}
  table.fair-table tbody th{color:var(--muted);font-weight:600;}
  .cand-dots{display:flex;gap:6px;margin-bottom:10px;}
  /* A4 — 44px numbered step dots (Scene 2 cards, Scene 5B candidate tables) */
  .cand-dot,.navdot{width:44px;height:44px;border-radius:50%;border:1px solid rgba(20,49,47,.3);background:#fff;
    font-size:14px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;}
  .cand-dot.current{border-color:var(--teal);background:var(--teal);color:#fff;}
  .cand-dot.picked{border-color:var(--teal);background:var(--teal-soft);color:var(--ink);}

  .row-cue{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;
    font-size:12.5px;font-weight:600;}
  .row-cue.ok{background:var(--teal-soft);}
  .row-cue.bad{background:var(--sun-soft);}
  .claim-card{border-radius:16px;border:2px solid rgba(20,49,47,.2);background:#fff;padding:16px;}
  .claim-card .claim{font-size:15px;line-height:1.5;margin-bottom:10px;}
  .claim-row{display:flex;align-items:baseline;gap:8px;margin-top:6px;}
  .claim-row .rk{font-size:13px;color:var(--muted);}

  .xray-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .xray-icon{font-size:22px;width:28px;text-align:center;}
  .xray-name{font-size:12px;color:var(--muted);width:52px;}
  .xray-bar{flex:1;height:14px;border-radius:7px;border:1.5px solid rgba(20,49,47,.25);background:#fff;
    overflow:hidden;display:flex;}
  .xray-bar .seg{height:100%;}
  .xray-bar .seg.anim{animation:growX .5s ease-out both;transform-origin:left;}
  @keyframes growX{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  .xray-bar .seg.goeasy{background:var(--sun);}
  .xray-bar .seg.friendly{background:var(--teal);}
  .shape-anim{animation:settle .45s ease-out both;}
  @keyframes settle{from{transform:translateY(-16px);opacity:0;}to{transform:none;opacity:1;}}

  .slot{min-height:46px;min-width:90px;border-radius:12px;border:2px dashed rgba(20,49,47,.35);
    background:#fff;padding:8px 12px;font-size:14px;display:inline-flex;align-items:center;
    justify-content:center;margin:3px;}
  .slot.filled{border-style:solid;border-color:var(--teal);background:var(--teal-soft);cursor:pointer;}

  .start-wrap{max-width:720px;margin:20px auto 0;}
  .start-hero{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .start-hero h1{font-size:26px;font-weight:800;}
  .start-hero .sub{color:var(--muted);font-size:15px;margin-top:2px;}
  .start-card{border-radius:20px;border:1px solid rgba(20,49,47,.15);background:rgba(255,255,255,.85);
    padding:18px;margin:16px 0;}
  .start-card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .privacy-note{font-size:13px;color:var(--muted);margin-top:14px;}

  .summary-wrap{max-width:760px;margin:10px auto 0;}
  .core-idea{border-radius:24px;border:2px solid var(--teal);background:var(--teal-soft);padding:20px;margin:16px 0;}
  .core-idea .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--teal);}
  .core-idea p{font-size:18px;line-height:1.55;margin-top:6px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){.two-col{grid-template-columns:1fr;} .gauge-wrap{gap:30px;}}
  .mini-card{border-radius:16px;border:1px solid rgba(20,49,47,.15);background:rgba(255,255,255,.85);padding:14px;}
  .mini-card .lab{font-size:15px;font-weight:700;color:#1e5c93;}
  .mini-card p{color:#1e5c93;font-size:16px;line-height:1.5;margin-top:4px;}
  .teaser{margin-top:14px;}
  .foot-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  /* M2/M3 — reduced motion. `.rm` goes on <html> for BOTH paths (the operating system
     setting and the in-app preview toggle), so the toggle really does stop every
     animation and transition, not just a stagger delay. */
  html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<a href="#stage" class="skip" id="skiplink">Skip to content</a>
<header><div class="header-inner" id="header"></div></header>
<!-- A2: one persistent live region — never replaced by a render, so a screen reader
     actually announces the narrator instead of losing the node mid-announcement -->
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<main id="stage" tabindex="-1"></main>
<footer class="nav" id="footer" hidden><div class="nav-inner" id="footer-inner"></div></footer>

<script>
"use strict";
/* ============================================================
   脂肪侦探 · Fat Detective — standalone, single-file build.
   No server, no build step, no network calls: open this file
   directly in a browser (double-click / file://). All progress
   is stored in this browser's localStorage only.
   ============================================================ */

// ---------- content ----------------------------------------------------
function t(c){ return c[STATE.lang]; }
function tl(c){ return c[STATE.level][STATE.lang]; }
function fmt(str, vals){ return str.replace(/\{(\w+)\}/g, (_,k)=> (vals[k]!==undefined? vals[k] : "{"+k+"}")); }

const UI = {
  brandTitle:{zh:"脂肪侦探",en:"Fat Detective"},
  brandSubtitle:{zh:"两包零食写的总脂肪一样多，它们对身体的影响也一样吗？",en:"Two snacks list the same Total Fat — do they affect your body the same way?"},
  next:{zh:"下一步",en:"Next"}, back:{zh:"上一步",en:"Back"},
  startOver:{zh:"重新开始",en:"Start over"},
  levelLabel:{zh:"年级",en:"Level"}, levelA:{zh:"一年级左右",en:"About Grade 1"}, levelB:{zh:"三年级左右",en:"About Grade 3"},
  langLabel:{zh:"语言",en:"Language"}, langZh:{zh:"中文",en:"中文"}, langEn:{zh:"English",en:"English"},
  narrator:{zh:"牛油果侦探说",en:"Avo the detective says"},
  yourIdeaSaved:{zh:"已记下你的第一个想法（这不是考试）。",en:"Your first idea is saved (this is not a test)."},
  correct:{zh:"对了！",en:"That works!"},
  hintButton:{zh:"需要提示",en:"Need a hint"}, hint1Label:{zh:"提示 1",en:"Hint 1"}, hint2Label:{zh:"提示 2",en:"Hint 2"},
  check:{zh:"检查一下",en:"Check"}, notYet:{zh:"还没有，看看提示",en:"Not yet — see the hint"},
  modelIsAModel:{zh:"这是一个模型：真正的脂肪分子太小，看不见。我们用“在室温下是固体还是液体”来帮你猜脂肪的种类。",
    en:"This is a model: real fat molecules are far too small to see. We use “solid or liquid at room temperature” as a clue to guess the fat type."},
  startTitle:{zh:"选择年级和语言（中文或 English），然后开始",en:"Choose a level and language (中文 or English), then begin"},
  startBegin:{zh:"开始学习",en:"Begin"},
  startBlurb:{zh:"大约 5 分钟。你要先猜一猜，再动手试一试，最后用自己的话说清楚。",en:"About 5 minutes. You will predict, try things, and then explain the idea in your own words."},
  noDataNote:{zh:"不收集姓名、声音或图像。进度只存在这台浏览器里，不会联网。",en:"No name, voice, or photos are collected. Progress stays in this browser only — nothing is sent anywhere."},
  progressStep:{zh:"第 {n} / 6 步",en:"Step {n} of 6"},
  startOverConfirm:{zh:"要重新开始吗？这会清除这台浏览器上的记录。",en:"Start over? This clears progress saved in this browser."},
  skipToContent:{zh:"跳到主要内容",en:"Skip to content"},
  regionVisual:{zh:"画面",en:"Visual"}, regionPanel:{zh:"旁白和问题",en:"Narration and questions"},
  reducedMotionPreview:{zh:"减少动画",en:"Reduce motion"},
  perServing:{zh:"每份",en:"per serving"},
  prevItem:{zh:"上一个",en:"Previous"}, nextItem:{zh:"下一个",en:"Next"},
};

/* P10 — plain-language descriptions of every visual for a screen reader. They report
   what is currently on screen and never state the answer the child still owes. */
const VISUAL = {
  hookClosed:{zh:"两包零食的图片并排放着：薯片和坚果，营养标签还没有对比出来。",
    en:"Two snack packages side by side: chips and nuts. Their nutrition labels have not been compared yet."},
  hookOpen:{zh:"两张营养标签并排放着。薯片这一张上有一个“无反式脂肪”的小牌子。两张都写着每份总脂肪 14 克。",
    en:"Two nutrition labels side by side. The chips' label carries a “0g trans fat” badge. Both list Total Fat 14g per serving."},
  obsCard:{zh:"第 {n} 张卡片，一共 {total} 张，上面写着：{text}",en:"Card {n} of {total}. It reads: {text}"},
  modelIdle:{zh:"观察台上放着{food}，还没有开始观察，看不出它是硬块还是液体。",
    en:"{food} is on the observation table. The observation has not run yet, so you cannot tell yet whether it is solid or liquid."},
  modelSettled:{zh:"观察台上的{food}现在看起来是{state}。已经观察了 {n} / {total} 种食物。",
    en:"The {food} on the observation table now looks {state}. {n} of {total} foods observed."},
  gaugeIdle:{zh:"两根一样长的尺子，分别代表黄油里的 20 克脂肪和橄榄油里的 20 克脂肪，现在都还是空的。",
    en:"Two bars of equal length stand for 20g of fat from butter and 20g of fat from olive oil. Both are still empty."},
  gaugeRan:{zh:"两根一样长的尺子都填满了。黄油那根里“要悠着点”的颜色占 {a}%，橄榄油那根占 {b}%。",
    en:"Both equal-length bars are filled in. On the butter bar the go-easy color takes {a}%; on the olive-oil bar it takes {b}%."},
  fairClaim:{zh:"第 {n} 组对比，一共 {total} 组。说法是：{claim}。份量：{serving}。看了什么：{checked}。",
    en:"Comparison {n} of {total}. The claim is: {claim}. Serving size: {serving}. What was checked: {checked}."},
  fairTable:{zh:"候选表 {n}，一共 {total} 张。表里的数字：{rows}",en:"Candidate table {n} of {total}. The numbers in it: {rows}"},
  xray:{zh:"两根 X 光条：牛奶和三文鱼。条里显示了 {pct}% 的内容，两种颜色分别代表要悠着点的脂肪和更友好的脂肪。",
    en:"Two X-ray bars, milk and salmon. {pct}% of each bar is filled in; the two colors stand for go-easy fat and friendlier fat."},
};

const SCENE_LABEL = {
  start:{zh:"开始",en:"Start"}, hook:{zh:"谜题",en:"Mystery"},
  observation:{zh:"观察还是猜测",en:"Observe or guess"}, model:{zh:"固体还是液体",en:"Solid or liquid"},
  compare:{zh:"比一比",en:"Compare"}, fairtest:{zh:"公平比较",en:"Fair comparison"},
  transfer:{zh:"换个情境",en:"Transfer"}, summary:{zh:"总结",en:"Summary"},
};
const SCENE_TIME = { hook:"0:00–0:30", observation:"0:30–1:15", model:"1:15–2:15", compare:"2:15–3:15", fairtest:"3:15–4:10", transfer:"4:10–5:00" };
const SCENE_ORDER = ["hook","observation","model","compare","fairtest","transfer"];

const HOOK = {
  chipsName:{zh:"薯片",en:"Chips"}, nutsName:{zh:"坚果",en:"Nuts"},
  totalFatLabel:{zh:"总脂肪",en:"Total Fat"}, grams:"14g",
  servingNote:{zh:"每份（两包份量一样）",en:"per serving (same serving size)"},

// ---------- state ---------------------------------------------------------
const STORAGE_KEY = "fmlos.fat-label-detective.standalone.v1";
let STATE = loadState();

function freshProgress(){ return { phase:"start", sceneIndex:0, record:{}, hintsUsed:{} }; }
function freshState(){ return { level:"A", lang:"en", reducedMotionPreview:false, byLevel:{ A:freshProgress(), B:freshProgress() } }; }
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.byLevel || !parsed.byLevel.A || !parsed.byLevel.B) return freshState();
    return parsed;
  }catch(e){ return freshState(); }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){} }

/* M2/M3 — one switch for both paths: the operating system setting and the in-app
   preview toggle. render() puts `.rm` on <html>, which kills every animation. */
let osReducedMotion = false;
try{ osReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
function reducedMotion(){ return osReducedMotion || STATE.reducedMotionPreview===true; }

/* A3 — the control the child just pressed, remembered across the re-render so that
   (a) only what this press created may animate and (b) focus can be put back on it
   instead of falling to the top of the page. Inline onclick handlers are used
   throughout this file, so the handler text itself is the key. */
let lastActKey = null, lastActFn = null, lastFocusedQuestion = null;
document.addEventListener("click", function(e){
  const el = e.target && e.target.closest ? e.target.closest("[onclick]") : null;
  if(!el) return;
  lastActKey = el.getAttribute("onclick");
  lastActFn = (lastActKey.match(/^\s*([A-Za-z0-9_$]+)/)||[])[1] || null;
}, true);

/* A3 — a renderer calls this to say "this is what the child must do next"; after the
   render it is scrolled into its column's visible area and given focus. */
let pendingQuestionId = null;
function markQuestion(id){ pendingQuestionId = id; return id; }
function fieldLabel(text, id){
  return '<div class="field-label"'+(id? ' id="'+id+'" tabindex="-1"' : '')+'>'+text+'</div>';
}
/* P10/A2 — a description of what is on screen right now, for a screen reader. */
function visual(desc, html){ return '<div role="img" aria-label="'+escAttr(desc)+'">'+html+'</div>'; }
function escAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

function prog(){ return STATE.byLevel[STATE.level]; }
function rec(){ return prog().record; }
function patchRecord(patch){ Object.assign(rec(), patch); saveState(); render(); }
function setPhaseScene(phase, idx){ prog().phase = phase; if(idx!==undefined) prog().sceneIndex = idx; saveState(); render(); }

// ---------- completion logic -----------------------------------------------
function observationCards(){ return OBSERVATION.cards.filter(c => STATE.level==="B" || !c.levelBOnly); }
function observationDone(){
  const p = rec().observationPlacements || {};
  const cards = observationCards();
  const allRight = cards.every(c => p[c.id]===c.kind);
  const explainOk = STATE.level==="A" || (OBSERVATION.levelBChoices.find(x=>x.id===rec().observationExplainChoice)||{}).correct===true;
  return allRight && explainOk;
}
function modelDone(){
  const r = rec();
  const observed = r.modelObservedFoods || [];
  return observed.length >= MODEL.foods.length && (r.modelRuns||0) >= 1 &&
    (MODEL.checkChoices.find(c=>c.id===r.modelCheckChoice)||{}).correct===true;
}
function compareDone(){
  const r = rec();
  return !!r.comparePrediction && !!r.compareRan &&
    (COMPARE.resultChoices.find(c=>c.id===r.compareResultChoice)||{}).correct===true;
}
function fairDone(){
  const r = rec();
  if(STATE.level==="A"){
    return FAIRTEST.levelA.experiments.every(e => r.fairAAnswers && r.fairAAnswers[e.id] === (e.fair?"fair":"unfair"));
  }
  return (FAIRTEST.levelB.options.find(o=>o.id===r.fairChecked)||{}).correct===true;
}
function transferDone(){
  const r = rec();
  if(STATE.level==="A"){
    const slots = r.transferSlots || [];
    if(slots.length!==3 || slots.some(s=>s==null)) return false;
    return slots.every((id,i)=> (TRANSFER.aChips.find(c=>c.id===id)||{}).slot===i);
  }
  const ev=(TRANSFER.bEvidence.find(c=>c.id===r.transferEvidence)||{}).correct===true;
  const bc=(TRANSFER.bBecause.find(c=>c.id===r.transferBecause)||{}).correct===true;
  const so=(TRANSFER.bSo.find(c=>c.id===r.transferSo)||{}).correct===true;
  return ev&&bc&&so;
}
function isSceneComplete(scene){
  switch(scene){
    case "hook": return !!rec().hookPrediction;
    case "observation": return observationDone();
    case "model": return modelDone();
    case "compare": return compareDone();
    case "fairtest": return fairDone();
    case "transfer": return transferDone();
  }
  return false;
}
function cap(s){ return s.length? s[0].toUpperCase()+s.slice(1) : s; }
function deriveExplanation(){
  if(!transferDone()) return null;
  const r = rec();
  if(STATE.level==="A"){
    const parts = (r.transferSlots||[]).map(id => t(pickCopy(TRANSFER.aChips.find(c=>c.id===id))));
    return parts.join(STATE.lang==="zh" ? "，" : " ") + (STATE.lang==="zh" ? "。" : ".");
  }
  const bc = t(pickCopy(TRANSFER.bBecause.find(c=>c.id===r.transferBecause)));
  const so = t(pickCopy(TRANSFER.bSo.find(c=>c.id===r.transferSo)));
  return STATE.lang==="zh" ? ("因为"+bc+"，所以"+so+"。") : (cap(bc)+", so "+so+".");
}
function pickCopy(obj){ return {zh:obj.zh, en:obj.en}; }
function hookChoiceLabel(id){ const c = HOOK.choices.find(x=>x.id===id); return c? t(pickCopy(c)) : id; }

// ---------- small render helpers -------------------------------------------
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
/* A2 — whatever the narrator says is mirrored into the one live region that survives
   a re-render, so a screen reader announces it instead of losing the node. */
let currentNarratorText = "", announcedText = "";
function narrator(html, extra){
  currentNarratorText = String(html).replace(/<[^>]*>/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/\s+/g," ").trim();
  return '<div class="narrator"><svg class="avo" viewBox="0 0 48 56" aria-hidden="true">'+avoSvg()+'</svg>'+
    '<div><div class="who">'+esc(t(UI.narrator))+'</div><div>'+html+'</div>'+(extra||"")+'</div></div>';
}
function avoSvg(){
  return '<path d="M24 3C11 3 5 18 5 30a19 19 0 0 0 38 0C43 18 37 3 24 3Z" fill="color-mix(in oklab, var(--teal) 22%, white)" stroke="var(--teal)" stroke-width="2"/>'+
  '<circle cx="24" cy="33" r="9" fill="var(--sun)" fill-opacity=".55" stroke="var(--sun)" stroke-width="1.5"/>'+
  '<path d="M9 12 Q24 4 39 12 L36 15 Q24 10 12 15 Z" fill="var(--ink)" fill-opacity=".75"/>'+
  '<rect x="16" y="4" width="16" height="8" rx="2" fill="var(--ink)" fill-opacity=".75"/>'+
  '<circle cx="18" cy="24" r="3" fill="#fff" stroke="var(--teal)" stroke-width="1"/>'+
  '<circle cx="30" cy="24" r="3" fill="#fff" stroke="var(--teal)" stroke-width="1"/>'+
  '<circle cx="18" cy="24.6" r="1.4" fill="var(--ink)"/><circle cx="30" cy="24.6" r="1.4" fill="var(--ink)"/>'+
  '<path d="M17 41c3 2.4 11 2.4 14 0" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/>';
}
function choiceBtn(id, label, opts){
  opts = opts || {};
  const cls = ["choice-btn"];
  if(opts.inline) cls.push("inline");
  if(opts.selected) cls.push(opts.wrong ? "wrong" : "selected");
  return '<button type="button" class="'+cls.join(" ")+'" onclick="'+opts.onclick+'">'+label+'</button>';
}
function feedback(html, tone){ return '<div class="feedback'+(tone==="hint"?" hint":"")+'">'+html+'</div>'; }

// ---------- scene renderers --------------------------------------------
function sceneShell(left, right){
  return '<div class="scene-grid">'+
    '<section class="left-col" aria-label="'+escAttr(t(UI.regionVisual))+'"><div class="panel visual-panel">'+left+'</div></section>'+
    '<section class="right-col" tabindex="-1" aria-label="'+escAttr(t(UI.regionPanel))+'">'+right+'</section></div>';
}

function renderHook(){
  const r = rec();
  const revealed = r.hookRevealed === true;
  const chosen = r.hookPrediction;
  let left = visual(t(revealed? VISUAL.hookOpen : VISUAL.hookClosed),
    '<div class="label-pair">'+
    labelCard(true, "🍟", t(HOOK.chipsName), revealed, t(HOOK.badge))+
    labelCard(false, "🥜", t(HOOK.nutsName), revealed, null)+
    '</div>');
  let right = narrator(esc(revealed? tl(HOOK.narrator) : tl(HOOK.intro)),
    revealed? '<p style="margin-top:8px;font-size:14px;font-weight:600;color:#1e5c93;">'+esc(t(HOOK.caption))+'</p>' : "");
  right += '<div>';
  right += revealed
    ? '<button class="ghost-btn" onclick="hookAgain()">'+esc(t(HOOK.againBtn))+'</button>'
    : '<button class="primary-btn" onclick="hookReveal()">'+esc(t(HOOK.compareBtn))+'</button>';
  right += '</div>';
  if(revealed){
    right += fieldLabel(esc(t(HOOK.question)), "q-hook")+'<div class="choice-col">';
    if(!chosen) markQuestion("q-hook");
    HOOK.choices.forEach(c=>{
      right += choiceBtn(c.id, esc(t(pickCopy(c))), {selected: chosen===c.id, onclick:"hookPredict('"+c.id+"')"});
    });
    right += '</div>';
    if(chosen) right += feedback(esc(t(UI.yourIdeaSaved)), "good");
  }
  return sceneShell(left, right);
}
function labelCard(hasBadge, icon, name, revealed, badge){
  if(!revealed){
    return '<div class="label-card dim"><div class="icon">'+icon+'</div><div class="name">'+esc(name)+'</div></div>';
  }
  return '<div class="label-card"><div style="font-size:12px;color:var(--muted);">'+icon+' '+esc(name)+'</div>'+
    (badge? '<div class="badge">'+esc(badge)+'</div>' : '<div style="height:26px;"></div>')+
    '<div class="row"><span>'+esc(t(HOOK.totalFatLabel))+'</span><span class="g">'+HOOK.grams+'</span></div>'+
    '<div style="font-size:10.5px;color:var(--muted);text-align:right;margin-top:4px;">'+esc(t(HOOK.servingNote))+'</div></div>';

window.hookReveal = function(){ patchRecord({hookRevealed:true}); };
window.hookAgain = function(){ patchRecord({hookRevealed:false, hookPrediction:undefined}); };
window.hookPredict = function(id){ patchRecord({hookPrediction:id}); };

let obsIdx = 0;
function renderObservation(){
  const cards = observationCards();
  const placements = rec().observationPlacements || {};
  const firstIncomplete = cards.findIndex(c=>placements[c.id]!==c.kind);
  if(obsIdx===undefined || obsIdx>=cards.length) obsIdx = 0;
  if(!renderObservation._touched) obsIdx = firstIncomplete===-1? cards.length-1 : Math.max(0,firstIncomplete);
  const card = cards[obsIdx];
  const placed = placements[card.id];
  const isRight = placed===card.kind, isWrong = !!placed && !isRight;
  const buckets = STATE.level==="B" ? ["observation","guess","explanation"] : ["observation","guess"];

  let left = visual(fmt(t(VISUAL.obsCard), {n:obsIdx+1, total:cards.length, text:t(pickCopy(card))}),
    '<div style="font-size:12px;font-weight:700;color:var(--muted);">'+(obsIdx+1)+' / '+cards.length+'</div>'+
    '<p style="font-size:20px;font-weight:600;line-height:1.5;margin-top:8px;">“'+esc(t(pickCopy(card)))+'”</p>');
  left += '<div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;">';
  cards.forEach((c,i)=>{
    const done = placements[c.id]===c.kind;
    const aria = fmt(t({zh:"第 {n} 张卡片，共 {total} 张",en:"Card {n} of {total}"}), {n:i+1, total:cards.length});
    left += '<button type="button" class="navdot" onclick="obsGoto('+i+')" aria-label="'+escAttr(aria)+'" aria-current="'+(i===obsIdx?'true':'false')+'" style="'+
      'border:1px solid '+(i===obsIdx?'var(--teal)':'rgba(20,49,47,.3)')+';'+
      'background:'+(i===obsIdx?'var(--teal)':(done?'var(--teal-soft)':'#fff'))+';'+
      'color:'+(i===obsIdx?'#fff':'var(--ink)')+';">'+(i+1)+'</button>';
  });
  left += '</div>';

  let right = narrator(esc(tl(OBSERVATION.narrator)));
  right += fieldLabel(esc(fmt(t({zh:"第 {n} 张卡片放哪里？",en:"Where does card {n} belong?"}),{n:obsIdx+1})), "q-obs");
  if(!isRight) markQuestion("q-obs");
  right += '<div class="choice-row">';
  buckets.forEach(b=>{
    const sel = placed===b;
    right += '<button class="choice-btn inline'+(sel?(isRight?' selected':' wrong'):'')+'" onclick="obsPlace(\''+card.id+'\',\''+b+'\')">'+esc(t(OBSERVATION.buckets[b]))+'</button>';
  });
  right += '</div>';
  if(isRight) right += feedback(esc(t(pickCopy({zh:card.fbzh,en:card.fben}))), "good");
  if(isWrong) right += feedback(esc(t(OBSERVATION.wrongFeedback)), "hint");
  right += '<div style="display:flex;gap:8px;">'+
    '<button class="ghost-btn" '+(obsIdx===0?'disabled':'')+' onclick="obsGoto('+(obsIdx-1)+')">'+esc(t(UI.back))+'</button>'+
    '<button class="ghost-btn" '+(obsIdx>=cards.length-1?'disabled':'')+' onclick="obsGoto('+(obsIdx+1)+')">'+esc(t(UI.next))+'</button>'+
    '</div>';

  const allPlacedRight = cards.every(c=>placements[c.id]===c.kind);
  if(STATE.level==="B" && allPlacedRight){
    const ec = rec().observationExplainChoice;
    const ok = (OBSERVATION.levelBChoices.find(x=>x.id===ec)||{}).correct===true;
    right += '<div style="border-top:1px solid rgba(20,49,47,.15);padding-top:12px;">'+
      fieldLabel(esc(t(OBSERVATION.levelBPrompt)), "q-obsexplain")+'<div class="choice-col" style="margin-top:8px;">';
    if(!ok) markQuestion("q-obsexplain");
    OBSERVATION.levelBChoices.forEach(c=>{
      const sel = ec===c.id;
      right += '<button class="choice-btn'+(sel?(c.correct?' selected':' wrong'):'')+'" onclick="obsExplain(\''+c.id+'\')">'+esc(t(pickCopy(c)))+'</button>';
    });
    right += '</div>';
    if(ec && !ok) right += feedback(esc(t(OBSERVATION.wrongFeedback)), "hint");
    right += '</div>';
  }
  if(isSceneComplete("observation")) right += feedback(esc(t(UI.correct)), "good");
  return sceneShell(left, right);
}
window.obsGoto = function(i){ obsIdx = Math.max(0, Math.min(i, observationCards().length-1)); render(); };
window.obsPlace = function(cardId, bucket){
  renderObservation._touched = true;
  const cards = observationCards();
  const c = cards.find(x=>x.id===cardId);
  const placements = Object.assign({}, rec().observationPlacements||{});
  placements[cardId] = bucket;
  patchRecord({observationPlacements: placements});
  if(c && bucket===c.kind){
    const nextIncomplete = cards.findIndex(x=>x.id!==cardId && placements[x.id]!==x.kind);
    /* A3 — the auto-advance is still the child's own action, so it must carry focus to
       the new card's question instead of dropping it at the top of the page. */
    if(nextIncomplete!==-1) setTimeout(()=>{
      obsIdx = nextIncomplete; lastFocusedQuestion = null; lastActKey = "obsGoto("+nextIncomplete+")"; render();
    }, 500);
  }
};
window.obsExplain = function(id){ renderObservation._touched = true; patchRecord({observationExplainChoice:id}); };

function renderModel(){
  const r = rec();
  const selectedId = r.modelSelectedFood || MODEL.foods[0].id;
  const food = MODEL.foods.find(f=>f.id===selectedId) || MODEL.foods[0];
  const observed = r.modelObservedFoods || [];
  const settled = observed.includes(food.id);
  /* M1 — the shape only settles on the render the child's own "Watch closely" made. */
  const animate = settled && !reducedMotion() && lastActFn==="modelWatch";
  const foodName = t(pickCopy(food));
  const desc = settled
    ? fmt(t(VISUAL.modelSettled), {food:foodName, state:t(MODEL.stateLabel[food.state]), n:observed.length, total:MODEL.foods.length})
    : fmt(t(VISUAL.modelIdle), {food:foodName});
  let left = visual(desc, '<div class="food-shape"><div class="icon" aria-hidden="true">'+food.icon+'</div>'+
    '<div class="shape">'+(settled ? '<div class="'+(food.state==="solid"?"shape-solid":"shape-liquid")+(animate?' shape-anim':'')+'"></div>' : '<div style="width:80px;height:6px;background:rgba(20,49,47,.12);border-radius:3px;"></div>')+'</div>'+
    '<div class="tag">'+(settled? esc(t(MODEL.stateLabel[food.state]))+' · '+esc(t(MODEL.tagLabel[food.tag])) : '')+'</div>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:10px;">'+fmt(esc(t(MODEL.progress)), {n:observed.length, total:MODEL.foods.length})+'</div></div>')+
    '<p class="caption">'+esc(t(MODEL.rule))+'</p>';

  let right = narrator(esc(tl(MODEL.narrator)));
  right += fieldLabel(esc(t(MODEL.pickFood)), "q-modelpick");
  if(observed.length<MODEL.foods.length) markQuestion("q-modelpick");
  right += '<div class="choice-row">';
  MODEL.foods.forEach(f=>{
    right += '<button class="choice-btn inline'+(f.id===food.id?' selected':'')+'" onclick="modelSelect(\''+f.id+'\')">'+f.icon+' '+esc(t(pickCopy(f)))+(observed.includes(f.id)?' ✓':'')+'</button>';
  });
  right += '</div><button class="ghost-btn" onclick="modelWatch()">'+esc(settled? t(MODEL.watchAgainBtn) : t(MODEL.watchBtn))+'</button>';

  if(observed.length>=MODEL.foods.length){
    const cc = r.modelCheckChoice;
    const ok = (MODEL.checkChoices.find(c=>c.id===cc)||{}).correct===true;
    right += fieldLabel(esc(t(MODEL.checkPrompt)), "q-modelcheck")+'<div class="choice-row">';
    if(!ok) markQuestion("q-modelcheck");
    MODEL.checkChoices.forEach(c=>{
      const sel = cc===c.id;
      right += '<button class="choice-btn inline'+(sel?(c.correct?' selected':' wrong'):'')+'" onclick="modelCheck(\''+c.id+'\')">'+esc(t(pickCopy(c)))+'</button>';
    });
    right += '</div>';
    if(cc && !ok) right += feedback(esc(t(MODEL.checkWrong)), "hint");
    if(ok) right += feedback(esc(t(UI.correct)), "good");
  }
  return sceneShell(left, right);
}
window.modelSelect = function(id){ patchRecord({modelSelectedFood:id}); };
window.modelWatch = function(){
  const r = rec();
  const selectedId = r.modelSelectedFood || MODEL.foods[0].id;
  const observed = (r.modelObservedFoods||[]).slice();
  if(!observed.includes(selectedId)) observed.push(selectedId);

};
window.modelCheck = function(id){ patchRecord({modelCheckChoice:id}); };

  let left = visual(desc, '<div class="gauge-wrap">'+

  if(ran){
    left += '<div class="legend"><span><span class="sw" style="background:var(--sun);"></span>'+esc(t(COMPARE.goEasyLegend))+'</span>'+
      '<span><span class="sw" style="background:var(--teal);"></span>'+esc(t(COMPARE.friendlyLegend))+'</span></div>';
  }

  let right = narrator(esc(tl(COMPARE.narrator)));
  right += fieldLabel(esc(t(COMPARE.predictPrompt)), "q-comppredict")+'<div class="choice-col">';
  if(!r.comparePrediction) markQuestion("q-comppredict");

    const rc = r.compareResultChoice;

    if(!ok) markQuestion("q-compresult");

let fairAHints = 0, fairBHints = 0;
function renderFairtest(){
  return STATE.level==="A" ? renderFairA() : renderFairB();
}
function renderFairA(){
  const A = FAIRTEST.levelA;
  const answers = rec().fairAAnswers || {};
  const step = Math.min(rec().fairAStep||0, A.experiments.length-1);
  const exp = A.experiments[step];
  const answer = answers[exp.id];
  const correctAns = exp.fair ? "fair" : "unfair";
  const answeredRight = answer===correctAns;

  /* P10 — the ✓ / ✕ cue IS the answer, so it stays hidden until the child has
     committed a judgement; before that the rows show the plain facts only. */
  const showCue = !!answer;
  const servingText = showCue ? t({zh:exp.servingzh,en:exp.serviceen}) : t({zh:exp.servingNeutralzh,en:exp.servingNeutralen});
  const checkedText = t({zh:exp.checkedzh,en:exp.checkeden});
  const desc = fmt(t(VISUAL.fairClaim), {n:step+1, total:A.experiments.length,
    claim:t({zh:exp.claimzh,en:exp.claimen}), serving:servingText, checked:checkedText});
  let left = '<p style="font-size:13px;color:var(--muted);">'+fmt(esc(t({zh:"第 {n} / {total} 组对比",en:"Comparison {n} of {total}"})),{n:step+1,total:A.experiments.length})+'</p>';
  left += visual(desc, '<div class="claim-card"><div class="claim">“'+esc(t({zh:exp.claimzh,en:exp.claimen}))+'”</div>'+
    fairRow("🥣", t(A.servingLabel), exp.servingOk, servingText, showCue)+
    fairRow("🔍", t(A.checkedLabel), exp.checkedOk, checkedText, showCue)+
    '</div>');

  let right = narrator(esc(tl(FAIRTEST.narrator)));
  right += fieldLabel(esc(t(A.question)), "q-faira");
  if(!answeredRight) markQuestion("q-faira");
  right += '<div class="choice-row">'+
    '<button class="choice-btn inline'+(answer==="fair"?(answeredRight?' selected':' wrong'):'')+'" onclick="fairAJudge(\'fair\')">'+esc(t(A.fairBtn))+'</button>'+
    '<button class="choice-btn inline'+(answer==="unfair"?(answeredRight?' selected':' wrong'):'')+'" onclick="fairAJudge(\'unfair\')">'+esc(t(A.notFairBtn))+'</button></div>';

  if(answer && !answeredRight){
    right += feedback(esc(t(answer==="fair"?A.wrongFair:A.wrongNotFair)), "hint");
    right += hintPanel(t(A.hint1), t(A.hint2), fairAHints, "fairAHint");
  }
  if(answeredRight){
    right += feedback(esc(t({zh:exp.whyzh,en:exp.whyen})), "good");
  }
  if(answeredRight && step < A.experiments.length-1){
    right += '<button class="primary-btn" onclick="fairANext()">'+esc(t(A.nextBtn))+'</button>';
  }
  if(fairDone()) right += feedback(esc(t(A.allDone)), "good");
  return sceneShell(left, right);
}
function fairRow(icon, label, ok, valueText, showCue){
  const cue = showCue
    ? '<span class="row-cue '+(ok?'ok':'bad')+'">'+(ok?'✓':'✕')+' '+esc(valueText)+'</span>'
    : '<span class="row-cue" style="background:transparent;color:var(--ink);font-weight:600;">'+esc(valueText)+'</span>';
  return '<div class="claim-row"><span aria-hidden="true">'+icon+'</span><span class="rk">'+esc(label)+':</span>'+cue+'</div>';
}
function hintPanel(h1, h2, shown, fnName){
  let html = '<div>';
  if(shown<1) html += '<button class="ghost-btn" onclick="'+fnName+'()">'+esc(t(UI.hintButton))+'</button>';
  if(shown>=1) html += '<div class="feedback" style="border-color:var(--blue);background:var(--blue-soft);margin-top:6px;"><b>'+esc(t(UI.hint1Label))+':</b> '+esc(h1)+'</div>';

window.fairAJudge = function(v){

let fairBView = 0;
function renderFairB(){
  const B = FAIRTEST.levelB;
  const choice = rec().fairChoice;
  const checked = rec().fairChecked;
  const checkedOpt = B.options.find(o=>o.id===checked);
  const isCorrect = checkedOpt && checkedOpt.correct===true;
  if(fairBView>=B.options.length) fairBView = 0;
  const shown = B.options[fairBView];
  const shownPicked = choice===shown.id;

  /* P3/P10 — the child must actually look at every candidate table before Check
     unlocks, so "pick the fair one" cannot be satisfied by taking the first one shown. */
  const seen = (rec().fairBSeen||[]).slice();
  if(!seen.includes(shown.id)){ seen.push(shown.id); rec().fairBSeen = seen; saveState(); }
  const seenAll = B.options.every(o=>seen.includes(o.id));
  const stillToSee = B.options.length - seen.length;

  const rowsDesc = [
    t(B.rowServing)+': '+shown.a.serving+' / '+shown.b.serving,
    t(B.rowTotal)+': '+shown.a.total+' / '+shown.b.total,
    t(B.rowSat)+': '+shown.a.sat+' / '+((shown.b.satEn && STATE.lang==="en")? shown.b.satEn : shown.b.sat),
    t(B.rowClaim)+': '+t({zh:shown.a.claimzh,en:shown.a.claimen})+' / '+t({zh:shown.b.claimzh,en:shown.b.claimen})
  ].join("; ");

  let left = '<div class="cand-dots">';
  B.options.forEach((o,i)=>{
    const aria = fmt(t(B.candidateLabel), {n:i+1, total:B.options.length});
    left += '<button type="button" class="cand-dot'+(i===fairBView?' current':(seen.includes(o.id)?' picked':''))+
      '" aria-label="'+escAttr(aria)+'" aria-current="'+(i===fairBView?'true':'false')+'" onclick="fairBGoto('+i+')">'+(i+1)+'</button>';
  });
  left += '</div><div class="panel" style="padding:12px;border-width:2px;'+
    (checked===shown.id ? (shown.correct?'border-color:var(--teal);background:var(--teal-soft);':'border-color:var(--sun);background:var(--sun-soft);') : (shownPicked?'border-color:var(--teal);background:var(--teal-soft);':'')) +'">';
  left += '<table class="fair-table"><caption class="sr-only">'+esc(fmt(t(VISUAL.fairTable),{n:fairBView+1,total:B.options.length,rows:rowsDesc}))+'</caption>'+
    '<thead><tr><td></td><th>'+esc(t(B.colA))+'</th><th>'+esc(t(B.colB))+'</th></tr></thead><tbody>'+
    fairBRow(t(B.rowServing), shown.a.serving, shown.b.serving)+
    fairBRow(t(B.rowTotal), shown.a.total, shown.b.total)+
    fairBRow(t(B.rowSat), shown.a.sat, shown.b.satEn && STATE.lang==="en" ? shown.b.satEn : shown.b.sat)+
    fairBRow(t(B.rowClaim), t({zh:shown.a.claimzh,en:shown.a.claimen}), t({zh:shown.b.claimzh,en:shown.b.claimen}))+
    '</tbody></table></div>'+
    '<div class="choice-row" style="justify-content:center;margin-top:10px;">'+
    '<button type="button" class="ghost-btn" onclick="fairBStep(-1)">'+esc(t(UI.prevItem))+'</button>'+
    '<button type="button" class="ghost-btn" onclick="fairBStep(1)">'+esc(t(UI.nextItem))+'</button></div>';

  let right = narrator(esc(tl(FAIRTEST.narrator)));
  right += fieldLabel(esc(fmt(t(B.candidateLabel),{n:fairBView+1,total:B.options.length})), "q-fairb");
  if(!isCorrect) markQuestion("q-fairb");
  right += '<div class="choice-row">'+
    '<button class="choice-btn inline'+(shownPicked?' selected':'')+'" onclick="fairBPick(\''+shown.id+'\')">'+esc(shownPicked? t(B.picked) : t(B.pickThis))+'</button>'+
    '<button class="primary-btn" '+((!choice||isCorrect||!seenAll)?'disabled':'')+' onclick="fairBCheck()">'+esc(t(UI.check))+'</button></div>';
  if(!seenAll) right += '<p style="color:var(--muted);font-size:14px;">'+esc(fmt(t(B.seeAllFirst),{total:B.options.length,left:stillToSee}))+'</p>';
  if(checked && !isCorrect && checkedOpt){
    right += feedback(esc(t(UI.notYet))+' — '+esc(t({zh:checkedOpt.whyzh,en:checkedOpt.whyen})), "hint");
    right += hintPanel(t(B.hint1), t(B.hint2), fairBHints, "fairBHint");
  }
  if(isCorrect){
    right += feedback(esc(t(B.correctNote))+(checkedOpt.whyzh? ' '+esc(t({zh:checkedOpt.whyzh,en:checkedOpt.whyen})) : ''), "good");
  }
  return sceneShell(left, right);
}

function renderTransferA(){
  const slots = rec().transferSlots || [null,null,null];
  const used = slots.filter(Boolean);
  const filled = slots.every(s=>s!==null);
  const distractor = filled && slots.some(id => (TRANSFER.aChips.find(c=>c.id===id)||{}).slot===-1);
  const done = transferDone();
  const progress = done? 1 : used.length/3;

  let left = xrayVisual(progress);
  let right = narrator(esc(tl(TRANSFER.narrator)));
  right += fieldLabel(esc(t({zh:"用词卡把三个空格填满",en:"Fill the three slots with word chips"})), "q-transfera");
  if(!done) markQuestion("q-transfera");
  /* one wrapper so "bring the question into view" covers the slots AND the word chips
     the child has to reach, not just the slots */
  right += '<div><div>';
  slots.forEach((id,i)=>{
    const label = id? t(pickCopy(TRANSFER.aChips.find(c=>c.id===id))) : (i+1);
    const aria = id? fmt(t({zh:"第 {n} 格，已填：{text}。按一下清空",en:"Slot {n}, filled with: {text}. Press to clear"}),{n:i+1,text:label})
                   : fmt(t({zh:"第 {n} 格，还是空的",en:"Slot {n}, still empty"}),{n:i+1});
    right += '<button class="slot'+(id?' filled':'')+'" aria-label="'+escAttr(aria)+'" onclick="transferAClear('+i+')">'+esc(String(label))+'</button>';
  });
  right += '</div><div class="choice-row">';
  TRANSFER.aChips.forEach(c=>{
    const isUsed = used.includes(c.id);
    right += '<button class="choice-btn inline" '+(isUsed?'disabled style="opacity:.4;"':'')+' onclick="transferAAdd(\''+c.id+'\')">'+esc(t(pickCopy(c)))+'</button>';
  });
  right += '</div></div>';
  if(filled && distractor) right += feedback(esc(t(TRANSFER.aWrongChip)), "hint");
  if(filled && !distractor && !done) right += feedback(esc(t(TRANSFER.aWrongOrder)), "hint");
  if(done) right += feedback(esc(t(UI.correct)), "good");
  if(used.length) right += '<button class="ghost-btn" onclick="transferAReset()">'+esc(t({zh:"再试一次",en:"Try again"}))+'</button>';
  right += '<p class="caption">'+esc(t(TRANSFER.tip))+'</p>';
  return sceneShell(left, right);
}

function renderTransferB(){
  const r = rec();
  const evOk = (TRANSFER.bEvidence.find(c=>c.id===r.transferEvidence)||{}).correct===true;
  const bcOk = (TRANSFER.bBecause.find(c=>c.id===r.transferBecause)||{}).correct===true;
  const soOk = (TRANSFER.bSo.find(c=>c.id===r.transferSo)||{}).correct===true;
  const done = transferDone();
  const anyWrong = (r.transferEvidence && !evOk) || (r.transferBecause && !bcOk) || (r.transferSo && !soOk);
  const steps = [evOk,bcOk,soOk].filter(Boolean).length;
  const progress = done? 1 : 0.15+steps*0.28;

  let left = xrayVisual(progress);
  let right = narrator(esc(tl(TRANSFER.narrator)));
  right += transferBGroup(TRANSFER.bEvidencePrompt, TRANSFER.bEvidence, r.transferEvidence, "transferEvidence", "q-transferev");
  if(!evOk) markQuestion("q-transferev");
  if(evOk){
    right += transferBGroup(TRANSFER.bBecausePrompt, TRANSFER.bBecause, r.transferBecause, "transferBecause", "q-transferbc");
    if(!bcOk) markQuestion("q-transferbc");
  }
  if(evOk && bcOk){
    right += transferBGroup(TRANSFER.bSoPrompt, TRANSFER.bSo, r.transferSo, "transferSo", "q-transferso");
    if(!soOk) markQuestion("q-transferso");

  if(anyWrong) right += feedback(esc(t(TRANSFER.bWrong)), "hint");
  if(done) right += feedback(esc(deriveExplanation()), "good");
  right += '<p class="caption">'+esc(t(TRANSFER.tip))+'</p>';
  return sceneShell(left, right);
}

  /* the buttons are removed, not just hidden: a control that keeps focus while it is
     display:none drops the child's focus onto <body> (the page top) */
  if(p.phase!=="scene"){ footerEl.hidden = true; document.getElementById("footer-inner").innerHTML = ""; return; }
  footerEl.hidden = false;
  const sceneId = SCENE_ORDER[p.sceneIndex];
  const canAdvance = isSceneComplete(sceneId);
  document.getElementById("footer-inner").innerHTML =
    '<button type="button" class="ghost-btn" onclick="goBack()">'+esc(t(UI.back))+'</button>'+
    '<button type="button" class="primary-btn" '+(canAdvance?'':'disabled')+' onclick="goNext()">'+esc(p.sceneIndex===SCENE_ORDER.length-1? t(SCENE_LABEL.summary) : t(UI.next))+'</button>';
}

/* U3/U5/U6 — measure real geometry and give the landscape stage an exact height, so
   the two columns scroll inside themselves and the page itself never scrolls. */
function syncStageHeight(){
  const root = document.documentElement;
  const grid = document.querySelector("#stage .scene-grid");
  const landscape = window.matchMedia("(min-width:900px) and (orientation:landscape)").matches;
  if(!grid || !landscape){ root.style.removeProperty("--stage-h"); return; }
  if(window.scrollY) window.scrollTo(0,0);
  const footer = document.getElementById("footer");
  const fh = (footer && !footer.hidden)? footer.offsetHeight : 0;
  const top = grid.getBoundingClientRect().top;
  root.style.setProperty("--stage-h", Math.max(220, Math.round(window.innerHeight - top - fh - 10))+"px");
}

/* U5 — bring the whole question BLOCK (its label *and* the choices under it) into the
   visible part of its own column. Scrolling the label alone is not enough: the choices
   are what the child has to reach, and the fixed footer covers the bottom of the screen. */
function scrollQuestionIntoView(q){
  const group = q.nextElementSibling;
  const col = q.closest(".right-col");
  const scrolls = col && col.scrollHeight > col.clientHeight+1;
  const footer = document.getElementById("footer");
  const top = scrolls? col.getBoundingClientRect().top : 0;
  const bottom = scrolls? col.getBoundingClientRect().bottom
                        : ((footer && !footer.hidden)? footer.getBoundingClientRect().top : window.innerHeight);
  const qr = q.getBoundingClientRect();
  const gr = group? group.getBoundingClientRect() : qr;
  const blockFits = (gr.bottom-qr.top) <= (bottom-top);
  if(!blockFits || gr.bottom>bottom || qr.top<top) q.scrollIntoView({block:"start", inline:"nearest"});
}

/* A3 — after the child acts: bring what they must do next into view inside its own
   column and move focus there. If nothing new appeared, put focus back on the control
   they just used, so a keyboard / switch user is never thrown to the top of the page. */
function applyFocusAndScroll(){
  const q = pendingQuestionId? document.getElementById(pendingQuestionId) : null;
  if(q){
    scrollQuestionIntoView(q);
    if(lastActKey && pendingQuestionId!==lastFocusedQuestion){
      try{ q.focus({preventScroll:true}); }catch(e){ q.focus(); }
      lastFocusedQuestion = pendingQuestionId;
    }
  } else {
    lastFocusedQuestion = null;
    /* nothing left to answer here: make sure the feedback the child just earned and
       the button that carries them onward are both readable without hunting */
    const tails = document.querySelectorAll("#stage .right-col .feedback, #stage .right-col .primary-btn, #stage .right-col .ghost-btn");
    const tail = tails[tails.length-1];
    if(tail && lastActKey) tail.scrollIntoView({block:"nearest", inline:"nearest"});
  }
  if(lastActKey && (!q || pendingQuestionId===lastFocusedQuestion)){
    let el = null;
    try{ el = document.querySelector('[onclick="'+lastActKey.replace(/"/g,'\\"')+'"]'); }catch(e){ el = null; }
    /* getClientRects() (not offsetParent) — the footer is position:fixed, whose
       offsetParent is always null even when it is perfectly visible */
    const onScreen = e => !!e && e.getClientRects().length>0;
    if(el && (el.disabled || !onScreen(el))) el = null;
    const ae = document.activeElement;
    const focusLost = !ae || ae===document.body || ae===document.documentElement || !onScreen(ae);
    if(el && ae!==el && (!q || focusLost)){
      try{ el.focus({preventScroll:true}); }catch(e){}
    } else if(!el && focusLost){
      /* the control the child used is gone or now disabled (a used word chip, a hint
         button replaced by its hint): keep focus in the content, not at the page top */
      const col = document.querySelector("#stage .right-col") || document.getElementById("stage");
      if(col){ try{ col.focus({preventScroll:true}); }catch(e){} }
    }
  }
  lastActKey = null; lastActFn = null;
}

function render(){
  const p = prog();
  pendingQuestionId = null;
  currentNarratorText = "";
  document.documentElement.classList.toggle("rm", reducedMotion());
  document.documentElement.lang = STATE.lang==="zh" ? "zh-Hans" : "en";
  const skip = document.getElementById("skiplink"); if(skip) skip.textContent = t(UI.skipToContent);
  renderHeader();

  let html = "";
  if(p.phase==="start"){
    html += renderStart();
  } else if(p.phase==="scene"){
    const sceneId = SCENE_ORDER[p.sceneIndex];
    html += '<div class="progress-row"><div class="dots" aria-hidden="true">';
    SCENE_ORDER.forEach((s,i)=>{
      html += '<span class="dot'+(i<p.sceneIndex?" done":(i===p.sceneIndex?" current":""))+'"></span>';
    });
    html += '</div><span class="step-label">'+fmt(esc(t(UI.progressStep)),{n:p.sceneIndex+1})+' · '+esc(t(SCENE_LABEL[sceneId]))+' · '+SCENE_TIME[sceneId]+' · '+esc(STATE.level==="A"?t(UI.levelA):t(UI.levelB))+'</span></div>';
    html += SCENE_RENDERERS[sceneId]();
  } else if(p.phase==="summary"){
    html += renderSummary();
  }
  document.getElementById("stage").innerHTML = html;
  renderFooter();

  /* A2 — mirror the narrator into the one live region that survives re-renders */
  const live = document.getElementById("live");
  if(live && currentNarratorText && currentNarratorText!==announcedText){ live.textContent = currentNarratorText; announcedText = currentNarratorText; }
  syncStageHeight();
  applyFocusAndScroll();
}
window.addEventListener("resize", syncStageHeight);
window.addEventListener("orientationchange", syncStageHeight);

render();
</script>
</body>
</html>
